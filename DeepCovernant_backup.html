  function ownedRelics(){ return (S && S.relics) || []; }
  /* unit 을 넘기지 않으면 파티 전체에 걸리는 값(잠식·드로우·에너지)을 묻는 것이다.
     적을 넘기면 언제나 빈손 — 유물은 적에게 붙지 않는다. */
  function relicApplies(r, unit){
    if(unit && !unit.isHero) return false;
    if(r.scope==='all') return true;
    if(!unit) return false;
    return unit.cls===r.scope || unit.reach===r.scope;
  }
  function relicSum(key, unit){
    let v = 0;
    ownedRelics().forEach(r=>{ if(r.effect[key]!=null && relicApplies(r, unit)) v += r.effect[key]; });
    return v;
  }
  function relicMul(key, unit){
    let v = 1;
    ownedRelics().forEach(r=>{ if(r.effect[key]!=null && relicApplies(r, unit)) v *= r.effect[key]; });
    return v;
  }
  /* 최대 체력은 판정 때마다 더하면 회복량이 꼬인다 — 주울 때 한 번만 몸에 새긴다 */
  function grantRelic(relic){
    S.relics.push(relic);
    if(relic.effect.maxHp){
      S.party.forEach(p=>{
        if(!p || !p.alive || !relicApplies(relic, p)) return;
        p.maxHp += relic.effect.maxHp;
        p.hp    += relic.effect.maxHp;
      });
    }
  }
  /* 새로 합류한 사람도 이미 챙긴 유물의 몫을 받는다 — 몸에 새기는 값이라 합류 시점에 한 번 얹는다 */
  function applyRelicMaxHp(hero){
    ownedRelics().forEach(r=>{
      if(!r.effect.maxHp || !relicApplies(r, hero)) return;
      hero.maxHp += r.effect.maxHp;
      hero.hp    += r.effect.maxHp;
    });
  }
  function relicOffer(){
    const owned = ownedRelics().map(r=>r.id);
    const pool = RELIC_POOL.filter(r=>owned.indexOf(r.id)<0);
    return shuffle(pool.slice()).slice(0,3);
  }

  /* ============ STATE ============ */
  let uid = 0;
  const nextId = () => 'u' + (uid++);

  let S = null;

  function rankName(idx){ return idx===0?'전열':idx===1?'중열':idx===2?'후열':idx===3?'심부':'심연'; }
 
  function makeHero(classId){
    const def = CLASS_DEFS[classId];
    return {id:classId, name:def.name, cls:classId, reach:def.reach, isHero:true,
            maxHp:def.maxHp, hp:def.maxHp, block:0, dp:0, collapsed:false, alive:true, react:null};
  }
  function buildPartyFromPlacements(placements){
    return placements.map(cid => cid ? makeHero(cid) : null);
  }

  function mkDeckCard(base){ return Object.assign({defId:nextId(), upgraded:false}, base); }
  function buildRunDeck(selectedClassIds){
    let deck=[];
    const addAll=(list)=>{ list.forEach(base=>{ deck.push(mkDeckCard(base)); deck.push(mkDeckCard(base)); }); };
    selectedClassIds.forEach(cid=>addAll(CARD_DB[cid]));
    addAll(CARD_DB.neutral);
    return deck;
  }

  /* ============ TAVERN ============
     인양된 자리에서만 사람을 바꾼다. 죽은 자의 카드는 덱에서 함께 빠지고,
     새로 온 사람의 카드가 그 자리에 들어온다 — 쓸 사람이 없는 카드로 손패가 막히지 않도록. */
  function deadSlots(){
    const out = [];
    S.party.forEach((p,i)=>{ if(p && !p.alive) out.push(i); });
    return out;
  }
  function recruitCandidates(){
    const inParty = S.party.filter(p=>p && p.alive).map(p=>p.cls);
    return unlockedClassIds().filter(id=>inParty.indexOf(id)<0).map(id=>CLASS_DEFS[id]);
  }
  function recruitInto(slotIdx, classId){
    const fallen = S.party[slotIdx];
    if(!fallen || fallen.alive) return null;
    if(!isUnlocked(classId)) return null;

    const hero = makeHero(classId);
    applyRelicMaxHp(hero);
    S.party[slotIdx] = hero;

    S.runDeck = S.runDeck.filter(c=>c.owner!==fallen.cls);
    CARD_DB[classId].forEach(base=>{ S.runDeck.push(mkDeckCard(base)); S.runDeck.push(mkDeckCard(base)); });
    return hero;
  }

  function newRun(){
    S = {
      screen:'title',
      setup: { phase:'pick-classes', selected:[], placements:[null,null,null,null], armed:null },
      erosion: 0,
      chapter: 0,
      stepInChapter: 0,
      mapChoices: null,
      mapVisited: [],
      pendingNode: null,
      afterAftermath: null,
      aftermath: null,
      runDeck: null,
      party: null,
      battle: null,
      rest: null,
      relics: [],
      escape: null,
      tavern: null,
      logMsg: '',
      logLines: [],
      loseReason:'',
    };
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }
  function cloneForBattle(runDeck){
    return shuffle(runDeck.map(c=>Object.assign({}, c, {uid:nextId(), contaminated:false})));
  }

  /* ============ 적 도감 ============
     적도 아군과 똑같은 규칙을 쓴다 — 서 있는 열이 곧 사거리다.
     역할(role)이 성향을, 사거리(reach)가 제약을 맡는다:
       brute      — 한 방이 무겁다
       skirmisher — 잘게 여러 번
       warden     — 웅크리고 버틴다
       caster     — 살을 깎지 않고 정신을 깎는다
       sniper     — 약한 놈만 골라 쏜다
     react 로 개체마다 회피/흘림/반격 성향을 덧씌운다. */
  const FOE_DB = {
    melee: [
      {name:'잠식의 신도',   maxHp:24, atk:6, reach:'melee', role:'skirmisher', icon:ICON_CULTIST},
      {name:'부푼 익사체',   maxHp:32, atk:5, reach:'melee', role:'warden', icon:ICON_DROWNED,
       reactMod:{dodge:0.03, guard:0.26, riposte:0.18, rip:4}},
      {name:'갑각 순례자',   maxHp:28, atk:5, reach:'melee', role:'warden', icon:ICON_CRAB,
       reactMod:{dodge:0.04, guard:0.30, riposte:0.30, rip:5}},
      {name:'갈고리 사공',   maxHp:22, atk:8, reach:'melee', role:'brute', icon:ICON_HOOK},
      {name:'닻을 끄는 자',  maxHp:30, atk:7, reach:'melee', role:'brute', icon:ICON_ANCHOR,
       reactMod:{dodge:0.02, guard:0.26, riposte:0.22, rip:6}},
    ],
    mid: [
      {name:'아가리 기생체', maxHp:20, atk:5, reach:'mid', role:'skirmisher', icon:ICON_LAMPREY},
      {name:'먹물 사제',     maxHp:22, atk:4, reach:'mid', role:'caster', icon:ICON_SQUID},
      {name:'그물 사냥꾼',   maxHp:24, atk:5, reach:'mid', role:'warden', icon:ICON_NET},
      {name:'작살잡이',      maxHp:19, atk:7, reach:'mid', role:'brute', icon:ICON_HARPOON},
      {name:'부유 해파리',   maxHp:17, atk:3, reach:'mid', role:'caster', icon:ICON_JELLY,
       reactMod:{dodge:0.30, guard:0.05, riposte:0.10, rip:3}},
    ],
    ranged: [
      {name:'응시하는 눈자루', maxHp:16, atk:4, reach:'ranged', role:'sniper', icon:ICON_EYESTALK},
      {name:'고동치는 심장',   maxHp:18, atk:3, reach:'ranged', role:'caster', icon:ICON_HEART},
      {name:'속삭이는 소라',   maxHp:15, atk:3, reach:'ranged', role:'caster', icon:ICON_SHELL},
      {name:'홑눈 감시자',     maxHp:14, atk:5, reach:'ranged', role:'sniper', icon:ICON_EYEBALL,
       reactMod:{dodge:0.32, guard:0.04, riposte:0.04, rip:2}},
      {name:'점액 포자',       maxHp:20, atk:3, reach:'ranged', role:'sniper', icon:ICON_GOO},
    ],
  };
  const FOE_ELITES = [
    {name:'심연의 감시자',     maxHp:38, atk:8, reach:'melee', role:'brute',  icon:ICON_SERPENT},
    {name:'여덟 팔의 문지기',  maxHp:42, atk:6, reach:'mid',   role:'warden', icon:ICON_OCTOPUS,
     reactMod:{dodge:0.06, guard:0.34, riposte:0.34, rip:6}},
    {name:'붙잡는 손',         maxHp:34, atk:9, reach:'melee', role:'brute',  icon:ICON_GRASP},
  ];
  const FOE_BOSS = {name:'침수된 대신관', maxHp:72, atk:9, reach:'mid', role:'brute', icon:ICON_BOSS, kind:'boss', phase:1};

  function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  /* 가중 추첨 — [[무게, 값], ...] */
  function weighted(list){
    const pool = list.filter(p=>p[0] > 0);
    if(!pool.length) return list[0][1];
    let total = 0; pool.forEach(p=>{ total += p[0]; });
    let r = Math.random()*total;
    for(let i=0;i<pool.length;i++){ r -= pool[i][0]; if(r<=0) return pool[i][1]; }
    return pool[pool.length-1][1];
  }

  /* 열이 병과를 정한다 — 앞은 근접, 가운데는 중거리, 뒤는 원거리 */
  function foeTypeForRank(rank){
    if(rank===0) return 'melee';
    if(rank===1) return weighted([[6,'melee'],[4,'mid']]);
    if(rank===2) return weighted([[2,'melee'],[5,'mid'],[3,'ranged']]);
    if(rank===3) return weighted([[3,'mid'],[7,'ranged']]);
    return 'ranged';
  }
  /* 머릿수가 늘면 개체는 약해진다 — 총 위협량을 대충 맞춰둔다 */
  function countScale(n){
    return n<=1 ? 1.35 : n===2 ? 1.0 : n===3 ? 0.78 : n===4 ? 0.62 : 0.50;
  }
  /* 얼마나 깊이 들어왔나 — 지나온 노드 수에 층 보정을 더한다 */
  function stageDepth(node){
    let d = S.mapVisited.length;
    if(node.tier === '중층') d += 2;
    else if(node.tier === '심해') d += 4;
    return d;
  }
  /* 깊어질수록 무리가 커진다. 얕은 곳은 2~3, 심층은 4~5가 기본이 된다.
     (실측 평균: 깊이0 ≈ 2.7마리 → 깊이4+ ≈ 4.2마리) */
  function rollFoeCount(depth){
    const d = Math.min(depth, 5);
    return weighted([
      [Math.max(0, 5 - d*2), 2],
      [4,                    3],
      [2 + d,                4],
      [Math.max(0, d*2 - 1), 5],
    ]);
  }

  function makeFoe(rank, scale){
    const base = Object.assign({}, pickOne(FOE_DB[foeTypeForRank(rank)]));
    base.maxHp = Math.max(8, Math.round(base.maxHp * scale));
    return base;
  }

  function enemySetFor(node){
    const set = [];
    const depth = stageDepth(node);
    /* 우두머리 자체가 무겁다 — 수행원은 깊이에 따라 천천히만 는다 (총 4를 넘기지 않는다) */
    const escortsFor = () => Math.min(3, 1 + Math.floor(Math.random()*2) + Math.floor(depth/4));

    if(node.boss){
      set.push(Object.assign({}, FOE_BOSS));
      const n = escortsFor();
      for(let r=1; r<=n; r++) set.push(makeFoe(r, 0.8));
      return set;
    }
    if(node.type==='elite'){
      set.push(Object.assign({}, pickOne(FOE_ELITES)));
      const n = escortsFor();
      for(let r=1; r<=n; r++) set.push(makeFoe(r, 0.8));
      return set;
    }
    const n = rollFoeCount(depth);
    const scale = countScale(n);
    for(let r=0; r<n; r++) set.push(makeFoe(r, scale));
    return set;
  }

  function handSize(){ return 5 + relicSum('draw'); }

  function startBattle(node){
    const enemies = enemySetFor(node).map(e=>Object.assign({}, e, {hp:e.maxHp, block:0, intent:null, alive:true, react:null}));
    const energy = 3 + relicSum('energy');
    S.battle = {
      tier: node.tier, node, enemies,
      deck: cloneForBattle(S.runDeck), hand:[], discard:[],
      energy:energy, maxEnergy:energy, turn:1, over:false,
      pendingCardUid:null, pendingDomain:null,
    };
    S.party.forEach(p=>{ if(p) p.react = null; });
    aliveParty().forEach(p=>{
      const mend = relicSum('battleHeal', p);
      if(mend>0) p.hp = Math.min(p.maxHp, p.hp + mend);
    });
    fxQueue = [];
    clearLog();
    rollIntents();
    drawHand(handSize());
    S.logMsg = node.boss ? '거대한 존재가 어둠 속에서 몸을 일으킨다.'
             : node.type==='elite' ? '유난히 거대한 형체가 앞장서 다가온다.'
             : enemies.length>1 ? `어둠 속에서 ${enemies.length}개의 형체가 열을 이룬다.`
             : '어둠 속에서 형체가 다가온다.';
    S.screen = 'battle';
  }

  /* 죽은 자는 열을 차지하지 않는다 — 앞이 쓰러지면 뒤가 당겨진다 (다키스트던전식) */
  function effRank(arr, idx){
    let r = 0;
    for(let i=0; i<idx; i++){ const u = arr[i]; if(u && u.alive) r++; }
    return r;
  }
  function heroRank(h){ return effRank(S.party, S.party.indexOf(h)); }
  function foeRank(en){ return effRank(S.battle.enemies, S.battle.enemies.indexOf(en)); }

  /* 이 적이 지금 닿을 수 있는 아군들 */
  function heroesInReach(en){
    const r = foeRank(en);
    if(!canActFrom(en, r)) return [];
    return S.party.filter(h => h && h.alive && canHitRank(en, heroRank(h)));
  }
  function pickHeroTarget(en){
    const pool = heroesInReach(en);
    if(!pool.length) return null;
    /* 원거리는 뒤를, 나머지는 앞을 노린다 */
    return en.reach==='ranged' ? pool[pool.length-1] : pool[0];
  }

  /* 적의 예고 행동 — 자기 열에서 실제로 할 수 있는 것만 고른다 */
  function pickIntent(en){
    const rank = foeRank(en);
    const roll = Math.random();
    const stuck = !canActFrom(en, rank) || heroesInReach(en).length===0;

    if(en.kind==='boss'){
      if(stuck) return {type:'guard_up', val:8, label:'웅크림', ic:IC_GUARD};
      if(en.phase===2){
        if(roll<0.34) return {type:'attack_reach', val:en.atk, label:'심연의 강타', ic:IC_CLEAVER};
        if(roll<0.60) return {type:'attack_all', val:Math.round(en.atk*0.7), label:'심연의 포효', ic:IC_ROAR};
        if(roll<0.82) return {type:'whisper_rear', val:11, label:'심연의 응시', ic:IC_GAZE};
        return {type:'guard_up', val:10, label:'웅크림', ic:IC_GUARD};
      }
      if(roll<0.46) return {type:'attack_reach', val:en.atk, label:'대신관의 강타', ic:IC_CLEAVER};
      if(roll<0.78) return {type:'whisper_rear', val:9, label:'심연의 응시', ic:IC_GAZE};
      return {type:'guard_up', val:8, label:'웅크림', ic:IC_GUARD};
    }

    /* 손이 닿지 않으면 자리를 고쳐 잡거나 속삭인다 */
    if(stuck){
      return roll<0.5
        ? {type:'guard_up', val:5, label:'웅크림', ic:IC_GUARD}
        : {type:'whisper_random', val:6, label:'속삭임', ic:IC_GAZE};
    }

    return weighted(intentPool(en));
  }

  /* 역할별 예고 행동 표 — 같은 사거리라도 성향이 다르면 전혀 다르게 싸운다 */
  function intentPool(en){
    const a = en.atk;
    const hit = (v,l,ic)=>({type:'attack_reach', val:Math.max(1,Math.round(v)), label:l, ic:ic||IC_CLEAVER});
    const dbl = (v,l)=>({type:'double_attack_reach', val:Math.max(1,Math.round(v)), label:l, ic:IC_DOUBLE});
    const rear = (v,l)=>({type:'whisper_rear', val:v, label:l, ic:IC_GAZE});
    const anyone = (v,l)=>({type:'whisper_random', val:v, label:l, ic:IC_GAZE});
    const grd = (v)=>({type:'guard_up', val:Math.max(4,Math.round(v)), label:'웅크림', ic:IC_GUARD});
    const snipe = (v,l)=>({type:'snipe_lowest', val:Math.max(1,Math.round(v)), label:l, ic:IC_SNIPE});

    switch(en.role){
      case 'brute':
        return [[4, hit(a*1.75,'강타 예고',IC_HEAVY)], [3, hit(a,'내려찍기')], [1, grd(a*0.8)]];
      case 'skirmisher':
        return [[4, dbl(a*0.62,'연속 공격')], [3, hit(a,'베어물기')], [1, anyone(6,'속삭임')]];
      case 'warden':
        return [[4, grd(a*1.4)], [3, hit(a,'밀어붙이기')], [1, anyone(6,'속삭임')]];
      case 'caster':
        return [[4, rear(9,'심연의 응시')], [3, anyone(7,'속삭임')], [1, hit(a*0.8,'저주 발사',IC_SNIPE)]];
      case 'sniper':
        return [[4, snipe(a,'약자 저격')], [3, hit(a*0.9,'원거리 사격',IC_SNIPE)], [1, rear(8,'후열 응시')]];
    }
    return [[1, hit(a,'공격')]];
  }
  function rollIntents(){ S.battle.enemies.forEach(en=>{ if(en.alive) en.intent = pickIntent(en); }); }

  function drawHand(n){
    const b = S.battle;
    for(let i=0;i<n;i++){
      if(b.deck.length===0){
        if(b.discard.length===0) break;
        b.deck = shuffle(b.discard); b.discard=[];
      }
      const c = b.deck.pop();
      if(b.tier==='중층' && Math.random() < 0.15){ c.contaminated = true; }
      b.hand.push(c);
    }
  }

  /* 로그가 화면 한복판으로 나왔으니 조사도 제대로 붙인다 — 받침 유무로 갈라준다 */
  function hasJong(s){
    if(!s) return false;
    const c = s.charCodeAt(s.length-1);
    if(c < 0xAC00 || c > 0xD7A3) return false;     /* 한글 음절이 아니면 판단 보류 */
    return (c - 0xAC00) % 28 !== 0;
  }
  function ga(n){ return n + (hasJong(n) ? '이' : '가'); }
  function eul(n){ return n + (hasJong(n) ? '을' : '를'); }

  /* 전투 로그 — 적이 여럿이면 한 턴에 여러 줄이 쏟아지므로 최근 3줄을 모아 보여준다 */
  function pushLog(msg){
    if(!msg) return;
    if(!S.logLines) S.logLines = [];
    S.logLines.push(msg);
    while(S.logLines.length > 3) S.logLines.shift();
    S.logMsg = msg;
  }
  function clearLog(){ S.logLines = []; }

  function aliveParty(){ return S.party.filter(p=>p && p.alive); }
  function rearTarget(){ const a=aliveParty(); return a.length? a[a.length-1] : null; }
  function lowestHpTarget(){ const a=aliveParty(); if(!a.length) return null; return a.reduce((x,p)=>p.hp<x.hp?p:x, a[0]); }

  /* ============ 피격 반응 ============
     맞는 쪽이 굴린다: 회피 → 흘려막기 → 그래도 맞으면 반격.
     반격은 자기 열에서 상대 열까지 손이 닿을 때만 나간다.
     반격에 대한 재반격은 없다 (무한 연쇄 방지). */
  function markReact(unit, kind){
    unit.react = {kind:kind, turn:S.battle ? S.battle.turn : 0};
  }
  function canRiposte(defender, defRank, attacker, atkRank){
    if(!attacker || !attacker.alive) return false;
    return canActFrom(defender, defRank) && canHitRank(defender, atkRank);
  }
  /* 회피/흘림 판정 + 방어도 소모. 실제 체력 차감은 호출부에서 한다. */
  function resolveIncoming(defender, amount){
    const rc = reactOf(defender);
    if(Math.random() < rc.dodge){
      markReact(defender, 'dodge');
      return {dealt:0, kind:'dodge'};
    }
    let dmg = amount;
    let kind = 'hit';
    if(Math.random() < rc.guard){
      dmg = Math.max(1, Math.round(dmg*0.5));
      markReact(defender, 'guard');
      kind = 'guard';
    }
    if(defender.block > 0){
      const absorbed = Math.min(defender.block, dmg);
      defender.block -= absorbed;
      dmg -= absorbed;
    }
    return {dealt:dmg, kind:kind};
  }

  function applyDamageToHero(hero, amount, opts){
    opts = opts || {};
    const stress = opts.stress!==false;
    const attacker = opts.from || null;
    const res = resolveIncoming(hero, amount);

    if(res.kind==='dodge'){
      queueFx('dodge', hero);
      pushLog(`${ga(hero.name)} 몸을 비틀어 피했다.`);
      return res;
    }
    hero.hp = Math.max(0, hero.hp - res.dealt);
    if(res.dealt>0){
      flash('red');
      queueFx('impact', hero, res.dealt);
      if(stress) addDp(hero, 4);
    }
    if(res.kind==='guard'){ queueFx('guard', hero); pushLog(`${ga(hero.name)} 흘려 막았다. (${res.dealt} 피해)`); }
    if(hero.hp<=0){ hero.alive = false; queueFx('death', hero); }
    checkCollapse(hero);

    if(hero.alive && opts.riposte!==false && canRiposte(hero, heroRank(hero), attacker, foeRank(attacker))
       && Math.random() < reactOf(hero).riposte){
      markReact(hero, 'riposte');
      queueFx('riposte', hero);
      const rip = reactOf(hero).rip;
      damageEnemy(attacker, rip, {riposte:true});
      pushLog(`${ga(hero.name)} 곧바로 받아친다. (반격 ${rip})`);
    }
    return res;
  }
  /* 심도압박 상승은 전부 이 문을 지난다 — 유물로 무뎌지는 지점이 한 곳뿐이도록 */
  function addDp(hero, amount){
    hero.dp = Math.min(100, hero.dp + amount * relicMul('dpMul', hero));
  }
  function checkCollapse(hero){
    if(hero.dp>=100 && !hero.collapsed){
      hero.collapsed = true; hero.dp = 70;
      pushLog(`${hero.name}의 정신이 함몰 직전이다...`);
    }
  }
  function damageEnemy(en, dmg, opts){
    opts = opts || {};
    flash('white');
    const res = resolveIncoming(en, dmg);
    if(res.kind==='dodge'){
      queueFx('dodge', en);
      pushLog(`${ga(en.name)} 미끄러지듯 피한다.`);
      return null;
    }
    en.hp = Math.max(0, en.hp - res.dealt);
    let phaseMsg = null;
    if(res.dealt>0) queueFx('impact', en, res.dealt);
    if(res.kind==='guard'){ queueFx('guard', en); phaseMsg = `${ga(en.name)} 몸을 틀어 흘려낸다. (${res.dealt} 피해)`; }

    if(en.hp<=0){
      en.alive = false;
      queueFx('death', en);
    } else if(en.kind==='boss' && en.phase===1 && en.hp <= en.maxHp*0.5){
      en.phase = 2;
      en.atk = Math.round(en.atk*1.2);
      en.block = Math.max(en.block, 6);
      en.intent = pickIntent(en);
      phaseMsg = `${ga(en.name)} 진짜 모습을 드러낸다...!`;
    }

    const hero = opts.from || null;
    if(en.alive && !opts.riposte && hero && hero.alive
       && canRiposte(en, foeRank(en), hero, heroRank(hero))
       && Math.random() < reactOf(en).riposte){
      markReact(en, 'riposte');
      queueFx('riposte', en);
      const rip = reactOf(en).rip;
      applyDamageToHero(hero, rip, {stress:false, riposte:false});
      phaseMsg = phaseMsg || `${ga(en.name)} 이빨을 드러내며 받아친다. (반격 ${rip})`;
    }
    return phaseMsg;
  }

  function isAttackCard(card){ return card.type==='attack' || card.type==='reroll_intent'; }
  function ownerOf(card){ return S.party.find(p=>p && p.id===card.owner) || null; }

  /* 이 카드가 지금 실제로 닿을 수 있는 적들 */
  function enemyTargetsFor(card){
    const b = S.battle;
    if(!b) return [];
    const owner = ownerOf(card);
    if(!owner || !owner.alive) return [];
    if(!canActFrom(owner, heroRank(owner))) return [];
    return b.enemies.filter(e => e.alive && canHitRank(owner, foeRank(e)));
  }

  /* 못 내는 이유를 문장으로 — 카드에 그대로 찍어 보여준다 */
  function cardBlockReason(card){
    if(!isAttackCard(card)) return null;
    const owner = ownerOf(card);
    if(!owner || !owner.alive) return '시전자가 없다';
    const oRank = heroRank(owner);
    if(!canActFrom(owner, oRank)) return `${reachOf(owner).label} 병과는 ${rankName(oRank)}에서 못 친다`;
    if(!enemyTargetsFor(card).length) return '닿는 적이 없다';
    return null;
  }

  function canPlayCard(card){
    const b = S.battle;
    if(!b || b.over) return false;
    if(b.pendingCardUid && b.pendingCardUid!==card.uid) return false;
    if(b.energy < card.cost) return false;
    if(cardBlockReason(card)) return false;
    return true;
  }

  function beginTargeting(cardUid, domain){ S.battle.pendingCardUid=cardUid; S.battle.pendingDomain=domain; }
  function cancelTargeting(){ if(S.battle){ S.battle.pendingCardUid=null; S.battle.pendingDomain=null; } }

  function resolveCard(cardUidVal, targetInfo){
    const b = S.battle;
    if(!b || b.over) return;
    const idx = b.hand.findIndex(c=>c.uid===cardUidVal);
    if(idx===-1) return;
    const card = b.hand[idx];
    if(!canPlayCard(card)) return;

    cancelTargeting();
    clearLog();
    b.energy -= card.cost;
    b.hand.splice(idx,1);
    b.discard.push(card);

    const owner = ownerOf(card);
    const reachable = enemyTargetsFor(card);

    /* 사거리 밖은 애초에 후보에 없다 */
    let enemyTarget = null;
    if(card.range==='melee' || card.range==='ranged'){
      if(card.range==='ranged' && targetInfo && targetInfo.enemyIdx!=null){
        const t = b.enemies[targetInfo.enemyIdx];
        if(t && reachable.indexOf(t)>=0) enemyTarget = t;
      }
      if(!enemyTarget) enemyTarget = reachable[0] || null;
    }

    let allyTarget = null;
    if(card.range==='support_ally'){
      if(targetInfo && targetInfo.allyId){ allyTarget = S.party.find(p=>p && p.id===targetInfo.allyId && p.alive) || null; }
      if(!allyTarget) allyTarget = lowestHpTarget();
    }

    /* 제 정신을 깎아 쓰는 카드는 공격만이 아니다 — 종류를 가리지 않고 먼저 치른다 */
    if(card.selfDp && owner && owner.alive){ addDp(owner, card.selfDp); checkCollapse(owner); }

    switch(card.type){
      case 'attack': {
        let dmg = Math.round(card.dmg * relicMul('dmgMul', owner));
        if(owner && owner.collapsed) dmg = Math.round(dmg*0.5);
        if(card.range==='aoe'){
          let phaseMsg = null;
          reachable.slice().forEach(en=>{ const pm=damageEnemy(en, dmg, {from:owner}); if(pm) phaseMsg=pm; });
          pushLog(phaseMsg || `${card.name} — 닿는 적 ${reachable.length}체에게 ${dmg} 피해.`);
        } else if(enemyTarget){
          const phaseMsg = damageEnemy(enemyTarget, dmg, {from:owner});
          if(card.selfBlock && owner && owner.alive) owner.block += card.selfBlock;
          pushLog(phaseMsg || `${card.name} — ${enemyTarget.name}에게 ${dmg} 피해.`);
        }
        break;
      }
      case 'block': { if(owner&&owner.alive){ owner.block+=Math.round(card.block*relicMul('blockMul', owner)); pushLog(`${owner.name}이 방어 태세를 취한다.`); } break; }
      case 'block_party': { aliveParty().forEach(p=>p.block+=Math.round(card.block*relicMul('blockMul', p))); pushLog('파티 전체가 대비한다.'); break; }
      case 'heal': { if(allyTarget){ allyTarget.hp=Math.min(allyTarget.maxHp, allyTarget.hp+Math.round(card.heal*relicMul('healMul', allyTarget))); queueFx('heal', allyTarget); pushLog(`${allyTarget.name}의 상처를 봉합했다.`); } break; }
      case 'calm': { if(allyTarget){ allyTarget.dp=Math.max(0, allyTarget.dp-card.calm); queueFx('calm', allyTarget); pushLog(`${allyTarget.name}이 숨을 고른다.`); } break; }
      case 'calm_party': { aliveParty().forEach(p=>{ p.dp=Math.max(0,p.dp-card.calm); queueFx('calm', p); }); pushLog('파티 전체가 진정된다.'); break; }
      case 'fuse_support': { if(allyTarget){ allyTarget.hp=Math.min(allyTarget.maxHp, allyTarget.hp+Math.round(card.heal*relicMul('healMul', allyTarget))); allyTarget.dp=Math.max(0, allyTarget.dp-card.calm); queueFx('heal', allyTarget); pushLog(`${allyTarget.name}이 정화와 회복을 동시에 받는다.`); } break; }
      case 'draw': { drawHand(card.draw); pushLog('카드를 더 끌어온다.'); break; }
      case 'foresight': { drawHand(card.draw); if(owner&&owner.alive){ owner.dp=Math.max(0,owner.dp-card.calm); } pushLog('마음을 가라앉히며 앞일을 살핀다.'); break; }
      case 'reroll_intent': { if(enemyTarget){ enemyTarget.intent = pickIntent(enemyTarget); pushLog(`${enemyTarget.name}의 운명이 뒤틀린다.`); } break; }
      case 'swap': {
        if(allyTarget){
          const targetIdx = S.party.indexOf(allyTarget);
          if(targetIdx > 0){ const t=S.party[0]; S.party[0]=S.party[targetIdx]; S.party[targetIdx]=t; pushLog(`${ga(allyTarget.name)} 전열로 나선다.`); }
          else if(targetIdx===0 && S.party.length>1){ const t=S.party[0]; S.party[0]=S.party[1]; S.party[1]=t; pushLog('전열과 중열이 자리를 바꾼다.'); }
        }
        break;
      }
    }
    /* 자리가 바뀌면 사거리가 바뀌므로 예고를 다시 계산한다 */
    if(card.type==='swap') rollIntents();

    if(b.enemies.every(e=>!e.alive)){ winBattle(); }
    render();
  }

  function executeEnemyTurn(){
    const b = S.battle;
    clearLog();
    b.enemies.forEach(en=>{
      if(!en.alive) return;
      en.block = 0;
      const intent = en.intent;
      if(!intent) return;

      if(intent.type==='attack_reach'){
        const t = pickHeroTarget(en);
        if(t){
          pushLog(`${ga(en.name)} ${rankName(heroRank(t))}의 ${eul(t.name)} 노린다. (${intent.val})`);
          applyDamageToHero(t, intent.val, {from:en});
        } else pushLog(`${ga(en.name)} 허공을 할퀸다 — 닿지 않는다.`);

      } else if(intent.type==='double_attack_reach'){
        const t = pickHeroTarget(en);
        if(t){
          pushLog(`${ga(en.name)} ${eul(t.name)} 두 번 후려친다.`);
          applyDamageToHero(t, intent.val, {from:en});
          if(t.alive) applyDamageToHero(t, intent.val, {from:en});
        } else pushLog(`${ga(en.name)} 헛손질한다.`);

      } else if(intent.type==='attack_all'){
        const pool = heroesInReach(en);
        if(pool.length){
          pushLog(`${ga(en.name)} 닿는 모두를 집어삼킨다. (전체 ${intent.val})`);
          pool.forEach(p=>{ if(p.alive) applyDamageToHero(p, intent.val, {from:en}); });
        } else pushLog(`${en.name}의 포효가 빈 물살을 때린다.`);

      } else if(intent.type==='whisper_random'){
        const alive = aliveParty();
        if(alive.length){
          const t = alive[Math.floor(Math.random()*alive.length)];
          addDp(t, intent.val); checkCollapse(t);
          pushLog(`무언가 ${t.name}의 귀에 속삭인다. (심도압박 +${intent.val})`);
        }

      } else if(intent.type==='whisper_rear'){
        const t = rearTarget();
        if(t){
          addDp(t, intent.val); checkCollapse(t);
          pushLog(`${ga(en.name)} 후미의 ${t.name}에게 속삭인다. (심도압박 +${intent.val})`);
        }

      } else if(intent.type==='snipe_lowest'){
        const pool = heroesInReach(en);
        if(pool.length){
          const t = pool.reduce((x,p)=> p.hp<x.hp ? p : x, pool[0]);
          pushLog(`${ga(en.name)} 가장 약한 ${eul(t.name)} 저격한다. (${intent.val})`);
          applyDamageToHero(t, intent.val, {stress:false, from:en});
        } else pushLog(`${ga(en.name)} 겨눌 표적을 찾지 못한다.`);

      } else if(intent.type==='guard_up'){
        en.block += intent.val;
        pushLog(`${ga(en.name)} 몸을 웅크린다. (방어 +${intent.val})`);
      }
    });
    checkPartyWipe();
  }

  function checkPartyWipe(){
    if(aliveParty().length===0){ triggerGameOver('파티 전원이 심연에 잠겼다.'); return true; }
    return false;
  }
  function triggerGameOver(reason){
    S.loseReason = reason;
    if(S.battle) S.battle.over = true;
    S.screen = 'gameover';
  }

  function endPlayerTurn(){
    const b = S.battle;
    if(!b || b.over || b.pendingCardUid) return;
    b.discard.push(...b.hand); b.hand=[];

    executeEnemyTurn();
    if(b.over){ render(); return; }

    const rise = b.tier==='중층' ? 2 : (b.node && b.node.type==='elite' ? 1 : 0);
    if(rise>0){ aliveParty().forEach(p=>{ addDp(p, rise); checkCollapse(p); }); }

    const maxed = addErosion(erosionRate());
    if(checkPartyWipe()){ render(); return; }
    if(maxed){ triggerGameOver('잠식이 한계에 다다랐다. 돌아갈 길이 사라졌다.'); render(); return; }

    aliveParty().forEach(p=>p.block=0);
    b.turn += 1;
    b.energy = b.maxEnergy;
    rollIntents();
    drawHand(handSize());
    render();
  }

  function winBattle(){
    S.battle.over = true;
    pushLog('적이 물거품이 되어 흩어진다.');
    setTimeout(()=>{ completeCurrentNode(); render(); }, 550);
  }

  /* ============ MAP FLOW ============ */
  /* 갈림길은 한 번 뽑으면 고정된다 — 다시 그린다고 선택지가 바뀌면 고를 이유가 없다 */
  function availableNodes(){
    if(!S.mapChoices) S.mapChoices = rollChoices();
    return S.mapChoices;
  }
  function aftermathActionsFor(node){
    if(node.type==='rest') return 0;
    if(node.type==='elite' || node.boss) return 2;
    return 1;
  }
  function enterMapNode(id){
    const node = availableNodes().find(n=>n.id===id);
    if(!node) return;
    S.pendingNode = node;
    if(node.type==='battle' || node.type==='elite'){
      startBattle(node);
    } else if(node.type==='rest'){
      if(addErosion(EROSION_REST)){ triggerGameOver('숨을 고르는 사이 잠식이 한계를 넘었다.'); return; }
      S.rest = {choice:null};
      S.screen = 'rest';
    } else if(node.type==='treasure'){
      completeCurrentNode();
    }
  }
  function completeCurrentNode(){
    const node = S.pendingNode;
    S.mapVisited.push(node);
    S.mapChoices = null;
    S.stepInChapter += 1;
    S.party.forEach(p=>{ if(p) p.block=0; });
    const actions = aftermathActionsFor(node);
    const surfaced = S.stepInChapter >= chapter().length;
    S.afterAftermath = !surfaced ? 'map' : (isFinalChapter() ? 'result' : 'escape');
    if(surfaced && !isFinalChapter()) S.escape = {offer:relicOffer(), taken:null, unlocked:unlockNextClass()};
    if(actions>0){
      S.aftermath = {actionsLeft:actions, selecting:null, fuseSelected:[], reveal:null};
      S.screen = 'aftermath';
    } else {
      S.screen = S.afterAftermath;
    }
  }
  function proceedAfterAftermath(){
    S.aftermath = null;
    S.screen = S.afterAftermath || 'map';
    render();
  }

  /* 인양 — 수면으로 올라왔으니 잠식 시계가 처음으로 돌아가고, 숨과 상처를 어느 정도 되찾는다.
     이게 없으면 뒤로 갈수록 길어지는 구역을 버틸 방법이 없다. */
  function enterTavern(){
    S.tavern = {recruited:[], slot:null, unlocked:S.escape ? S.escape.unlocked : null};
    S.screen = 'tavern';
  }

  function descendNextChapter(){
    S.chapter += 1;
    S.stepInChapter = 0;
    S.mapChoices = null;
    S.pendingNode = null;
    S.escape = null;
    S.tavern = null;
    S.erosion = 0;
    S.party.forEach(p=>{
      if(!p || !p.alive) return;
      p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp*0.4));
      p.dp = Math.max(0, p.dp - 30);
      p.block = 0;
      p.collapsed = false;
    });
    S.screen = 'map';
  }

  function chooseRest(kind){ S.rest.choice = kind; }
  function confirmRest(){
    const alive = aliveParty();
    if(S.rest.choice==='heal'){ alive.forEach(p=>p.hp=Math.min(p.maxHp,p.hp+Math.round(10*relicMul('healMul', p)))); S.logMsg='상처를 돌본다.'; }
    else if(S.rest.choice==='calm'){ alive.forEach(p=>p.dp=Math.max(0,p.dp-18)); S.logMsg='잠시 눈을 감고 숨을 고른다.'; }
    completeCurrentNode();
    render();
  }

  /* ============ UPGRADE / FUSION ============ */
  function groupedUpgradeOptions(){
    const groups = {};
    S.runDeck.forEach(c=>{
      if(c.upgraded) return;
      if(!groups[c.name]) groups[c.name] = {name:c.name, owner:c.owner, count:0};
      groups[c.name].count++;
    });
    return Object.values(groups);
  }
  function applyUpgradeCard(c){
    c.upgraded = true;
    c.name = c.name + '+';
    if(c.dmg) c.dmg = Math.round(c.dmg*1.35);
    if(c.block) c.block = Math.round(c.block*1.35);
    if(c.selfBlock) c.selfBlock = Math.round(c.selfBlock*1.35);
    if(c.heal) c.heal = Math.round(c.heal*1.35);
    if(c.calm) c.calm = Math.round(c.calm*1.35);
    if(c.selfDp) c.selfDp = Math.max(0, c.selfDp-2);
    if(c.type==='draw' || c.type==='foresight') c.draw = (c.draw||0)+1;
    if(c.type==='swap' || c.type==='reroll_intent') c.cost = Math.max(0, c.cost-1);
    S.logMsg = `${c.name} 카드가 강화되었다.`;
  }
  function applyUpgradeByName(name){
    const c = S.runDeck.find(c=>c.name===name && !c.upgraded);
    if(c) applyUpgradeCard(c);
    return c || null;
  }
  function applyFusion(defIdA, defIdB){
    const ia = S.runDeck.findIndex(c=>c.defId===defIdA);
    const ib = S.runDeck.findIndex(c=>c.defId===defIdB);
    if(ia<0 || ib<0 || ia===ib) return null;
    const first = Math.max(ia,ib), second = Math.min(ia,ib);
    S.runDeck.splice(first,1);
    S.runDeck.splice(second,1);
    const newCard = {defId:nextId(), name:'속죄의 결속', cost:2, type:'fuse_support', heal:5, calm:8, owner:'neutral', range:'support_ally', upgraded:false, desc:'아군 한 명 체력 5 회복 + 심도압박 8 감소.'};
    S.runDeck.push(newCard);
    S.logMsg = '두 카드가 하나로 융합되었다.';
    return newCard;
  }

  /* ============ ATMOSPHERE ============ */
  function tierSlug(tier){
    if(tier==='표층') return 'surface';
    if(tier==='중층') return 'mid';
    return 'abyss';
  }
  function currentTier(){
    if(S.screen==='gameover') return '심해';
    if(S.screen==='battle' && S.battle) return S.battle.tier;
    if((S.screen==='rest' || S.screen==='aftermath') && S.pendingNode) return S.pendingNode.tier;
    /* 인양된 뒤에는 수면 위다 — 배경도 같이 밝아져야 올라왔다는 게 읽힌다 */
    if(S.screen==='escape' || S.screen==='tavern' || S.screen==='result') return '표층';
    if(S.screen==='map') return chapter().tier;
    return '표층';
  }
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function bubbles(n){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(3,97).toFixed(1), size=rand(3,8).toFixed(1), dur=rand(14,24).toFixed(1), delay=(-rand(0,20)).toFixed(1);
      html += `<div class="bubble" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  function motes(n,kind){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(4,96).toFixed(1), top=rand(4,90).toFixed(1), size=rand(2,5).toFixed(1), dur=rand(14,24).toFixed(1), delay=(-rand(0,20)).toFixed(1);
      html += `<div class="mote mote-${kind}" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  /* 가라앉는 잿가루 — 어느 층이든 위에서 계속 내려온다 */
  function ashes(n){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(2,98).toFixed(1), size=rand(1,2.4).toFixed(1), dur=rand(20,38).toFixed(1), delay=(-rand(0,36)).toFixed(1);
      html += `<div class="ash" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  function atmoMarkup(slug){
    if(slug==='surface') return `<div class="atmo-gradient atmo-surface"></div><div class="beam beam1"></div><div class="beam beam2"></div>${bubbles(7)}${ashes(10)}`;
    if(slug==='mid') return `<div class="atmo-gradient atmo-mid"></div>${motes(8,'mid')}${ashes(14)}`;
    return `<div class="atmo-gradient atmo-abyss"></div>${motes(4,'abyss')}${ashes(8)}`;
  }

  /* ============ RENDER ============ */
  const app = document.getElementById('app');
  app.innerHTML = '<div id="atmo" aria-hidden="true"></div><div id="content"></div>'
                + '<div id="grain" aria-hidden="true"></div><div id="fx" aria-hidden="true"></div>'
                + '<div id="flash" aria-hidden="true"></div>';
  const atmoEl = document.getElementById('atmo');
  const contentEl = document.getElementById('content');
  const fxEl = document.getElementById('fx');
  const flashEl = document.getElementById('flash');

  /* ============ 파티클 ============
     피해 판정은 render() 앞에서 끝나지만 그때의 DOM 은 곧 버려진다.
     그래서 이벤트만 큐에 쌓아두고, 다시 그린 뒤 카드 위치를 찾아 뿌린다. */
  let fxQueue = [];
  function queueFx(kind, unit, amount){
    if(!S.battle) return;
    const side = S.party.indexOf(unit) >= 0 ? 'hero' : 'foe';
    const key  = side==='hero' ? unit.id : S.battle.enemies.indexOf(unit);
    fxQueue.push({kind:kind, side:side, key:key, amount:amount||0});
  }

  const FX_COLOR = {
    heroHit:'#c4383c', foeHit:'#b87ad8',
    dodge:'#8fd4c4', guard:'#9fc0d8', riposte:'#e0574f',
    heal:'#e0aa4c', calm:'#7fbfae', death:'#cfe4dd',
  };
  function clearFxLayer(){ while(fxEl.firstChild) fxEl.removeChild(fxEl.firstChild); }
  const FX_MAX = 180;   /* 타이머가 밀려도 레이어가 무한히 불어나지 않게 */
  function spawn(cls, x, y, color, size, vars, life){
    while(fxEl.childElementCount >= FX_MAX) fxEl.removeChild(fxEl.firstChild);
    const p = document.createElement('div');
    p.className = 'p ' + cls;
    p.style.left = x+'px';
    p.style.top  = y+'px';
    if(color) p.style.color = color;
    if(size){ p.style.width = size[0]+'px'; p.style.height = size[1]+'px'; }
    if(vars) for(const k in vars) p.style.setProperty(k, vars[k]);
    fxEl.appendChild(p);
    setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, life||1100);
  }
  const rnd = (a,b)=> a + Math.random()*(b-a);

  function burst(x, y, color, n, spread){
    for(let i=0;i<n;i++){
      const a = (360/n)*i + rnd(-14,14);
      spawn('p-shard', x, y, color, [rnd(1.5,2.8), rnd(7,13)],
            {'--a':a+'deg', '--r':rnd(spread*0.55, spread)+'px', '--d':rnd(380,620)+'ms'}, 700);
    }
  }
  function playFx(ev, el){
    const ar = app.getBoundingClientRect();
    const r  = el.getBoundingClientRect();
    const cx = r.left - ar.left + r.width/2;
    const cy = r.top  - ar.top  + r.height/2;
    const mine = ev.side==='hero';

    if(ev.kind==='impact'){
      const col = mine ? FX_COLOR.heroHit : FX_COLOR.foeHit;
      /* 피해가 클수록 파편이 많고 멀리 튄다 */
      const n = Math.max(6, Math.min(14, 5 + Math.round(ev.amount*0.8)));
      burst(cx, cy, col, n, 30 + Math.min(26, ev.amount*2.2));
      spawn('p-ring', cx, cy, col, [30,30], {'--d':'380ms'}, 500);
      el.classList.add('hit-shake');

    } else if(ev.kind==='dodge'){
      for(let i=0;i<3;i++){
        spawn('p-wisp', cx + rnd(-8,8), cy + rnd(-12,12), FX_COLOR.dodge, null,
              {'--dx':rnd(20,36)+'px', '--d':rnd(420,600)+'ms'}, 700);
      }

    } else if(ev.kind==='guard'){
      spawn('p-ring', cx, cy, FX_COLOR.guard, [40,40], {'--d':'520ms'}, 650);
      burst(cx, cy, FX_COLOR.guard, 5, 20);

    } else if(ev.kind==='riposte'){
      spawn('p-slash', cx, cy, FX_COLOR.riposte, null, {'--a':'-32deg'}, 460);
      spawn('p-slash', cx, cy, FX_COLOR.riposte, null, {'--a':'26deg'}, 460);

    } else if(ev.kind==='death'){
      for(let i=0;i<12;i++){
        const s = rnd(3,8);
        spawn('p-bub', cx + rnd(-16,16), cy + rnd(-10,14), null, [s,s],
              {'--dx':rnd(-16,16)+'px', '--dy':rnd(48,92)+'px', '--d':rnd(700,1150)+'ms'}, 1300);
      }
      spawn('p-ring', cx, cy, FX_COLOR.death, [44,44], {'--d':'620ms'}, 800);

    } else if(ev.kind==='heal' || ev.kind==='calm'){
      const col = ev.kind==='heal' ? FX_COLOR.heal : FX_COLOR.calm;
      for(let i=0;i<8;i++){
        const s = rnd(2,4);
        spawn('p-mote', cx + rnd(-18,18), cy + rnd(-4,16), col, [s,s],
              {'--dx':rnd(-10,10)+'px', '--dy':rnd(26,48)+'px', '--d':rnd(560,900)+'ms'}, 1000);
      }
    }
  }
  function flushFx(){
    if(!fxQueue.length) return;
    const q = fxQueue; fxQueue = [];
    if(!S.battle || S.screen!=='battle'){ clearFxLayer(); return; }
    q.forEach(ev=>{
      const sel = ev.side==='hero'
        ? '.hero-card[data-id="'+ev.key+'"]'
        : '.foe-card[data-idx="'+ev.key+'"]';
      const el = contentEl.querySelector(sel);
      if(el) playFx(ev, el);
    });
  }
  function flash(type){
    if(!flashEl) return;
    flashEl.classList.remove('flash-white','flash-red');
    void flashEl.offsetWidth; // force reflow so the animation restarts even if same type fires again
    flashEl.classList.add(type==='white' ? 'flash-white' : 'flash-red');
  }
  let lastSlug = null;
  function ensureAtmo(slug){
    if(slug !== lastSlug){ atmoEl.innerHTML = atmoMarkup(slug); lastSlug = slug; }
    if(app.dataset.tier !== slug) app.dataset.tier = slug;
  }

  function dpColor(dp){ if(dp>=100) return '#d9452f'; if(dp>=70) return '#d89a3c'; return '#7fbfae'; }
  function dpRingStyle(dp){
    const col = dpColor(dp);
    return `background:conic-gradient(${col} ${dp*3.6}deg, rgba(206,198,181,0.07) 0deg); box-shadow: inset 0 0 0 3px #080e10, 0 0 9px ${col}40;`;
  }
  function ownerLabel(o){
    if(o==='neutral') return '중립';
    const def = CLASS_DEFS[o];
    return def ? def.name : o;
  }

  function renderTopbar(){
    const pct = Math.max(0, Math.min(100, S.erosion));
    const danger = pct >= 70 ? 'danger' : '';
    return `
      <div class="topbar">
        <div class="ero-row">
          <div class="ero-label">잠식</div>
          <div class="ero-case ${danger}"><div class="ero-fill" style="width:${pct}%"></div></div>
          <div class="ero-num mono ${danger}">${Math.round(S.erosion)}%</div>
        </div>
        ${S.relics.length ? `<div class="relic-tray topbar-relics">${S.relics.map(relicChip).join('')}</div>` : ''}
      </div>`;
  }

  function renderTitle(){
    contentEl.innerHTML = `
      <div class="screen title-screen">
        <div class="title-glyph"><span>${ICON_SIGIL}</span></div>
        <div class="title-en">Roguelike Deckbuilder · Cosmic Depths</div>
        <div class="title-kr">THE FATHOM<br>COVENANT</div>
        <div class="rule"></div>
        <div class="title-sub">가라앉은 도시가 잠시 떠오른다.<br>잠식이 도시를 다 삼키기 전, 내려가 회수하고 돌아와라.</div>
        <button class="btn primary" data-action="start">전문가 선정</button>
        <div class="title-sub" style="font-size:11px; opacity:0.55;">프로토타입 · 표층~중층 · 갈림길</div>
      </div>`;
  }

  function renderClassSelect(){
    const st = S.setup;
    let body = '';
    if(st.phase==='pick-classes'){
      body = `
        <div class="tier-tag">전문가 3인을 선택하세요 (${st.selected.length}/3)</div>
        <div class="class-grid">
          ${Object.values(CLASS_DEFS).map(def=>{
            const sel = st.selected.includes(def.id);
            const locked = !isUnlocked(def.id);
            return `
            <div class="class-card ${sel?'sel':''} ${locked?'locked':''}" ${locked?'':`data-action="toggle-class" data-id="${def.id}"`}>
              <div class="portrait portrait-${def.id}" style="margin:0 auto 6px;">${CLASS_ICON[def.id]}</div>
              <div class="class-name">${def.name} ${reachChip({reach:def.reach})}</div>
              ${locked ? `<div class="class-locked-tag">여관에서 만나지 못했다</div>`
                       : `<div class="class-tagline">${def.tagline}</div>
                          <div class="class-blurb">${def.blurb}</div>`}
            </div>`;
          }).join('')}
        </div>
        <button class="btn primary" data-action="classes-next" ${st.selected.length===3?'':'disabled'}>다음 — 위치 배치</button>`;
    } else {
      const trayIds = st.selected.filter(id=>!st.placements.includes(id));
      /* 빈 칸은 열을 차지하지 않는다 — 실제로 서게 될 열을 미리 보여준다 */
      const badPlacements = st.placements.filter((cid,i)=>{
        if(!cid) return false;
        const eff = st.placements.slice(0,i).filter(Boolean).length;
        return !canActFrom({reach:CLASS_DEFS[cid].reach}, eff);
      }).length;
      body = `
        <div class="tier-tag">대열을 짜세요</div>
        <div class="rank-slots">
          ${[0,1,2,3].map(i=>{
            const cid = st.placements[i];
            const def = cid ? CLASS_DEFS[cid] : null;
            const droppable = st.armed && !cid;
            const eff = st.placements.slice(0,i).filter(Boolean).length;
            const bad = cid && !canActFrom({reach:def.reach}, eff);
            return `
            <div class="rank-slot ${cid?'filled':'empty'} ${droppable?'droppable':''} ${bad?'bad':''}" data-action="place-rank" data-idx="${i}">
              <div class="rank-slot-label">${cid ? rankName(eff) : '—'}</div>
              ${def
                ? `<div class="portrait portrait-${cid}" style="width:30px;height:30px;margin:3px auto;">${CLASS_ICON[cid]}</div>
                   <div class="rank-slot-name">${def.name}</div>
                   <div style="margin-top:3px;">${reachChip({reach:def.reach})}</div>
                   ${bad ? `<div class="rank-warn">공격 불가</div>` : ''}`
                : `<div class="rank-slot-hint">비어있음</div>`}
            </div>`;
          }).join('')}
        </div>
        <div class="reach-legend">
          근접은 <b>전열·중열</b>에서만 휘두르고, 원거리는 <b>전열에 서면</b> 겨눌 수 없다.<br>
          빈 칸은 열로 세지 않으며, 앞이 쓰러지면 뒤가 당겨진다.
        </div>
        ${badPlacements ? `<div class="rank-warn" style="font-size:10px;">지금 배치로는 ${badPlacements}명이 공격할 수 없다</div>` : ''}
        <div class="hero-tray">
          ${trayIds.map(cid=>{
            const def = CLASS_DEFS[cid];
            return `<div class="tray-chip ${st.armed===cid?'armed':''}" data-action="arm-hero" data-id="${cid}">${def.name}</div>`;
          }).join('')}
        </div>
        <div class="af-hint">${st.armed ? '배치할 위치를 탭하세요' : (trayIds.length ? '탭하여 전문가를 든 다음, 위치를 탭하세요' : '전문가 배치가 끝났다')}</div>
        <div class="setup-btn-row">
          <button class="btn" data-action="classes-back">뒤로</button>
          <button class="btn primary" data-action="confirm-setup" ${trayIds.length===0?'':'disabled'}>하강 시작</button>
        </div>`;
    }
    contentEl.innerHTML = `
      <div class="screen map-screen">
        ${body}
      </div>`;
  }

  function renderMap(){
    const avail = availableNodes();
    const ch = chapter();
    /* 이번 구역에서 지나온 자취만 남긴다 — 인양될 때마다 발자국은 새로 찍힌다 */
    const crumbs = S.mapVisited.slice(S.mapVisited.length - S.stepInChapter).map(n=>{
      const ic = n.type==='battle'?IC_CRUMB_BATTLE:n.type==='elite'?IC_CRUMB_ELITE:n.type==='rest'?IC_CRUMB_REST:IC_CRUMB_LOOT;
      return `<div class="crumb-chip">${ic}</div>`;
    }).join('');
    const bossNext = avail.length===1 && avail[0].boss;
    contentEl.innerHTML = `
      ${renderTopbar()}
      <div class="screen map-screen">
        <div class="chapter-tag">${ch.title} · ${ch.tier}<span class="chapter-step">${S.stepInChapter}/${ch.length}</span></div>
        ${S.stepInChapter ? `<div class="path-trail">${crumbs}</div>` : `<div class="chapter-lead">${ch.lead}</div>`}
        <div class="tier-tag">${bossNext ? '길이 하나로 좁혀졌다' : '다음 향할 곳을 선택하세요'}</div>
        <div class="node-choices">
          ${avail.map(n=>{
            const typeLabel = n.boss?'수문장':n.type==='battle'?'조우':n.type==='elite'?'엘리트':n.type==='rest'?'은신처':'회수';
            return `
            <div class="node-card${n.boss?' boss':''}" data-action="enter-node" data-id="${n.id}">
              <div class="node-type-tag">${typeLabel} · ${n.tier}</div>
              <h3>${n.title}</h3>
              <p>${n.desc}</p>
              <div class="node-card-cta">${n.boss?'넘어선다 →':'선택 →'}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  function relicChip(r){
    return `<div class="relic-chip" title="${r.boon}">${ICON_RELIC}<span>${r.name}</span></div>`;
  }

  function renderEscape(){
    const ch = chapter();
    const esc = S.escape || {offer:[], taken:null};
    const next = CHAPTERS[S.chapter+1];
    const picked = esc.taken;
    contentEl.innerHTML = `
      <div class="screen escape-screen">
        <div class="title-glyph"><span style="color:var(--gaslamp);">${ICON_SIGIL}</span></div>
        <div class="title-en">Extracted</div>
        <h2 style="margin:0;">${ch.tier} 구역을 빠져나왔다</h2>
        <div class="escape-note">
          인양줄이 당겨진다. 잠식은 수면 위에서 멈추고, 숨과 상처가 얼마간 돌아온다.
        </div>
        ${picked ? `
          <div class="relic-card">
            <div class="relic-glyph">${ICON_RELIC}</div>
            <div class="relic-name">${picked.name}</div>
            <div class="relic-boon">${picked.boon}</div>
            <div class="relic-desc">${picked.flavor}</div>
          </div>
          <div class="escape-note">부두 끝에 불이 켜진 여관이 하나 있다. 하강 전에 들를 수 있는 마지막 자리다.</div>
          <button class="btn primary" data-action="to-tavern">여관으로 간다</button>
        ` : `
          <div class="tier-tag">건져 올린 것 중 하나를 챙긴다</div>
          <div class="relic-offer">
            ${esc.offer.map(r=>`
              <div class="relic-opt" data-action="take-relic" data-id="${r.id}">
                <div class="relic-opt-head">${ICON_RELIC}<span>${r.name}</span></div>
                <div class="relic-boon">${r.boon}</div>
                <div class="relic-desc">${r.flavor}</div>
              </div>`).join('')}
          </div>
        `}
      </div>`;
  }

  function reachChip(unit){
    const r = reachOf(unit);
    return `<span class="reach-chip reach-${r.id}">${r.label}</span>`;
  }
  function reactBadge(unit){
    if(!unit || !unit.react || !S.battle) return '';
    if(unit.react.turn !== S.battle.turn) return '';
    const k = unit.react.kind;
    const ic = k==='dodge' ? IC_DODGE : k==='guard' ? IC_GUARDED : IC_RIPOSTE;
    const label = k==='dodge' ? '회피' : k==='guard' ? '흘림' : '반격';
    return `<div class="react-tag react-${k}">${ic}<span>${label}</span></div>`;
  }
  function pendingCard(){
    const b = S.battle;
    if(!b || !b.pendingCardUid) return null;
    return b.hand.find(c=>c.uid===b.pendingCardUid) || null;
  }

  function heroCardHtml(hero){
    if(!hero) return `<div class="hero-card empty">공석</div>`;
    const hpPct = Math.max(0,(hero.hp/hero.maxHp)*100);
    const dead = !hero.alive;
    const rank = heroRank(hero);
    const idle = !dead && !canActFrom(hero, rank);
    const targetable = S.battle && S.battle.pendingDomain==='ally' && hero.alive;
    return `
      <div class="hero-card cls-${hero.cls} ${hero.collapsed?'collapsed':''} ${targetable?'targetable':''} ${idle?'idle':''}"
           style="${dead?'opacity:0.35;':''}"
           data-action="choose-target" data-domain="ally" data-id="${hero.id}">
        ${reactBadge(hero)}
        <div class="portrait portrait-${hero.cls}">${CLASS_ICON[hero.cls]}</div>
        <div class="hero-rank">${dead?'전사':rankName(rank)} ${reachChip(hero)}</div>
        <div class="hero-name">${hero.name}</div>
        <div class="hero-hpline">
          <div class="hpbar"><div class="fill" style="width:${hpPct}%"></div></div>
          <div class="hero-num mono">${hero.hp}/${hero.maxHp}</div>
        </div>
        <div class="dp-gauge">
          <div class="dp-ring" style="${dpRingStyle(hero.dp)}"></div>
          <div class="dp-num">${hero.dp}</div>
        </div>
        ${idle ? `<div class="rank-warn">사거리 밖</div>` : ''}
        ${hero.block>0 ? `<div class="block-tag">${IC_BLOCK}${hero.block}</div>` : ''}
      </div>`;
  }

  function foeCardHtml(en, i){
    const b = S.battle;
    const hpPct = Math.max(0,(en.hp/en.maxHp)*100);
    const tSlug = tierSlug(b.tier);
    const rank = foeRank(en);
    const isBoss = en.kind==='boss';
    const isElite = en === b.enemies[0] && b.node && b.node.type==='elite';
    const isAwakened = isBoss && en.phase===2;
    const dead = !en.alive;
    const idle = !dead && (!canActFrom(en, rank) || heroesInReach(en).length===0);

    /* 조준 중인 카드가 실제로 닿는 적만 밝힌다 */
    const pc = pendingCard();
    const targetable = b.pendingDomain==='enemy' && en.alive && pc && enemyTargetsFor(pc).indexOf(en) >= 0;

    return `
      <div class="foe-card ${targetable?'targetable':''} ${isElite?'elite-foe':''} ${isBoss?'boss-foe':''} ${isAwakened?'boss-awakened':''} ${idle?'idle':''}"
           style="${dead?'opacity:0.3;':''}"
           data-action="choose-target" data-domain="enemy" data-idx="${i}">
        ${reactBadge(en)}
        <div class="foe-rank">${dead?'소멸':(isAwakened?'각성':rankName(rank))} ${reachChip(en)}</div>
        <div class="enemy-portrait tier-${tSlug}">${en.icon || ICON_CULTIST}</div>
        <div class="foe-name">${en.name}</div>
        <div class="hero-hpline"><div class="hpbar"><div class="fill" style="width:${hpPct}%"></div></div><div class="hero-num mono">${en.hp}/${en.maxHp}</div></div>
        ${en.block>0 ? `<div class="block-tag" style="position:static; display:inline-flex; margin-top:2px;">${IC_BLOCK}${en.block}</div>` : ''}
        ${en.alive && en.intent ? `<div class="intent-badge"><span class="ic">${en.intent.ic}</span>${en.intent.label}${en.intent.val?` · ${en.intent.val}`:''}</div>` : (dead?`<div class="foe-dead">소멸</div>`:'')}
      </div>`;
  }

  function describeCard(card){
    switch(card.type){
      case 'attack': {
        let s;
        if(card.range==='aoe') s = `모든 적에게 ${card.dmg} 피해.`;
        else if(card.range==='melee') s = `전열 적에게 ${card.dmg} 피해.`;
        else s = `적 한 명을 골라 ${card.dmg} 피해.`;
        if(card.selfBlock) s += ` 자신 방어 ${card.selfBlock} 획득.`;
        if(card.selfDp) s += ` 자신 심도압박 ${card.selfDp} 상승.`;
        return s;
      }
      case 'block': return `자신 방어 ${card.block} 획득.`;
      case 'block_party': return `생존한 아군 전체 방어 ${card.block} 획득.`;
      case 'heal': return `아군 한 명 체력 ${card.heal} 회복.`;
      case 'calm': return `아군 한 명 심도압박 ${card.calm} 감소.`;
      case 'calm_party': return `생존한 아군 전체 심도압박 ${card.calm} 감소.`;
      case 'fuse_support': return `아군 한 명 체력 ${card.heal} 회복 + 심도압박 ${card.calm} 감소.`;
      case 'draw': return `카드 ${card.draw}장을 드로우한다.`;
      case 'foresight': return `카드 ${card.draw}장 드로우. 자신 심도압박 ${card.calm} 감소.`;
      case 'reroll_intent': return `적 한 명의 예고된 행동을 다시 정한다.`;
      case 'swap': return `아군 한 명을 전열로 이동시킨다. (이미 전열이면 중열과 교대)`;
      default: return card.desc || '';
    }
  }

  /* 못 내는 카드에는 이유를 붙여 보여준다 — 왜 회색인지 알아야 자리를 고친다 */
  function castRankNote(card){
    const why = S.battle ? cardBlockReason(card) : null;
    return why ? ` — ${why}` : '';
  }

  function cardHtml(card, playable, selecting){
    const glitch = card.contaminated;
    const desc = glitch ? '？？？ 효과 미상 — 사용 시 확인됨' : (describeCard(card) + castRankNote(card));
    return `
      <div class="card owner-${card.owner} ${playable?'':'unplayable'} ${glitch?'contaminated':''} ${selecting?'selecting':''}" data-uid="${card.uid}" data-action="play-card">
        <div class="card-cost mono">${card.cost}</div>
        <div class="card-name ${glitch?'glitch':''}">${glitch ? garble(card.name) : card.name}</div>
        <div class="card-desc ${glitch?'glitch':''}">${desc}</div>
        <div class="card-owner-tag">${ownerLabel(card.owner)}</div>
      </div>`;
  }

  function garble(str){
    const glyphs = ['◈','҂','⁂','†','☩','▒','░','⍟','✢','⌁'];
    return str.split('').map(ch => Math.random()<0.5 ? glyphs[Math.floor(Math.random()*glyphs.length)] : ch).join('');
  }

  function renderBattle(){
    const b = S.battle;

    let pips = '';
    for(let i=0;i<b.maxEnergy;i++){ pips += `<div class="pip ${i<b.energy?'filled':''}"></div>`; }

    const heroesHtml = S.party.map(h=>heroCardHtml(h)).join('');
    const foesHtml = b.enemies.map((en,i)=>foeCardHtml(en,i)).join('');

    const handHtml = b.hand.map(c=>{
      const playable = canPlayCard(c);
      const selecting = b.pendingCardUid===c.uid;
      return cardHtml(c, playable, selecting);
    }).join('');

    /* 중앙 명판 — 조준 중이면 안내, 아니면 최근 전투 기록 */
    let logHtml;
    if(b.pendingCardUid){
      logHtml = '대상을 선택하세요 · 카드를 다시 탭하면 취소';
    } else if(S.logLines && S.logLines.length){
      const n = S.logLines.length;
      logHtml = S.logLines.map((l,i)=>`<span class="l ${i<n-1?'old':''}">${l}</span>`).join('');
    } else {
      logHtml = S.logMsg || '';
    }

    contentEl.innerHTML = `
      ${renderTopbar()}
      <div class="screen battle-screen">
        <div class="enemy-zone">
          <div class="zone-label">적 대열</div>
          <div class="foe-row ${b.enemies.length>2?'many':''} ${b.enemies.length>=4?'crowded':''}">${foesHtml}</div>
        </div>

        <div class="mid-stage">
          <div class="log-plate ${b.pendingCardUid?'targeting':''}">${logHtml}</div>
        </div>

        <div class="party-zone">${heroesHtml}</div>

        <div class="hand-zone">
          <div class="energy-row">
            <div class="energy-label">에너지</div>
            ${pips}
            <div class="mono" style="font-size:11px;color:var(--muted);margin-left:8px;">턴 ${b.turn}</div>
          </div>
          <div class="hand-row">${handHtml}</div>
          <div class="end-turn-row">
            <button class="btn" data-action="end-turn" ${(b.over||b.pendingCardUid)?'disabled':''}>턴 종료</button>
          </div>
        </div>
      </div>`;
  }

  function renderRest(){
    const r = S.rest;
    contentEl.innerHTML = `
      ${renderTopbar()}
      <div class="screen rest-screen">
        <div class="tier-tag">은신처</div>
        <h3 style="margin:0;">잠시 숨을 고른다</h3>
        <div class="rest-opts">
          <div class="rest-opt ${r.choice==='heal'?'sel':''}" data-action="rest-pick" data-kind="heal">
            <div class="t">상처를 봉합한다</div>
            <div class="d">생존한 아군 전체 체력 +10</div>
          </div>
          <div class="rest-opt ${r.choice==='calm'?'sel':''}" data-action="rest-pick" data-kind="calm">
            <div class="t">눈을 감고 침묵한다</div>
            <div class="d">생존한 아군 전체 심도압박 -18</div>
          </div>
        </div>
        <button class="btn primary" data-action="rest-confirm" ${r.choice?'':'disabled'}>계속 하강한다</button>
      </div>`;
  }

  function renderAftermath(){
    const a = S.aftermath;
    const node = S.pendingNode;
    let body = '';
    if(a.reveal){
      const card = a.reveal.card;
      body = `
        <div class="reveal-banner">${a.reveal.kind==='upgrade' ? '카드가 강화되었다' : '두 카드가 합성되었다'}</div>
        <div class="reveal-card-wrap">
          <div class="card owner-${card.owner} reveal-card">
            <div class="card-cost mono">${card.cost}</div>
            <div class="card-name">${card.name}</div>
            <div class="card-desc">${describeCard(card)}</div>
            <div class="card-owner-tag">${ownerLabel(card.owner)}</div>
          </div>
        </div>
        <button class="btn primary" data-action="reveal-confirm">계속하기</button>`;
    } else if(a.selecting==='upgrade'){
      const opts = groupedUpgradeOptions();
      body = `
        <div class="af-list">
          ${opts.length ? opts.map(g=>`
            <div class="af-row" data-action="do-upgrade" data-name="${g.name}">
              <div class="af-row-name">${g.name}${g.count>1?` ×${g.count}`:''}</div>
              <div class="af-row-owner">${ownerLabel(g.owner)}</div>
            </div>`).join('') : `<div class="af-empty">강화할 수 있는 카드가 없다.</div>`}
        </div>
        <button class="btn" data-action="aftermath-back">뒤로</button>`;
    } else if(a.selecting==='fuse'){
      const opts = S.runDeck.filter(c=>c.owner==='neutral');
      body = `
        <div class="af-list">
          ${opts.map(c=>`
            <div class="af-row ${a.fuseSelected.includes(c.defId)?'sel':''}" data-action="toggle-fuse" data-defid="${c.defId}">
              <div class="af-row-name">${c.name}</div>
              <div class="af-row-owner">중립</div>
            </div>`).join('')}
        </div>
        ${a.fuseSelected.length===2 ? `<button class="btn primary" data-action="do-fuse">합성하기</button>` : `<div class="af-hint">중립 카드 2장을 선택하세요 (${a.fuseSelected.length}/2)</div>`}
        <button class="btn" data-action="aftermath-back">뒤로</button>`;
    } else {
      body = `
        <div class="rest-opts">
          <div class="rest-opt" data-action="aftermath-pick" data-kind="upgrade"><div class="t">카드 강화</div><div class="d">보유 카드 한 장을 골라 영구히 강화한다</div></div>
          <div class="rest-opt" data-action="aftermath-pick" data-kind="fuse"><div class="t">카드 합성</div><div class="d">중립 카드 두 장을 하나의 강화된 카드로 합친다</div></div>
        </div>
        <button class="btn" data-action="aftermath-skip">그냥 넘어가기</button>`;
    }
    contentEl.innerHTML = `
      ${renderTopbar()}
      <div class="screen rest-screen">
        <div class="tier-tag">${node?node.title:''} · 완료</div>
        ${a.reveal ? '' : `<h3 style="margin:0;">${a.actionsLeft>0? `정화 기회 ${a.actionsLeft}회 남음` : '완료'}</h3>`}
        ${(!a.reveal && node && node.desc) ? `<p class="af-flavor">${node.desc}</p>` : ''}
        ${body}
      </div>`;
  }

  /* 여관 — 인양된 자리에서만 열린다. 빈 자리를 채우고 다시 내려간다. */
  function renderTavern(){
    const tv = S.tavern || {recruited:[], slot:null, unlocked:null};
    const next = CHAPTERS[S.chapter+1];
    const fallen = deadSlots();
    const cands = recruitCandidates();
    const roster = S.party.map((p,i)=>{
      if(!p) return '';
      const dead = !p.alive;
      const fresh = tv.recruited.indexOf(i)>=0;
      return `
        <div class="tavern-seat ${dead?'empty':''} ${fresh?'fresh':''}">
          <div class="portrait portrait-${p.cls}" style="width:30px;height:30px;">${CLASS_ICON[p.cls]}</div>
          <div class="tavern-seat-body">
            <div class="tavern-seat-name">${p.name}${fresh?' <span class="tavern-new">새 얼굴</span>':''}</div>
            <div class="tavern-seat-sub">${dead ? '자리가 비었다' : `${rankName(i)} · HP ${p.hp}/${p.maxHp}`}</div>
          </div>
          ${dead && cands.length ? `<button class="btn tavern-hire" data-action="tavern-slot" data-idx="${i}">영입</button>` : ''}
        </div>`;
    }).join('');

    let picker = '';
    if(tv.slot!==null && tv.slot!==undefined){
      picker = `
        <div class="tier-tag">누구를 앉힐까</div>
        <div class="relic-offer">
          ${cands.map(d=>`
            <div class="relic-opt" data-action="tavern-hire" data-cls="${d.id}">
              <div class="relic-opt-head">
                <div class="portrait portrait-${d.id}" style="width:26px;height:26px;margin:0;">${CLASS_ICON[d.id]}</div>
                <span>${d.name}</span> ${reachChip({reach:d.reach})}
              </div>
              <div class="relic-boon">${d.tagline} · 최대 체력 ${d.maxHp}</div>
              <div class="relic-desc">${d.blurb}</div>
            </div>`).join('')}
        </div>
        <button class="btn" data-action="tavern-cancel">그만둔다</button>`;
    }

    contentEl.innerHTML = `
      <div class="screen tavern-screen">
        <div class="tier-tag">부두의 여관</div>
        <h2 style="margin:0;">잠긴 닻</h2>
        <div class="escape-note">젖은 외투에서 물이 떨어진다. 아무도 어디를 다녀왔는지 묻지 않는다.</div>
        ${tv.unlocked ? `
          <div class="tavern-unlock">
            <div class="relic-opt-head">${CLASS_ICON[tv.unlocked.id]}<span>${tv.unlocked.name}</span></div>
            <div class="relic-desc">문이 열리고 새로운 얼굴이 들어온다. 이제부터 데려갈 수 있다.</div>
          </div>` : ''}
        ${picker ? picker : `
          <div class="tavern-roster">${roster}</div>
          ${fallen.length && cands.length ? `<div class="escape-note">빈 자리가 ${fallen.length}개 있다. 채우고 내려갈 수 있다.</div>`
            : fallen.length ? `<div class="escape-note">빈 자리가 있지만, 지금 여관에 남은 사람이 없다.</div>`
            : `<div class="escape-note">전원이 살아 돌아왔다.</div>`}
          <div class="escape-note">${next ? `${next.title} — ${next.lead}` : ''}</div>
          <button class="btn primary" data-action="descend">${next ? `다시 내려간다 · ${next.length}구역` : '계속한다'}</button>
        `}
      </div>`;
  }

  function renderResult(){
    const upgradedCount = S.runDeck.filter(c=>c.upgraded).length;
    contentEl.innerHTML = `
      <div class="screen result-screen">
        <div class="title-glyph"><span style="color:var(--gaslamp);">${ICON_SIGIL}</span></div>
        <div class="title-en">Recovered</div>
        <h2 style="margin:0;">심해를 끝까지 내려갔다</h2>
        ${S.relics.length ? `
        <div class="relic-tray">${S.relics.map(relicChip).join('')}</div>` : ''}
        <div class="result-list mono">
          최종 잠식도: ${Math.round(S.erosion)}%<br>
          회수한 유물: ${S.relics.length}점<br>
          강화된 카드: ${upgradedCount}장<br>
          ${S.party.filter(p=>p).map(p=> `${p.name} — HP ${p.hp}/${p.maxHp} · 심도압박 ${Math.round(p.dp)}${p.collapsed?' (함몰 경험)':''}`).join('<br>')}
        </div>
        <button class="btn primary" data-action="restart">다시 하강한다</button>
      </div>`;
  }

  function renderGameOver(){
    contentEl.innerHTML = `
      <div class="screen result-screen lose">
        <div class="title-glyph" style="border-color:#6a2420;"><span style="color:var(--blood-lit);">${ICON_SIGIL}</span></div>
        <div class="title-en">Lost To The Depths</div>
        <h2 style="margin:0;">돌아오지 못했다</h2>
        <div class="result-list">${S.loseReason}</div>
        <button class="btn danger" data-action="restart">다시 시도한다</button>
      </div>`;
  }

  function render(){
    ensureAtmo(tierSlug(currentTier()));
    if(S.screen==='title') renderTitle();
    else if(S.screen==='classSelect') renderClassSelect();
    else if(S.screen==='map') renderMap();
    else if(S.screen==='battle') renderBattle();
    else if(S.screen==='rest') renderRest();
    else if(S.screen==='aftermath') renderAftermath();
    else if(S.screen==='escape') renderEscape();
    else if(S.screen==='tavern') renderTavern();
    else if(S.screen==='result') renderResult();
    else if(S.screen==='gameover') renderGameOver();
    flushFx();   /* 카드가 새로 배치된 뒤라야 좌표를 잡을 수 있다 */
  }

  /* ============ EVENTS ============ */
  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');
    if(!el || el.disabled) return;
    const action = el.dataset.action;

    if(action==='start'){ S.screen='classSelect'; render(); }

    else if(action==='toggle-class'){
      const st=S.setup; const id=el.dataset.id;
      const pos=st.selected.indexOf(id);
      if(pos>=0) st.selected.splice(pos,1);
      else if(st.selected.length<3) st.selected.push(id);
      render();
    }
    else if(action==='classes-next'){
      if(S.setup.selected.length===3){ S.setup.phase='assign-ranks'; S.setup.placements=[null,null,null,null]; S.setup.armed=null; render(); }
    }
    else if(action==='classes-back'){
      S.setup.phase='pick-classes'; S.setup.placements=[null,null,null,null]; S.setup.armed=null; render();
    }
    else if(action==='arm-hero'){
      const st=S.setup; const id=el.dataset.id;
      if(st.armed===id){ st.armed=null; }
      else {
        const placedIdx = st.placements.indexOf(id);
        if(placedIdx>=0) st.placements[placedIdx]=null;
        st.armed = id;
      }
      render();
    }
    else if(action==='place-rank'){
      const st=S.setup; const idx=parseInt(el.dataset.idx,10);
      if(st.armed){
        const displaced = st.placements[idx];
        st.placements[idx] = st.armed;
        st.armed = displaced;
      } else {
        const occ = st.placements[idx];
        if(occ){ st.placements[idx]=null; st.armed=occ; }
      }
      render();
    }
    else if(action==='confirm-setup'){
      const st=S.setup;
      if(st.placements.filter(Boolean).length===3){
        S.party = buildPartyFromPlacements(st.placements);
        S.runDeck = buildRunDeck(st.selected);
        S.screen = 'map';
      }
      render();
    }

    else if(action==='enter-node'){ enterMapNode(el.dataset.id); render(); }

    else if(action==='play-card'){
      const uidVal = el.dataset.uid;
      const b = S.battle;
      if(!b || b.over) return;
      if(b.pendingCardUid===uidVal){ cancelTargeting(); render(); return; }
      const card = b.hand.find(c=>c.uid===uidVal);
      if(!card || !canPlayCard(card)) return;
      if(card.range==='ranged'){
        const targets = enemyTargetsFor(card);
        if(targets.length<=1){ resolveCard(uidVal, targets[0] ? {enemyIdx:b.enemies.indexOf(targets[0])} : null); }
        else { beginTargeting(uidVal,'enemy'); render(); }
      } else if(card.range==='support_ally'){
        const targets = aliveParty();
        if(targets.length<=1){ resolveCard(uidVal, targets[0] ? {allyId:targets[0].id} : null); }
        else { beginTargeting(uidVal,'ally'); render(); }
      } else {
        resolveCard(uidVal, null);
      }
    }

    else if(action==='choose-target'){
      const b = S.battle;
      if(!b || !b.pendingCardUid) return;
      const domain = el.dataset.domain;
      if(domain!==b.pendingDomain) return;
      const uidVal = b.pendingCardUid;
      if(domain==='enemy'){ resolveCard(uidVal, {enemyIdx: parseInt(el.dataset.idx,10)}); }
      else if(domain==='ally'){ resolveCard(uidVal, {allyId: el.dataset.id}); }
    }

    else if(action==='end-turn'){ endPlayerTurn(); }

    else if(action==='rest-pick'){ chooseRest(el.dataset.kind); render(); }
    else if(action==='rest-confirm'){ confirmRest(); }

    else if(action==='aftermath-pick'){ S.aftermath.selecting = el.dataset.kind; if(el.dataset.kind==='fuse') S.aftermath.fuseSelected=[]; render(); }
    else if(action==='aftermath-back'){ S.aftermath.selecting=null; S.aftermath.fuseSelected=[]; render(); }
    else if(action==='aftermath-skip'){ proceedAfterAftermath(); }
    else if(action==='do-upgrade'){
      const card = applyUpgradeByName(el.dataset.name);
      if(card){ S.aftermath.selecting=null; S.aftermath.reveal={kind:'upgrade', card}; }
      render();
    }
    else if(action==='toggle-fuse'){
      const id = el.dataset.defid; const arr = S.aftermath.fuseSelected;
      const pos = arr.indexOf(id);
      if(pos>=0) arr.splice(pos,1); else if(arr.length<2) arr.push(id);
      render();
    }
    else if(action==='do-fuse'){
      if(S.aftermath.fuseSelected.length===2){
        const newCard = applyFusion(S.aftermath.fuseSelected[0], S.aftermath.fuseSelected[1]);
        S.aftermath.fuseSelected=[];
        if(newCard){ S.aftermath.selecting=null; S.aftermath.reveal={kind:'fuse', card:newCard}; }
        render();
      }
    }
    else if(action==='reveal-confirm'){
      S.aftermath.reveal = null;
      S.aftermath.actionsLeft--;
      if(S.aftermath.actionsLeft<=0) proceedAfterAftermath(); else render();
    }

    else if(action==='take-relic'){
      if(S.escape && !S.escape.taken){
        const relic = S.escape.offer.find(r=>r.id===el.dataset.id);
        if(relic){ grantRelic(relic); S.escape.taken = relic; render(); }
      }
    }
    else if(action==='to-tavern'){ enterTavern(); render(); }
    else if(action==='tavern-slot'){ S.tavern.slot = parseInt(el.dataset.idx,10); render(); }
    else if(action==='tavern-cancel'){ S.tavern.slot = null; render(); }
    else if(action==='tavern-hire'){
      const tv = S.tavern;
      if(tv && tv.slot!==null && tv.slot!==undefined){
        const hero = recruitInto(tv.slot, el.dataset.cls);
        if(hero) tv.recruited.push(tv.slot);
        tv.slot = null;
        render();
      }
    }
    else if(action==='descend'){ descendNextChapter(); render(); }

    else if(action==='restart'){ newRun(); render(); }
  });

  newRun();
  render();
})();
</script>
</body>
</html>
