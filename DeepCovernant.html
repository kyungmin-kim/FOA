  /* ==== /BUNDLED FONTS ==== */
  :root{
    /* ground — 젖은 석재 / 잉크 / 수압 검정 */
    --void:#04070a;
    --deep:#0b1317;
    --deep2:#121d20;
    --slab:#18262a;

    /* 차가운 심해 생물발광 — 조준/생명 계열 (채도 낮춤) */
    --phosphor:#7fbfae;
    --phosphor-dim:#38635a;

    /* kin — 코스믹 바이올렛 */
    --corrode:#8d7ab0;

    /* 심연 장미빛 */
    --abyss:#9c3550;
    --abyss-dim:#5d1e32;

    /* 직군 색상 — 전부 가스등 수준으로 탈채도 */
    --steel:#7d9cb2;
    --toxin:#8aab7c;
    --bone:#d9d0bd;
    --indigo:#8478b6;

    /* 변색된 놋쇠 / 가스등 */
    --brass:#b8934f;
    --brass-dim:#6b5530;
    --gaslamp:#e0aa4c;

    /* 피 */
    --blood:#8f2028;
    --blood-lit:#c4383c;
    --blood-dim:#4a1116;

    --erode:#b23a35;
    --ink:#cec6b5;
    --muted:#7b7a70;
    --crack:#d9452f;

    /* 카드 등급 팔레트 — 보상·강화·합성·손패가 반드시 이 네 계열만 사용한다. */
    --card-normal:#d9d8d1;
    --card-normal-hi:#efeee5;
    --card-class:#5d98c9;
    --card-class-hi:#78b6e3;
    --card-class-text:#8cbfe6;
    --card-epic:var(--corrode);
    --card-epic-hi:#c5b2ee;
    --card-legendary:var(--gaslamp);
    --card-legendary-hi:#f1cf7b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 픽셀은 픽셀로 — 브라우저가 부드럽게 뭉개지 못하게 막는다 */
  img.px{ image-rendering:pixelated; image-rendering:crisp-edges; -ms-interpolation-mode:nearest-neighbor; display:block; }
  html,body{margin:0;padding:0;height:100%;background:var(--void);overflow:hidden;}
  body{
    font-family:'Nanum Myeongjo',serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    -webkit-user-select:none;
    user-select:none;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    position:relative;
    background: var(--column-bg);
    transition: background 1.4s ease;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  #app[data-tier="surface"]{ --column-bg: linear-gradient(180deg, #16292c 0%, #0d1b1e 42%, #060c0f 100%); }
  #app[data-tier="mid"]{ --column-bg: linear-gradient(180deg, #0d1519 0%, #0a1013 45%, #04080a 100%); }
  #app[data-tier="abyss"]{ --column-bg: linear-gradient(180deg, #05070a 0%, #020304 55%, #000000 100%); }

  /* 깊은 비네트 — 화면 가장자리를 물속 어둠으로 눌러준다 */
  #app::after{
    content:'';
    position:absolute; inset:0;
    pointer-events:none;
    box-shadow:
      inset 0 0 80px 16px rgba(0,0,0,0.36),
      inset 0 0 200px 56px rgba(0,0,0,0.25);
  }

  /* 필름 그레인 + 상단 비네트 — 콘텐츠 위에 얹혀 전체를 한 장의 동판화처럼 묶는다 */
  #grain{
    position:absolute; inset:0; pointer-events:none; z-index:4;
    background-image:
      repeating-linear-gradient(43deg, rgba(255,240,215,0.016) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-37deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 4px);
  }
  #grain::after{
    content:''; position:absolute; inset:0;
    box-shadow: inset 0 0 60px 10px rgba(0,0,0,0.22), inset 0 0 180px 64px rgba(0,0,0,0.21);
  }

  h1,h2,h3,.disp{ font-family:'Nanum Myeongjo',serif; letter-spacing:0.05em; color:var(--bone); text-shadow:0 1px 2px rgba(0,0,0,0.7); }
  .mono{ font-family:monospace; }
  .fell{ font-family:'Nanum Myeongjo',serif; }
  /* 산문에만 keep-all — 좁은 flex 칸(파티/손패 슬롯)의 최소폭까지 늘리지 않도록 범위를 좁힌다 */
  .title-sub,.node-card p,.node-card h3,.af-flavor,.class-blurb,.rest-opt .d,
  .card-desc,.log-plate,.relic-desc,.af-hint,.result-list,.foe-dead,
  .rank-slot-name,.reach-legend,.rank-warn{ word-break:keep-all; }

  /* ---------- ATMOSPHERE LAYER ---------- */
  #atmo{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  #content{ position:relative; z-index:1; flex:1; min-height:0; display:flex; flex-direction:column; }

  .atmo-gradient{ position:absolute; inset:-15% -5%; }
  .atmo-surface{ background:radial-gradient(ellipse at 50% -15%, rgba(196,220,212,0.13), transparent 55%); }
  .atmo-mid{ background:radial-gradient(ellipse at 50% 108%, rgba(141,122,176,0.10), transparent 60%); }
  .atmo-abyss{ background:radial-gradient(ellipse at 50% 100%, rgba(143,32,40,0.12), transparent 55%); }

  /* 수면 위에서 내려꽂히는 창백한 달빛 기둥 */
  .beam{ position:absolute; top:-25%; width:130px; height:170%; background:linear-gradient(180deg, rgba(214,228,220,0.085), transparent 72%); filter:blur(4px); transform:rotate(11deg); animation:beamSway 11s ease-in-out infinite alternate; }
  .beam1{ left:6%; }
  .beam2{ left:54%; width:96px; opacity:0.65; animation-delay:-5s; }
  @keyframes beamSway{ from{ transform:rotate(8deg) translateX(0);} to{ transform:rotate(15deg) translateX(16px);} }

  .bubble{ position:absolute; bottom:-6%; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(232,240,235,0.4), rgba(170,200,190,0.04)); border:1px solid rgba(196,220,212,0.16); animation-name:bubbleRise; animation-timing-function:linear; animation-iteration-count:infinite; }
  @keyframes bubbleRise{ from{ transform:translateY(0) translateX(0); opacity:0.55;} to{ transform:translateY(-760px) translateX(16px); opacity:0;} }

  .mote{ position:absolute; border-radius:50%; animation-name:moteDrift; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .mote-mid{ background:var(--corrode); box-shadow:0 0 7px var(--corrode); opacity:0.42; }
  .mote-abyss{ background:var(--blood-lit); box-shadow:0 0 9px var(--blood); opacity:0.4; }
  @keyframes moteDrift{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-20px);} }

  /* 가라앉는 재 — 블러드본식 잿가루가 물속에서 천천히 내려앉는다 */
  .ash{ position:absolute; top:-4%; width:1.5px; height:1.5px; border-radius:50%; background:rgba(224,170,76,0.5); box-shadow:0 0 3px rgba(224,170,76,0.35); animation-name:ashFall; animation-timing-function:linear; animation-iteration-count:infinite; }
  @keyframes ashFall{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:0.8; }
    88%{ opacity:0.55; }
    100%{ transform:translate(26px, 780px); opacity:0; }
  }

  @keyframes targetPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.035);} }

  /* ---------- HIT FLASH (attack = white, damaged = red) ---------- */
  #flash{ position:absolute; inset:0; pointer-events:none; z-index:5; }
  #flash.flash-white{ animation: flashVignetteWhite 0.4s ease-out; }
  #flash.flash-red{ animation: flashVignetteRed 0.55s ease-out; }
  @keyframes flashVignetteWhite{
    0%{ box-shadow: inset 0 0 50px 10px rgba(246,238,220,0.9), inset 0 0 160px 40px rgba(224,170,76,0.4); }
    100%{ box-shadow: inset 0 0 50px 10px rgba(246,238,220,0), inset 0 0 160px 40px rgba(224,170,76,0); }
  }
  @keyframes flashVignetteRed{
    0%{ box-shadow: inset 0 0 60px 14px rgba(159,29,36,0.95), inset 0 0 180px 50px rgba(90,12,18,0.75); }
    100%{ box-shadow: inset 0 0 60px 14px rgba(159,29,36,0), inset 0 0 180px 50px rgba(90,12,18,0); }
  }

  @media (prefers-reduced-motion: reduce){
    .beam,.bubble,.mote,.ash,.enemy-portrait,.ero-fill::after,.ero-case.danger,.title-glyph::before,.title-glyph::after,.foe-card.targetable,.hero-card.targetable,
    .hpbar .fill,.hpbar .fill::after,.hand-row .card{ animation:none !important; }
    /* 훑고 지나가는 빛을 멈추면 남은 한 장이 게이지를 가린다 */
    .ero-fill::after,.hpbar .fill::after{ display:none !important; }
  }

  /* ---------- TITLE ---------- */
  .screen{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; z-index:1;}
  .title-screen{ justify-content:center; align-items:center; text-align:center; padding:32px; gap:16px;}
  .title-glyph{
    width:104px;height:104px;border-radius:50%;
    border:1px solid var(--brass-dim);
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      0 0 34px rgba(127,191,174,0.12),
      0 0 62px rgba(143,32,40,0.15),
      inset 0 0 22px rgba(184,147,79,0.14);
    position:relative;
  }
  .title-glyph::before{
    content:'';position:absolute;inset:7px;border-radius:50%;
    border:1px dashed rgba(184,147,79,0.34);
    animation:spin 54s linear infinite;
  }
  /* 바깥 궤도 — 피와 인광이 서로 반대로 돈다 */
  .title-glyph::after{
    content:'';position:absolute;inset:-9px;border-radius:50%;
    border:1px solid rgba(184,147,79,0.15);
    border-top-color:rgba(196,56,60,0.42);
    border-bottom-color:rgba(127,191,174,0.3);
    animation:spin 96s linear infinite reverse;
  }
  .title-glyph span{ display:flex; color:var(--bone); filter:drop-shadow(0 0 9px rgba(127,191,174,0.45)); }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .title-en{ font-size:9.5px; letter-spacing:0.26em; line-height:1.8; color:var(--brass); text-transform:uppercase; padding:0 10px; }
  .title-kr{
    font-family:'Nanum Myeongjo',serif; font-weight:700;
    font-size:27px; line-height:1.28; color:var(--bone); letter-spacing:0.03em;
    text-shadow:0 0 20px rgba(196,56,60,0.26), 0 2px 3px rgba(0,0,0,0.85);
  }
  .title-sub{ font-family:'Nanum Myeongjo',serif; font-size:14px; color:var(--muted); max-width:302px; line-height:1.75; font-style:italic; }

  /* 놋쇠 구획선 + 중앙 마름모 — 화면 사이 호흡 */
  .rule{
    width:196px; height:9px; position:relative; opacity:0.8;
    background:linear-gradient(90deg, transparent, var(--brass-dim) 22%, var(--brass-dim) 78%, transparent) no-repeat 0 50%/100% 1px;
  }
  .rule::after{
    content:''; position:absolute; left:50%; top:50%; width:6px; height:6px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--void); border:1px solid var(--brass);
  }

  .btn{
    font-family:'Nanum Myeongjo',serif; font-size:13.5px; letter-spacing:0.1em; font-weight:600;
    background:linear-gradient(180deg, rgba(184,147,79,0.14), rgba(184,147,79,0.03));
    border:1px solid var(--brass-dim);
    color:var(--brass);
    padding:13px 26px; border-radius:2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 1px 0 rgba(224,170,76,0.14);
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
    cursor:pointer;
  }
  .btn:active{ transform:translateY(1px); background:rgba(184,147,79,0.22); }
  .btn.primary{
    color:#150c07; font-weight:700;
    background:linear-gradient(180deg,#dcb066,#8e6b2e);
    border-color:#c8a45c;
    text-shadow:0 1px 0 rgba(255,238,200,0.35);
    box-shadow:0 0 16px rgba(224,170,76,0.22), inset 0 1px 0 rgba(255,240,205,0.45);
  }
  .btn.danger{ color:var(--blood-lit); border-color:#6a2420; background:linear-gradient(180deg, rgba(143,32,40,0.24), rgba(143,32,40,0.06)); }
  .btn:disabled{ opacity:0.3; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    padding:10px 14px 9px; flex-shrink:0;
    border-bottom:1px solid rgba(184,147,79,0.16);
    background:linear-gradient(180deg, rgba(9,16,19,0.85), rgba(9,16,19,0.12));
    box-shadow:0 1px 0 rgba(0,0,0,0.65);
  }
  .ero-row{ display:flex; align-items:center; gap:10px; }
  .ero-label{ font-family:'Nanum Myeongjo',serif; font-size:9.5px; letter-spacing:0.24em; color:var(--brass); text-transform:uppercase; white-space:nowrap;}
  /* 놋쇠 리벳이 박힌 압력계 케이스 — 차오르는 것은 물이 아니라 피에 가깝다 */
  .ero-case{
    flex:1; height:15px; border-radius:1px;
    border:1px solid var(--brass-dim);
    background:
      radial-gradient(circle at 5px 50%, rgba(224,170,76,0.45) 0 1.1px, transparent 1.5px),
      radial-gradient(circle at calc(100% - 5px) 50%, rgba(224,170,76,0.45) 0 1.1px, transparent 1.5px),
      repeating-linear-gradient(90deg, rgba(184,147,79,0.15) 0 1px, transparent 1px 11px),
      #070c0e;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);
    position:relative; overflow:hidden;
  }
  /* 채워질수록 나쁘다 — 잠식이 왼쪽에서부터 게이지를 먹어 들어온다 */
  .ero-fill{
    position:absolute; inset:1px; left:1px;
    background:linear-gradient(90deg, #3a0d12, var(--erode) 68%, #c4544a);
    box-shadow:0 0 12px rgba(178,58,53,0.45), inset 0 -3px 5px rgba(0,0,0,0.45);
    transition:width 0.5s ease;
  }
  /* ---- 바이탈 사인 ----
     체력·심도압박·잠식은 모두 살아 있는 값이다. 계기 위를 한 줄기 빛이 왼쪽 끝에서
     오른쪽 끝까지 훑고 지나가게 두어, 멈춘 그림이 아니라 지금도 재고 있는 눈금으로 읽힌다.

     빛줄기를 폭이 정해진 상자로 만들어 밀면(translateX) 밀어낸 거리만큼밖에 못 가서
     게이지가 길어지면 중간에 멈춘다. 그래서 배경 그림 한 장을 no-repeat 로 깔고
     그 자리(background-position)만 옮긴다 — calc(100% + 폭) 이 곧 '오른쪽 끝 너머'라
     게이지가 아무리 길어져도 끝까지 지나간다. */
  /* .ero-fill 은 이미 absolute 다 — 여기서 position 을 다시 주면 게이지가 자리를 잃는다 */
  .ero-fill{ overflow:hidden; }
  .hpbar .fill{ position:relative; overflow:hidden; }
  /* 빛줄기는 배경을 옮기지 않고 층 자체를 민다.
     background-position 은 합성이 안 되는 속성이라 프레임마다 그 칸을 다시 칠한다 —
     게이지가 열세 개쯤 도는 전투 화면에서는 그것만으로 휴대폰이 숨을 못 쉰다.
     대신 층을 통째로 translateX 로 밀면 GPU 가 옮겨 주고 다시 칠하지 않는다.
     transform 의 % 는 '제 너비'가 기준이므로, -100%→100% 면 게이지 길이와 무관하게
     왼쪽 바깥에서 오른쪽 바깥까지 정확히 한 번 지나간다. */
  .ero-fill::after,.hpbar .fill::after{
    content:''; position:absolute; inset:0; pointer-events:none; will-change:transform;
    background-image:linear-gradient(90deg, transparent, rgba(255,240,220,0.42), transparent);
    background-repeat:no-repeat;
    background-size:var(--vital-w,34px) 100%;
    background-position:left center;
    animation:vitalSweep var(--vital-dur,2.6s) linear infinite;
  }
  @keyframes vitalSweep{
    from{ transform:translateX(-100%); }
    to  { transform:translateX(100%); }
  }
  /* 잠식은 심장이 아니라 시계다 — 느리고 흐릿하게 한 번씩 훑는다 */
  .ero-fill{ --vital-w:40px; --vital-dur:3.2s; }
  .ero-fill::after{ background-image:linear-gradient(90deg, transparent, rgba(255,226,200,0.20), transparent); }
  /* 70% 를 넘기면 케이스 자체가 맥동한다 */
  .ero-case.danger{ border-color:var(--blood-lit); animation:eroAlarm 1.5s ease-in-out infinite; }
  @keyframes eroAlarm{
    0%,100%{ box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 0 0 rgba(196,56,60,0); }
    50%    { box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 0 12px rgba(196,56,60,0.6); }
  }
  /* 게이지 안에 얹는 숫자 — 어디까지 찼든 읽혀야 하니 그림자를 두껍게 깐다 */
  .ero-num{
    position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#f2ece0; letter-spacing:0.02em; pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.75);
  }
  .ero-num.danger{ color:#ffd9d5; text-shadow:0 1px 2px rgba(0,0,0,0.9), 0 0 6px rgba(196,56,60,0.75); }

  /* ---------- MENU POPUP ---------- */
  .menu-btn{
    -webkit-appearance:none; appearance:none;
    flex:0 0 auto; width:26px; height:26px; padding:0; margin:0; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(184,147,79,0.14), rgba(184,147,79,0.03));
    border:1px solid var(--brass-dim); color:var(--brass);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 1px 0 rgba(224,170,76,0.14);
    cursor:pointer;
  }
  .menu-btn:active{ transform:translateY(1px); background:rgba(184,147,79,0.22); }
  /* 아이콘을 글꼴에 맡기지 않는다 — 비트맵 글꼴에 ☰ 글리프가 없어 대체 글꼴로 떨어지면
     획 굵기도 중심도 어긋난다. 세 획을 직접 그리면 어떤 글꼴에서도 같은 자리에 앉는다. */
  .menu-ico{ position:relative; display:block; width:14px; height:2px; background:currentColor; }
  .menu-ico::before,.menu-ico::after{
    content:''; position:absolute; left:0; width:14px; height:2px; background:currentColor;
  }
  .menu-ico::before{ top:-5px; }
  .menu-ico::after { top:5px; }
  /* 닫기 표시도 같은 이유로 두 획을 겹쳐 그린다 */
  .menu-close-ico{ position:relative; display:block; width:11px; height:11px; }
  .menu-close-ico::before,.menu-close-ico::after{
    content:''; position:absolute; top:50%; left:0; width:11px; height:2px; margin-top:-1px;
    background:currentColor;
  }
  .menu-close-ico::before{ transform:rotate(45deg); }
  .menu-close-ico::after { transform:rotate(-45deg); }
  .menu-overlay{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:18px; background:rgba(2,5,7,0.78);
  }
  .menu-panel{
    width:100%; max-width:280px; padding:14px; border:1px solid var(--gaslamp);
    background:#101719; box-shadow:inset 1px 1px 0 rgba(232,196,121,0.24),inset -1px -1px 0 #000,0 0 0 1px #000;
    text-align:left;
    max-height:100%; display:flex; flex-direction:column; min-height:0;
  }
  /* 가이드는 글이 길어 한 칸 넓게 쓴다 */
  .menu-panel.wide{ max-width:320px; }
  .menu-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex:0 0 auto; }
  .menu-panel-head h3{ margin:0; color:var(--bone); font-size:14px; }
  .menu-close{
    -webkit-appearance:none; appearance:none;
    flex:0 0 auto; width:22px; height:22px; padding:0; margin:0; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--brass-dim); background:transparent; color:var(--muted);
    cursor:pointer;
  }
  .menu-close:active{ transform:translateY(1px); }
  .menu-list{ display:flex; flex-direction:column; gap:6px; }
  .menu-item{
    text-align:left; padding:10px 12px; border-radius:2px;
    border:1px solid var(--brass-dim);
    background:linear-gradient(180deg, rgba(184,147,79,0.1), rgba(184,147,79,0.02));
    color:var(--brass); font-family:'Nanum Myeongjo',serif; font-size:12.5px; letter-spacing:0.04em;
    cursor:pointer;
  }
  .menu-item:active{ transform:translateY(1px); background:rgba(184,147,79,0.2); }
  .menu-placeholder p,.menu-confirm p{ margin:0 0 12px; color:var(--ink); font-size:11.5px; line-height:1.7; word-break:keep-all; }
  .menu-placeholder .btn{ display:block; margin:0 auto; }
  .menu-confirm-actions{ display:flex; gap:8px; justify-content:flex-end; }

  /* ---------- 게임 가이드 ---------- */
  .menu-guide{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:4px;
    border-top:1px solid rgba(184,147,79,0.18); border-bottom:1px solid rgba(184,147,79,0.18);
    padding:8px 0;
  }
  .guide-sec{ border:1px solid rgba(184,147,79,0.28); background:rgba(9,16,18,0.5); }
  .guide-sec.open{ border-color:var(--brass-dim); background:rgba(20,26,28,0.9); }
  .guide-sec-head{
    -webkit-appearance:none; appearance:none;
    width:100%; padding:8px 10px; margin:0; border:0; background:transparent;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    color:var(--brass); font-size:12px; text-align:left; cursor:pointer;
  }
  .guide-sec.open .guide-sec-head{ color:var(--gaslamp); }
  /* 펼침 표시도 글꼴에 맡기지 않는다 — 닫히면 '+', 열리면 '−' */
  .guide-sec-mark{ position:relative; flex:0 0 auto; width:9px; height:9px; }
  .guide-sec-mark::before,.guide-sec-mark::after{
    content:''; position:absolute; background:currentColor;
  }
  .guide-sec-mark::before{ top:4px; left:0; width:9px; height:1px; }
  .guide-sec-mark::after { top:0; left:4px; width:1px; height:9px; }
  .guide-sec.open .guide-sec-mark::after{ display:none; }
  .guide-sec-body{
    margin:0; padding:0 10px 9px; list-style:none;
    display:flex; flex-direction:column; gap:5px;
  }
  .guide-sec-body li{
    position:relative; padding-left:9px;
    color:var(--ink); font-size:11.5px; line-height:1.7; word-break:keep-all;
  }
  .guide-sec-body li::before{
    content:''; position:absolute; left:0; top:7px; width:3px; height:3px; background:var(--brass-dim);
  }
  .guide-sec-body b{ color:var(--gaslamp); font-weight:normal; }
  .menu-guide-back{ flex:0 0 auto; display:block; margin:10px auto 0; padding:8px 18px; font-size:11px; }

  /* ---------- 설정 ---------- */
  .menu-settings{ display:flex; flex-direction:column; gap:8px; }
  .setting-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px; border:1px solid rgba(184,147,79,0.28); background:rgba(9,16,18,0.5);
  }
  .setting-label{ color:var(--bone); font-size:12px; }
  .setting-hint{ margin-top:2px; color:var(--muted); font-size:10.5px; line-height:1.5; word-break:keep-all; }
  .setting-switch{
    -webkit-appearance:none; appearance:none;
    flex:0 0 auto; min-width:44px; padding:5px 9px; margin:0; border-radius:0;
    border:1px solid var(--brass-dim); background:#141a1c; color:var(--muted);
    font-size:11px; text-align:center; cursor:pointer;
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.16), inset -1px -1px 0 rgba(0,0,0,0.8);
  }
  .setting-switch.on{ border-color:var(--gaslamp); color:#150c07; background:#a67c33;
    box-shadow: inset 1px 1px 0 #e8c479, inset -1px -1px 0 #5c4826; }
  .setting-switch:active{ transform:translateY(1px); }

  /* ---------- MAP / SETUP shared shell ---------- */
  .map-screen{ padding:20px 18px; align-items:center; gap:12px; overflow-y:auto; }
  .path-trail{ display:flex; gap:6px; margin-bottom:2px; }
  .crumb-chip{
    width:25px;height:25px;border-radius:50%;
    border:1px solid var(--brass-dim);
    display:flex;align-items:center;justify-content:center;
    color:var(--brass); background:rgba(9,16,18,0.6);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.75);
  }
  .tier-tag{ font-family:'Nanum Myeongjo',serif; font-size:10px; line-height:1.7; letter-spacing:0.26em; color:var(--brass); text-transform:uppercase; }
  .node-choices{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; margin:0 auto; }
  /* 모서리를 깎아낸 각인 동판 */
  .node-card{
    width:100%;
    border:1px solid var(--brass-dim); border-radius:0;
    padding:15px 17px 28px;
    background:linear-gradient(180deg, rgba(22,34,37,0.62), rgba(5,9,11,0.68));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(184,147,79,0.075);
    clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
    text-align:left; cursor:pointer; position:relative;
  }
  .node-card:active{ transform:scale(0.985); border-color:var(--phosphor); }
  .node-type-tag{ font-family:'Nanum Myeongjo',serif; font-size:9.5px; letter-spacing:0.2em; color:var(--corrode); text-transform:uppercase; margin-bottom:5px; }
  .node-card h3{ margin:0 0 5px; font-size:16.5px; }
  .node-card p{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--muted); margin:0; line-height:1.6;}
  .node-card-cta{ position:absolute; right:15px; bottom:9px; font-family:'Nanum Myeongjo',serif; font-size:10px; color:var(--brass); letter-spacing:0.12em; }

  /* ---------- CLASS SELECT / RANK ASSIGN ---------- */
  .class-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:340px; margin:0 auto; }
  .class-card{
    min-width:0;
    border:1px solid var(--brass-dim); border-radius:0; padding:12px 10px; text-align:center;
    background:linear-gradient(180deg, rgba(22,34,37,0.6), rgba(5,9,11,0.62));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(184,147,79,0.07);
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    cursor:pointer;
  }
  .class-card.sel{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 18px rgba(127,191,174,0.16), 0 0 14px rgba(127,191,174,0.3); background:linear-gradient(180deg, rgba(38,60,58,0.7), rgba(8,16,16,0.7)); }
  .class-name{ font-family:'Nanum Myeongjo',serif; font-size:12.5px; font-weight:600; margin-bottom:2px; color:var(--bone); }
  .class-tagline{ font-size:9.5px; color:var(--corrode); margin-bottom:6px; letter-spacing:0.06em; }
  .class-blurb{ font-family:'Nanum Myeongjo',serif; font-size:10.5px; color:var(--muted); line-height:1.5; }

  .rank-slots{ display:flex; gap:6px; width:100%; max-width:340px; margin:0 auto; }
  .rank-slot{ flex:1; min-width:0; border:1px solid var(--brass-dim); border-radius:0; padding:8px 4px; text-align:center; min-height:90px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; background:rgba(12,20,22,0.5); box-shadow: inset 0 0 12px rgba(0,0,0,0.6); }
  .rank-slot.filled{ border-style:solid; }
  .rank-slot.empty{ border-style:dashed; }
  .rank-slot.droppable{ border-color:var(--phosphor); box-shadow: inset 0 0 12px rgba(127,191,174,0.14), 0 0 10px rgba(127,191,174,0.3); }
  .rank-slot.bad{ border-color:var(--crack); box-shadow: inset 0 0 14px rgba(217,69,47,0.16); }
  .reach-legend{
    font-family:'Nanum Myeongjo',serif; font-size:11.5px; line-height:1.65;
    color:var(--muted); text-align:center; max-width:320px; word-break:keep-all;
  }
  .reach-legend b{ color:var(--brass); font-weight:600; }
  .rank-slot-label{ font-family:'Nanum Myeongjo',serif; font-size:8.5px; color:var(--brass); letter-spacing:0.16em; margin-bottom:2px; }
  .rank-slot-name{ font-size:10px; line-height:1.2; }
  .rank-slot-hint{ font-family:'Nanum Myeongjo',serif; font-size:10px; color:var(--muted); font-style:italic; }

  .hero-tray{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; max-width:340px; margin:0 auto; min-height:30px; }
  .tray-chip{ border:1px solid var(--brass-dim); border-radius:2px; padding:6px 14px; font-size:11.5px; background:rgba(12,20,22,0.55); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5); cursor:pointer; }
  .tray-chip.armed{ border-color:var(--phosphor); background:rgba(38,60,58,0.7); box-shadow:0 0 10px rgba(127,191,174,0.34); }
  .setup-btn-row{ display:flex; gap:10px; }

  /* ---------- BATTLE ---------- */
  .battle-screen{ flex:1; min-height:0; display:flex; flex-direction:column;}
  .enemy-zone{
    flex-shrink:0;
    padding:10px 14px 6px; display:flex; flex-direction:column; align-items:center; gap:6px;
    border-bottom:1px solid rgba(141,122,176,0.18);
    box-shadow:0 1px 0 rgba(0,0,0,0.6);
  }
  .foe-row{ display:flex; gap:6px; justify-content:center; width:100%; }
  /* 1~4마리가 들어오므로 폭은 균등 분배하고 최소폭만 지킨다 */
  .foe-card{
    flex:1 1 0; min-width:0; max-width:158px;
    border:1px solid rgba(141,122,176,0.34); border-radius:0; padding:7px 5px;
    text-align:center; position:relative;
    background:linear-gradient(180deg, rgba(26,18,32,0.55), rgba(5,7,10,0.42));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 22px rgba(0,0,0,0.55);
  }
  .foe-card.targetable{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 20px rgba(127,191,174,0.14), 0 0 15px rgba(127,191,174,0.45); animation:targetPulse 1.2s ease-in-out infinite; cursor:pointer; }
  .foe-card.elite-foe{ border-color:var(--brass); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 22px rgba(184,147,79,0.1), 0 0 14px rgba(184,147,79,0.24); }
  .foe-card.elite-foe .enemy-portrait{ transform:scale(1.1); }
  .foe-card.boss-foe{ flex:1.5 1 0; max-width:200px; padding:12px 8px; }
  .foe-card.boss-foe .foe-name{ font-size:14px; }
  .foe-card.boss-foe .enemy-portrait.tier-mid{ width:80px; height:80px; }
  .foe-card.boss-awakened{ border-color:var(--blood-lit); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 26px rgba(143,32,40,0.28), 0 0 26px rgba(196,56,60,0.5); }
  .foe-card.boss-awakened .enemy-portrait{ animation-duration:1.5s; }
  .foe-card.boss-awakened .foe-rank{ color:var(--blood-lit); }
  .foe-name{ font-family:'Nanum Myeongjo',serif; font-size:12px; color:var(--corrode); margin:3px 0 1px; font-weight:600; letter-spacing:0.02em; text-shadow:0 1px 2px rgba(0,0,0,0.8); }
  /* 3마리 이상이면 칸이 좁아지므로 글자를 줄인다 */
  .foe-row.many .foe-name{ font-size:10px; margin:2px 0 1px; }
  .foe-row.many .intent-badge{ font-size:8.5px; padding:2px 5px 2px 4px; gap:3px; margin-top:4px; }
  .foe-row.many .foe-rank{ font-size:7.5px; letter-spacing:0.08em; }
  .foe-row.many .hero-num{ font-size:7.5px; min-width:20px; }
  /* 4~5마리는 정말 좁다 — 초상과 배지를 한 번 더 줄인다 */
  .foe-row.crowded{ gap:4px; }
  .foe-row.crowded .foe-card{ padding:6px 3px; }
  .foe-row.crowded .enemy-portrait{ width:40px; height:40px; }
  .foe-row.crowded .foe-name{ font-size:9px; line-height:1.25; }
  .foe-row.crowded .intent-badge{ font-size:8px; padding:1px 4px 1px 3px; gap:2px; }
  .foe-row.crowded .reach-chip{ font-size:6.5px; padding:0 2px; }
  .foe-dead{ font-family:'Nanum Myeongjo',serif; font-size:11px; color:var(--muted); margin-top:6px; font-style:italic; }
  .foe-rank{ font-family:'Nanum Myeongjo',serif; font-size:8.5px; color:var(--brass); letter-spacing:0.18em; margin-bottom:2px; }

  /* 성유물 메달 — 실루엣 아이콘을 깎아먹지 않도록 클립 대신 원형 감실로 담는다 */
  .enemy-portrait{ width:48px;height:48px; display:flex; align-items:center; justify-content:center; position:relative; margin:0 auto; border-radius:50%; }
  .enemy-portrait.tier-surface{
    background:radial-gradient(circle at 38% 30%, rgba(141,122,176,0.34), rgba(6,4,11,0.92) 74%);
    box-shadow: inset 0 0 0 1px rgba(141,122,176,0.42), inset 0 0 15px rgba(0,0,0,0.75);
    color:#d3c5e8;
    animation:eldritchPulse 4.2s ease-in-out infinite;
  }
  .enemy-portrait.tier-mid{
    width:54px;height:54px;
    background:radial-gradient(circle at 38% 30%, rgba(156,53,80,0.36), rgba(6,3,5,0.94) 74%);
    box-shadow: inset 0 0 0 1px rgba(156,53,80,0.48), inset 0 0 15px rgba(0,0,0,0.75);
    color:#f0c8d3;
    animation:eldritchPulseDeep 3s ease-in-out infinite;
  }
  /* 실루엣이 잘려나가도 살아남도록 glow 를 drop-shadow 로 — 물속에서 스스로 발광하는 느낌 */
  @keyframes eldritchPulse{
    0%,100%{ filter:brightness(1) saturate(1) drop-shadow(0 0 7px rgba(141,122,176,0.4)); }
    50%{ filter:brightness(1.14) saturate(1.28) drop-shadow(0 0 15px rgba(141,122,176,0.62)); }
  }
  @keyframes eldritchPulseDeep{
    0%,100%{ filter:brightness(1) saturate(1) drop-shadow(0 0 8px rgba(156,53,80,0.45)); }
    50%{ filter:brightness(1.16) saturate(1.3) drop-shadow(0 0 18px rgba(196,56,60,0.6)); }
  }

  .hpbar{ height:9px; border-radius:1px; background:#0c0910; border:1px solid rgba(0,0,0,0.65); box-shadow: inset 0 1px 2px rgba(0,0,0,0.85), 0 0 0 1px rgba(141,122,176,0.2); overflow:hidden;}
  /* 빛줄기가 지나가는 순간 눈금 전체가 한 번 밝아진다 — 맥이 뛰는 쪽에 눈이 가도록.
     그림자가 아니라 밝기로 뛰게 두어야 픽셀 스킨의 베벨을 덮어쓰지 않는다. */
  .hpbar .fill{
    height:100%; background:linear-gradient(90deg,#3f2b56,var(--corrode)); transition:width 0.4s;
    animation:vitalBeat var(--vital-dur,2.6s) ease-in-out infinite;
  }
  @keyframes vitalBeat{
    0%,66%,100%{ filter:brightness(1); }
    84%        { filter:brightness(1.4); }
  }
  /* 심도압박은 체력과 어긋난 박자로 뛴다 — 둘이 한 몸처럼 붙어 보이지 않게 */
  .dpbar{ --vital-dur:3.1s; --vital-w:26px; }
  /* 위독할수록 빨라진다. 체력바는 남은 비율에 따라 --vital-dur 를 인라인으로 받아
     단계 없이 이어서 빨라지므로, 여기 값은 그것을 받지 않는 압박바에만 걸린다. */
  .hpbar.urgent{ --vital-dur:1.15s; }
  .hpbar.urgent .fill::after{ background-image:linear-gradient(90deg, transparent, rgba(255,236,214,0.7), transparent); }
  @keyframes vitalBeatUrgent{
    0%,52%,100%{ filter:brightness(1); }
    62%,76%    { filter:brightness(1.55); }
    69%        { filter:brightness(1); }
  }
  .hpbar.urgent .fill{ animation-name:vitalBeatUrgent; }
  .intent-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink);
    background:linear-gradient(180deg, rgba(141,122,176,0.15), rgba(141,122,176,0.04));
    border:1px solid rgba(141,122,176,0.28);
    padding:3px 9px 3px 7px; border-radius:2px; margin-top:5px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  .intent-badge .ic{ display:flex; align-items:center; color:var(--corrode); }
  .foe-card.boss-awakened .intent-badge{ border-color:rgba(196,56,60,0.42); background:linear-gradient(180deg, rgba(143,32,40,0.22), rgba(143,32,40,0.05)); }
  .foe-card.boss-awakened .intent-badge .ic{ color:var(--blood-lit); }

  .party-zone{
    flex-shrink:0;
    display:flex; gap:5px; padding:10px 8px; overflow-x:auto;
    border-bottom:1px solid rgba(184,147,79,0.15);
    box-shadow:0 1px 0 rgba(0,0,0,0.55);
  }
  .hero-card{
    flex:1; min-width:0;
    border:1px solid var(--brass-dim); border-radius:0;
    padding:7px 5px; text-align:center; position:relative;
    background:linear-gradient(180deg, rgba(22,34,37,0.6), rgba(5,9,11,0.4));
  }
  /* 직군 정체성은 카드 상단 각인선으로만 — 색은 아끼고 형태로 구분한다 */
  .hero-card.cls-vanguard{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(125,156,178,0.5); }
  .hero-card.cls-chemist{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(138,171,124,0.5); }
  .hero-card.cls-priest{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(217,208,189,0.45); }
  .hero-card.cls-oracle{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(132,120,182,0.5); }
  .hero-card.cls-hellion{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(196,56,60,0.5); }
  .hero-card.cls-robber{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(138,171,124,0.45); }
  .hero-card.cls-jester{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(141,122,176,0.5); }
  /* 피는 계급을 가리지 않는다 — 아군 체력은 전부 같은 동맥색 */
  .hero-card .hpbar .fill{ background:linear-gradient(90deg,#4f1119,#a8262c); box-shadow:0 0 6px rgba(168,38,44,0.35); }
  .hero-card.collapsed{ border-color:var(--crack); }
  /* 정신 함몰 표식 — 소용돌이 */
  .hero-card.collapsed::before{
    content:''; position:absolute; top:3px; right:4px; width:11px; height:11px;
    background:no-repeat center/contain var(--px-spiral);
    image-rendering:pixelated;
  }
  .hero-card.empty{ opacity:0.22; border-style:dashed; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); }
  .hero-card.targetable{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 18px rgba(127,191,174,0.13), 0 0 15px rgba(127,191,174,0.45); animation:targetPulse 1.2s ease-in-out infinite; cursor:pointer; }

  .portrait{ width:41px;height:41px; margin:0 auto 3px; display:flex; align-items:center; justify-content:center; position:relative; }
  /* 생환 기록 — 한 번 돌아올 때마다 초상 아래의 핏점이 하나 늘며, 다섯 번에서 멈춘다. */
  .survival-marks{ position:absolute; z-index:3; left:50%; bottom:-3px; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:2px; pointer-events:none; }
  .survival-mark{ width:4px; height:4px; background:var(--blood-lit); border:1px solid var(--blood-dim); box-shadow:0 0 3px rgba(196,56,60,0.70); }
  .portrait-vanguard{
    border-radius:50%;
    background:radial-gradient(circle at 35% 28%, rgba(125,156,178,0.42), rgba(6,11,15,0.94));
    border:1px solid rgba(125,156,178,0.5);
    color:#c3d6e4;
    box-shadow:0 0 10px rgba(125,156,178,0.26), inset 0 0 9px rgba(0,0,0,0.6);
  }
  .portrait-chemist{
    border-radius:42% 58% 54% 46% / 46% 40% 60% 54%;
    background:radial-gradient(circle at 35% 28%, rgba(138,171,124,0.42), rgba(6,14,9,0.94));
    border:1px solid rgba(138,171,124,0.5);
    color:#cbdcc0;
    box-shadow:0 0 10px rgba(138,171,124,0.24), inset 0 0 9px rgba(0,0,0,0.6);
  }
  .portrait-priest{
    clip-path: polygon(50% 0%, 100% 35%, 85% 100%, 15% 100%, 0% 35%);
    background:radial-gradient(circle at 35% 24%, rgba(217,208,189,0.36), rgba(11,10,9,0.94));
    border:1px solid rgba(217,208,189,0.45);
    color:#e6dfd0;
    filter:drop-shadow(0 0 7px rgba(217,208,189,0.2));
  }
  /* 육각 아스트롤라베 — 마름모보다 도상을 덜 잘라먹는다 */
  .portrait-oracle{
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:radial-gradient(circle at 35% 28%, rgba(132,120,182,0.42), rgba(8,5,14,0.94));
    border:1px solid rgba(132,120,182,0.5);
    color:#d3cbec;
    filter:drop-shadow(0 0 8px rgba(132,120,182,0.28));
  }

  /* 나중에 합류하는 셋 — 팔각(광기), 마름모(도둑), 종(악사) */
  .portrait-hellion{
    clip-path: polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
    background:radial-gradient(circle at 35% 26%, rgba(196,56,60,0.4), rgba(16,6,7,0.94));
    border:1px solid rgba(196,56,60,0.5);
    color:#e6b9b4;
    filter:drop-shadow(0 0 8px rgba(196,56,60,0.28));
  }
  .portrait-robber{
    clip-path: polygon(50% 3%, 97% 50%, 50% 97%, 3% 50%);
    background:radial-gradient(circle at 35% 26%, rgba(138,171,124,0.34), rgba(8,12,10,0.94));
    border:1px solid rgba(138,171,124,0.45);
    color:#c2d2b8;
    filter:drop-shadow(0 0 7px rgba(138,171,124,0.22));
  }
  .portrait-jester{
    border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 35% 26%, rgba(141,122,176,0.42), rgba(10,7,16,0.94));
    border:1px solid rgba(141,122,176,0.5);
    color:#cfc5e4;
    box-shadow:0 0 10px rgba(141,122,176,0.24), inset 0 0 9px rgba(0,0,0,0.6);
  }

  .hero-rank{ font-family:'Nanum Myeongjo',serif; font-size:8.5px; color:var(--brass); letter-spacing:0.18em; margin-bottom:2px;}
  .hero-name{ font-size:10.5px; font-weight:600; margin-bottom:1px; line-height:1.15; color:var(--ink);}
  /* 이름·압박·체력은 한 덩어리로 읽히도록 줄 사이를 1px 만 띄운다 */
  .hero-hpline{ display:flex; align-items:center; gap:4px; margin-bottom:1px; }
  .hero-hpline .hpbar{ flex:1; height:7px; }
  .hero-num{ font-size:8.5px; color:var(--muted); min-width:24px; }
  /* 심도압박 = 체력과 같은 형태의 눈금. 체력 위에 얹어, 몸이 깎이기 전에
     정신이 먼저 차오르는 것을 같은 눈으로 읽게 한다. 한 칸 얇게 두어 둘을 가른다. */
  .dp-line{ margin-bottom:1px; }
  .dp-line .hpbar{ height:5px; }
  /* 채움색은 압박·체력에 따라 인라인으로 들어온다 — 아래 그라디언트를 지워야 그 색이 보인다 */
  .hero-card .dpbar .fill,
  .hero-card .lifebar .fill{ background-image:none; box-shadow:inset 0 1px 0 rgba(255,255,255,0.14); }
  /* ---- 상태 표식은 한 자리에 모은다 ----
     방어·무적·피격 반응이 저마다 제 모서리를 잡고 있으면 서로 겹치고, 어디를 봐야
     상태를 아는지도 매번 달라진다. 아군도 적과 같이 좌측 상단 한 곳에 쌓아 둔다. */
  .status-stack{
    position:absolute; top:2px; left:2px; z-index:2;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    pointer-events:none;
  }
  /* 방어 = 놋쇠로 덧댄 판금 */
  .block-tag{
    display:inline-flex; align-items:center; gap:2px;
    font-family:monospace; font-size:8.5px; color:#c6d8e4;
    background:rgba(14,24,31,0.85); border:1px solid rgba(125,156,178,0.42); border-radius:1px; padding:0 4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
  }
  .invulnerable-tag{ padding:1px 4px; border:1px solid var(--phosphor); color:var(--phosphor); background:rgba(4,18,18,0.86); font-size:8px; letter-spacing:0.08em; }

  /* ---------- 중앙 무대: 적과 아군 사이, 상황이 읽히는 자리 ---------- */
  .mid-stage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 14px; }
  .log-plate{
    width:100%; max-width:340px; padding:11px 16px; text-align:center;
    font-family:'Nanum Myeongjo',serif; font-size:13.5px; line-height:1.65;
    color:var(--ink);
    background:linear-gradient(180deg, rgba(9,16,19,0.88), rgba(4,8,10,0.8));
    border-top:1px solid rgba(184,147,79,0.34);
    border-bottom:1px solid rgba(184,147,79,0.34);
    box-shadow:0 0 30px rgba(0,0,0,0.7), inset 0 0 22px rgba(0,0,0,0.5);
    text-shadow:0 1px 3px rgba(0,0,0,0.95);
  }
  .log-plate .l{ display:block; }
  .log-plate .l.old{ opacity:0.42; font-size:11.5px; }
  /* 최근에 실제로 처리된 결과는 마지막 줄에 남기고, 한 단계 더 밝게 읽힌다. */
  .log-plate .l.latest{ color:#f1ead9; font-weight:700; text-shadow:1px 1px 0 #000,0 0 7px rgba(224,170,76,0.22); }
  .log-plate.targeting{
    color:var(--phosphor); letter-spacing:0.02em;
    border-color:rgba(127,191,174,0.5);
    box-shadow:0 0 30px rgba(127,191,174,0.18), inset 0 0 22px rgba(0,0,0,0.5);
  }
  .zone-label{ font-family:'Nanum Myeongjo',serif; font-size:8px; letter-spacing:0.3em; color:var(--muted); text-transform:uppercase; }

  /* ---------- 파티클 레이어 ----------
     전투 화면은 매 행동마다 innerHTML 로 다시 그려지므로, 파티클은 카드 안이 아니라
     다시 그려지지 않는 별도 레이어(#fx)에 절대좌표로 뿌린다. 끝나면 스스로 제거된다. */
  #fx{ position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .p{ position:absolute; pointer-events:none; will-change:transform,opacity; }

  /* 파편 — 피격 지점에서 방사형으로 튄다 */
  .p-shard{
    width:2px; height:9px; border-radius:1px; background:currentColor;
    box-shadow:0 0 5px currentColor;
    animation:shardFly var(--d,520ms) cubic-bezier(.12,.72,.3,1) forwards;
  }
  @keyframes shardFly{
    from{ transform:translate(-50%,-50%) rotate(var(--a)) translateY(6px) scaleY(0.5); opacity:1; }
    to  { transform:translate(-50%,-50%) rotate(var(--a)) translateY(var(--r,44px)) scaleY(1.6); opacity:0; }
  }

  /* 고리 — 흘려막기 / 시전 */
  .p-ring{
    border-radius:50%; border:1.5px solid currentColor;
    box-shadow:0 0 10px currentColor, inset 0 0 8px currentColor;
    animation:ringOut var(--d,460ms) ease-out forwards;
  }
  @keyframes ringOut{
    from{ transform:translate(-50%,-50%) scale(0.22); opacity:0.95; }
    to  { transform:translate(-50%,-50%) scale(1.5);  opacity:0; }
  }

  /* 잔상 — 회피 */
  .p-wisp{
    width:20px; height:3px; border-radius:3px;
    background:linear-gradient(90deg, transparent, currentColor);
    animation:wispSlip var(--d,520ms) cubic-bezier(.1,.8,.3,1) forwards;
  }
  @keyframes wispSlip{
    from{ transform:translate(-50%,-50%) translateX(0) scaleX(0.4); opacity:0.95; }
    to  { transform:translate(-50%,-50%) translateX(var(--dx,28px)) scaleX(1.3); opacity:0; }
  }

  /* 베기 궤적 — 반격 */
  .p-slash{
    width:58px; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, currentColor 45%, #fff 52%, currentColor 60%, transparent);
    box-shadow:0 0 8px currentColor;
    animation:slashSweep 320ms ease-out forwards;
  }
  @keyframes slashSweep{
    from{ transform:translate(-50%,-50%) rotate(var(--a)) scaleX(0.1); opacity:0; }
    35% { opacity:1; }
    to  { transform:translate(-50%,-50%) rotate(var(--a)) scaleX(1.3); opacity:0; }
  }

  /* 기포 — 소멸 (물속이니 물거품으로 흩어진다) */
  .p-bub{
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%, rgba(236,244,240,0.6), rgba(150,195,185,0.05));
    border:1px solid rgba(206,228,220,0.35);
    animation:bubUp var(--d,900ms) ease-out forwards;
  }
  @keyframes bubUp{
    from{ transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    18% { opacity:0.9; }
    to  { transform:translate(calc(-50% + var(--dx,0px)), calc(-50% - var(--dy,64px))) scale(1.05); opacity:0; }
  }

  /* 인광 티끌 — 회복 / 진정 */
  .p-mote{
    border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor;
    animation:moteUp var(--d,760ms) ease-out forwards;
  }
  @keyframes moteUp{
    from{ transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    22% { opacity:1; }
    to  { transform:translate(calc(-50% + var(--dx,0px)), calc(-50% - var(--dy,34px))) scale(0.3); opacity:0; }
  }

  /* 회복 십자 — 카드 둘레를 따라 돋아 올라온다.
     상처가 아무는 것은 몸 한 곳이 아니라 그 사람 전체에 일어나는 일이라,
     초상 위가 아니라 카드를 두르는 자리에 뿌린다. */
  .p-plus{
    font-family:monospace; font-weight:700; font-size:14px; line-height:1;
    color:currentColor; z-index:1;
    text-shadow:0 0 7px currentColor, 0 1px 0 rgba(0,0,0,0.85);
    animation:plusRise var(--d,860ms) ease-out var(--dl,0ms) both;
  }
  @keyframes plusRise{
    from{ transform:translate(-50%,-50%) scale(0.35); opacity:0; }
    28% { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
    to  { transform:translate(calc(-50% + var(--dx,0px)), calc(-50% - var(--dy,24px))) scale(0.85); opacity:0; }
  }

  /* 피해 수치 — 맞은 초상 위로 솟았다가 가라앉는다.
     파편·고리와 섞이면 읽히지 않으므로 한 겹 위에 두고 검은 테를 둘러 띄운다. */
  .p-dmg{
    font-family:monospace; font-weight:700; font-size:16px; line-height:1;
    color:currentColor; white-space:nowrap; z-index:1;
    text-shadow:0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 0 7px rgba(0,0,0,0.85);
    animation:dmgFloat var(--d,900ms) cubic-bezier(.16,.72,.32,1) forwards;
  }
  @keyframes dmgFloat{
    from{ transform:translate(-50%,-50%) translateY(4px) scale(0.7); opacity:0; }
    22% { transform:translate(-50%,-50%) translateY(-6px) scale(1.15); opacity:1; }
    46% { transform:translate(-50%,-50%) translateY(-13px) scale(1); opacity:1; }
    to  { transform:translate(-50%,-50%) translateY(-30px) scale(0.95); opacity:0; }
  }

  /* 손에서 뽑혀 나가는 카드 — 사라지기 직전의 모습을 그대로 뜬 잔상.
     한 번 눌렀다가 위로 빠져나간다. 카드는 비트맵 글자를 품고 있어 확대·회전은
     획을 뭉개므로, 정수 픽셀로만 밀어 올리고 끝에서 흩어지게 둔다.
     #fx 안에 얹히므로 카드 규칙(.card)의 position 을 눌러야 한다. */
  #fx .card-fly{
    position:absolute; margin:0; z-index:6; pointer-events:none;
    transform-origin:50% 50%;
    animation:cardFly 95ms ease-out forwards;
  }
  /* 뽑혀 나가기보다 그 자리에서 부풀며 흩어진다 — 10px 만 떠오르고 120% 까지
     커지며 투명해진다. 커지는 동안에는 픽셀이 어차피 갈리므로 계단으로 끊지 않고
     매끄럽게 잇는다(steps 로 끊으면 확대가 뚝뚝 튀어 보인다). */
  @keyframes cardFly{
    from{ transform:translateY(0)     scale(1);    opacity:1; }
    60% { transform:translateY(-6px)  scale(1.12); opacity:0.5; }
    to  { transform:translateY(-10px) scale(1.2);  opacity:0; }
  }

  /* ---- 크리티컬 ----
     깊게 들어간 한 방. 파편과 달리 위로 튀었다가 아래로 떨어진다 — 튄 피는 가라앉는다. */
  .p-blood{
    border-radius:50%; background:currentColor;
    animation:bloodFly var(--d,640ms) cubic-bezier(.2,.5,.5,1) forwards;
  }
  @keyframes bloodFly{
    from{ transform:translate(-50%,-50%) scale(1);   opacity:1; }
    35% { transform:translate(calc(-50% + var(--dx,0px) * 0.6), calc(-50% - var(--rise,12px))) scale(0.9); opacity:1; }
    to  { transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,28px))) scale(0.45); opacity:0; }
  }
  .p-crit{
    font-family:monospace; font-weight:700; font-size:15px; letter-spacing:0.1em;
    color:currentColor; white-space:nowrap; z-index:2;
    text-shadow:0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 0 10px rgba(255,74,54,0.85);
    animation:critPop var(--d,900ms) cubic-bezier(.16,.72,.32,1) forwards;
  }
  @keyframes critPop{
    from{ transform:translate(-50%,-50%) scale(0.45); opacity:0; }
    16% { transform:translate(-50%,-50%) scale(1.3);  opacity:1; }
    32% { transform:translate(-50%,-50%) scale(1);    opacity:1; }
    68% { transform:translate(-50%,-50%) translateY(-12px) scale(1); opacity:1; }
    to  { transform:translate(-50%,-50%) translateY(-26px) scale(0.95); opacity:0; }
  }

  /* 피격 흔들림 — 카드 자체를 짧게 턴다 */
  .hit-shake{ animation:hitShake 240ms cubic-bezier(.36,.07,.19,.97); }
  @keyframes hitShake{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-3px); }
    38%{ transform:translateX(3px); }
    58%{ transform:translateX(-2px); }
    80%{ transform:translateX(1px); }
  }

  @media (prefers-reduced-motion: reduce){
    /* 장식은 걷어내되 피해 수치와 치명타 표시는 정보라 남긴다 — 뜬 자리에 머물다 사라진다 */
    #fx > :not(.p-dmg):not(.p-crit){ display:none; }
    .p-dmg,.p-crit{ animation:dmgHold 900ms steps(1,end) forwards !important; }
    @keyframes dmgHold{
      from{ transform:translate(-50%,-50%); opacity:1; }
      72% { transform:translate(-50%,-50%); opacity:1; }
      to  { transform:translate(-50%,-50%); opacity:0; }
    }
    .hit-shake{ animation:none !important; }
  }

  /* ---------- 사거리 / 피격 반응 표식 ---------- */
  .reach-chip{
    display:inline-block; font-family:'Nanum Myeongjo',serif;
    font-size:7.5px; letter-spacing:0.08em; padding:0 4px; border-radius:1px;
    border:1px solid currentColor; opacity:0.9; vertical-align:middle;
  }
  .reach-melee{ color:#d0895e; }
  .reach-mid{ color:#c2a75f; }
  .reach-ranged{ color:#8ab2c6; }
  .react-tag{
    display:inline-flex; align-items:center; gap:2px;
    font-size:8px; padding:1px 4px 1px 2px; border-radius:1px;
    background:rgba(3,6,9,0.92); border:1px solid currentColor;
    animation:reactPop 0.35s ease-out;
  }
  .react-dodge{ color:#8fd4c4; }
  .react-guard{ color:#9fc0d8; }
  .react-riposte{ color:var(--blood-lit); }
  @keyframes reactPop{ from{ transform:translateY(4px) scale(0.8); opacity:0; } to{ transform:none; opacity:1; } }
  /* 자리를 잘못 잡아 아무것도 못 하는 상태 */
  .rank-warn{ font-family:'Nanum Myeongjo',serif; font-size:7.5px; letter-spacing:0.06em; color:var(--crack); margin-top:2px; }
  .hero-card.idle .portrait, .foe-card.idle .enemy-portrait{ filter:grayscale(0.65) brightness(0.72); }

  .hand-zone{ flex-shrink:0; padding:6px 8px 10px; }
  .ap-row{ display:flex; justify-content:center; align-items:center; gap:9px; margin-bottom:8px;}
  .ap-label{ font-family:'Nanum Myeongjo',serif; font-size:9.5px; letter-spacing:0.2em; color:var(--brass); text-transform:uppercase; }
  /* AP = 등잔 기름 방울 */
  .pip{ width:12px;height:12px; border:1px solid var(--brass-dim); background:rgba(0,0,0,0.45); border-radius:50% 50% 50% 0; transform:rotate(-45deg); }
  .pip.filled{ background:radial-gradient(circle at 38% 32%, #f3d189, #b0752a); border-color:var(--gaslamp); box-shadow:0 0 9px rgba(224,170,76,0.5); }
  /* 좌·상단 여백은 밀랍 봉인이 스크롤 컨테이너에 잘리지 않게 하려는 것.
     가로로만 구르는 상자라도 세로는 잘리므로, 집어 든 카드가 떠오를 자리까지 함께 비워 둔다. */
  .hand-row{ display:flex; gap:9px; overflow-x:auto; padding:16px 10px 8px; scroll-snap-type:x proximity; }
  /* 손패 = 밀랍 봉인된 낡은 양피 카드 */
  .card{
    scroll-snap-align:start;
    flex:0 0 124px; height:178px;
    border-radius:0; border:1px solid var(--brass-dim);
    padding:9px 8px; position:relative;
    background:
      repeating-linear-gradient(51deg, rgba(224,206,170,0.022) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, rgba(30,40,40,0.9), rgba(6,10,12,0.95));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(184,147,79,0.085), inset 0 -24px 26px rgba(0,0,0,0.42);
    display:flex; flex-direction:column;
    transition:transform 0.15s;
  }
  /* 기본 카드 색: 공용은 흰색, 모든 직업 카드는 같은 파란색으로 읽힌다. */
  .card.owner-neutral{ border-color:var(--card-normal); border-top:3px solid var(--card-normal-hi); }
  .card.owner-vanguard,.card.owner-chemist,.card.owner-priest,.card.owner-oracle,
  .card.owner-hellion,.card.owner-robber,.card.owner-jester{ border-color:var(--card-class); border-top:3px solid var(--card-class-hi); }
  /* 보상·드로우 카드도 소유자 데이터가 비어 있어 색을 잃지 않게 기본 분류색을 둔다. */
  .card.normal{ border-color:var(--card-normal); border-top-color:var(--card-normal-hi); }
  .card.class{ border-color:var(--card-class); border-top-color:var(--card-class-hi); }
  .card:active{ transform:translateY(-4px); }

  /* ---- 손패를 집어 드는 느낌 ----
     쓸 수 있는 카드만 반응한다 — 못 쓰는 카드가 따라 들리면 쓸 수 있다고 착각한다.
     흔들지 않고 들어 올리기만 한다. 손패는 늘 눈이 머무는 자리라, 계속 움직이면
     읽어야 할 카드 글씨가 먼저 지친다. */
  @media (hover:hover){
    .hand-row .card:not(.unplayable):hover{
      transform:translateY(-6px); z-index:2;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(184,147,79,0.16),
                  inset 0 -24px 26px rgba(0,0,0,0.42), 0 5px 12px rgba(0,0,0,0.6);
    }
  }
  /* 누르는 동안은 한 칸 더 들린 자리에 머문다 */
  .hand-row .card:not(.unplayable):active{
    transform:translateY(-7px); z-index:2;
  }
  .card.unplayable{ opacity:0.52; filter:grayscale(0.6); }
  .card.unplayable .card-name, .card.unplayable .card-cost{ opacity:0.72; }
  .card.contaminated{
    border-color:var(--corrode);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 24px rgba(141,122,176,0.18), 0 0 12px rgba(141,122,176,0.22);
  }
  /* 표적을 고르는 동안에도 카드는 손에 들려 있다 — 떠 있는 자리와 인광 테두리로만 알린다 */
  .card.selecting{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 22px rgba(127,191,174,0.14), 0 0 16px rgba(127,191,174,0.5); transform:translateY(-6px); z-index:2; }
  /* 비용 = 밀랍 봉인 */
  .card-cost{
    position:absolute; top:-8px; left:-8px; width:23px;height:23px;
    border-radius:52% 48% 47% 53% / 50% 53% 47% 50%;
    background:radial-gradient(circle at 34% 30%, #b8323a, #6b141b 72%);
    border:1px solid rgba(224,170,76,0.55); color:#f2e6cf;
    font-family:monospace; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,0.85), inset 0 1px 2px rgba(255,192,172,0.26);
    text-shadow:0 1px 1px rgba(0,0,0,0.7);
  }
  .card-name{ font-size:11px; font-weight:600; margin-top:9px; line-height:1.25; min-height:26px; color:var(--bone);}
  .card-name.glitch{ color:var(--corrode); letter-spacing:0.02em;}
  /* 이름과 효과 사이 각인 구획선 */
  .card-desc{
    font-size:9.5px; color:var(--muted); line-height:1.4; flex:1; margin-top:5px; padding-top:5px;
    border-top:1px solid rgba(184,147,79,0.16);
  }
  .card-desc.glitch{ color:rgba(141,122,176,0.75); }
  .card-owner-tag{ font-family:'Nanum Myeongjo',serif; font-size:7.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; margin-top:auto;}
  .card.normal .card-owner-tag{ color:var(--card-normal-hi); }
  .card.class .card-owner-tag{ color:var(--card-class-text); }
  /* 에픽은 보라색 표식만 남기고, 일반 카드의 크기·정렬·AP 봉인 규칙을 그대로 쓴다. */
  .card.epic{ border-color:var(--card-epic); border-top-color:var(--card-epic); }
  .card.legendary{ border-color:var(--card-legendary); border-top-color:var(--card-legendary); }
  .card.epic .card-owner-tag{ color:var(--card-epic-hi); }
  .card.legendary .card-owner-tag{ color:var(--card-legendary-hi); }

  .end-turn-row{ display:flex; justify-content:center; padding-top:2px;}

  /* ---------- REST / AFTERMATH ---------- */
  .rest-screen{ padding:22px 18px; justify-content:center; align-items:center; gap:12px; text-align:center; overflow-y:auto;}
  .af-flavor{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--muted); line-height:1.7; max-width:300px; margin:0 0 2px; font-style:italic; }
  .rest-opts{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; }
  .rest-opt{
    border:1px solid var(--brass-dim); border-radius:0; padding:12px 14px; text-align:left;
    background:linear-gradient(180deg, rgba(22,34,37,0.55), rgba(5,9,11,0.55));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(184,147,79,0.07);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    cursor:pointer;
  }
  .rest-opt.sel{ border-color:var(--phosphor); background:linear-gradient(180deg, rgba(38,60,58,0.7), rgba(8,16,16,0.7)); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 20px rgba(127,191,174,0.14); }
  .rest-opt .t{ font-size:13px; font-weight:600; margin-bottom:3px; color:var(--bone);}
  .rest-opt .d{ font-size:11px; color:var(--muted); }
  .rest-party-status{ width:100%; max-width:300px; text-align:left; border:1px solid var(--brass-dim); padding:8px; background:rgba(8,14,16,0.58); box-shadow:inset 0 0 12px rgba(0,0,0,0.44); }
  .rest-party-title{ color:var(--gaslamp); font-size:10px; letter-spacing:0.08em; margin:0 0 6px; }

  /* 공통 hover가 에픽·전설의 고유 테두리를 금색으로 덮지 않도록 이동·광택만 준다. */

  .card.reward-card.normal:hover{ box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 20px rgba(239,238,229,0.10), 0 0 10px rgba(239,238,229,0.22); }
  .card.reward-card.class:hover{ box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 20px rgba(120,182,227,0.12), 0 0 10px rgba(120,182,227,0.28); }
  .card.reward-card.epic:hover{ border-color:var(--card-epic); border-top-color:var(--card-epic); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 20px rgba(141,122,176,0.18), 0 0 12px rgba(141,122,176,0.36); }
  .card.reward-card.legendary:hover{ border-color:var(--card-legendary); border-top-color:var(--card-legendary); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 20px rgba(230,189,89,0.20), 0 0 13px rgba(230,189,89,0.42); }

  .draw-swap{ position:absolute; z-index:20; inset:0; padding:18px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; overflow-y:auto; background:rgba(2,7,9,0.90); border:1px solid rgba(224,170,76,0.44); }
  .draw-swap-title{ color:var(--gaslamp); font-size:14px; text-align:center; }
  .draw-swap-copy{ max-width:300px; color:var(--muted); font-size:11px; text-align:center; line-height:1.55; }
  .draw-swap-card{ transform:scale(0.9); margin:-8px 0; pointer-events:none; }
  .draw-replace-list{ width:100%; max-width:310px; display:flex; flex-direction:column; gap:5px; }
  .draw-replace-row{ border:1px solid var(--brass-dim); padding:8px 10px; color:var(--bone); background:rgba(15,26,28,0.78); cursor:pointer; text-align:left; }
  .draw-replace-row:hover{ border-color:var(--blood-lit); background:rgba(70,23,27,0.58); }
  .af-row{ border:1px solid var(--brass-dim); border-radius:0; padding:9px 12px; display:flex; justify-content:space-between; align-items:center; background:rgba(12,20,22,0.5); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.45); cursor:pointer; text-align:left; user-select:none; -webkit-user-select:none; }
  .af-row.sel{ border-color:var(--phosphor); background:rgba(34,54,52,0.7); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.45), inset 0 0 16px rgba(127,191,174,0.14); }
  /* 강화·합성 목록도 보상 화면과 같은 등급 색을 유지한다. 선택 상태에서는 초록 테두리와 색상 표기를 함께 남긴다. */
  .af-row.normal{ border-left:3px solid var(--card-normal-hi); }
  .af-row.class{ border-left:3px solid var(--card-class-hi); }
  .af-row.epic{ border-left:3px solid var(--card-epic); background:rgba(52,40,79,0.44); }
  .af-row.legendary{ border-left:3px solid var(--card-legendary); background:rgba(75,57,22,0.44); }
  .af-row.sel.normal{ border-left-color:var(--card-normal-hi); }
  .af-row.sel.class{ border-left-color:var(--card-class-hi); }
  .af-row.sel.epic{ border-left-color:var(--card-epic); }
  .af-row.sel.legendary{ border-left-color:var(--card-legendary); }
  .af-row.locked{ opacity:0.42; cursor:not-allowed; }
  .af-row.unavailable{ opacity:0.42; cursor:not-allowed; }
  .af-row-name{ font-size:12px; color:var(--ink); }
  .af-row-owner{ font-size:9.5px; color:var(--muted); white-space:nowrap; margin-left:8px; }
  .af-row.normal .af-row-owner{ color:var(--card-normal-hi); }
  .af-row.class .af-row-owner{ color:var(--card-class-text); }
  .af-row.epic .af-row-owner{ color:var(--card-epic-hi); }
  .af-row.legendary .af-row-owner{ color:var(--card-legendary-hi); }
  .af-empty{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--muted); font-style:italic; }
  .af-hint{ font-family:'Nanum Myeongjo',serif; font-size:12.5px; color:var(--muted); font-style:italic; }
  .upgrade-preview{ width:100%; max-width:300px; border:1px solid var(--phosphor); padding:9px 11px; text-align:left; background:rgba(18,42,40,0.42); box-shadow:inset 0 0 16px rgba(127,191,174,0.12); }
  .upgrade-preview.normal{ border-left:3px solid var(--card-normal-hi); }
  .upgrade-preview.class{ border-left:3px solid var(--card-class-hi); }
  .upgrade-preview.epic{ border-left:3px solid var(--card-epic); background:rgba(52,40,79,0.48); }
  .upgrade-preview.legendary{ border-left:3px solid var(--card-legendary); background:rgba(75,57,22,0.48); }
  .upgrade-preview-title{ color:var(--bone); font-size:12px; margin-bottom:4px; }
  .upgrade-preview-line{ color:var(--muted); font-size:10px; line-height:1.6; }

  .upgrade-guide-overlay{
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:18px; background:rgba(2,5,7,0.78);
  }
  .upgrade-guide-panel{
    width:100%; max-width:310px; padding:16px; border:1px solid var(--gaslamp);
    background:#101719; box-shadow:inset 1px 1px 0 rgba(232,196,121,0.24),inset -1px -1px 0 #000,0 0 0 1px #000;
    text-align:left;

  .upgrade-guide-panel h3{ margin:0 0 8px; color:var(--bone); font-size:14px; }
  .upgrade-guide-panel p{ margin:0 0 8px; color:var(--ink); font-size:11px; line-height:1.7; word-break:keep-all; }
