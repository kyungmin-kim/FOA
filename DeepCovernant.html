  /* ==== /BUNDLED FONTS ==== */
  :root{
    /* ground — 젖은 석재 / 잉크 / 수압 검정 */
    --void:#04070a;
    --deep:#0b1317;
    --deep2:#121d20;
    --slab:#18262a;

    /* 차가운 심해 생물발광 — 조준/생명 계열 (채도 낮춤) */
    --phosphor:#7fbfae;
    --phosphor-dim:#38635a;

    /* kin — 코스믹 바이올렛 */
    --corrode:#8d7ab0;

    /* 심연 장미빛 */
    --abyss:#9c3550;
    --abyss-dim:#5d1e32;

    /* 직군 색상 — 전부 가스등 수준으로 탈채도 */
    --steel:#7d9cb2;
    --toxin:#8aab7c;
    --bone:#d9d0bd;
    --indigo:#8478b6;

    /* 변색된 놋쇠 / 가스등 */
    --brass:#b8934f;
    --brass-dim:#6b5530;
    --gaslamp:#e0aa4c;

    /* 피 */
    --blood:#8f2028;
    --blood-lit:#c4383c;
    --blood-dim:#4a1116;

    --erode:#b23a35;
    --ink:#cec6b5;
    --muted:#7b7a70;
    --crack:#d9452f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 픽셀은 픽셀로 — 브라우저가 부드럽게 뭉개지 못하게 막는다 */
  img.px{ image-rendering:pixelated; image-rendering:crisp-edges; -ms-interpolation-mode:nearest-neighbor; display:block; }
  html,body{margin:0;padding:0;height:100%;background:var(--void);overflow:hidden;}
  body{
    font-family:'Nanum Myeongjo',serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    -webkit-user-select:none;
    user-select:none;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    position:relative;
    background: var(--column-bg);
    transition: background 1.4s ease;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  #app[data-tier="surface"]{ --column-bg: linear-gradient(180deg, #16292c 0%, #0d1b1e 42%, #060c0f 100%); }
  #app[data-tier="mid"]{ --column-bg: linear-gradient(180deg, #0d1519 0%, #0a1013 45%, #04080a 100%); }
  #app[data-tier="abyss"]{ --column-bg: linear-gradient(180deg, #05070a 0%, #020304 55%, #000000 100%); }

  /* 깊은 비네트 — 화면 가장자리를 물속 어둠으로 눌러준다 */
  #app::after{
    content:'';
    position:absolute; inset:0;
    pointer-events:none;
    box-shadow:
      inset 0 0 80px 16px rgba(0,0,0,0.36),
      inset 0 0 200px 56px rgba(0,0,0,0.25);
  }

  /* 필름 그레인 + 상단 비네트 — 콘텐츠 위에 얹혀 전체를 한 장의 동판화처럼 묶는다 */
  #grain{
    position:absolute; inset:0; pointer-events:none; z-index:4;
    background-image:
      repeating-linear-gradient(43deg, rgba(255,240,215,0.016) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-37deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 4px);
  }
  #grain::after{
    content:''; position:absolute; inset:0;
    box-shadow: inset 0 0 60px 10px rgba(0,0,0,0.22), inset 0 0 180px 64px rgba(0,0,0,0.21);
  }

  h1,h2,h3,.disp{ font-family:'Nanum Myeongjo',serif; letter-spacing:0.05em; color:var(--bone); text-shadow:0 1px 2px rgba(0,0,0,0.7); }
  .mono{ font-family:monospace; }
  .fell{ font-family:'Nanum Myeongjo',serif; }
  /* 산문에만 keep-all — 좁은 flex 칸(파티/손패 슬롯)의 최소폭까지 늘리지 않도록 범위를 좁힌다 */
  .title-sub,.node-card p,.node-card h3,.af-flavor,.class-blurb,.rest-opt .d,
  .card-desc,.log-plate,.relic-desc,.af-hint,.result-list,.foe-dead,
  .rank-slot-name,.reach-legend,.rank-warn{ word-break:keep-all; }

  /* ---------- ATMOSPHERE LAYER ---------- */
  #atmo{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  #content{ position:relative; z-index:1; flex:1; min-height:0; display:flex; flex-direction:column; }

  .atmo-gradient{ position:absolute; inset:-15% -5%; }
  .atmo-surface{ background:radial-gradient(ellipse at 50% -15%, rgba(196,220,212,0.13), transparent 55%); }
  .atmo-mid{ background:radial-gradient(ellipse at 50% 108%, rgba(141,122,176,0.10), transparent 60%); }
  .atmo-abyss{ background:radial-gradient(ellipse at 50% 100%, rgba(143,32,40,0.12), transparent 55%); }

  /* 수면 위에서 내려꽂히는 창백한 달빛 기둥 */
  .beam{ position:absolute; top:-25%; width:130px; height:170%; background:linear-gradient(180deg, rgba(214,228,220,0.085), transparent 72%); filter:blur(4px); transform:rotate(11deg); animation:beamSway 11s ease-in-out infinite alternate; }
  .beam1{ left:6%; }
  .beam2{ left:54%; width:96px; opacity:0.65; animation-delay:-5s; }
  @keyframes beamSway{ from{ transform:rotate(8deg) translateX(0);} to{ transform:rotate(15deg) translateX(16px);} }

  .bubble{ position:absolute; bottom:-6%; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(232,240,235,0.4), rgba(170,200,190,0.04)); border:1px solid rgba(196,220,212,0.16); animation-name:bubbleRise; animation-timing-function:linear; animation-iteration-count:infinite; }
  @keyframes bubbleRise{ from{ transform:translateY(0) translateX(0); opacity:0.55;} to{ transform:translateY(-760px) translateX(16px); opacity:0;} }

  .mote{ position:absolute; border-radius:50%; animation-name:moteDrift; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .mote-mid{ background:var(--corrode); box-shadow:0 0 7px var(--corrode); opacity:0.42; }
  .mote-abyss{ background:var(--blood-lit); box-shadow:0 0 9px var(--blood); opacity:0.4; }
  @keyframes moteDrift{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-20px);} }

  /* 가라앉는 재 — 블러드본식 잿가루가 물속에서 천천히 내려앉는다 */
  .ash{ position:absolute; top:-4%; width:1.5px; height:1.5px; border-radius:50%; background:rgba(224,170,76,0.5); box-shadow:0 0 3px rgba(224,170,76,0.35); animation-name:ashFall; animation-timing-function:linear; animation-iteration-count:infinite; }
  @keyframes ashFall{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:0.8; }
    88%{ opacity:0.55; }
    100%{ transform:translate(26px, 780px); opacity:0; }
  }

  @keyframes targetPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.035);} }

  /* ---------- HIT FLASH (attack = white, damaged = red) ---------- */
  #flash{ position:absolute; inset:0; pointer-events:none; z-index:5; }
  #flash.flash-white{ animation: flashVignetteWhite 0.4s ease-out; }
  #flash.flash-red{ animation: flashVignetteRed 0.55s ease-out; }
  @keyframes flashVignetteWhite{
    0%{ box-shadow: inset 0 0 50px 10px rgba(246,238,220,0.9), inset 0 0 160px 40px rgba(224,170,76,0.4); }
    100%{ box-shadow: inset 0 0 50px 10px rgba(246,238,220,0), inset 0 0 160px 40px rgba(224,170,76,0); }
  }
  @keyframes flashVignetteRed{
    0%{ box-shadow: inset 0 0 60px 14px rgba(159,29,36,0.95), inset 0 0 180px 50px rgba(90,12,18,0.75); }
    100%{ box-shadow: inset 0 0 60px 14px rgba(159,29,36,0), inset 0 0 180px 50px rgba(90,12,18,0); }
  }

  @media (prefers-reduced-motion: reduce){
    .beam,.bubble,.mote,.ash,.enemy-portrait,.ero-fill::after,.ero-case.danger,.title-glyph::before,.title-glyph::after,.foe-card.targetable,.hero-card.targetable{ animation:none !important; }
  }

  /* ---------- TITLE ---------- */
  .screen{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; z-index:1;}
  .title-screen{ justify-content:center; align-items:center; text-align:center; padding:32px; gap:16px;}
  .title-glyph{
    width:104px;height:104px;border-radius:50%;
    border:1px solid var(--brass-dim);
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      0 0 34px rgba(127,191,174,0.12),
      0 0 62px rgba(143,32,40,0.15),
      inset 0 0 22px rgba(184,147,79,0.14);
    position:relative;
  }
  .title-glyph::before{
    content:'';position:absolute;inset:7px;border-radius:50%;
    border:1px dashed rgba(184,147,79,0.34);
    animation:spin 54s linear infinite;
  }
  /* 바깥 궤도 — 피와 인광이 서로 반대로 돈다 */
  .title-glyph::after{
    content:'';position:absolute;inset:-9px;border-radius:50%;
    border:1px solid rgba(184,147,79,0.15);
    border-top-color:rgba(196,56,60,0.42);
    border-bottom-color:rgba(127,191,174,0.3);
    animation:spin 96s linear infinite reverse;
  }
  .title-glyph span{ display:flex; color:var(--bone); filter:drop-shadow(0 0 9px rgba(127,191,174,0.45)); }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .title-en{ font-size:9.5px; letter-spacing:0.26em; line-height:1.8; color:var(--brass); text-transform:uppercase; padding:0 10px; }
  .title-kr{
    font-family:'Nanum Myeongjo',serif; font-weight:700;
    font-size:27px; line-height:1.28; color:var(--bone); letter-spacing:0.03em;
    text-shadow:0 0 20px rgba(196,56,60,0.26), 0 2px 3px rgba(0,0,0,0.85);
  }
  .title-sub{ font-family:'Nanum Myeongjo',serif; font-size:14px; color:var(--muted); max-width:302px; line-height:1.75; font-style:italic; }

  /* 놋쇠 구획선 + 중앙 마름모 — 화면 사이 호흡 */
  .rule{
    width:196px; height:9px; position:relative; opacity:0.8;
    background:linear-gradient(90deg, transparent, var(--brass-dim) 22%, var(--brass-dim) 78%, transparent) no-repeat 0 50%/100% 1px;
  }
  .rule::after{
    content:''; position:absolute; left:50%; top:50%; width:6px; height:6px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--void); border:1px solid var(--brass);
  }

  .btn{
    font-family:'Nanum Myeongjo',serif; font-size:13.5px; letter-spacing:0.1em; font-weight:600;
    background:linear-gradient(180deg, rgba(184,147,79,0.14), rgba(184,147,79,0.03));
    border:1px solid var(--brass-dim);
    color:var(--brass);
    padding:13px 26px; border-radius:2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 1px 0 rgba(224,170,76,0.14);
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
    cursor:pointer;
  }
  .btn:active{ transform:translateY(1px); background:rgba(184,147,79,0.22); }
  .btn.primary{
    color:#150c07; font-weight:700;
    background:linear-gradient(180deg,#dcb066,#8e6b2e);
    border-color:#c8a45c;
    text-shadow:0 1px 0 rgba(255,238,200,0.35);
    box-shadow:0 0 16px rgba(224,170,76,0.22), inset 0 1px 0 rgba(255,240,205,0.45);
  }
  .btn.danger{ color:var(--blood-lit); border-color:#6a2420; background:linear-gradient(180deg, rgba(143,32,40,0.24), rgba(143,32,40,0.06)); }
  .btn:disabled{ opacity:0.3; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    padding:10px 14px 9px; flex-shrink:0;
    border-bottom:1px solid rgba(184,147,79,0.16);
    background:linear-gradient(180deg, rgba(9,16,19,0.85), rgba(9,16,19,0.12));
    box-shadow:0 1px 0 rgba(0,0,0,0.65);
  }
  .ero-row{ display:flex; align-items:center; gap:10px; }
  .ero-label{ font-family:'Nanum Myeongjo',serif; font-size:9.5px; letter-spacing:0.24em; color:var(--brass); text-transform:uppercase; white-space:nowrap;}
  /* 놋쇠 리벳이 박힌 압력계 케이스 — 차오르는 것은 물이 아니라 피에 가깝다 */
  .ero-case{
    flex:1; height:15px; border-radius:1px;
    border:1px solid var(--brass-dim);
    background:
      radial-gradient(circle at 5px 50%, rgba(224,170,76,0.45) 0 1.1px, transparent 1.5px),
      radial-gradient(circle at calc(100% - 5px) 50%, rgba(224,170,76,0.45) 0 1.1px, transparent 1.5px),
      repeating-linear-gradient(90deg, rgba(184,147,79,0.15) 0 1px, transparent 1px 11px),
      #070c0e;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);
    position:relative; overflow:hidden;
  }
  /* 채워질수록 나쁘다 — 잠식이 왼쪽에서부터 게이지를 먹어 들어온다 */
  .ero-fill{
    position:absolute; inset:1px; left:1px;
    background:linear-gradient(90deg, #3a0d12, var(--erode) 68%, #c4544a);
    box-shadow:0 0 12px rgba(178,58,53,0.45), inset 0 -3px 5px rgba(0,0,0,0.45);
    transition:width 0.5s ease;
  }
  .ero-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,226,200,0.16), transparent);
    width:40px; animation:eroShimmer 3.2s linear infinite;
  }
  @keyframes eroShimmer{ from{transform:translateX(-40px);} to{transform:translateX(160px);} }
  /* 70% 를 넘기면 케이스 자체가 맥동한다 */
  .ero-case.danger{ border-color:var(--blood-lit); animation:eroAlarm 1.5s ease-in-out infinite; }
  @keyframes eroAlarm{
    0%,100%{ box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 0 0 rgba(196,56,60,0); }
    50%    { box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 0 12px rgba(196,56,60,0.6); }
  }
  .ero-num{ font-size:12px; color:var(--muted); min-width:34px; text-align:right; }
  .ero-num.danger{ color:var(--blood-lit); text-shadow:0 0 8px rgba(196,56,60,0.55); }

  /* ---------- MAP / SETUP shared shell ---------- */
  .map-screen{ padding:20px 18px; align-items:center; gap:12px; overflow-y:auto; }
  .path-trail{ display:flex; gap:6px; margin-bottom:2px; }
  .crumb-chip{
    width:25px;height:25px;border-radius:50%;
    border:1px solid var(--brass-dim);
    display:flex;align-items:center;justify-content:center;
    color:var(--brass); background:rgba(9,16,18,0.6);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.75);
  }
  .tier-tag{ font-family:'Nanum Myeongjo',serif; font-size:10px; line-height:1.7; letter-spacing:0.26em; color:var(--brass); text-transform:uppercase; }
  .node-choices{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; margin:0 auto; }
  /* 모서리를 깎아낸 각인 동판 */
  .node-card{
    width:100%;
    border:1px solid var(--brass-dim); border-radius:0;
    padding:15px 17px 28px;
    background:linear-gradient(180deg, rgba(22,34,37,0.62), rgba(5,9,11,0.68));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(184,147,79,0.075);
    clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
    text-align:left; cursor:pointer; position:relative;
  }
  .node-card:active{ transform:scale(0.985); border-color:var(--phosphor); }
  .node-type-tag{ font-family:'Nanum Myeongjo',serif; font-size:9.5px; letter-spacing:0.2em; color:var(--corrode); text-transform:uppercase; margin-bottom:5px; }
  .node-card h3{ margin:0 0 5px; font-size:16.5px; }
  .node-card p{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--muted); margin:0; line-height:1.6;}
  .node-card-cta{ position:absolute; right:15px; bottom:9px; font-family:'Nanum Myeongjo',serif; font-size:10px; color:var(--brass); letter-spacing:0.12em; }

  /* ---------- CLASS SELECT / RANK ASSIGN ---------- */
  .class-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:340px; margin:0 auto; }
  .class-card{
    min-width:0;
    border:1px solid var(--brass-dim); border-radius:0; padding:12px 10px; text-align:center;
    background:linear-gradient(180deg, rgba(22,34,37,0.6), rgba(5,9,11,0.62));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(184,147,79,0.07);
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    cursor:pointer;
  }
  .class-card.sel{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 18px rgba(127,191,174,0.16), 0 0 14px rgba(127,191,174,0.3); background:linear-gradient(180deg, rgba(38,60,58,0.7), rgba(8,16,16,0.7)); }
  .class-name{ font-family:'Nanum Myeongjo',serif; font-size:12.5px; font-weight:600; margin-bottom:2px; color:var(--bone); }
  .class-tagline{ font-size:9.5px; color:var(--corrode); margin-bottom:6px; letter-spacing:0.06em; }
  .class-blurb{ font-family:'Nanum Myeongjo',serif; font-size:10.5px; color:var(--muted); line-height:1.5; }

  .rank-slots{ display:flex; gap:6px; width:100%; max-width:340px; margin:0 auto; }
  .rank-slot{ flex:1; min-width:0; border:1px solid var(--brass-dim); border-radius:0; padding:8px 4px; text-align:center; min-height:90px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; background:rgba(12,20,22,0.5); box-shadow: inset 0 0 12px rgba(0,0,0,0.6); }
  .rank-slot.filled{ border-style:solid; }
  .rank-slot.empty{ border-style:dashed; }
  .rank-slot.droppable{ border-color:var(--phosphor); box-shadow: inset 0 0 12px rgba(127,191,174,0.14), 0 0 10px rgba(127,191,174,0.3); }
  .rank-slot.bad{ border-color:var(--crack); box-shadow: inset 0 0 14px rgba(217,69,47,0.16); }
  .reach-legend{
    font-family:'Nanum Myeongjo',serif; font-size:11.5px; line-height:1.65;
    color:var(--muted); text-align:center; max-width:320px; word-break:keep-all;
  }
  .reach-legend b{ color:var(--brass); font-weight:600; }
  .rank-slot-label{ font-family:'Nanum Myeongjo',serif; font-size:8.5px; color:var(--brass); letter-spacing:0.16em; margin-bottom:2px; }
  .rank-slot-name{ font-size:10px; line-height:1.2; }
  .rank-slot-hint{ font-family:'Nanum Myeongjo',serif; font-size:10px; color:var(--muted); font-style:italic; }

  .hero-tray{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; max-width:340px; margin:0 auto; min-height:30px; }
  .tray-chip{ border:1px solid var(--brass-dim); border-radius:2px; padding:6px 14px; font-size:11.5px; background:rgba(12,20,22,0.55); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5); cursor:pointer; }
  .tray-chip.armed{ border-color:var(--phosphor); background:rgba(38,60,58,0.7); box-shadow:0 0 10px rgba(127,191,174,0.34); }
  .setup-btn-row{ display:flex; gap:10px; }

  /* ---------- BATTLE ---------- */
  .battle-screen{ flex:1; min-height:0; display:flex; flex-direction:column;}
  .enemy-zone{
    flex-shrink:0;
    padding:10px 14px 6px; display:flex; flex-direction:column; align-items:center; gap:6px;
    border-bottom:1px solid rgba(141,122,176,0.18);
    box-shadow:0 1px 0 rgba(0,0,0,0.6);
  }
  .foe-row{ display:flex; gap:6px; justify-content:center; width:100%; }
  /* 1~4마리가 들어오므로 폭은 균등 분배하고 최소폭만 지킨다 */
  .foe-card{
    flex:1 1 0; min-width:0; max-width:158px;
    border:1px solid rgba(141,122,176,0.34); border-radius:0; padding:7px 5px;
    text-align:center; position:relative;
    background:linear-gradient(180deg, rgba(26,18,32,0.55), rgba(5,7,10,0.42));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 22px rgba(0,0,0,0.55);
  }
  .foe-card.targetable{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 20px rgba(127,191,174,0.14), 0 0 15px rgba(127,191,174,0.45); animation:targetPulse 1.2s ease-in-out infinite; cursor:pointer; }
  .foe-card.elite-foe{ border-color:var(--brass); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 22px rgba(184,147,79,0.1), 0 0 14px rgba(184,147,79,0.24); }
  .foe-card.elite-foe .enemy-portrait{ transform:scale(1.1); }
  .foe-card.boss-foe{ flex:1.5 1 0; max-width:200px; padding:12px 8px; }
  .foe-card.boss-foe .foe-name{ font-size:14px; }
  .foe-card.boss-foe .enemy-portrait.tier-mid{ width:80px; height:80px; }
  .foe-card.boss-awakened{ border-color:var(--blood-lit); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 26px rgba(143,32,40,0.28), 0 0 26px rgba(196,56,60,0.5); }
  .foe-card.boss-awakened .enemy-portrait{ animation-duration:1.5s; }
  .foe-card.boss-awakened .foe-rank{ color:var(--blood-lit); }
  .foe-name{ font-family:'Nanum Myeongjo',serif; font-size:12px; color:var(--corrode); margin:3px 0 5px; font-weight:600; letter-spacing:0.02em; text-shadow:0 1px 2px rgba(0,0,0,0.8); }
  /* 3마리 이상이면 칸이 좁아지므로 글자를 줄인다 */
  .foe-row.many .foe-name{ font-size:10px; margin:2px 0 4px; }
  .foe-row.many .intent-badge{ font-size:8.5px; padding:2px 5px 2px 4px; gap:3px; margin-top:4px; }
  .foe-row.many .foe-rank{ font-size:7.5px; letter-spacing:0.08em; }
  .foe-row.many .hero-num{ font-size:7.5px; min-width:20px; }
  /* 4~5마리는 정말 좁다 — 초상과 배지를 한 번 더 줄인다 */
  .foe-row.crowded{ gap:4px; }
  .foe-row.crowded .foe-card{ padding:6px 3px; }
  .foe-row.crowded .enemy-portrait{ width:40px; height:40px; }
  .foe-row.crowded .foe-name{ font-size:9px; line-height:1.25; }
  .foe-row.crowded .intent-badge{ font-size:8px; padding:1px 4px 1px 3px; gap:2px; }
  .foe-row.crowded .reach-chip{ font-size:6.5px; padding:0 2px; }
  .foe-dead{ font-family:'Nanum Myeongjo',serif; font-size:11px; color:var(--muted); margin-top:6px; font-style:italic; }
  .foe-rank{ font-family:'Nanum Myeongjo',serif; font-size:8.5px; color:var(--brass); letter-spacing:0.18em; margin-bottom:2px; }

  /* 성유물 메달 — 실루엣 아이콘을 깎아먹지 않도록 클립 대신 원형 감실로 담는다 */
  .enemy-portrait{ width:48px;height:48px; display:flex; align-items:center; justify-content:center; position:relative; margin:0 auto; border-radius:50%; }
  .enemy-portrait.tier-surface{
    background:radial-gradient(circle at 38% 30%, rgba(141,122,176,0.34), rgba(6,4,11,0.92) 74%);
    box-shadow: inset 0 0 0 1px rgba(141,122,176,0.42), inset 0 0 15px rgba(0,0,0,0.75);
    color:#d3c5e8;
    animation:eldritchPulse 4.2s ease-in-out infinite;
  }
  .enemy-portrait.tier-mid{
    width:54px;height:54px;
    background:radial-gradient(circle at 38% 30%, rgba(156,53,80,0.36), rgba(6,3,5,0.94) 74%);
    box-shadow: inset 0 0 0 1px rgba(156,53,80,0.48), inset 0 0 15px rgba(0,0,0,0.75);
    color:#f0c8d3;
    animation:eldritchPulseDeep 3s ease-in-out infinite;
  }
  /* 실루엣이 잘려나가도 살아남도록 glow 를 drop-shadow 로 — 물속에서 스스로 발광하는 느낌 */
  @keyframes eldritchPulse{
    0%,100%{ filter:brightness(1) saturate(1) drop-shadow(0 0 7px rgba(141,122,176,0.4)); }
    50%{ filter:brightness(1.14) saturate(1.28) drop-shadow(0 0 15px rgba(141,122,176,0.62)); }
  }
  @keyframes eldritchPulseDeep{
    0%,100%{ filter:brightness(1) saturate(1) drop-shadow(0 0 8px rgba(156,53,80,0.45)); }
    50%{ filter:brightness(1.16) saturate(1.3) drop-shadow(0 0 18px rgba(196,56,60,0.6)); }
  }

  .hpbar{ height:9px; border-radius:1px; background:#0c0910; border:1px solid rgba(0,0,0,0.65); box-shadow: inset 0 1px 2px rgba(0,0,0,0.85), 0 0 0 1px rgba(141,122,176,0.2); overflow:hidden;}
  .hpbar .fill{ height:100%; background:linear-gradient(90deg,#3f2b56,var(--corrode)); transition:width 0.4s; }
  .intent-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink);
    background:linear-gradient(180deg, rgba(141,122,176,0.15), rgba(141,122,176,0.04));
    border:1px solid rgba(141,122,176,0.28);
    padding:3px 9px 3px 7px; border-radius:2px; margin-top:5px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  .intent-badge .ic{ display:flex; align-items:center; color:var(--corrode); }
  .foe-card.boss-awakened .intent-badge{ border-color:rgba(196,56,60,0.42); background:linear-gradient(180deg, rgba(143,32,40,0.22), rgba(143,32,40,0.05)); }
  .foe-card.boss-awakened .intent-badge .ic{ color:var(--blood-lit); }

  .party-zone{
    flex-shrink:0;
    display:flex; gap:5px; padding:10px 8px; overflow-x:auto;
    border-bottom:1px solid rgba(184,147,79,0.15);
    box-shadow:0 1px 0 rgba(0,0,0,0.55);
  }
  .hero-card{
    flex:1; min-width:0;
    border:1px solid var(--brass-dim); border-radius:0;
    padding:7px 5px; text-align:center; position:relative;
    background:linear-gradient(180deg, rgba(22,34,37,0.6), rgba(5,9,11,0.4));
  }
  /* 직군 정체성은 카드 상단 각인선으로만 — 색은 아끼고 형태로 구분한다 */
  .hero-card.cls-vanguard{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(125,156,178,0.5); }
  .hero-card.cls-chemist{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(138,171,124,0.5); }
  .hero-card.cls-priest{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(217,208,189,0.45); }
  .hero-card.cls-oracle{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(132,120,182,0.5); }
  .hero-card.cls-hellion{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(196,56,60,0.5); }
  .hero-card.cls-robber{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(138,171,124,0.45); }
  .hero-card.cls-jester{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 2px 0 rgba(141,122,176,0.5); }
  /* 피는 계급을 가리지 않는다 — 아군 체력은 전부 같은 동맥색 */
  .hero-card .hpbar .fill{ background:linear-gradient(90deg,#4f1119,#a8262c); box-shadow:0 0 6px rgba(168,38,44,0.35); }
  .hero-card.collapsed{ border-color:var(--crack); }
  /* 정신 함몰 표식 — 소용돌이 */
  .hero-card.collapsed::before{
    content:''; position:absolute; top:3px; right:4px; width:11px; height:11px;
    background:no-repeat center/contain var(--px-spiral);
    image-rendering:pixelated;
  }
  .hero-card.empty{ opacity:0.22; border-style:dashed; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); }
  .hero-card.targetable{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 18px rgba(127,191,174,0.13), 0 0 15px rgba(127,191,174,0.45); animation:targetPulse 1.2s ease-in-out infinite; cursor:pointer; }

  .portrait{ width:41px;height:41px; margin:0 auto 3px; display:flex; align-items:center; justify-content:center; position:relative; }
  .portrait-vanguard{
    border-radius:50%;
    background:radial-gradient(circle at 35% 28%, rgba(125,156,178,0.42), rgba(6,11,15,0.94));
    border:1px solid rgba(125,156,178,0.5);
    color:#c3d6e4;
    box-shadow:0 0 10px rgba(125,156,178,0.26), inset 0 0 9px rgba(0,0,0,0.6);
  }
  .portrait-chemist{
    border-radius:42% 58% 54% 46% / 46% 40% 60% 54%;
    background:radial-gradient(circle at 35% 28%, rgba(138,171,124,0.42), rgba(6,14,9,0.94));
    border:1px solid rgba(138,171,124,0.5);
    color:#cbdcc0;
    box-shadow:0 0 10px rgba(138,171,124,0.24), inset 0 0 9px rgba(0,0,0,0.6);
  }
  .portrait-priest{
    clip-path: polygon(50% 0%, 100% 35%, 85% 100%, 15% 100%, 0% 35%);
    background:radial-gradient(circle at 35% 24%, rgba(217,208,189,0.36), rgba(11,10,9,0.94));
    border:1px solid rgba(217,208,189,0.45);
    color:#e6dfd0;
    filter:drop-shadow(0 0 7px rgba(217,208,189,0.2));
  }
  /* 육각 아스트롤라베 — 마름모보다 도상을 덜 잘라먹는다 */
  .portrait-oracle{
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:radial-gradient(circle at 35% 28%, rgba(132,120,182,0.42), rgba(8,5,14,0.94));
    border:1px solid rgba(132,120,182,0.5);
    color:#d3cbec;
    filter:drop-shadow(0 0 8px rgba(132,120,182,0.28));
  }

  /* 나중에 합류하는 셋 — 팔각(광기), 마름모(도둑), 종(악사) */
  .portrait-hellion{
    clip-path: polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
    background:radial-gradient(circle at 35% 26%, rgba(196,56,60,0.4), rgba(16,6,7,0.94));
    border:1px solid rgba(196,56,60,0.5);
    color:#e6b9b4;
    filter:drop-shadow(0 0 8px rgba(196,56,60,0.28));
  }
  .portrait-robber{
    clip-path: polygon(50% 3%, 97% 50%, 50% 97%, 3% 50%);
    background:radial-gradient(circle at 35% 26%, rgba(138,171,124,0.34), rgba(8,12,10,0.94));
    border:1px solid rgba(138,171,124,0.45);
    color:#c2d2b8;
    filter:drop-shadow(0 0 7px rgba(138,171,124,0.22));
  }
  .portrait-jester{
    border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 35% 26%, rgba(141,122,176,0.42), rgba(10,7,16,0.94));
    border:1px solid rgba(141,122,176,0.5);
    color:#cfc5e4;
    box-shadow:0 0 10px rgba(141,122,176,0.24), inset 0 0 9px rgba(0,0,0,0.6);
  }

  .hero-rank{ font-family:'Nanum Myeongjo',serif; font-size:8.5px; color:var(--brass); letter-spacing:0.18em; margin-bottom:2px;}
  .hero-name{ font-size:10.5px; font-weight:600; margin-bottom:4px; line-height:1.15; color:var(--ink);}
  .hero-hpline{ display:flex; align-items:center; gap:4px; margin-bottom:4px; }
  .hero-hpline .hpbar{ flex:1; height:7px; }
  .hero-num{ font-size:8.5px; color:var(--muted); min-width:24px; }
  .dp-gauge{ position:relative; width:34px; height:34px; margin:2px auto 0; }
  .dp-ring{ width:100%; height:100%; border-radius:50%; }
  .dp-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9.5px; font-family:monospace; color:var(--ink);
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
  }
  /* 방어 = 놋쇠로 덧댄 판금 */
  .block-tag{
    position:absolute; bottom:3px; left:3px;
    display:inline-flex; align-items:center; gap:2px;
    font-family:monospace; font-size:8.5px; color:#c6d8e4;
    background:rgba(14,24,31,0.85); border:1px solid rgba(125,156,178,0.42); border-radius:1px; padding:0 4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
  }

  /* ---------- 중앙 무대: 적과 아군 사이, 상황이 읽히는 자리 ---------- */
  .mid-stage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 14px; }
  .log-plate{
    width:100%; max-width:340px; padding:11px 16px; text-align:center;
    font-family:'Nanum Myeongjo',serif; font-size:13.5px; line-height:1.65;
    color:var(--ink);
    background:linear-gradient(180deg, rgba(9,16,19,0.88), rgba(4,8,10,0.8));
    border-top:1px solid rgba(184,147,79,0.34);
    border-bottom:1px solid rgba(184,147,79,0.34);
    box-shadow:0 0 30px rgba(0,0,0,0.7), inset 0 0 22px rgba(0,0,0,0.5);
    text-shadow:0 1px 3px rgba(0,0,0,0.95);
  }
  .log-plate .l{ display:block; }
  .log-plate .l.old{ opacity:0.42; font-size:11.5px; }
  /* 최근에 실제로 처리된 결과는 마지막 줄에 남기고, 한 단계 더 밝게 읽힌다. */
  .log-plate .l.latest{ color:#f1ead9; font-weight:700; text-shadow:1px 1px 0 #000,0 0 7px rgba(224,170,76,0.22); }
  .log-plate.targeting{
    color:var(--phosphor); letter-spacing:0.02em;
    border-color:rgba(127,191,174,0.5);
    box-shadow:0 0 30px rgba(127,191,174,0.18), inset 0 0 22px rgba(0,0,0,0.5);
  }
  .zone-label{ font-family:'Nanum Myeongjo',serif; font-size:8px; letter-spacing:0.3em; color:var(--muted); text-transform:uppercase; }

  /* ---------- 파티클 레이어 ----------
     전투 화면은 매 행동마다 innerHTML 로 다시 그려지므로, 파티클은 카드 안이 아니라
     다시 그려지지 않는 별도 레이어(#fx)에 절대좌표로 뿌린다. 끝나면 스스로 제거된다. */
  #fx{ position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .p{ position:absolute; pointer-events:none; will-change:transform,opacity; }

  /* 파편 — 피격 지점에서 방사형으로 튄다 */
  .p-shard{
    width:2px; height:9px; border-radius:1px; background:currentColor;
    box-shadow:0 0 5px currentColor;
    animation:shardFly var(--d,520ms) cubic-bezier(.12,.72,.3,1) forwards;
  }
  @keyframes shardFly{
    from{ transform:translate(-50%,-50%) rotate(var(--a)) translateY(6px) scaleY(0.5); opacity:1; }
    to  { transform:translate(-50%,-50%) rotate(var(--a)) translateY(var(--r,44px)) scaleY(1.6); opacity:0; }
  }

  /* 고리 — 흘려막기 / 시전 */
  .p-ring{
    border-radius:50%; border:1.5px solid currentColor;
    box-shadow:0 0 10px currentColor, inset 0 0 8px currentColor;
    animation:ringOut var(--d,460ms) ease-out forwards;
  }
  @keyframes ringOut{
    from{ transform:translate(-50%,-50%) scale(0.22); opacity:0.95; }
    to  { transform:translate(-50%,-50%) scale(1.5);  opacity:0; }
  }

  /* 잔상 — 회피 */
  .p-wisp{
    width:20px; height:3px; border-radius:3px;
    background:linear-gradient(90deg, transparent, currentColor);
    animation:wispSlip var(--d,520ms) cubic-bezier(.1,.8,.3,1) forwards;
  }
  @keyframes wispSlip{
    from{ transform:translate(-50%,-50%) translateX(0) scaleX(0.4); opacity:0.95; }
    to  { transform:translate(-50%,-50%) translateX(var(--dx,28px)) scaleX(1.3); opacity:0; }
  }

  /* 베기 궤적 — 반격 */
  .p-slash{
    width:58px; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, currentColor 45%, #fff 52%, currentColor 60%, transparent);
    box-shadow:0 0 8px currentColor;
    animation:slashSweep 320ms ease-out forwards;
  }
  @keyframes slashSweep{
    from{ transform:translate(-50%,-50%) rotate(var(--a)) scaleX(0.1); opacity:0; }
    35% { opacity:1; }
    to  { transform:translate(-50%,-50%) rotate(var(--a)) scaleX(1.3); opacity:0; }
  }

  /* 기포 — 소멸 (물속이니 물거품으로 흩어진다) */
  .p-bub{
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%, rgba(236,244,240,0.6), rgba(150,195,185,0.05));
    border:1px solid rgba(206,228,220,0.35);
    animation:bubUp var(--d,900ms) ease-out forwards;
  }
  @keyframes bubUp{
    from{ transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    18% { opacity:0.9; }
    to  { transform:translate(calc(-50% + var(--dx,0px)), calc(-50% - var(--dy,64px))) scale(1.05); opacity:0; }
  }

  /* 인광 티끌 — 회복 / 진정 */
  .p-mote{
    border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor;
    animation:moteUp var(--d,760ms) ease-out forwards;
  }
  @keyframes moteUp{
    from{ transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    22% { opacity:1; }
    to  { transform:translate(calc(-50% + var(--dx,0px)), calc(-50% - var(--dy,34px))) scale(0.3); opacity:0; }
  }

  /* 피격 흔들림 — 카드 자체를 짧게 턴다 */
  .hit-shake{ animation:hitShake 240ms cubic-bezier(.36,.07,.19,.97); }
  @keyframes hitShake{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-3px); }
    38%{ transform:translateX(3px); }
    58%{ transform:translateX(-2px); }
    80%{ transform:translateX(1px); }
  }

  @media (prefers-reduced-motion: reduce){
    #fx{ display:none; }
    .hit-shake{ animation:none !important; }
  }

  /* ---------- 사거리 / 피격 반응 표식 ---------- */
  .reach-chip{
    display:inline-block; font-family:'Nanum Myeongjo',serif;
    font-size:7.5px; letter-spacing:0.08em; padding:0 4px; border-radius:1px;
    border:1px solid currentColor; opacity:0.9; vertical-align:middle;
  }
  .reach-melee{ color:#d0895e; }
  .reach-mid{ color:#c2a75f; }
  .reach-ranged{ color:#8ab2c6; }
  .react-tag{
    position:absolute; top:2px; left:2px; z-index:2;
    display:inline-flex; align-items:center; gap:2px;
    font-size:8px; padding:1px 4px 1px 2px; border-radius:1px;
    background:rgba(3,6,9,0.92); border:1px solid currentColor;
    animation:reactPop 0.35s ease-out;
  }
  .react-dodge{ color:#8fd4c4; }
  .react-guard{ color:#9fc0d8; }
  .react-riposte{ color:var(--blood-lit); }
  @keyframes reactPop{ from{ transform:translateY(4px) scale(0.8); opacity:0; } to{ transform:none; opacity:1; } }
  /* 자리를 잘못 잡아 아무것도 못 하는 상태 */
  .rank-warn{ font-family:'Nanum Myeongjo',serif; font-size:7.5px; letter-spacing:0.06em; color:var(--crack); margin-top:2px; }
  .hero-card.idle .portrait, .foe-card.idle .enemy-portrait{ filter:grayscale(0.65) brightness(0.72); }

  .hand-zone{ flex-shrink:0; padding:6px 8px 10px; }
  .ap-row{ display:flex; justify-content:center; align-items:center; gap:9px; margin-bottom:8px;}
  .ap-label{ font-family:'Nanum Myeongjo',serif; font-size:9.5px; letter-spacing:0.2em; color:var(--brass); text-transform:uppercase; }
  /* AP = 등잔 기름 방울 */
  .pip{ width:12px;height:12px; border:1px solid var(--brass-dim); background:rgba(0,0,0,0.45); border-radius:50% 50% 50% 0; transform:rotate(-45deg); }
  .pip.filled{ background:radial-gradient(circle at 38% 32%, #f3d189, #b0752a); border-color:var(--gaslamp); box-shadow:0 0 9px rgba(224,170,76,0.5); }
  /* 좌·상단 여백은 밀랍 봉인이 스크롤 컨테이너에 잘리지 않게 하려는 것 */
  .hand-row{ display:flex; gap:9px; overflow-x:auto; padding:11px 10px 8px; scroll-snap-type:x proximity; }
  /* 손패 = 밀랍 봉인된 낡은 양피 카드 */
  .card{
    scroll-snap-align:start;
    flex:0 0 124px; height:178px;
    border-radius:0; border:1px solid var(--brass-dim);
    padding:9px 8px; position:relative;
    background:
      repeating-linear-gradient(51deg, rgba(224,206,170,0.022) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, rgba(30,40,40,0.9), rgba(6,10,12,0.95));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(184,147,79,0.085), inset 0 -24px 26px rgba(0,0,0,0.42);
    display:flex; flex-direction:column;
    transition:transform 0.15s;
  }
  .card.owner-vanguard{ border-top:3px solid var(--steel); }
  .card.owner-chemist{ border-top:3px solid var(--toxin); }
  .card.owner-priest{ border-top:3px solid var(--bone); }
  .card.owner-oracle{ border-top:3px solid var(--indigo); }
  .card.owner-neutral{ border-top:3px solid var(--brass); }
  .card:active{ transform:translateY(-4px); }
  .card.unplayable{ opacity:0.52; filter:grayscale(0.6); }
  .card.unplayable .card-name, .card.unplayable .card-cost{ opacity:0.72; }
  .card.contaminated{
    border-color:var(--corrode);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 24px rgba(141,122,176,0.18), 0 0 12px rgba(141,122,176,0.22);
  }
  .card.selecting{ border-color:var(--phosphor); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 22px rgba(127,191,174,0.14), 0 0 16px rgba(127,191,174,0.5); transform:translateY(-4px); }
  /* 비용 = 밀랍 봉인 */
  .card-cost{
    position:absolute; top:-8px; left:-8px; width:23px;height:23px;
    border-radius:52% 48% 47% 53% / 50% 53% 47% 50%;
    background:radial-gradient(circle at 34% 30%, #b8323a, #6b141b 72%);
    border:1px solid rgba(224,170,76,0.55); color:#f2e6cf;
    font-family:monospace; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,0.85), inset 0 1px 2px rgba(255,192,172,0.26);
    text-shadow:0 1px 1px rgba(0,0,0,0.7);
  }
  .card-name{ font-size:11px; font-weight:600; margin-top:9px; line-height:1.25; min-height:26px; color:var(--bone);}
  .card-name.glitch{ color:var(--corrode); letter-spacing:0.02em;}
  /* 이름과 효과 사이 각인 구획선 */
  .card-desc{
    font-size:9.5px; color:var(--muted); line-height:1.4; flex:1; margin-top:5px; padding-top:5px;
    border-top:1px solid rgba(184,147,79,0.16);
  }
  .card-desc.glitch{ color:rgba(141,122,176,0.75); }
  .card-owner-tag{ font-family:'Nanum Myeongjo',serif; font-size:7.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; margin-top:auto;}
  /* 에픽은 표기만 남기고, 일반 카드의 크기·정렬·AP 봉인 규칙을 그대로 쓴다. */
  .card.epic{ border-color:#f2ca63; }
  .card.legendary{ border-color:#b98ae4; }

  .end-turn-row{ display:flex; justify-content:center; padding-top:2px;}

  /* ---------- REST / AFTERMATH ---------- */
  .rest-screen{ padding:22px 18px; justify-content:center; align-items:center; gap:12px; text-align:center; overflow-y:auto;}
  .af-flavor{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--muted); line-height:1.7; max-width:300px; margin:0 0 2px; font-style:italic; }
  .rest-opts{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; }
  .rest-opt{
    border:1px solid var(--brass-dim); border-radius:0; padding:12px 14px; text-align:left;
    background:linear-gradient(180deg, rgba(22,34,37,0.55), rgba(5,9,11,0.55));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(184,147,79,0.07);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    cursor:pointer;
  }
  .rest-opt.sel{ border-color:var(--phosphor); background:linear-gradient(180deg, rgba(38,60,58,0.7), rgba(8,16,16,0.7)); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 20px rgba(127,191,174,0.14); }
  .rest-opt .t{ font-size:13px; font-weight:600; margin-bottom:3px; color:var(--bone);}
  .rest-opt .d{ font-size:11px; color:var(--muted); }
  .rest-party-status{ width:100%; max-width:300px; text-align:left; border:1px solid var(--brass-dim); padding:8px; background:rgba(8,14,16,0.58); box-shadow:inset 0 0 12px rgba(0,0,0,0.44); }
  .rest-party-title{ color:var(--gaslamp); font-size:10px; letter-spacing:0.08em; margin:0 0 6px; }
  .rest-party-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
  .rest-party-member{ min-width:0; padding:5px 6px; border:1px solid rgba(184,147,79,0.38); background:rgba(22,32,34,0.44); }
  .rest-party-member.dead{ opacity:0.52; border-color:rgba(139,51,52,0.62); }
  .rest-party-name{ color:var(--ink); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rest-party-meta{ margin-top:2px; color:var(--muted); font-family:monospace; font-size:8.5px; white-space:nowrap; }
  .rest-party-meta .dp{ color:var(--phosphor); }
  .rest-party-member.dead .dp{ color:var(--blood); }

  .af-list{ display:flex; flex-direction:column; gap:6px; width:100%; max-width:300px; max-height:230px; overflow-y:auto; padding:2px; touch-action:pan-y; }
  .card-reward-grid{ width:100%; max-width:350px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .card.reward-card{ min-width:0; width:auto; flex:auto; height:170px; padding:8px 6px; cursor:pointer; }
  .card.reward-card:hover{ transform:translateY(-3px); border-color:var(--gaslamp); }
  .card.reward-card .card-name{ margin-top:8px; min-height:30px; }
  .card.reward-card .card-desc{ font-size:9px; line-height:1.4; }
  .draw-swap{ position:absolute; z-index:20; inset:0; padding:18px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; overflow-y:auto; background:rgba(2,7,9,0.90); border:1px solid rgba(224,170,76,0.44); }
  .draw-swap-title{ color:var(--gaslamp); font-size:14px; text-align:center; }
  .draw-swap-copy{ max-width:300px; color:var(--muted); font-size:11px; text-align:center; line-height:1.55; }
  .draw-swap-card{ transform:scale(0.9); margin:-8px 0; pointer-events:none; }
  .draw-replace-list{ width:100%; max-width:310px; display:flex; flex-direction:column; gap:5px; }
  .draw-replace-row{ border:1px solid var(--brass-dim); padding:8px 10px; color:var(--bone); background:rgba(15,26,28,0.78); cursor:pointer; text-align:left; }
  .draw-replace-row:hover{ border-color:var(--blood-lit); background:rgba(70,23,27,0.58); }
  .af-row{ border:1px solid var(--brass-dim); border-radius:0; padding:9px 12px; display:flex; justify-content:space-between; align-items:center; background:rgba(12,20,22,0.5); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.45); cursor:pointer; text-align:left; user-select:none; -webkit-user-select:none; }
  .af-row.sel{ border-color:var(--phosphor); background:rgba(34,54,52,0.7); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.45), inset 0 0 16px rgba(127,191,174,0.14); }
  .af-row.locked{ opacity:0.42; cursor:not-allowed; }
  .af-row.unavailable{ opacity:0.42; cursor:not-allowed; }
  .af-row-name{ font-size:12px; color:var(--ink); }
  .af-row-owner{ font-size:9.5px; color:var(--muted); white-space:nowrap; margin-left:8px; }
  .af-empty{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--muted); font-style:italic; }
  .af-hint{ font-family:'Nanum Myeongjo',serif; font-size:12.5px; color:var(--muted); font-style:italic; }
  .upgrade-preview{ width:100%; max-width:300px; border:1px solid var(--phosphor); padding:9px 11px; text-align:left; background:rgba(18,42,40,0.42); box-shadow:inset 0 0 16px rgba(127,191,174,0.12); }
  .upgrade-preview-title{ color:var(--bone); font-size:12px; margin-bottom:4px; }
  .upgrade-preview-line{ color:var(--muted); font-size:10px; line-height:1.6; }
  .upgrade-preview-line b{ color:var(--gaslamp); font-weight:normal; }
  .upgrade-guide-overlay{
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:18px; background:rgba(2,5,7,0.78);
  }
  .upgrade-guide-panel{
    width:100%; max-width:310px; padding:16px; border:1px solid var(--gaslamp);
    background:#101719; box-shadow:inset 1px 1px 0 rgba(232,196,121,0.24),inset -1px -1px 0 #000,0 0 0 1px #000;
    text-align:left;
  }
  .upgrade-guide-panel h3{ margin:0 0 8px; color:var(--bone); font-size:14px; }
  .upgrade-guide-panel p{ margin:0 0 8px; color:var(--ink); font-size:11px; line-height:1.7; word-break:keep-all; }
  .upgrade-guide-panel .btn{ display:block; margin:12px auto 0; }
  .fusion-inspect{ width:100%; max-width:300px; display:flex; flex-direction:column; gap:5px; }
  .card-inspect{ border:1px solid rgba(184,147,79,0.68); padding:7px 9px; text-align:left; background:rgba(20,25,26,0.70); box-shadow:inset 0 0 12px rgba(184,147,79,0.08); }
  .card-inspect.epic{ border-color:#f2ca63; background:rgba(58,38,42,0.68); }
  .card-inspect.legendary{ border-color:#b98ae4; background:rgba(41,29,59,0.68); }
  .card-inspect-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; color:var(--bone); font-size:11px; }
  .card-inspect-meta{ color:var(--gaslamp); font-size:9px; white-space:nowrap; }
  .card-inspect-effect{ margin-top:2px; color:var(--muted); font-size:10px; line-height:1.5; }

  .reveal-stage{ width:100%; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .reveal-banner{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--gaslamp); letter-spacing:0.14em; text-shadow:0 0 12px rgba(224,170,76,0.4); animation:revealBannerPulse 1s steps(2,end) infinite; }
  .reveal-card-wrap{ position:relative; display:flex; justify-content:center; padding:6px 0 4px; }
  .card.reveal-card{ flex:0 0 156px; height:198px; border-color:var(--gaslamp); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6),inset 0 0 26px rgba(224,170,76,0.14),0 0 24px rgba(224,170,76,0.4); transform:scale(1.05); }
  .reveal-upgrade .card.reveal-card{ animation:upgradeReveal 720ms steps(7,end) both; }
  .reveal-fusion .card.reveal-card{ animation:fusionReveal 900ms steps(8,end) both; }
  @keyframes revealBannerPulse{ 0%,100%{ opacity:0.68; transform:translateY(0); } 50%{ opacity:1; transform:translateY(-1px); } }
  @keyframes upgradeReveal{ 0%{ opacity:0; transform:scale(0.74) rotate(-2deg); filter:brightness(2.4); } 58%{ opacity:1; transform:scale(1.12) rotate(1deg); filter:brightness(1.45); } 100%{ opacity:1; transform:scale(1.05); filter:brightness(1); } }
  @keyframes fusionReveal{ 0%{ opacity:0; transform:scale(0.42) rotate(-9deg); filter:brightness(2.2); } 52%{ opacity:1; transform:scale(1.15) rotate(3deg); filter:brightness(1.65); } 100%{ opacity:1; transform:scale(1.05); filter:brightness(1); } }
  .card.reveal-card .card-name{ font-size:13px; }
  .card.reveal-card .card-desc{ font-size:10.5px; }

  /* 유물 = 성유물함 */
  .relic-card{
    border:1px solid var(--brass); border-radius:0; padding:16px 22px 18px;
    background:linear-gradient(180deg, rgba(184,147,79,0.13), rgba(10,17,19,0.55));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(184,147,79,0.11), 0 0 22px rgba(184,147,79,0.22);
    clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 11px, 100% calc(100% - 11px), calc(100% - 11px) 100%, 11px 100%, 0 calc(100% - 11px), 0 11px);
    max-width:280px; text-align:center;
  }
  .relic-glyph{ display:flex; justify-content:center; color:var(--gaslamp); filter:drop-shadow(0 0 10px rgba(224,170,76,0.55)); margin-bottom:6px; }
  .relic-name{ font-family:'Nanum Myeongjo',serif; font-size:14px; color:var(--brass); margin-bottom:6px; letter-spacing:0.03em; }
  .relic-desc{ font-family:'Nanum Myeongjo',serif; font-size:12.5px; color:var(--muted); line-height:1.65; font-style:italic; }
  .relic-boon{ font-size:11px; color:var(--phosphor); letter-spacing:0.04em; line-height:1.5; margin-bottom:6px; }
  /* 유물 원화는 한 장의 제단화에 모여 있다. 좌표만 달리해 각 유물의 초상으로 쓴다. */
  .relic-portrait{
    display:inline-block; width:36px; height:36px; flex:0 0 36px;
    background-image:url('assets/유물.png'); background-repeat:no-repeat;
    background-size:768px auto; background-position:var(--relic-x) var(--relic-y);
    image-rendering:auto;
  }
  /* 작은 칩은 원화 중앙을 잘라 아이콘처럼 쓰고, 획득 화면은 원형 액자 전체가
     보이도록 별도의 스프라이트 좌표와 넉넉한 캔버스를 쓴다. */
  .relic-portrait.large{ width:88px; height:88px; flex-basis:88px; }
  /* 잠식 아래 선반은 시야를 가리지 않도록 기존 25px의 절반 크기로 둔다. */
  .relic-portrait.compact{ width:13px; height:13px; flex-basis:13px; background-size:269px auto; }
  .relic-glyph .relic-portrait{ margin:0; }
  .relic-tier{
    display:inline-block; margin-left:auto; padding:2px 4px; border:1px solid currentColor;
    font-family:'Galmuri9','Nanum Myeongjo',serif !important; font-size:8px; line-height:1;
    letter-spacing:0.04em;
  }
  .tier-common{ color:#c6bba3; }.tier-uncommon{ color:#9ebd72; }.tier-rare{ color:#79b4d9; }
  .tier-very-rare{ color:#bd8bd5; }.tier-legendary{ color:#e29a45; }

  /* 첫 하강 — 설명을 읽고 넘기는 대신 실제 전투판에서 한 수씩 익힌다. */
  .prologue-screen{ padding:24px 18px; justify-content:center; align-items:center; text-align:center; gap:13px; overflow-y:auto; }
  /* 사망 연출은 프롤로그·일반 패배 모두 하나의 심연 테마를 공유한다. */
  .prologue-fall-screen,.result-screen.lose{
    isolation:isolate;
    background:linear-gradient(rgba(14,4,7,0.25),rgba(10,3,5,0.42)),url('assets/failed.png') center 100%/auto 130% no-repeat;
  }
  .prologue-fall-screen::before,.result-screen.lose::before{ content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,rgba(8,2,4,0.025),rgba(8,2,4,0.28)); }
  .prologue-fall-screen > *,.result-screen.lose > *{ position:relative; z-index:1; }
  .prologue-fall-screen .title-crest,.result-screen.lose .title-crest{ display:none; }
  .prologue-copy{ max-width:330px; color:var(--muted); font-size:12px; line-height:1.8; word-break:keep-all; }
  .prologue-panel{
    width:100%; max-width:350px; margin:2px auto 0; padding:8px 10px; text-align:left;
    border:1px solid rgba(224,170,76,0.62); background:#111416;
    box-shadow:inset 1px 1px 0 rgba(224,170,76,0.16), inset -1px -1px 0 #000;
  }
  .prologue-panel .tier-tag{ color:var(--gaslamp); margin-bottom:3px; }
  .prologue-panel p{ margin:0; color:var(--ink); font-size:10px; line-height:1.6; word-break:keep-all; }
  .prologue-fallen{ width:100%; max-width:340px; display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
  .prologue-fallen .hero-card{ min-height:112px; }
  .prologue-scroll-box{
    width:100%; max-width:340px; height:min(48vh,360px); overflow:hidden; position:relative;
    border-top:1px solid rgba(184,147,79,0.35); border-bottom:1px solid rgba(184,147,79,0.35);
    background:linear-gradient(180deg,#071014 0%,rgba(7,16,20,0.14) 18%,rgba(7,16,20,0.14) 82%,#071014 100%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 84%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 84%,transparent 100%);
  }
  .prologue-crawl{
    /* 첫 문장이 하단 가장자리에서 나타나 심해처럼 위로 떠오른다. */
    position:absolute; left:0; right:0; top:calc(100% - 56px); padding:0 18px; text-align:left;
    animation:prologueCrawl 33s linear infinite;
  }
  .prologue-crawl p{ margin:0 0 28px; color:#d6d0c2; font-size:13px; line-height:2; word-break:keep-all; text-shadow:1px 1px 0 #000; }
  .prologue-crawl p.em{ color:var(--gaslamp); animation:prologueEmphasis 1.35s steps(2,end) infinite; }
  /* 첫 행은 즉시 하단에 보이고, 끝 행까지 지나간 뒤 다시 아래에서 시작한다. */
  @keyframes prologueCrawl{ from{transform:translateY(0);} to{transform:translateY(-160%);} }
  @keyframes prologueEmphasis{ 0%,100%{ color:var(--gaslamp); text-shadow:1px 1px 0 #000,0 0 0 transparent; } 50%{ color:#fff0c7; text-shadow:1px 1px 0 #000,0 0 8px rgba(224,170,76,0.75); } }
  .btn.prologue-proceed{ animation:prologueProceed 1s steps(2,end) infinite; }
  @keyframes prologueProceed{ 0%,100%{ border-color:#e0aa4c; box-shadow:inset 1px 1px 0 #e8c479,inset -1px -1px 0 #5c4826,0 0 0 transparent; } 50%{ border-color:#fff0c7; box-shadow:inset 1px 1px 0 #fff0c7,inset -1px -1px 0 #5c4826,0 0 12px rgba(224,170,76,0.68); } }
  /* 튜토리얼에서 지금 눌러야 할 카드·표적·버튼. 보상이나 위험 요소와 혼동되지 않게 금빛 한 색만 쓴다. */
  .tutorial-pulse{ animation:tutorialPulse 0.9s steps(2,end) infinite !important; position:relative; z-index:2; }
  @keyframes tutorialPulse{ 0%,100%{ border-color:#e0aa4c; box-shadow:0 0 0 1px rgba(224,170,76,0.20),inset 1px 1px 0 rgba(232,196,121,0.35); } 50%{ border-color:#fff0c7; box-shadow:0 0 0 2px rgba(224,170,76,0.72),0 0 14px rgba(224,170,76,0.56),inset 1px 1px 0 #fff0c7; } }
  @media (prefers-reduced-motion: reduce){ .prologue-crawl p.em,.btn.prologue-proceed,.tutorial-pulse{ animation:none !important; } }
  @media (prefers-reduced-motion: reduce){ .prologue-scroll-box{ height:auto; max-height:48vh; overflow-y:auto; -webkit-mask-image:none; mask-image:none; }.prologue-crawl{ position:static; animation:none; padding:18px; } }

  /* ---------- ESCAPE / 인양 ---------- */
  .escape-screen{
    padding:26px 18px; justify-content:center; align-items:center; text-align:center; gap:12px; overflow-y:auto;
    isolation:isolate; background:linear-gradient(rgba(4,10,13,0.27),rgba(4,10,13,0.40)),url('assets/escape.png') center/cover no-repeat;
  }
  .escape-screen::before{ content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,rgba(5,14,18,0.04),rgba(5,11,13,0.26)); }
  .escape-screen > *{ position:relative; z-index:1; }
  /* 이전 마크업이 남아 있어도 인양 완료 제목 위의 문양은 표시하지 않는다. */
  .escape-screen .title-glyph{ display:none; }
  .escape-note{
    font-family:'Nanum Myeongjo',serif; font-size:11.5px; color:var(--muted);
    line-height:1.7; max-width:300px; font-style:italic;
  }
  .escape-growth{ width:100%; max-width:330px; padding:8px 10px; border:1px solid rgba(127,191,174,0.48); background:rgba(10,27,28,0.64); box-shadow:inset 0 0 14px rgba(127,191,174,0.08); }
  .escape-growth-title{ color:var(--phosphor); font-size:10px; letter-spacing:0.06em; margin-bottom:4px; }
  .escape-growth-row{ display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-top:1px solid rgba(127,191,174,0.14); color:var(--bone); font-size:10px; }
  .escape-growth-row small{ color:var(--muted); font-size:9px; text-align:right; }
  .relic-offer{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:330px; }
  .relic-opt{
    min-width:0; border:1px solid var(--brass-dim); border-radius:0; padding:11px 13px; text-align:left; cursor:pointer;
    background:linear-gradient(180deg, rgba(184,147,79,0.09), rgba(10,17,19,0.5));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .relic-opt:active{ border-color:var(--gaslamp); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), 0 0 16px rgba(224,170,76,0.3); }
  .relic-opt.slot-locked{ opacity:0.48; cursor:not-allowed; border-style:dashed; }
  .relic-slot-lock{ margin-top:5px; color:var(--blood); font-size:9px; }
  .relic-opt-head{
    display:flex; align-items:center; gap:7px; margin-bottom:5px;
    font-family:'Nanum Myeongjo',serif; font-size:12.5px; color:var(--brass);
  }
  .relic-opt-head > .portrait{ flex-shrink:0; }
  .relic-opt .relic-desc{ font-size:11px; line-height:1.55; }

  /* 지니고 있는 유물 — 이름만 늘어놓는 선반 */
  .relic-tray{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:330px; }
  .relic-chip{
    display:inline-flex; align-items:center; gap:4px;
    border:1px solid var(--brass-dim); background:rgba(184,147,79,0.09);
    padding:2px 7px; font-size:9.5px; color:var(--brass); letter-spacing:0.03em;
  }
  /* 유물 보유 한도(3개)에 맞춰 상단 선반은 언제나 한 줄 3칸으로 고정한다. */
  .topbar-relics{ max-width:none; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; justify-content:stretch; margin-top:6px; }
  .topbar-relics .relic-chip{ min-width:0; font-size:8.5px; padding:1px 5px; }
  .topbar-relics .relic-chip span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 관측 표식은 소모 유물이 아니라 장기 진행 기록이다. 유물 한도와 별도의 작은 선반에 둔다. */
  .marker-tray{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; margin-top:6px; }
  .marker-chip{
    min-width:0; display:flex; align-items:center; gap:4px; padding:2px 4px;
    border:1px solid rgba(166,79,79,0.62); background:rgba(48,9,13,0.38); color:#d9b5af;
    font-size:8px; line-height:1.25;
  }
  .marker-chip img{ width:15px; height:15px; flex:0 0 15px; object-fit:contain; background:#050607; image-rendering:auto; }
  .marker-chip span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .chapter-tag{
    display:flex; align-items:center; gap:8px;
    font-family:'Nanum Myeongjo',serif; font-size:10.5px; letter-spacing:0.2em;
    color:var(--brass); text-transform:uppercase;
  }
  .chapter-step{ font-family:monospace; font-size:10px; color:var(--muted); letter-spacing:0.06em; }
  .chapter-lead{
    font-family:'Nanum Myeongjo',serif; font-size:11.5px; color:var(--muted);
    font-style:italic; line-height:1.7; max-width:300px; text-align:center;
  }
  .chapter-threat{ display:block; margin-top:3px; color:var(--blood); font-family:'GalmuriMono11',monospace; font-size:8.5px; font-style:normal; letter-spacing:0.02em; }
  .node-card.boss{ border-color:var(--blood); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 20px rgba(143,32,40,0.2); }

  /* ---------- TAVERN / 여관 ---------- */
  .tavern-screen{ padding:24px 18px; justify-content:center; align-items:center; text-align:center; gap:11px; overflow-y:auto; }
  .tavern-roster{ display:flex; flex-direction:column; gap:6px; width:100%; max-width:330px; }
  .tavern-seat{
    min-width:0; display:flex; align-items:center; gap:9px; text-align:left;
    border:1px solid var(--brass-dim); padding:7px 9px;
    background:linear-gradient(180deg, rgba(184,147,79,0.07), rgba(10,17,19,0.45));
  }
  .tavern-seat.empty{ border-style:dashed; border-color:var(--crack); opacity:0.75; }
  .tavern-seat.fresh{ border-color:var(--phosphor); box-shadow:0 0 12px rgba(127,191,174,0.22); }
  .tavern-seat-body{ flex:1; min-width:0; }
  .tavern-seat-name{ font-size:11.5px; color:var(--ink); }
  .tavern-seat-sub{ font-size:9.5px; color:var(--muted); margin-top:1px; }
  .tavern-new{ font-size:8.5px; color:var(--phosphor); letter-spacing:0.08em; }
  .btn.tavern-hire{ flex-shrink:0; padding:4px 10px; font-size:10px; }
  .tavern-unlock{
    width:100%; max-width:330px; text-align:left; padding:9px 12px;
    border:1px solid var(--gaslamp); background:linear-gradient(180deg, rgba(224,170,76,0.12), rgba(10,17,19,0.5));
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .tavern-unlock .relic-opt-head{ color:var(--gaslamp); }

  /* 젖은 명패 — 여관 안쪽 벽 */
  .plate-wall{
    width:100%; max-width:330px; text-align:left; padding:8px 11px;
    border:1px solid var(--brass-dim); border-left:3px solid var(--gaslamp);
    background:linear-gradient(180deg, rgba(184,147,79,0.09), rgba(6,12,14,0.55));
  }
  .plate-wall-head{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:0.06em; color:var(--gaslamp); text-shadow:1px 1px 0 #000;
  }
  .plate-wall-note{ font-size:9.5px; color:var(--muted); line-height:1.7; margin-top:3px; word-break:keep-all; }
  /* 아직 물이 떨어지는 명패는 인광이 돈다 */
  .relic-opt.plate-opt{ border-color:rgba(127,191,174,0.5); }
  .relic-opt.plate-opt:hover{ border-color:var(--phosphor); box-shadow:0 0 12px rgba(127,191,174,0.20); }
  .plate-story{ font-style:italic; }
  .plate-left{ color:var(--muted); margin-top:4px; }

  /* 아직 만나지 못한 병과 */
  .class-card.locked{ opacity:0.4; border-style:dashed; cursor:default; }
  .class-card.locked .portrait{ filter:grayscale(1) brightness(0.6); }
  .class-locked-tag{ font-size:9px; color:var(--muted); letter-spacing:0.14em; }

  /* ---------- RESULT / GAMEOVER ---------- */
  .result-screen{ padding:32px 22px; justify-content:center; align-items:center; text-align:center; gap:14px;}
  /* 인양·완주·실패 결과는 한눈에 읽혀야 한다. 보조 영문 라벨의 기본 11px보다 두 배 크게 쓴다. */
  #app .escape-screen > .title-en,
  #app .result-screen > .title-en,
  #app .prologue-fall-screen > .title-en{
    font-size:22px; font-weight:700; line-height:1.2; letter-spacing:1px;
    text-shadow:1px 1px 0 #000, 0 0 8px rgba(224,170,76,0.35);
  }
  /* 화면과 원화 비율이 같아도 위치 이동이 보이도록 130%로 확대해 하단에 맞춘다.
     원화의 시작점이 약 30% 위로 올라가 게임오버 문구와 겹치지 않는다. */
  .result-screen.lose .title-en{ color:var(--blood-lit); }
  .result-list{ font-size:12px; color:var(--muted); line-height:1.95; }

  /* ================================================================
     안전 영역 — 노치와 홈 인디케이터
     viewport-fit=cover 로 화면 끝까지 그리므로, 그만큼 직접 비켜 줘야 한다.
     비켜 주지 않으면 상단바가 노치에 잘리고 턴 종료 버튼이 홈 바에 깔린다.
     웹 브라우저에서는 inset 이 전부 0 이라 아무것도 달라지지 않는다.
     ================================================================ */
  :root{
    --sa-top:    env(safe-area-inset-top, 0px);
    --sa-bottom: env(safe-area-inset-bottom, 0px);
    --sa-left:   env(safe-area-inset-left, 0px);
    --sa-right:  env(safe-area-inset-right, 0px);
  }
  /* 가로 여백은 화면 전체가 진다 — 가로로 눕히면 양쪽에 노치가 온다 */
  #app{ padding-left:var(--sa-left); padding-right:var(--sa-right); }

  .topbar{ padding-top:calc(10px + var(--sa-top)); }
  .hand-zone{ padding-bottom:calc(10px + var(--sa-bottom)); }
  /* 전투가 아닌 화면들은 제 스크롤 컨테이너 안에서 비켜 준다 */
  .map-screen,.rest-screen,.result-screen,.tavern-screen,.escape-screen{
    padding-top:calc(20px + var(--sa-top));
    padding-bottom:calc(20px + var(--sa-bottom));
  }
  .title-screen{
    padding-top:calc(24px + var(--sa-top));
    padding-bottom:calc(24px + var(--sa-bottom));
  }

  ::-webkit-scrollbar{ display:none; }

  /* ================================================================
     PIXEL SKIN
     여기서부터는 앞의 동판화 규칙을 픽셀 규칙으로 덮어쓴다.
     원칙은 셋뿐이다 — 흐릿한 것을 없애고, 곡선을 계단으로 바꾸고,
     모든 치수를 정수 픽셀에 맞춘다.
     ================================================================ */

  /* ---- 글꼴 : 세리프를 비트맵으로 ----
     앞쪽 규칙들이 저마다 Cinzel·IM Fell·Spectral 을 직접 지정해 두었으므로
     한 군데만 고쳐서는 안 잡힌다. 전부 걷어낸 뒤 표제와 숫자만 되돌려 준다. */
  body,#app,#app *{
    font-family:'Galmuri11','Nanum Myeongjo',serif !important;
    letter-spacing:0; font-style:normal !important;
  }
  #app h1,#app h2,#app h3,#app .disp,#app .btn,#app .title-en,#app .title-kr,
  #app .foe-name,#app .foe-rank,#app .hero-rank,#app .node-card h3,
  #app .rest-opt .t,#app .relic-opt-head,#app .zone-label,#app .ap-label{
    font-family:'Galmuri14','Galmuri11','Nanum Myeongjo',serif !important;
  }
  #app .mono,#app .hero-num,#app .dp-num,#app .block-tag,#app .card-cost,#app .ero-num{
    font-family:'GalmuriMono11','Galmuri11',monospace !important;
  }
  .title-kr{ font-size:24px; letter-spacing:0.06em; text-shadow:2px 2px 0 #000; }
  /* 비트맵 글꼴에 그림자를 흘리면 획이 뭉갠다 — 그림자도 한 픽셀씩 각지게 */
  h1,h2,h3,.disp,.foe-name,.hero-name,.btn{ text-shadow:1px 1px 0 rgba(0,0,0,0.9); }

  /* ---- 흐림 제거 ---- */
  .beam{ filter:none; opacity:0.5; }
  .mote,.ash{ box-shadow:none; }
  .title-kr,.title-glyph span{ filter:none; }

  /* ---- 곡선을 계단으로 ---- */
  .btn,.foe-card,.hero-card,.hpbar,.intent-badge,.block-tag,.reach-chip{ border-radius:0; }
  .bubble,.mote,.ash{ border-radius:0; }        /* 물거품도 재도 네모난 픽셀 하나 */
  .ash{ width:2px; height:2px; }
  .mote{ image-rendering:pixelated; }

  /* ---- 버튼 : 그라디언트 대신 한 픽셀 베벨 ---- */
  .btn{
    background:#141a1c;
    border:1px solid var(--brass-dim);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.16), inset -1px -1px 0 rgba(0,0,0,0.8);
    padding:12px 24px;
  }
  .btn:active{ transform:translateY(1px); box-shadow: inset -1px -1px 0 rgba(224,170,76,0.12), inset 1px 1px 0 rgba(0,0,0,0.8); }
  .btn.primary{
    background:#a67c33; color:#120a05;
    border-color:#e0aa4c;
    box-shadow: inset 1px 1px 0 #e8c479, inset -1px -1px 0 #5c4826;
    text-shadow:1px 1px 0 rgba(255,240,205,0.3);
  }
  .btn.danger{ background:#2a0f12; color:var(--blood-lit); border-color:#6a2420;
    box-shadow: inset 1px 1px 0 rgba(196,56,60,0.22), inset -1px -1px 0 rgba(0,0,0,0.8); }

  /* ---- 초상 감실 : 클립패스 대신 각진 액자 ----
     비스듬히 잘라내면 대각선 가장자리가 흐려져 픽셀이 죽는다.
     대신 다키스트 던전식 사각 액자로 통일하고, 직군은 테두리 색으로만 가른다. */
  .portrait{
    width:42px; height:42px; margin:0 auto 4px;
    clip-path:none !important; border-radius:0 !important;
    background:#05080a !important; overflow:hidden;
    border:1px solid var(--brass-dim);
    box-shadow: inset 0 0 0 1px #000;
    filter:none !important;
  }
  .portrait-vanguard{ border-color:#4f6675; }
  .portrait-chemist { border-color:#54684b; }
  .portrait-priest  { border-color:#7c7666; }
  .portrait-oracle  { border-color:#544b74; }
  .portrait-hellion { border-color:#7a2a2c; }
  .portrait-robber  { border-color:#4a5c45; }
  .portrait-jester  { border-color:#4e4468; }

  /* 적 감실도 같은 규칙 — 둥근 후광 대신 젖은 석판 한 장 */
  .enemy-portrait,
  .enemy-portrait.tier-surface,
  .enemy-portrait.tier-mid{
    width:48px; height:48px; border-radius:0;
    background:#06090c;
    border:1px solid rgba(141,122,176,0.30);
    box-shadow: inset 0 0 0 1px #000;
    animation:none;
    padding:1px;
  }
  .enemy-portrait.tier-mid{ border-color:rgba(156,53,80,0.34); }
  .foe-card.elite-foe .enemy-portrait{ transform:none; border-color:var(--brass-dim); }
  .foe-card.boss-foe .enemy-portrait,
  .foe-card.boss-foe .enemy-portrait.tier-mid{ width:76px; height:76px; }
  .foe-row.crowded .enemy-portrait{ width:36px; height:36px; }
  .foe-card.boss-awakened .enemy-portrait{ border-color:var(--blood-lit); }

  /* ---- 체력 게이지 : 매끈한 띠 대신 눈금 ----
     눈금은 반드시 색 '위에' 얹어야 한다. background-image 만 새로 주면
     아래 깔려 있던 색 그라디언트를 통째로 갈아치워서 게이지가 투명해진다. */
  .hpbar{
    border-radius:0; height:9px;
    background:#0a0e12;
    border:1px solid rgba(0,0,0,0.8);
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.9), 0 0 0 1px rgba(141,122,176,0.34);
  }
  .hero-hpline .hpbar{ height:9px; }
  .hpbar .fill{
    transition:width 0.2s steps(8, end);
    background-color:#7a66a6;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.45) 0 1px, transparent 1px 4px),
      linear-gradient(90deg, #5a4780, #a894cf);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }
  /* 피는 계급을 가리지 않는다 — 아군은 동맥색, 적은 잠식의 보라 */
  .hero-card .hpbar .fill{
    background-color:#a8262c;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.45) 0 1px, transparent 1px 4px),
      linear-gradient(90deg, #6b1620, #c4383c);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
  }

  /* ---- 조준 표시 : 확대 대신 점멸 ----
     픽셀 그림을 1.035배로 늘리면 매 프레임 다른 픽셀이 뭉갠다. */
  @keyframes targetPulse{ 0%,100%{ transform:none; opacity:1; } 50%{ transform:none; opacity:0.72; } }
  .foe-card.targetable,.hero-card.targetable{
    box-shadow: inset 0 0 0 1px #000, inset 0 0 0 2px rgba(127,191,174,0.5);
    animation:targetPulse 0.9s steps(2,end) infinite;
  }

  /* ---- 파티클 : 둥근 빛망울 대신 각진 부스러기 ----
     번짐(box-shadow blur)을 걷어내고 움직임도 계단으로 끊는다.
     매끄럽게 흐르는 파티클 하나가 화면 전체의 픽셀감을 깬다. */
  .p-shard,.p-ring,.p-wisp,.p-slash,.p-bub,.p-mote{
    border-radius:0 !important; box-shadow:none !important; filter:none !important;
    image-rendering:pixelated;
  }
  .p-shard{ width:3px; height:6px; animation-timing-function:steps(7,end); }
  .p-ring{ border-width:2px; animation-timing-function:steps(6,end); }
  .p-wisp{ height:3px; background:currentColor; animation-timing-function:steps(6,end); }
  .p-slash{ height:3px; background:currentColor; animation-timing-function:steps(5,end); }
  .p-bub{ background:rgba(206,228,220,0.5); border:1px solid rgba(236,244,240,0.7);
          animation-timing-function:steps(9,end); }
  .p-mote{ animation-timing-function:steps(8,end); }

  /* ---- 피격 흔들림 : 정수 픽셀만큼만, 뚝뚝 끊어서 ---- */
  @keyframes hitShake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-3px); }
    40%{ transform:translateX(3px); }
    60%{ transform:translateX(-2px); }
    80%{ transform:translateX(2px); }
  }
  .hit-shake{ animation:hitShake 240ms steps(1,end); }

  /* ---- 스프라이트 숨쉬기 ----
     물속에 떠 있는 것들은 가만히 있지 않는다. 한 픽셀씩만 오르내린다. */
  @keyframes pxFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2px); } }
  @keyframes pxFloatSlow{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-1px); } }
  .enemy-portrait img{ animation:pxFloat 2.4s steps(2,end) infinite; }
  .foe-card:nth-child(2n) .enemy-portrait img{ animation-duration:2.9s; animation-delay:-0.7s; }
  .foe-card:nth-child(3n) .enemy-portrait img{ animation-duration:3.4s; animation-delay:-1.4s; }
  .foe-card.boss-foe .enemy-portrait img{ animation-duration:4.2s; }
  .foe-card.boss-awakened .enemy-portrait img{ animation-duration:1.4s; }
  .battle-screen .portrait img.px{ animation:pxFloatSlow 3.6s steps(2,end) infinite; }
  .foe-card[style*="opacity:0.3"] .enemy-portrait img,
  .hero-card[style*="opacity:0.35"] .portrait img.px{ animation:none; filter:grayscale(1) brightness(0.5); }

  /* ---- 주사선 + 픽셀 격자 : 화면 전체를 한 장의 낡은 브라운관으로 ---- */
  #grain{
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.13) 0 1px, transparent 1px 3px);
  }
  #grain::after{
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.85), inset 0 0 40px 14px rgba(0,0,0,0.25), inset 0 0 160px 56px rgba(0,0,0,0.22);
  }

  /* ---- 층 배경 : 매끈한 그라디언트를 디더 띠로 ----
     물속으로 내려갈수록 색이 한 단씩 뚝뚝 떨어지게 만든다. */
  #app[data-tier="surface"]{ --column-bg:
      repeating-linear-gradient(180deg,
        #16292c 0 26px, #132427 26px 52px, #0f1e21 52px 82px, #0c191c 82px 116px,
        #0a1517 116px 154px, #081113 154px 196px, #060d0f 196px 100%); }
  #app[data-tier="mid"]{ --column-bg:
      repeating-linear-gradient(180deg,
        #0d1519 0 26px, #0b1317 26px 52px, #0a1114 52px 82px, #080e11 82px 116px,
        #070c0e 116px 154px, #050a0b 154px 196px, #04080a 196px 100%); }
  #app[data-tier="abyss"]{ --column-bg:
      repeating-linear-gradient(180deg,
        #06080b 0 26px, #050709 26px 52px, #040608 52px 82px, #030405 82px 116px,
        #020304 116px 154px, #010202 154px 196px, #000000 196px 100%); }

  /* 제목 화면의 회전 궤도 — 원을 네모로 바꾸면 돌 때마다 대각선이 생겨 못 쓴다.
     돌리지 말고, 겹쳐 새긴 사각 인장으로 세워 둔다. */
  .title-glyph{
    width:96px; height:96px; border-radius:0;
    border:1px solid var(--brass-dim);
    box-shadow: inset 0 0 0 1px #000, inset 0 0 0 4px rgba(184,147,79,0.10);
  }
  .title-glyph::before{
    inset:8px; border-radius:0; animation:none;
    border:1px dashed rgba(184,147,79,0.30);
  }
  .title-glyph::after{
    inset:-5px; border-radius:0; animation:none;
    border:1px solid rgba(184,147,79,0.13);
    border-top-color:rgba(196,56,60,0.40);
    border-bottom-color:rgba(127,191,174,0.28);
  }
  .rule::after{ transform:translate(-50%,-50%); width:5px; height:5px; }

  /* ---- 타이틀 : 키 아트 위에 문장과 워드마크를 얹는다 ----
     문장과 워드마크는 검은 바탕째로 구웠다. screen 으로 합성하면 검정이 사라져
     투명 PNG 없이도 배경 위에 얹힌다 — 알파를 깎으면 어두운 놋쇠 선이 함께 날아간다. */
  .title-screen{ justify-content:center; padding:24px; gap:9px; position:relative; }
  .title-art{
    position:absolute; inset:0;
    background-size:cover; background-position:50% 20%;
    opacity:0.55; pointer-events:none; z-index:0;
    -webkit-mask-image:linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,0.25) 78%, transparent 100%);
            mask-image:linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,0.25) 78%, transparent 100%);
  }
  .title-screen > *:not(.title-art){ position:relative; z-index:1; }
  .title-wordmark{
    width:100%; max-width:318px; height:auto; display:block; margin:0 auto 2px;
    mix-blend-mode:screen;
  }
  /* 문장 — 배경이 깨끗한 결과·게임오버 화면에 세운다 */
  .title-crest{
    width:104px; height:auto; display:block; margin:0 auto;
    mix-blend-mode:screen;
  }
  .title-crest.lost{ filter:hue-rotate(-28deg) saturate(1.5) brightness(0.95); }
  .title-screen .title-en,.title-screen .title-sub{ text-shadow:1px 1px 0 #000, 0 0 9px #000; }
  .title-screen .rule{ margin:2px auto; }
  .title-screen > .title-version{
    position:absolute; right:calc(12px + var(--sa-right)); bottom:calc(10px + var(--sa-bottom)); z-index:2;
    margin:0; color:rgba(214,208,194,0.58); font-size:9px; letter-spacing:0.12em;
    text-shadow:1px 1px 0 #000;
  }
  @media (max-height:680px){
    .title-wordmark{ max-width:258px; }
    .title-crest{ width:78px; }
  }

  /* 해금 알림 — 여관에 들어서면 먼저 눈에 들어와야 한다 */
  .tavern-unlock.unlocked{
    border-color:var(--gaslamp);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.20), 0 0 0 1px #000;
  }
  .unlock-banner{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:1px; color:var(--gaslamp);
    margin-bottom:6px; text-shadow:1px 1px 0 #000;
  }

  /* 새로 건진 유물 — 지닌 것들과 갈라 보이게 */
  .relic-opt.incoming{ border-color:var(--gaslamp); box-shadow: inset 1px 1px 0 rgba(224,170,76,0.22), 0 0 0 1px #000; }
  .relic-new{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important; font-size:9px;
    color:#120a05; background:#a67c33; border:1px solid #e0aa4c;
    padding:0 4px; margin-left:4px;
  }

  /* 임시 AP — 이 턴이 지나면 사라지므로 반쯤 비쳐 보이게 둔다 */
  .pip.temp{
    opacity:0.5;
    border-style:dashed;
  }
  .pip.temp.filled{
    background:#c9964a; border-color:#e8c479;
    box-shadow: inset 1px 1px 0 rgba(232,196,121,0.5);
  }

  /* 아직 아무도 서지 않은 자리 */
  .portrait-vacant{
    border:1px dashed var(--brass-dim) !important;
    background:#070b0d !important;
  }
  .tavern-seat.empty .tavern-seat-name{ color:var(--muted); }

  /* 잠긴 직군은 회색이 아니라 그늘에 앉아 있다 */
  .class-card.locked .portrait{ filter:brightness(0.42) saturate(0.35) !important; }

  /* ---- 보스급이 남기고 간 것 ---- */
  .relic-card.drop{
    border-color:var(--gaslamp);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.2), inset -1px -1px 0 rgba(0,0,0,0.8), 0 0 0 1px #000;
  }
  .drop-banner{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:1px; color:var(--gaslamp);
    margin-bottom:6px; text-shadow:1px 1px 0 #000;
  }

  /* ---- 덱 구성 : 무엇을 들고 내려갈지 고르는 자리 ----
     손패 카드처럼 크게 펼치면 열아홉 장이 화면을 넘긴다. 한 줄짜리 표로 눕힌다. */
  .deck-sect{ width:100%; max-width:340px; margin:0 auto 10px; }
  .deck-sect-head{
    display:flex; align-items:center; gap:6px; margin-bottom:5px;
    padding-bottom:3px; border-bottom:1px solid rgba(184,147,79,0.22);
  }
  .deck-sect-name{ flex:1; color:var(--brass); font-size:11px; letter-spacing:0.02em; }
  .deck-count{
    font-family:'GalmuriMono9',monospace !important; font-size:9px;
    color:var(--muted); border:1px solid var(--brass-dim); padding:1px 4px;
  }
  .deck-count.done{ color:#120a05; background:#a67c33; border-color:#e0aa4c; }

  .pick-card{
    display:flex; align-items:stretch; gap:7px; margin-bottom:4px;
    padding:5px 7px 5px 5px; cursor:pointer;
    background:#0b1114;
    border:1px solid var(--brass-dim);
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.8);
  }
  .pick-card .pick-cost{
    flex-shrink:0; width:18px; display:flex; align-items:center; justify-content:center;
    font-family:'GalmuriMono11',monospace !important; font-size:11px;
    color:#f0e4c8; background:#7e1a22;
    border:1px solid #c9964a; box-shadow: inset 1px 1px 0 #b8323a;
  }
  .pick-body{ flex:1; min-width:0; text-align:left; }
  .pick-name{ font-size:11px; color:var(--ink); line-height:1.3; }
  .pick-desc{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; color:var(--muted); line-height:1.45; margin-top:2px; word-break:keep-all;
  }
  /* 고른 것 — 놋쇠로 덧대어 한눈에 갈라 보이게 */
  .pick-card.sel{
    background:#1a1408;
    border-color:var(--gaslamp);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.28), inset -1px -1px 0 rgba(0,0,0,0.8), 0 0 0 1px #000;
  }
  .pick-card.sel .pick-name{ color:var(--gaslamp); }
  .pick-card.epic{ border-color:#f2ca63; }
  .pick-card.legendary{ border-color:#b98ae4; }
  /* 칸이 다 찼을 때 못 고르는 것은 물러나 있게 — 막지는 않는다(고른 걸 눌러 빼면 된다) */
  .pick-card.full{ opacity:0.4; }
  .pick-card:active{ transform:translateY(1px); }

  /* ---- 등잔 기름 = AP : 방울을 각진 눈금으로 ---- */
  .pip{
    width:10px; height:14px; border-radius:0; transform:none;
    border:1px solid var(--brass-dim); background:#0a0c0d;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.8);
  }
  .pip.filled{
    background:#c9964a; border-color:#e8c479; box-shadow: inset 1px 1px 0 #e8c479, inset -1px -1px 0 #6b5530;
  }

  /* ---- 밀랍 봉인 = 비용 : 찌그러진 원 대신 각진 인장 ---- */
  .card-cost{
    border-radius:0; width:22px; height:22px; top:-7px; left:-7px;
    background:#7e1a22;
    border:1px solid #c9964a;
    box-shadow: inset 1px 1px 0 #b8323a, inset -1px -1px 0 #400c11, 1px 1px 0 rgba(0,0,0,0.9);
    text-shadow:1px 1px 0 rgba(0,0,0,0.7);
  }

  /* ---- 정신 함몰 게이지 : 원형 눈금을 계단으로 ----
     conic-gradient 는 매끈한 부채꼴이라 픽셀과 어긋난다. 여덟 칸짜리 각진 눈금으로 대신한다. */
  .dp-gauge{ width:32px; height:14px; margin:3px auto 0; }
  .dp-ring{
    width:100%; height:100%; border-radius:0 !important;
    border:1px solid rgba(206,198,181,0.18);
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.85) !important;
    background-image:
      linear-gradient(90deg, var(--dp-col) var(--dp-pct), rgba(206,198,181,0.06) var(--dp-pct)),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.6) 0 1px, transparent 1px 4px) !important;
    background-blend-mode:normal;
  }
  .dp-num{ font-size:9px; }

  /* ---- 인장 : SVG 자리를 픽셀 그림이 물려받았으니 크기 규칙도 옮긴다 ---- */
  .relic-glyph{ filter:none; }
  .relic-chip img.px{ flex-shrink:0; }
  /* 감실 없이 놓인 인장만 붙든다 — 액자 안의 초상은 제 크기(100%)를 지킨다 */
  .relic-opt-head > img.px{ flex-shrink:0; }
  .relic-opt-head > .portrait{ flex-shrink:0; }

  /* 의도 배지 도상도 마찬가지 — 칸이 좁아져도 12px 를 깎지 않는다 */
  .intent-badge .ic img.px,
  .foe-row.many .intent-badge .ic img.px,
  .foe-row.crowded .intent-badge .ic img.px{ width:12px; height:12px; flex-shrink:0; }
  /* 잔글씨 도상은 12×12 로 찍혀 있다. 9px·10px·11px 로 줄이면 정수배가 아니라서
     최근접 보간이 12줄 중 한두 줄을 통째로 버리고, 방패 외곽선이 갉아먹힌다.
     좁은 칸에서도 제 크기(12px)를 지키게 둔다. */
  .react-tag img.px{ width:12px; height:12px; flex-shrink:0; }
  .block-tag img.px{ width:12px; height:12px; flex-shrink:0; }
  .crumb-chip{
    border-radius:0; width:22px; height:22px;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.85), inset -1px -1px 0 rgba(184,147,79,0.10);
  }

  /* ================================================================
     시인성 — 비트맵 글꼴은 제 크기에서만 또렷하다
     갈무리는 7·9·11·14px 로 그려진 글꼴이다. 8.5px 나 9.5px 로 쓰면
     획이 픽셀 격자에서 반 칸 어긋나 안티에일리어싱으로 뭉갠다.
     그래서 잔글씨를 전부 설계 크기에 붙이고, 자간도 정수 픽셀로 끊는다.
     ================================================================ */

  /* --- 11px 급 : 플레이어가 실제로 읽는 잔글씨 ---
     예전엔 9px 이었다. 격자에는 맞았지만 손에 쥔 화면에서는 너무 작았다.
     비트맵 글꼴이라 10px 같은 중간값으로는 못 올리고 한 단(9→11) 통째로 올린다. */
  #app .reach-chip,#app .rank-warn,#app .foe-rank,#app .hero-rank,
  #app .class-locked-tag,#app .tavern-new,#app .tavern-seat-sub,
  #app .af-row-owner,#app .class-tagline,#app .node-type-tag,
  #app .title-en,#app .ero-label,#app .ap-label,#app .tier-tag,
  #app .rank-slot-label,#app .card-desc,#app .topbar-relics .relic-chip,
  #app .foe-row.many .foe-rank,#app .pick-desc,#app .drop-banner{
    font-family:'Galmuri11','Nanum Myeongjo',serif !important;
    font-size:11px; letter-spacing:0; line-height:1.5;
  }
  #app .card-desc{ line-height:1.55; }
  /* 상단 선반은 정보 밀도가 높아 별도로 30% 줄인다. 일반 유물 선택창은 읽기 크기를 유지한다. */
  #app .topbar-relics .relic-chip{ font-size:8px; line-height:1.35; gap:3px; padding:1px 4px; }
  /* 자간을 벌려야 읽히는 것은 대문자·기호로 된 표제뿐이다 */
  #app .title-en,#app .ero-label,#app .ap-label,#app .tier-tag,
  #app .zone-label,#app .rank-slot-label{ letter-spacing:1px; }

  /* --- 9px 급 : 읽지 않고 훑고 지나가는 장식 딱지만 (예전 7px) --- */
  #app .zone-label,#app .card-owner-tag,
  #app .foe-row.crowded .reach-chip{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:1px;
  }

  /* --- 숫자 : 고정폭도 제 크기로 --- */
  #app .hero-num,#app .dp-num,#app .foe-row.many .hero-num,#app .deck-count{
    font-family:'GalmuriMono11',monospace !important; font-size:11px; letter-spacing:0;
  }
  #app .hero-num{ min-width:32px; }

  /* --- 본문·표제도 한 단씩 --- */
  body,#app,#app *{ line-height:1.55; }
  #app .card-name,#app .hero-name,#app .foe-name,#app .pick-name,
  #app .rank-slot-name,#app .relic-name,#app .tavern-seat-name{ font-size:12px; }
  #app .class-blurb,#app .relic-desc,#app .relic-boon,#app .af-flavor,
  #app .escape-note,#app .reach-legend,#app .log-plate,#app .title-sub,
  #app .node-card p,#app .rest-opt .d,#app .result-list{ font-size:12px; line-height:1.6; }
  #app h2,#app h3,#app .node-card h3{ font-size:16px; }

  /* --- 대비 : 어두운 판 위에서 회색이 너무 가라앉아 있었다 --- */
  #app .card-desc,#app .pick-desc,#app .class-blurb,#app .relic-desc,
  #app .af-flavor,#app .escape-note,#app .reach-legend,#app .hero-num,
  #app .tavern-seat-sub,#app .af-row-owner,#app .card-owner-tag{ color:#a8a596; }
  #app .log-plate,#app .node-card p{ color:#c4bfae; }

  /* ---- 이름이 길면 두 줄이 된다 ----
     한 카드만 두 줄이 되면 그 카드의 체력바만 아래로 밀려 줄이 어그러진다.
     ('앵무조개 오징어' 처럼 긴 이름이 실제로 있다.)
     그래서 두 줄 자리를 미리 비워 두고, 짧은 이름은 그 안에서 가운데 선다. */
  #app .foe-name,#app .hero-name{
    display:flex; align-items:center; justify-content:center;
    min-height:36px; margin:3px 0 5px;
  }
  #app .foe-row.crowded .foe-name{ min-height:34px; }

  /* ---- 낮은 화면 : 전투 한 판이 세로로 다 들어가야 한다 ----
     320×568 같은 기기에서는 적·아군·손패를 합치면 화면을 넘긴다.
     아군 대열이 flex 로 짜부라져 24px 짜리 띠가 되는 사고가 여기서 났다.
     짓눌리게 두는 대신, 초상과 카드를 한 단씩 줄여 자리를 만든다.
     글씨 크기는 건드리지 않는다 — 작은 화면일수록 글씨는 커야 한다. */
  @media (max-height:680px){
    .enemy-zone{ padding:6px 8px 4px; }
    .enemy-portrait,
    .enemy-portrait.tier-surface,
    .enemy-portrait.tier-mid{ width:38px; height:38px; }
    .foe-card.boss-foe .enemy-portrait,
    .foe-card.boss-foe .enemy-portrait.tier-mid{ width:56px; height:56px; }
    .foe-row.crowded .enemy-portrait{ width:32px; height:32px; }
    #app .foe-name,#app .hero-name{ min-height:19px; margin:2px 0 3px; }
    #app .foe-row.crowded .foe-name{ min-height:19px; }

    .party-zone{ padding:6px 6px; }
    .portrait{ width:34px; height:34px; margin:0 auto 3px; }
    .dp-gauge{ width:28px; height:12px; margin:2px auto 0; }
    #app .dp-num{ font-size:9px; }

    .mid-stage{ padding:4px 10px; }
