    .hand-zone{ padding:4px 6px calc(7px + var(--sa-bottom)); }
    .energy-row,.ap-row{ margin-bottom:5px; }
    .hand-row{ padding:9px 7px 6px; gap:7px; }
    .card{ flex:0 0 112px; height:142px; padding:7px 6px; }
    .card-name{ margin-top:7px; min-height:20px; }
    #app .card-desc{ line-height:1.4; }
    .btn{ padding:9px 18px; }

    /* 턴 종료가 제 줄을 차지하면 그 한 줄 때문에 버튼이 화면 밖으로 밀린다.
       AP 줄의 빈 오른쪽에 얹어 한 줄을 통째로 돌려받는다. */
    .hand-zone{ position:relative; }
    .ap-row{ justify-content:flex-start; padding-left:4px; }
    .end-turn-row{ position:absolute; top:2px; right:8px; padding-top:0; z-index:3; }
    .end-turn-row .btn{ padding:6px 14px; }

    /* 좁은 칸에서 '중열 [중거리]' 가 두 줄로 접히면 그 카드만 아래로 밀린다 */
    #app .reach-chip{ font-size:9px; padding:0 3px; }
  }

  /* ---- 좁은 화면 : 글씨를 줄이는 대신 여백을 줄인다 ----
     손바닥만 한 화면일수록 글씨가 커야 읽힌다. 자리는 패딩에서 뺀다. */
  @media (max-width:400px){
    .map-screen{ padding:calc(14px + var(--sa-top)) 10px calc(14px + var(--sa-bottom)); gap:9px; }
    .rest-screen,.result-screen{ padding:calc(18px + var(--sa-top)) 12px calc(18px + var(--sa-bottom)); }
    .enemy-zone{ padding:8px 6px 5px; }
    .foe-row{ gap:4px; }
    .foe-card{ padding:6px 3px; }
    .party-zone{ padding:8px 5px; gap:4px; }
    .hero-card{ padding:6px 3px; }
    .hand-row{ gap:7px; padding:11px 7px 8px; }
    .deck-sect{ max-width:none; }
    .pick-card{ padding:5px 5px 5px 4px; gap:6px; }
    .topbar{ padding:calc(8px + var(--sa-top)) 10px 7px; }
    .btn{ padding:11px 16px; }
    #app .title-kr{ font-size:22px; }
  }

  /* ---- 방어 = 놋쇠로 덧댄 판금 ----
     초상 위에 겹쳐 놓이는 딱지라 반투명하면 뒤의 그림과 섞여 읽히지 않는다.
     불투명 판으로 깔고, 검은 테를 한 겹 둘러 무엇 위에 놓이든 떼어 놓는다. */
  #app .block-tag{
    display:inline-flex; align-items:center; gap:3px;
    bottom:2px; left:2px; padding:1px 4px 1px 3px;
    font-family:'GalmuriMono11',monospace !important;
    font-size:11px; letter-spacing:0; line-height:1;
    color:#f0e4c8;
    background:#0e1a20;
    border:1px solid var(--brass);
    box-shadow: 0 0 0 1px #000, inset 1px 1px 0 rgba(224,170,76,0.22);
    text-shadow:1px 1px 0 #000;
  }

  /* ---- 피격 반응 표식 : 같은 이유로 불투명하게 ---- */
  /* 카드 안쪽 맨 위에 얹으면 열 표시("전열/중열/후열")를 덮는다.
     테두리 위로 반 칸 올려 걸어 두면 둘 다 읽힌다. */
  #app .react-tag{
    top:-7px; left:2px;
    gap:3px; padding:1px 4px 1px 3px; line-height:1;
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:0;
    background:#05090c;
    box-shadow: 0 0 0 1px #000;
    text-shadow:1px 1px 0 #000;
    animation:reactPop 0.35s steps(3,end);
  }
  /* 색이 곧 뜻이다 — 회피/흘림/반격을 글자만이 아니라 색으로도 가른다 */
  .react-dodge{ color:#a8e6d6; }
  .react-guard{ color:#bcd8ee; }
  .react-riposte{ color:#e0605c; }

  /* 의도 배지도 8.5~10.5px 를 오가고 있었다 — 전부 9px 로 붙인다 */
  #app .intent-badge,
  #app .foe-row.many .intent-badge,
  #app .foe-row.crowded .intent-badge{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:0; gap:4px; line-height:1.35;
    padding:3px 6px 3px 5px;
  }
  /* 글자를 키운 만큼 좁은 칸에서 넘칠 여지가 생긴다.
     줄이는 대신 접히게 둔다 — 읽을 수 있어야 배지다. */
  #app .foe-row.many .intent-badge,
  #app .foe-row.crowded .intent-badge{
    flex-wrap:wrap; justify-content:center; max-width:100%;
    gap:2px 3px; padding:2px 4px;
  }

  /* 앞의 감축 규칙은 .enemy-portrait 를 세웠지만, 이제 숨쉬는 건 그 안의 스프라이트다 */
  @media (prefers-reduced-motion: reduce){
    .enemy-portrait img,.portrait img.px,
    .p-shard,.p-ring,.p-wisp,.p-slash,.p-bub,.p-mote,
    .reveal-banner,.card.reveal-card{ animation:none !important; }
  }
</style>

<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ ICONS ============
     모티프는 셋뿐이다 — 잠수 장비(놋쇠·리벳), 이단 성물(십자·봉인),
     심연의 기관(눈·아가리·촉수). 전부 아래 픽셀 엔진으로 찍는다. */

  /* ============ PIXEL ART ENGINE ============
     이 게임의 도상은 전부 손으로 찍은 픽셀맵이다. 한 글자가 한 픽셀이고,
     '.' 은 비워 둔다. 팔레트는 젖은 석재·놋쇠·피·부식 보라·심해 인광 다섯 계열로만 묶어
     스무 마리가 넘는 괴물이 한 판화에서 찍혀 나온 것처럼 보이게 한다. */
  const PX_PAL = {
    '.':null,
    /* 젖은 석재 — 어두운 쪽에서 밝은 쪽으로 */
    '0':'#04070a', '1':'#0b1216', '2':'#16232a', '3':'#26383f',
    '4':'#3a5158', '5':'#55707a', '6':'#7f9aa1', '7':'#a8bfc2',
    /* 변색된 놋쇠 · 가스등 */
    'b':'#2e2210', 'B':'#5c4826', 'Y':'#8f7038', 'G':'#c9964a', 'g':'#e8c479',
    /* 피 */
    'r':'#26090e', 'R':'#5e161d', 'E':'#96232a', 'F':'#c4383c',
    /* 부식 보라 — 이단과 잠식의 색 */
    'p':'#1c1528', 'P':'#372a4c', 'V':'#5c4a7d', 'W':'#8d7ab0',
    /* 심해 생물발광 */
    'c':'#0e211f', 'C':'#255049', 'L':'#4f8f80', 'M':'#7fbfae',
    /* 뼈 · 상아 · 낡은 종이 */
    'n':'#6e6759', 'N':'#a89f8b', 'i':'#d9d0bd',
    /* 젖은 가죽 · 밧줄 */
    'o':'#2a1d16', 'O':'#4a3226', 'u':'#6b4a35',
    /* 쇠붙이와 그늘 */
    'x':'#15181a', 'X':'#33393b', 'z':'#5a6266',
  };

  /* 오른쪽 여백까지 세어가며 찍으면 손이 먼저 지친다 — 짧은 줄은 알아서 채운다. */
  function pxPad(rows){
    let w = 0;
    rows.forEach(r=>{ if(r.length > w) w = r.length; });
    return {w:w, h:rows.length, rows:rows.map(r=> r + '.'.repeat(w - r.length))};
  }

  const PX_CACHE = {};   /* 이름 → data URL */
  const PX_DIM   = {};   /* 이름 → {w,h} — 세로로 긴 놈을 짓눌러 그리지 않기 위해 */

  /* 픽셀맵을 1픽셀=1셀 짜리 PNG 로 굽는다. 확대는 CSS 의 image-rendering:pixelated 가 맡는다. */
  function pxURL(name){
    if(PX_CACHE[name]) return PX_CACHE[name];
    const sp = PX_SPRITES[name];
    if(!sp) return '';
    const m = pxPad(sp.rows);
    const cv = document.createElement('canvas');
    cv.width = m.w; cv.height = m.h;
    const ctx = cv.getContext('2d');
    const table = sp.pal ? Object.assign({}, PX_PAL, sp.pal) : PX_PAL;
    for(let y=0; y<m.h; y++){
      const row = m.rows[y];
      for(let x=0; x<m.w; x++){
        const col = table[row[x]];
        if(!col) continue;          /* '.' 과 미등록 문자는 그대로 비운다 */
        ctx.fillStyle = col;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    PX_DIM[name] = {w:m.w, h:m.h};
    PX_CACHE[name] = cv.toDataURL('image/png');
    return PX_CACHE[name];
  }

  /* 스프라이트 등록소 — 이름 하나로 어디서든 꺼내 쓴다. */
  const PX_SPRITES = {};
  function pxDef(name, rows, pal){ PX_SPRITES[name] = {rows:rows, pal:pal}; }

  /* size 를 한 변으로 하는 정사각 틀에 비율을 지켜 앉힌다. */
  function pxImg(name, size, cls){
    const url = pxURL(name);
    if(!url) return '';
    const d = PX_DIM[name];
    const k = size / Math.max(d.w, d.h);
    return '<img class="px'+(cls?' '+cls:'')+'" src="'+url+'" alt="" draggable="false"'
         + ' style="width:'+Math.round(d.w*k)+'px;height:'+Math.round(d.h*k)+'px">';
  }

  /* 감실을 가득 채운다 — 크기는 CSS 가 정하게 두고 비율만 지킨다. */
  function pxFill(name, cls){
    const url = pxURL(name);
    if(!url) return '';
    return '<img class="px'+(cls?' '+cls:'')+'" src="'+url+'" alt="" draggable="false"'
         + ' style="width:100%;height:100%;object-fit:contain;display:block;">';
  }

  /* 외부 에셋 초상도 기존 픽셀 초상과 같은 틀에 넣는다. */
  function assetIcon(src, cls){
    return '<img class="px'+(cls?' '+cls:'')+'" src="'+src+'" alt="" draggable="false"'
         + ' style="width:100%;height:100%;object-fit:cover;display:block;">';
  }

  /* ============ 사거리 ============
     다키스트던전식 — 서 있는 열이 곧 화력이다.
       from : 이 병과가 공격을 시작할 수 있는 "자기 열"
       hits : 그때 닿을 수 있는 "상대 열"
     근접이 후열로 밀려나면 from 을 벗어나 전열을 때릴 수 없고,
     원거리가 전열로 끌려나오면 조준할 자리가 없어 무력해진다. */
  const REACH = {
    melee:  {id:'melee',  label:'근접',   from:[0,1],   hits:[0,1],
             note:'전열·중열에서만 휘두를 수 있다'},
    mid:    {id:'mid',    label:'중거리', from:[0,1,2], hits:[0,1,2],
             note:'후미(심부)에서는 손이 닿지 않는다'},
    ranged: {id:'ranged', label:'원거리', from:[1,2,3,4], hits:[0,1,2,3,4],
             note:'전열에 서면 조준할 자리가 없다'},
  };
  function reachOf(unit){ return REACH[unit && unit.reach] || REACH.mid; }
  function canActFrom(unit, rank){ return reachOf(unit).from.indexOf(rank) >= 0; }
  function canHitRank(unit, rank){ return reachOf(unit).hits.indexOf(rank) >= 0; }

  /* 피격 반응 성향 — 앞에 설수록 받아치고, 뒤에 설수록 비껴난다 */
  const REACT = {
    melee:  {dodge:0.08, guard:0.24, riposte:0.30, rip:5},
    mid:    {dodge:0.15, guard:0.15, riposte:0.14, rip:3},
    ranged: {dodge:0.24, guard:0.07, riposte:0.05, rip:2},
  };
  /* 개체별 reactMod 가 있으면 그것이 사거리 기본값을 덮어쓴다 (갑각은 잘 흘리고, 해파리는 잘 피한다) */
  function reactOf(unit){
    const base = (unit && unit.reactMod) || REACT[unit && unit.reach] || REACT.mid;
    if(!unit || !unit.isHero) return base;
    /* 유물은 아군에게만 붙는다 — 적은 언제나 맨몸의 기본값으로 판정한다 */
    const veteranReact = unit.descentReact || 0;
    return {
      dodge:   Math.min(0.60, base.dodge   + relicSum('dodge', unit) + veteranReact),
      guard:   Math.min(0.70, base.guard   + relicSum('guard', unit) + veteranReact),
      riposte: Math.min(0.70, base.riposte + relicSum('riposte', unit)),
      rip:     base.rip + relicSum('rip', unit),
    };
  }

     window.FOA_STORAGE = { get(k), set(k,v), remove(k) } 를 심어 두면 그쪽을 쓴다.

     쓰기가 통째로 막힌 곳(사파리 비공개 모드 등)에서는 메모리에만 들고 있는다 —
     그 판에서는 정상으로 굴러가고, 앱을 닫으면 사라진다. */
  const Store = (function(){
    const native = (typeof window !== 'undefined') && window.FOA_STORAGE;
    if(native && typeof native.get === 'function' && typeof native.set === 'function'){
      return Object.assign({ kind:'native', ok:true }, native);
    }
    const mem = {};
    let ok = true;
    return {
      kind:'local',
      get ok(){ return ok; },
      get(k){
        try{ const v = localStorage.getItem(k); if(v !== null) return v; }catch(e){ ok = false; }
        return (k in mem) ? mem[k] : null;
      },
      set(k, v){
        mem[k] = v;
        try{ localStorage.setItem(k, v); return true; }
        catch(e){ ok = false; return false; }
      },
      remove(k){
        delete mem[k];
        try{ localStorage.removeItem(k); }catch(e){ ok = false; }
      },
    };

    if(chapter().tier==='끝없는 심연'){
      if(step >= chapter().length-2) return weighted([[72,'battle'],[28,'elite']]);
      return weighted([[58,'battle'],[42,'elite']]);

    if(step >= chapter().length-2) return canOfferRest() ? weighted([[55,'battle'],[27,'rest'],[18,'treasure']]) : weighted([[72,'battle'],[28,'treasure']]);

  }

  function rollChoices(){

    const last = S.mapVisited[S.mapVisited.length-1];
    /* 보스급 보상과 정화를 마친 직후에는 다음 길을 흔들지 않는다. 반드시 숨을 고른다.
       수문장은 구역을 끝내므로 이 지점에 다시 돌아오지 않는다. */
    if(last && last.type==='elite' && canOfferRest()) return [makeNode('rest')];
    if(step >= chapter().length-1) return [makeNode('boss')];
    const count = 1 + Math.floor(Math.random()*3);
    const kinds = [];
    const seen = new Set();
    for(let i=0; i<count; i++){
      let kind = rollNodeKind(step);
      /* 표층은 조우만 허용한다. 그 밖의 층에서는 중복을 줄이되, 후보가 모자라면 허용한다. */
      if(chapter().tier!=='표층'){
        for(let tries=0; tries<8 && seen.has(kind); tries++) kind = rollNodeKind(step);
      }
      kinds.push(kind); seen.add(kind);
    }
    return kinds.map(makeNode);
  }

  const RELIC_TIER_LABEL = {common:'일반',uncommon:'고급',rare:'희귀','very-rare':'매우 희귀',legendary:'전설'};

  function relicPortrait(r, large, compact){
    const pos = (large ? RELIC_ART_LARGE_POS : RELIC_ART_POS)[r.art] || (large ? [-132,-14] : [-156,-37]);
    /* 상단 유물 선반은 아이콘과 스프라이트 좌표를 함께 절반으로 축소한다. */

  /* 기본 유물함은 셋. 슬롯 유물을 지니면 한 칸이 더 열려 넷째까지 담을 수 있다. */
  const RELIC_CAP = 3;
  function ownedRelics(){ return (S && S.relics) || []; }
  function relicCap(relics){
    const list = relics || ownedRelics();
    return RELIC_CAP + list.reduce((total, r)=>total + ((r.effect && r.effect.relicSlots) || 0), 0);
  }
  function canAddRelic(relic){
    const next = ownedRelics().concat(relic);
    return next.length <= relicCap(next);
  }
  function canReplaceRelic(drop, incoming){
    const next = ownedRelics().filter(r=>r!==drop).concat(incoming);
    return next.length <= relicCap(next);
  }
  /* unit 을 넘기지 않으면 파티 전체에 걸리는 값(잠식·드로우·AP)을 묻는 것이다.
     적을 넘기면 언제나 빈손 — 유물은 적에게 붙지 않는다. */
  function relicApplies(r, unit){
    if(unit && !unit.isHero) return false;
    if(r.scope==='all') return true;
    if(!unit) return false;
    return unit.cls===r.scope || unit.reach===r.scope;
  }
  function relicSum(key, unit){
    let v = 0;
    ownedRelics().forEach(r=>{ if(r.effect[key]!=null && relicApplies(r, unit)) v += r.effect[key]; });
    return v;
  }
  function relicMul(key, unit){
    let v = 1;
    ownedRelics().forEach(r=>{ if(r.effect[key]!=null && relicApplies(r, unit)) v *= r.effect[key]; });
    return v;
  }
  /* 최대 체력은 판정 때마다 더하면 회복량이 꼬인다 — 주울 때 한 번만 몸에 새긴다 */
  function grantRelic(relic){
    S.relics.push(relic);
    if(relic.effect.maxHp){
      S.party.forEach(p=>{
        if(!p || !p.alive || !relicApplies(relic, p)) return;
        p.maxHp += relic.effect.maxHp;
        p.hp    += relic.effect.maxHp;
      });
    }
  }
  /* 내려놓을 때는 몸에 새긴 값을 되돌린다 — 최대 체력을 그대로 두면 유물을 돌려가며
     체력만 불릴 수 있다. 현재 체력은 새 최대치를 넘지 않게 깎는다. */
  function revokeRelic(relic){
    const at = S.relics.indexOf(relic);
    if(at < 0) return;
    S.relics.splice(at, 1);
    if(relic.effect.maxHp){
      S.party.forEach(p=>{
        if(!p || !relicApplies(relic, p)) return;
        p.maxHp = Math.max(1, p.maxHp - relic.effect.maxHp);
        p.hp    = Math.min(p.hp, p.maxHp);
      });
    }
  }

  /* 유물이 들어올 때 반드시 이 문을 지난다. 자리가 없으면 고르는 화면으로 보낸다.
     화면을 가로챘으면 true — 부른 쪽은 제 화면 전환을 접어야 한다. */
  function offerRelic(relic, back){
    if(!relic) return false;
    if(canAddRelic(relic)){ grantRelic(relic); return false; }
    S.relicSwap = { incoming: relic, back: back || S.screen };
    S.screen = 'relicSwap';
    return true;
  }

  /* 새로 합류한 사람도 이미 챙긴 유물의 몫을 받는다 — 몸에 새기는 값이라 합류 시점에 한 번 얹는다 */
  function applyRelicMaxHp(hero){
    ownedRelics().forEach(r=>{
      if(!r.effect.maxHp || !relicApplies(r, hero)) return;
      hero.maxHp += r.effect.maxHp;
      hero.hp    += r.effect.maxHp;

  /* 보스급은 제 몫을 남기고 죽는다.
     '보스급' 의 기준은 정화 기회를 두 번 주는 그 기준(정예·보스)을 그대로 쓴다.
     이미 챙긴 것은 후보에서 빠지고, 열한 점을 다 모았으면 더 나오지 않는다. */
  function isBossTier(node){ return !!node && (node.type==='elite' || node.boss); }
  function dropRelic(){

  const RELIC_TIER_WEIGHT = {common:46, uncommon:30, rare:16, 'very-rare':6, legendary:2};
  function weightedRelicPick(pool){
    if(!pool.length) return null;
    let roll = Math.random() * pool.reduce((sum,r)=>sum+(RELIC_TIER_WEIGHT[r.tier]||1), 0);
    for(const relic of pool){
      roll -= RELIC_TIER_WEIGHT[relic.tier]||1;
      if(roll < 0) return relic;
    }
    return pool[pool.length-1];
  }
  function relicOffer(){
    const owned = ownedRelics().map(r=>r.id);
    const pool = RELIC_POOL.filter(r=>owned.indexOf(r.id)<0).slice();
    const offer=[];
    while(pool.length && offer.length<3){
      const relic = weightedRelicPick(pool);
      offer.push(relic);
      pool.splice(pool.indexOf(relic),1);
    }
    return offer;
  }

  const EXTRACTION_REACT_PER_DESCENT = 0.005;
  function rewardExtractionSurvivors(hpMultiplier, finalAbyss){

      const hpGain = hero.maxHp - beforeHp;
      const reactGain = EXTRACTION_REACT_PER_DESCENT * descent;
      hero.descentWins = (hero.descentWins || 0) + 1;
      hero.descentHp = (hero.descentHp || 0) + hpGain;
      hero.descentReact = (hero.descentReact || 0) + reactGain;
      hero.hp += hpGain;
      return {name:hero.name, descent:hero.descentWins, hpGain, hpMultiplier, finalAbyss:!!finalAbyss, reactPct:Math.round(reactGain*1000)/10};

  function buildRunDeck(selectedClassIds, picks){

    selectedClassIds.forEach(cid=>addPicked(deck, CARD_DB[cid], (picks&&picks[cid])||[], 'starter'));

  }
  function starterDeckCards(){
    const ids = Array.isArray(S.starterDeckCardIds) ? S.starterDeckCardIds : [];

  /* 이전 버전 저장은 시작 덱 ID가 없으므로, 당시 선택 기록으로 한 번만 복구한다. */
  function restoreStarterDeckIds(data){
    if(Array.isArray(data.starterDeckCardIds)) return;
    const picks = (data.setup&&data.setup.picks)||{};
    const chosen = new Set();
    Object.keys(picks).forEach(owner=>(picks[owner]||[]).forEach(name=>chosen.add(`${owner}|${String(name).replace(/\++$/, '')}`)));
    data.starterDeckCardIds = (data.runDeck||[])
      .filter(c=>chosen.has(`${c.owner}|${String(c.baseName||c.name||'').replace(/\++$/, '')}`))

  function startNeutralOffer(){
    const escape = CARD_DB.neutral.find(c=>c.type==='emergency_escape');
    const normal = CARD_DB.neutral.filter(c=>c.type!=='emergency_escape');
    const offer = shuffle(normal).slice(0, NEUTRAL_OFFER_SIZE-1);
    if(offer.length && Math.random() < START_EPIC_OFFER_CHANCE){
      offer[Math.floor(Math.random()*offer.length)] = pickOne(START_EPIC_CARD_POOL);
    }
    if(escape) offer.push(escape);
    return shuffle(offer).map(c=>c.name);
  }
  /* 여관에서 새로 합류한 사람 몫 — 제 카드 한 장을 무작위로 쥐고 합류한다. */
  function randomPicks(list, n){
    return shuffle(list.slice()).slice(0,n).map(c=>c.name);
  }

  /* ============ TAVERN ============

     새로 온 사람의 카드가 그 자리에 들어온다 — 쓸 사람이 없는 카드로 손패가 막히지 않도록. */
  /* 채울 수 있는 자리 — 쓰러진 자리와, 처음부터 비어 있던 자리 둘 다.
     넷을 짜고 셋만 데리고 내려가므로 네 번째 칸은 늘 null 로 남는다.
     예전에는 이 칸이 후보에서 빠져, 인양해서 사람을 해금해도 앉힐 데가 없었다. */
  function openSlots(){
    const out = [];
    S.party.forEach((p,i)=>{ if(!p || !p.alive) out.push(i); });
    return out;
  }
  function recruitCandidates(){
    const inParty = S.party.filter(p=>p && p.alive).map(p=>p.cls);
    return unlockedClassIds().filter(id=>inParty.indexOf(id)<0).map(id=>CLASS_DEFS[id]);
  }
  function recruitInto(slotIdx, classId){
    const fallen = S.party[slotIdx];
    if(fallen && fallen.alive) return null;     /* 살아 있는 사람은 밀어낼 수 없다 */
    if(!isUnlocked(classId)) return null;

    const hero = makeHero(classId);
    applyRelicMaxHp(hero);
    S.party[slotIdx] = hero;

    /* 쓰러진 사람의 카드는 함께 빠진다. 빈 칸이었다면 뺄 것이 없다 */
    if(fallen) S.runDeck = S.runDeck.filter(c=>c.owner!==fallen.cls);
    const picked = randomPicks(CARD_DB[classId], RECRUIT_PICKS_PER_CLASS);
    S.setup.picks[classId] = picked;
    const added = addPickedToRunDeck(CARD_DB[classId], picked, 'recruit');
    S.logMsg = added.length ? `${CLASS_DEFS[classId].name}이(가) ${picked.join(' · ')}을(를) 들고 합류했다.` : `${CLASS_DEFS[classId].name}은(는) 합류했지만, 덱이 가득 차 카드는 맡기지 못했다.`;
    return hero;
  }

  /* ============ 저장 ============
     런 하나를 통째로 넣어 둔다. 다만 적이 들고 있는 icon 은 base64 이미지 통짜라
     그대로 담으면 저장소가 금방 찬다 — 이름만 남기고 불러올 때 다시 붙인다.
     전투 중에는 저장하지 않는다. 조준 중이던 카드나 파티클 같은 순간 상태까지
     되살리려면 복잡해지고, 실패하면 런 전체를 잃는다.
     전투에서 나가면 그 노드 입구부터 다시 시작한다. */
  const RUN_KEY = 'fathom.run.v1';
  const UPGRADE_GUIDE_KEY = 'fathom.upgrade-guide.v1';
  const SAFE_SCREENS = ['map','rest','aftermath','escape','tavern','relicSwap'];
  function hasSeenUpgradeGuide(){ return Store.get(UPGRADE_GUIDE_KEY)==='1'; }
  function markUpgradeGuideSeen(){ Store.set(UPGRADE_GUIDE_KEY, '1'); }

  function foeIconByName(name){
    const all = FOE_SURFACE.concat(FOE_ELITES, FOE_ENDLESS, [FOE_BOSS, FOE_ENDLESS_BOSS]);
    const hit = all.find(f=>f.name===name);
    return hit ? hit.icon : null;
  }
  function saveRun(){
    if(!S || SAFE_SCREENS.indexOf(S.screen) < 0) return;
    try{
      /* icon 은 적 초상, ic 는 예고 행동 도상 — 둘 다 base64 이미지 통짜다.
         이름과 타입만 남기고 불러올 때 다시 붙인다. */
      const json = JSON.stringify(S, (k,v)=> (k==='icon' || k==='ic') ? undefined : v);
      Store.set(RUN_KEY, json);
    }catch(e){}
  }
  function hasSavedRun(){ return !!Store.get(RUN_KEY); }
  function clearRun(){ Store.remove(RUN_KEY); }
  function loadRun(){
    try{
      const raw = Store.get(RUN_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!data || SAFE_SCREENS.indexOf(data.screen) < 0) return false;
      /* 저장할 때 떼어낸 초상을 이름으로 다시 붙인다 */
      if(data.battle && data.battle.enemies){
        data.battle.enemies.forEach(en=>{
          en.icon = foeIconByName(en.name);
          /* 예고 행동은 다음 전투가 시작될 때 어차피 새로 뽑는다 —
             전투 중에는 저장하지 않으므로 여기서는 비워 두면 된다 */
          en.intent = null;
        });
      }
      restoreStarterDeckIds(data);
      S = data;
      return true;
    }catch(e){ return false; }
  }
  /* '새로운 탐색' 은 해금까지 지운다 — 말 그대로 처음부터다 */
  function wipeAllSaves(){
    clearRun();
    Store.remove(UNLOCK_KEY);
    Store.remove(MARKER_KEY);
    UNLOCKED = [];
    OWNED_MARKERS = [];
  }

  /* 여관에서 대열을 다시 짠다.
     살아서 돌아온 사람은 그대로 데려간다 — 체력도 심도압박도 이어받는다.
     새로 들어온 사람만 몸을 만들고, 덱은 빠진 병과의 카드를 걷어내고
     들어온 병과의 카드를 채운다(강화해 둔 카드는 그 병과가 남아 있으면 그대로다). */
  function applyReform(placements){
    const keep = {};
    S.party.forEach(p=>{ if(p && p.alive) keep[p.cls] = p; });

    const before = Object.keys(keep);
    const after  = placements.filter(Boolean);

    S.party = placements.map(cid=>{
      if(!cid) return null;
      if(keep[cid]) return keep[cid];
      const hero = makeHero(cid);
      applyRelicMaxHp(hero);
      return hero;
    });

    /* 빠진 병과의 카드는 덱에서 함께 나간다 */
    before.filter(c=>after.indexOf(c)<0).forEach(cls=>{
      S.runDeck = S.runDeck.filter(c=>c.owner!==cls);
      delete S.setup.picks[cls];
    });
    /* 새로 들어온 병과는 제 카드 중 둘을 무작위로 쥐고 온다 */
    const joined = after.filter(c=>before.indexOf(c)<0);
    joined.forEach(cls=>{
      const picked = randomPicks(CARD_DB[cls], RECRUIT_PICKS_PER_CLASS);
      S.setup.picks[cls] = picked;
      addPickedToRunDeck(CARD_DB[cls], picked, 'recruit');
    });
    return joined;
  }

  function newRun(){
    S = {

      pendingNode: null,

      escape: null,
      emergencyExit: null,
      finalGrowth: null,
      tavern: null,
      prologue: null,
      logMsg: '',

  /* 프롤로그는 저장되는 런과 분리한다. 네 사람이 이미 한 번 심연에 닿았다는
     사실만 남기고, 본편의 선택·해금·덱에는 어떤 이득도 남기지 않는다. */
  function tutorialCard(owner, name){
    const base = (CARD_DB[owner]||[]).find(c=>c.name===name);
    return base ? Object.assign({}, base, {uid:nextId(), defId:nextId(), upgraded:false, contaminated:false}) : null;
  }
  function tutorialFoe(name, hp, atk, reach, role, icon, intent){
    return {id:nextId(), name, maxHp:hp, hp:hp, atk:atk, reach:reach, role:role,
            icon:icon, block:0, intent:intent, alive:true, react:null};
  }
  function startPrologue(){
    newRun();
    S.prologue = {stage:'briefing'};
    S.screen = 'prologue';
  }
  function beginPrologueBattle(){
    S.party = BASE_CLASSES.map(makeHero);
    /* 첫 예시는 확률이 아니라 규칙을 보여주는 장면이다 — 회피·반격이 끼어들면
       방어가 피해를 막는 핵심이 흐려진다. */
    S.party[0].reactMod = {dodge:0, guard:0, riposte:0, rip:0};
    S.erosion = 10;
    const frontIntent = {type:'attack_reach', val:12, label:'내려찍기', ic:IC_CLEAVER};
    const rearIntent  = {type:'whisper_rear', val:7, label:'심연의 응시', ic:IC_GAZE};
    const ranged = FOE_ENDLESS.find(f=>f.name==='침묵의 등불지기');
    const finalBoss = tutorialFoe(FOE_ENDLESS_BOSS.name, FOE_ENDLESS_BOSS.maxHp, FOE_ENDLESS_BOSS.atk, FOE_ENDLESS_BOSS.reach, FOE_ENDLESS_BOSS.role, FOE_ENDLESS_BOSS.icon, frontIntent);
    /* 프롤로그의 기록에서도 정체는 끝까지 가린다. */
    finalBoss.kind = 'boss'; finalBoss.phase = 1; finalBoss.hiddenName = '???';
    const enemies = [
      finalBoss,
      tutorialFoe(ranged.name, ranged.maxHp, ranged.atk, ranged.reach, ranged.role, ranged.icon, rearIntent)
    ];
    S.battle = {
      tier:'끝없는 심연', node:{type:'battle',tier:'끝없는 심연',title:'되돌아갈 수 없는 문턱',desc:''}, enemies,
      deck:[], hand:[tutorialCard('vanguard','놋쇠 벽')], discard:[],
      ap:3, maxAp:3, tempAp:0, turn:1, over:false, pendingCardUid:null, pendingDomain:null
    };
    S.prologue.stage = 'brace';
    S.logMsg = '이름 없는 거대한 존재와 심연의 등불지기가 인양대를 바라본다.';
    S.screen = 'battle';
  }
  function prologueHandForStrike(){

    S.party.forEach(p=>{ p.hp=0; p.dp=100; p.block=0; p.alive=false; p.collapsed=true; });
    S.battle = null;
    S.prologue.stage = 'fallen';
    S.screen = 'prologueFall';

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }
  function cloneForBattle(runDeck){
    return shuffle(runDeck.map(c=>Object.assign({}, c, {uid:nextId(), contaminated:false})));
  }

  /* ============ 적 도감 ============
     적도 아군과 똑같은 규칙을 쓴다 — 서 있는 열이 곧 사거리다.
     역할(role)이 성향을, 사거리(reach)가 제약을 맡는다:
       brute      — 한 방이 무겁다
       skirmisher — 잘게 여러 번
       warden     — 웅크리고 버틴다
       caster     — 살을 깎지 않고 정신을 깎는다
       sniper     — 약한 놈만 골라 쏜다
     react 로 개체마다 회피/흘림/반격 성향을 덧씌운다. */
  /* 표층 몹 풀 — 표층 조우에서 무작위로 올라온다.
     서 있는 열이 곧 사거리이므로, 그 열에서 손이 닿는 놈만 후보가 된다
     (근접을 후열에 세우면 아무것도 못 하고 서 있게 된다).
     중층·심층 풀은 설계만 되어 있고 아직 자리가 없다 — 지금은 모든 층이 이 풀을 쓴다. */

    /* 최약체지만 속삭임이 잦다 — 무작위 속삭임 가중치를 네 배로 */

  const FOE_ELITES = [
    {name:'감시자',            maxHp:36, atk:7, reach:'melee', role:'skirmisher', icon:ICON_WATCHER},
    /* 웅크린 다음 크게 친다 */
    {name:'쇠사슬 파수장',     maxHp:42, atk:8, reach:'melee', role:'brute',      icon:ICON_CHAINWARD,
     intentMod:{guard_up:3}},
    {name:'첫 번째 잠수복',    maxHp:40, atk:7, reach:'mid',   role:'caster',     icon:ICON_FIRSTSUIT},
    /* 속삭임 빈도 매우 높음 */
    {name:'아홉 눈의 조타수',  maxHp:38, atk:6, reach:'mid',   role:'caster',     icon:ICON_HELMSMAN,
     intentMod:{whisper_rear:2, whisper_random:2}},
    /* 삼킨 종을 울려 전열 전체를 친다 */
    {name:'종을 삼킨 자',      maxHp:44, atk:8, reach:'melee', role:'brute',      icon:ICON_BELLEATER,
     intentMod:{attack_all:3}},
    {name:'조수를 부르는 여사제', maxHp:34, atk:5, reach:'mid', role:'caster',    icon:ICON_PRIESTESS},
    /* 가장 단단하다 — 방어 위주 */
    {name:'강철 아가미',       maxHp:46, atk:9, reach:'melee', role:'warden',     icon:ICON_STEELGILL,
     reactMod:{dodge:0.03, guard:0.38, riposte:0.30, rip:6}},
    /* 약한 놈만 골라 끌어내린다. 원거리로 두면 전열에 세울 수 없어 중거리로 둔다 */
    {name:'익사시키는 자',     maxHp:40, atk:8, reach:'mid',   role:'sniper',     icon:ICON_DROWNER},
  ];
  const FOE_BOSS = {name:'꿈꾸는 손의 파수꾼', maxHp:72, atk:9, reach:'mid', role:'brute', icon:ICON_BOSS, kind:'boss', phase:1};

  /* 끝없는 심연의 토착자. 마지막 장에서는 기존 적과 이 풀을 섞어 무작위 조우를 만든다. */
  const FOE_ENDLESS = [
    {name:'사슬 끊는 자',     maxHp:64, atk:14, reach:'melee',  role:'brute',      icon:assetIcon('assets/minion-chain-severer.png'),
     intentMod:{attack_reach:2}, reactMod:{dodge:0.03, guard:0.20, riposte:0.20, rip:7}},
    {name:'흑조의 성가대',    maxHp:50, atk:10, reach:'mid',    role:'caster',     icon:assetIcon('assets/minion-black-tide-choir.png'),
     intentMod:{whisper_rear:3, whisper_random:3}},
    {name:'안구 갑각수',      maxHp:74, atk:12, reach:'melee',  role:'warden',     icon:assetIcon('assets/minion-ocular-carapace.png'),
     intentMod:{guard_up:3}, reactMod:{dodge:0.02, guard:0.42, riposte:0.24, rip:6}},
    {name:'침묵의 등불지기',  maxHp:52, atk:11, reach:'ranged', role:'sniper',     icon:assetIcon('assets/minion-silent-lamplighter.png'),
     intentMod:{whisper_rear:2, snipe_lowest:2}},
    {name:'심연의 낙하자',    maxHp:56, atk:15, reach:'ranged', role:'skirmisher', icon:assetIcon('assets/minion-abyss-diver.png'),
     intentMod:{double_attack_reach:2}, reactMod:{dodge:0.16, guard:0.05, riposte:0.16, rip:6}},
  ];
  const FOE_ENDLESS_BOSS = {
    name:'최심의 안식자 네루모르', hiddenName:'???', maxHp:180, atk:16,
    reach:'mid', role:'brute', icon:assetIcon('assets/boss-nemorum.png'), kind:'boss', phase:1,
    intentMod:{attack_all:2, attack_reach:2}, reactMod:{dodge:0.05, guard:0.24, riposte:0.26, rip:9},
  };

  /* 네루모르는 절반을 잃기 전까지 이름조차 허락하지 않는다.
     피가 흐른 뒤에야 이것이 심연의 눈이 아니라, 그 눈을 지키던 인간이었음이 드러난다. */
  function foeDisplayName(en){
    return en && en.hiddenName && en.hp > en.maxHp*0.5 ? en.hiddenName : en.name;
  }

  function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  /* 가중 추첨 — [[무게, 값], ...] */
  function weighted(list){
    const pool = list.filter(p=>p[0] > 0);
    if(!pool.length) return list[0][1];
    let total = 0; pool.forEach(p=>{ total += p[0]; });
    let r = Math.random()*total;
    for(let i=0;i<pool.length;i++){ r -= pool[i][0]; if(r<=0) return pool[i][1]; }
    return pool[pool.length-1][1];
  }

  /* 이 열에서 실제로 손이 닿는 놈만 후보에 올린다 */
  function foePoolFor(tier){
    return tier==='끝없는 심연' ? FOE_SURFACE.concat(FOE_ELITES, FOE_ENDLESS) : FOE_SURFACE;
  }
  function foeCandidates(rank, tier){
    const pool = foePoolFor(tier);
    const ok = pool.filter(f => REACH[f.reach].from.indexOf(rank) >= 0);
    return ok.length ? ok : pool;
  }
  /* 머릿수가 늘면 개체는 약해진다 — 총 위협량을 대충 맞춰둔다 */
  function countScale(n){
    return n<=1 ? 1.35 : n===2 ? 1.0 : n===3 ? 0.78 : n===4 ? 0.62 : 0.50;
  }
  /* 얼마나 깊이 들어왔나 — 지나온 노드 수에 층 보정을 더한다 */
  function stageDepth(node){
    let d = S.mapVisited.length;
    if(node.tier === '중층') d += 2;
    else if(node.tier === '심해') d += 4;
    else if(node.tier === '끝없는 심연') d += 8;
    return d;
  }
  /* 깊어질수록 무리가 커진다. 얕은 곳은 2~3, 심층은 4~5가 기본이 된다.
     (실측 평균: 깊이0 ≈ 2.7마리 → 깊이4+ ≈ 4.2마리) */
  function rollFoeCount(depth, tier){
    if(tier==='끝없는 심연') return weighted([[3,4],[7,5]]);
    const d = Math.min(depth, 5);
    return weighted([
      [Math.max(0, 5 - d*2), 2],
      [4,                    3],
      [2 + d,                4],
      [Math.max(0, d*2 - 1), 5],
    ]);
  }

  function scaleFoeForTier(foe, node, packScale, leader){
    const threat = tierThreat(node.tier);
    const boss = leader && !!node.boss;
    const elite = leader && node.type==='elite';
    const hpRoleMul = boss ? threat.bossHp : elite ? threat.eliteHp : 1;
    const atkRoleMul = boss ? threat.bossAtk : elite ? threat.eliteAtk : 1;
    foe.maxHp = Math.max(8, Math.round(foe.maxHp * packScale * threat.hp * hpRoleMul));
    foe.atk = Math.max(1, Math.round(foe.atk * threat.atk * atkRoleMul));
    foe.pressureMul = threat.pressure;
    return foe;
  }
  function makeFoe(rank, scale, node){
    const base = Object.assign({}, pickOne(foeCandidates(rank, node.tier)));
    return scaleFoeForTier(base, node, scale, false);
  }

  function enemySetFor(node){
    const set = [];
    const depth = stageDepth(node);
    const endless = node.tier==='끝없는 심연';
    /* 우두머리 자체가 무겁다 — 수행원은 깊이에 따라 천천히만 는다 (총 4를 넘기지 않는다) */
    const escortsFor = () => Math.min(3, 1 + Math.floor(Math.random()*2) + Math.floor(depth/4));

    if(node.boss){
      set.push(scaleFoeForTier(Object.assign({}, endless ? FOE_ENDLESS_BOSS : FOE_BOSS), node, 1, true));
      const n = endless ? 3 : escortsFor();
      for(let r=1; r<=n; r++) set.push(makeFoe(r, endless ? 0.92 : 0.8, node));
      return set;
    }
    if(node.type==='elite'){
      const leaders = endless ? FOE_ELITES.concat(FOE_ENDLESS) : FOE_ELITES;
      set.push(scaleFoeForTier(Object.assign({}, pickOne(leaders)), node, 1, true));
      const n = endless ? 3 : escortsFor();
      for(let r=1; r<=n; r++) set.push(makeFoe(r, endless ? 0.95 : 0.8, node));
      return set;
    }
    const n = rollFoeCount(depth, node.tier);
    const scale = countScale(n) * (endless ? 1.22 : 1);
    for(let r=0; r<n; r++) set.push(makeFoe(r, scale, node));
    return set;
  }

  function handSize(){ return Math.min(HAND_LIMIT, 5 + relicSum('draw')); }

  function startBattle(node){
    const enemies = enemySetFor(node).map(e=>Object.assign({}, e, {hp:e.maxHp, block:0, intent:null, alive:true, react:null}));
    const ap = 3 + relicSum('ap');
    S.battle = {
      tier: node.tier, node, enemies,
      deck: cloneForBattle(S.runDeck), hand:[], discard:[],
      ap:ap, maxAp:ap, tempAp:0, turn:1, over:false,
      pendingCardUid:null, pendingDomain:null, pendingDraw:null,
    };
    S.party.forEach(p=>{ if(p) p.react = null; });
    aliveParty().forEach(p=>{
      const mend = relicSum('battleHeal', p);
      if(mend>0) p.hp = Math.min(p.maxHp, p.hp + mend);
    });
    fxQueue = [];
    clearLog();
    rollIntents();
    drawHand(handSize());
    S.logMsg = node.boss
      ? (node.tier==='끝없는 심연' ? '검은 수면 아래의 눈이 당신을 알아본다. 그 앞에 한 인간의 형체가 서 있다.' : '이곳의 꿈을 지키는 형체가 어둠 속에서 몸을 일으킨다.')
      : node.type==='elite' ? '유난히 거대한 형체가 앞장서 다가온다. 그것은 당신을 처음 보는 얼굴이 아니다.'
      : enemies.length>1 ? `어둠 속에서 ${enemies.length}개의 형체가 열을 이룬다. 모두 같은 박자로 숨을 쉰다.`
      : '어둠 속의 형체가 고개를 든다. 당신이 먼저 보았다고 믿게 만든다.';
    S.screen = 'battle';
  }

  /* 죽은 자는 열을 차지하지 않는다 — 앞이 쓰러지면 뒤가 당겨진다 (다키스트던전식) */
  function effRank(arr, idx){
    let r = 0;
    for(let i=0; i<idx; i++){ const u = arr[i]; if(u && u.alive) r++; }
    return r;
  }
  function heroRank(h){ return effRank(S.party, S.party.indexOf(h)); }
  function foeRank(en){ return effRank(S.battle.enemies, S.battle.enemies.indexOf(en)); }

  /* 이 적이 지금 닿을 수 있는 아군들 */
  function heroesInReach(en){
    const r = foeRank(en);
    if(!canActFrom(en, r)) return [];
    return S.party.filter(h => h && h.alive && canHitRank(en, heroRank(h)));
  }
  function pickHeroTarget(en){
    const pool = heroesInReach(en);
    if(!pool.length) return null;
    /* 원거리는 뒤를, 나머지는 앞을 노린다 */
    return en.reach==='ranged' ? pool[pool.length-1] : pool[0];
  }

  function pressureIntent(en, value){ return Math.max(1, Math.round(value * (en.pressureMul || 1))); }
  /* 적의 예고 행동 — 자기 열에서 실제로 할 수 있는 것만 고른다 */
  function pickIntent(en){
    const rank = foeRank(en);
    const roll = Math.random();
    const stuck = !canActFrom(en, rank) || heroesInReach(en).length===0;

    if(en.kind==='boss'){
      if(stuck) return {type:'guard_up', val:8, label:'웅크림', ic:IC_GUARD};
      if(en.phase===2){
        if(roll<0.34) return {type:'attack_reach', val:en.atk, label:'심연의 강타', ic:IC_CLEAVER};
        if(roll<0.60) return {type:'attack_all', val:Math.round(en.atk*0.7), label:'심연의 포효', ic:IC_ROAR};
        if(roll<0.82) return {type:'whisper_rear', val:pressureIntent(en,11), label:'심연의 응시', ic:IC_GAZE};
        return {type:'guard_up', val:10, label:'웅크림', ic:IC_GUARD};
      }
      if(roll<0.46) return {type:'attack_reach', val:en.atk, label:'대신관의 강타', ic:IC_CLEAVER};
      if(roll<0.78) return {type:'whisper_rear', val:pressureIntent(en,9), label:'심연의 응시', ic:IC_GAZE};
      return {type:'guard_up', val:8, label:'웅크림', ic:IC_GUARD};
    }

    /* 손이 닿지 않으면 자리를 고쳐 잡거나 속삭인다 */
    if(stuck){
      return roll<0.5
        ? {type:'guard_up', val:5, label:'웅크림', ic:IC_GUARD}
        : {type:'whisper_random', val:pressureIntent(en,6), label:'속삭임', ic:IC_GAZE};
    }

    return weighted(intentPool(en));
  }

  /* 역할별 예고 행동 표 — 같은 사거리라도 성향이 다르면 전혀 다르게 싸운다 */
  function intentPool(en){
    const a = en.atk;
    const hit = (v,l,ic)=>({type:'attack_reach', val:Math.max(1,Math.round(v)), label:l, ic:ic||IC_CLEAVER});
    const dbl = (v,l)=>({type:'double_attack_reach', val:Math.max(1,Math.round(v)), label:l, ic:IC_DOUBLE});
    const rear = (v,l)=>({type:'whisper_rear', val:pressureIntent(en,v), label:l, ic:IC_GAZE});
    const anyone = (v,l)=>({type:'whisper_random', val:pressureIntent(en,v), label:l, ic:IC_GAZE});
    const grd = (v)=>({type:'guard_up', val:Math.max(4,Math.round(v)), label:'웅크림', ic:IC_GUARD});
    const snipe = (v,l)=>({type:'snipe_lowest', val:Math.max(1,Math.round(v)), label:l, ic:IC_SNIPE});

    let list;
    switch(en.role){
      case 'brute':
        list = [[4, hit(a*1.75,'강타 예고',IC_HEAVY)], [3, hit(a,'내려찍기')], [1, grd(a*0.8)]]; break;
      case 'skirmisher':
        list = [[4, dbl(a*0.62,'연속 공격')], [3, hit(a,'베어물기')], [1, anyone(6,'속삭임')]]; break;
      case 'warden':
        list = [[4, grd(a*1.4)], [3, hit(a,'밀어붙이기')], [1, anyone(6,'속삭임')]]; break;
      case 'caster':
        list = [[4, rear(9,'심연의 응시')], [3, anyone(7,'속삭임')], [1, hit(a*0.8,'저주 발사',IC_SNIPE)]]; break;
      case 'sniper':
        list = [[4, snipe(a,'약자 저격')], [3, hit(a*0.9,'원거리 사격',IC_SNIPE)], [1, rear(8,'후열 응시')]]; break;
      default:
        list = [[1, hit(a,'공격')]];
    }

    /* 개체별 성향 — 역할표는 그대로 두고 특정 행동의 가중치만 배로 올린다.
       '느리지만 묵직'(웅크림 ×2)이나 '속삭임 빈도 높음'(×4) 같은 것이
       이름표로만 남지 않고 실제로 그렇게 싸우도록. */
    const mod = en.intentMod;
    if(mod){
      list = list.map(p => [p[0] * (mod[p[1].type] || 1), p[1]]);
      /* 역할표에 없는 행동은 새로 얹는다 — 지금은 전체 공격뿐이다 */
      if(mod.attack_all){
        list.push([mod.attack_all, {type:'attack_all', val:Math.max(1,Math.round(a*0.7)),
                                    label:'삼킨 종을 울린다', ic:IC_ROAR}]);
      }
    }
    return list;
  }
  function rollIntents(){ S.battle.enemies.forEach(en=>{ if(en.alive) en.intent = pickIntent(en); }); }

  /* 효과미상은 한 턴의 교란일 뿐, 덱 전체가 영구히 오염되지는 않는다. */
  const UNKNOWN_CARD_MAX_PER_TURN = 3;
  /* 중층의 기존 15% 빈도는 절반으로 낮춘다. 하지만 심해와 끝없는 심연에서는
     심연의 관측이 강해지므로 다시 가파르게 늘어난다. */
  const UNKNOWN_CARD_CHANCE = {'중층':0.075, '심해':0.12, '끝없는 심연':0.18};
  function drawNextBattleCard(){
    const b = S.battle;
    if(b.deck.length===0){
      if(b.discard.length===0) return null;
      b.deck = shuffle(b.discard); b.discard=[];
    }
    const c = b.deck.pop();
    c.contaminated = false;
    const unknownCount = b.hand.filter(card=>card.contaminated).length;
    const unknownChance = UNKNOWN_CARD_CHANCE[b.tier] || 0;
    if(unknownCount < UNKNOWN_CARD_MAX_PER_TURN && Math.random() < unknownChance) c.contaminated = true;
    return c;
  }
  function drawHand(n){
    const b = S.battle;
    if(!b || n<=0) return;
    if(b.pendingDraw){ b.pendingDraw.remaining += n; return; }
    for(let left=n;left>0;left--){
      const c = drawNextBattleCard();
      if(!c) break;
      if(b.hand.length>=HAND_LIMIT){
        b.pendingDraw = {card:c, remaining:left-1};
        return;
      }
      b.hand.push(c);
    }
  }
  function replaceForPendingDraw(handUid){
    const b = S.battle;
    if(!b || !b.pendingDraw) return false;
    const idx = b.hand.findIndex(c=>c.uid===handUid);
    if(idx<0) return false;
    const removed = b.hand[idx];
    const incoming = b.pendingDraw.card;
    const remaining = b.pendingDraw.remaining;
    b.hand.splice(idx,1, incoming);
    b.discard.push(removed);
    b.pendingDraw = null;
    pushLog(`${removed.name}을(를) 버리고 ${incoming.name}을(를) 받았다.`);
    drawHand(remaining);
    return true;
  }

  /* 로그가 화면 한복판으로 나왔으니 조사도 제대로 붙인다 — 받침 유무로 갈라준다 */
  function hasJong(s){
    if(!s) return false;
    const c = s.charCodeAt(s.length-1);
    if(c < 0xAC00 || c > 0xD7A3) return false;     /* 한글 음절이 아니면 판단 보류 */
    return (c - 0xAC00) % 28 !== 0;
  }
  function ga(n){ return n + (hasJong(n) ? '이' : '가'); }
  function eul(n){ return n + (hasJong(n) ? '을' : '를'); }

  /* 전투 로그 — 적이 여럿이면 한 턴에 여러 줄이 쏟아지므로 최근 3줄을 모아 보여준다 */
  function pushLog(msg){
    if(!msg) return;
    if(!S.logLines) S.logLines = [];
    S.logLines.push(msg);
    while(S.logLines.length > 3) S.logLines.shift();
    S.logMsg = msg;
  }
  function clearLog(){ S.logLines = []; }

  function aliveParty(){ return S.party.filter(p=>p && p.alive); }
  function rearTarget(){ const a=aliveParty(); return a.length? a[a.length-1] : null; }
  function lowestHpTarget(){ const a=aliveParty(); if(!a.length) return null; return a.reduce((x,p)=>p.hp<x.hp?p:x, a[0]); }

  /* ============ 피격 반응 ============
     맞는 쪽이 굴린다: 회피 → 흘려막기 → 그래도 맞으면 반격.
     반격은 자기 열에서 상대 열까지 손이 닿을 때만 나간다.
     반격에 대한 재반격은 없다 (무한 연쇄 방지). */
  function markReact(unit, kind){
    unit.react = {kind:kind, turn:S.battle ? S.battle.turn : 0};
  }
  function canRiposte(defender, defRank, attacker, atkRank){
    if(!attacker || !attacker.alive) return false;
    return canActFrom(defender, defRank) && canHitRank(defender, atkRank);
  }
  /* 회피/흘림 판정 + 방어도 소모. 실제 체력 차감은 호출부에서 한다. */
  function resolveIncoming(defender, amount){
    const rc = reactOf(defender);
    if(Math.random() < rc.dodge){
      markReact(defender, 'dodge');
      return {dealt:0, kind:'dodge'};
    }
    let dmg = amount;
    let kind = 'hit';
    if(Math.random() < rc.guard){
      dmg = Math.max(1, Math.round(dmg*0.5));
      markReact(defender, 'guard');
      kind = 'guard';
    }
    if(defender.block > 0){
      const absorbed = Math.min(defender.block, dmg);
      defender.block -= absorbed;
      dmg -= absorbed;
    }
    return {dealt:dmg, kind:kind};
  }

  /* 전사한 전문가는 자신이 다루던 기술도 함께 잃는다.
     합성·강화 카드는 owner 값으로 병과를 보존하므로 같은 경로로 모두 제거된다. */
  function purgeDeadClassCards(hero){
    if(!hero || !hero.cls || !S || S.prologue) return;
    const cls = hero.cls;
    const before = S.runDeck.length;
    S.runDeck = S.runDeck.filter(c=>c.owner!==cls);
    if(S.setup && S.setup.picks) delete S.setup.picks[cls];

    const b = S.battle;
    if(b){
      ['deck','hand','discard'].forEach(zone=>{
        b[zone] = (b[zone]||[]).filter(c=>c.owner!==cls);
      });
      if(b.pendingCardUid && !b.hand.some(c=>c.uid===b.pendingCardUid)){
        b.pendingCardUid = null;
        b.pendingDomain = null;
      }
    }
    if(before>S.runDeck.length) pushLog(`${hero.name}의 카드가 심연에 잠겼다.`);
  }

  function applyDamageToHero(hero, amount, opts){
    opts = opts || {};
    const stress = opts.stress!==false;
    const attacker = opts.from || null;
    /* 정신이 함몰되면 몸도 함께 무너진다. 방어·흘림 판정 전에 원피해가 50% 늘어난다. */
    if(hero.collapsed) amount = Math.round(amount * 1.5);
    const res = resolveIncoming(hero, amount);

    if(res.kind==='dodge'){
      queueFx('dodge', hero);
      pushLog(`${ga(hero.name)} 몸을 비틀어 피했다.`);
      return res;
    }
    hero.hp = Math.max(0, hero.hp - res.dealt);
    if(res.dealt>0){
      flash('red');
      queueFx('impact', hero, res.dealt);
      if(stress) addDp(hero, 4);
    }
    if(res.kind==='guard'){ queueFx('guard', hero); pushLog(`${ga(hero.name)} 흘려 막았다. (${res.dealt} 피해)`); }
    if(hero.hp<=0 && hero.alive){
      hero.alive = false;
      purgeDeadClassCards(hero);
      queueFx('death', hero);
    }
    checkCollapse(hero);

    if(hero.alive && opts.riposte!==false && canRiposte(hero, heroRank(hero), attacker, foeRank(attacker))
       && Math.random() < reactOf(hero).riposte){
      markReact(hero, 'riposte');
      queueFx('riposte', hero);
      const rip = reactOf(hero).rip;
      /* 반격 선언 뒤의 회피·흘림 결과가 마지막 줄에 남도록 한다. */
      pushLog(`${ga(hero.name)} 곧바로 받아친다. (반격 ${rip})`);
      damageEnemy(attacker, rip, {riposte:true});
    }
    return res;
  }
  /* 심도압박은 항상 0~100의 정수로 유지한다. 유물의 백분율 배율이 소수점을 만들 수 있다. */
  function setDp(hero, value){
    const safeValue = Number.isFinite(value) ? value : 0;
    hero.dp = Math.round(Math.max(0, Math.min(100, safeValue)));
    return hero.dp;
  }
  /* 심도압박 상승은 전부 이 문을 지난다 — 유물로 무뎌지는 지점이 한 곳뿐이도록 */
  function addDp(hero, amount){
    setDp(hero, hero.dp + amount * relicMul('dpMul', hero));
  }
  function checkCollapse(hero){
    if(hero.dp>=100 && !hero.collapsed){
      hero.collapsed = true; setDp(hero, 70);
      pushLog(`${hero.name}의 정신이 함몰됐다. 가하는 피해 -50% · 받는 피해 +50%.`);
    }
  }
  function damageEnemy(en, dmg, opts){
    opts = opts || {};
    flash('white');
    const res = resolveIncoming(en, dmg);
    if(res.kind==='dodge'){
      queueFx('dodge', en);
      pushLog(`${ga(foeDisplayName(en))} 미끄러지듯 피한다.`);
      return null;
    }
    en.hp = Math.max(0, en.hp - res.dealt);
    if(res.dealt>0) queueFx('impact', en, res.dealt);
    if(res.kind==='guard'){
      queueFx('guard', en);
      pushLog(`${ga(foeDisplayName(en))} 몸을 틀어 흘려낸다. (${res.dealt} 피해)`);
    }

    if(en.hp<=0){
      en.alive = false;
      queueFx('death', en);
    } else if(en.kind==='boss' && en.phase===1 && en.hp <= en.maxHp*0.5){
      en.phase = 2;
      en.atk = Math.round(en.atk*1.2);
      en.block = Math.max(en.block, 6);
      en.intent = pickIntent(en);
      pushLog(en.hiddenName
        ? `${en.name}의 흉부가 열리며 단안이 당신을 향한다. 그것은 심연이 아니라, 심연을 지키던 인간이었다...!`
        : `${ga(en.name)} 진짜 모습을 드러낸다...!`);
    }

    const hero = opts.from || null;
    if(en.alive && !opts.riposte && hero && hero.alive
       && canRiposte(en, foeRank(en), hero, heroRank(hero))
       && Math.random() < reactOf(en).riposte){
      markReact(en, 'riposte');
      queueFx('riposte', en);
      const rip = reactOf(en).rip;
      pushLog(`${ga(foeDisplayName(en))} 이빨을 드러내며 받아친다. (반격 ${rip})`);
      applyDamageToHero(hero, rip, {stress:false, riposte:false});
    }
    return res;
  }

  function isAttackCard(card){ return card.type==='attack' || card.type==='fusion_attack' || card.type==='epic_attack' || card.type==='reroll_intent'; }
  function ownerOf(card){ return S.party.find(p=>p && p.id===card.owner) || null; }

  /* 이 카드가 지금 실제로 닿을 수 있는 적들 */
  function enemyTargetsFor(card){
    const b = S.battle;
    if(!b) return [];
    /* 합성 공격은 특정 병과가 휘두르는 무기가 아니라, 합성으로 부른 심연 그 자체다. */
    if(card.type==='fusion_attack' || card.type==='epic_attack' || (card.type==='reroll_intent' && card.owner==='neutral')) return b.enemies.filter(e=>e.alive);
    const owner = ownerOf(card);
    if(!owner || !owner.alive) return [];
    if(!canActFrom(owner, heroRank(owner))) return [];
    return b.enemies.filter(e => e.alive && canHitRank(owner, foeRank(e)));
  }

  /* 못 내는 이유를 문장으로 — 카드에 그대로 찍어 보여준다 */
  function cardBlockReason(card){
    if(!isAttackCard(card)) return null;
    if(card.type==='fusion_attack' || card.type==='epic_attack' || (card.type==='reroll_intent' && card.owner==='neutral')) return null;
    const owner = ownerOf(card);
    if(!owner || !owner.alive) return '시전자가 없다';
    const oRank = heroRank(owner);
    if(!canActFrom(owner, oRank)) return `${reachOf(owner).label} 병과는 ${rankName(oRank)}에서 못 친다`;
    if(!enemyTargetsFor(card).length) return '닿는 적이 없다';
    return null;
  }

  function canPlayCard(card){
    const b = S.battle;
    if(!b || b.over) return false;
    if(b.pendingDraw) return false;
    /* 프롤로그에서는 지금 배울 한 장만 켠다. 다른 카드로 우연히 넘기지 못하게 한다. */
    if(S.prologue){
      const step = S.prologue.stage;
      if(step==='brace' && card.name!=='놋쇠 벽') return false;
      if(step==='strike' && card.name!=='저주받은 조준') return false;
      if(step==='pressure' && card.name!=='속죄의 기도') return false;
      if(step!=='brace' && step!=='strike' && step!=='pressure') return false;
    }
    if(b.pendingCardUid && b.pendingCardUid!==card.uid) return false;
    if(b.ap + (b.tempAp||0) < card.cost) return false;
    if(cardBlockReason(card)) return false;
    return true;
  }

  function beginTargeting(cardUid, domain){ S.battle.pendingCardUid=cardUid; S.battle.pendingDomain=domain; }
  function cancelTargeting(){ if(S.battle){ S.battle.pendingCardUid=null; S.battle.pendingDomain=null; } }

  function resolveCard(cardUidVal, targetInfo){
    const b = S.battle;
    if(!b || b.over) return;
    const idx = b.hand.findIndex(c=>c.uid===cardUidVal);
    if(idx===-1) return;
    const card = b.hand[idx];
    if(!canPlayCard(card)) return;

    cancelTargeting();
    clearLog();
    /* 임시 AP 는 이 턴이 지나면 사라진다 — 먼저 쓴다 */
    let cost = card.cost;
    const fromTemp = Math.min(b.tempAp||0, cost);
    b.tempAp = (b.tempAp||0) - fromTemp;
    b.ap -= (cost - fromTemp);
    b.hand.splice(idx,1);
    b.discard.push(card);
    card.contaminated = false;

    const owner = ownerOf(card);
    const reachable = enemyTargetsFor(card);

    /* 사거리 밖은 애초에 후보에 없다 */
    let enemyTarget = null;
    if(card.range==='melee' || card.range==='ranged'){
      if(card.range==='ranged' && targetInfo && targetInfo.enemyIdx!=null){
        const t = b.enemies[targetInfo.enemyIdx];
        if(t && reachable.indexOf(t)>=0) enemyTarget = t;
      }
      if(!enemyTarget) enemyTarget = reachable[0] || null;
    }

    let allyTarget = null;
    if(card.range==='support_ally'){
      if(targetInfo && targetInfo.allyId){ allyTarget = S.party.find(p=>p && p.id===targetInfo.allyId && p.alive) || null; }
      if(!allyTarget) allyTarget = lowestHpTarget();
    }

    /* 제 정신을 깎아 쓰는 카드는 공격만이 아니다 — 종류를 가리지 않고 먼저 치른다 */
    if(card.selfDp && owner && owner.alive){ addDp(owner, card.selfDp); checkCollapse(owner); }

    switch(card.type){
      case 'attack':
      case 'fusion_attack':
      case 'epic_attack': {
        let dmg = Math.round(card.dmg * relicMul('dmgMul', owner));
        if(owner && owner.collapsed) dmg = Math.round(dmg*0.5);
        if(card.range==='aoe'){
          /* 선언은 먼저, 회피·흘림·각성 같은 실제 결과는 처리 직후 뒤에 남긴다. */
          pushLog(`${card.name} — 닿는 적 ${reachable.length}체에게 ${dmg} 피해.`);
          reachable.slice().forEach(en=>damageEnemy(en, dmg, {from:owner}));
        } else if(enemyTarget){
          pushLog(`${card.name} — ${foeDisplayName(enemyTarget)}에게 ${dmg} 피해.`);
          damageEnemy(enemyTarget, dmg, {from:owner});
          if(card.selfBlock && owner && owner.alive) owner.block += card.selfBlock;
        }
        break;
      }
      case 'block': { if(owner&&owner.alive){ owner.block+=Math.round(card.block*relicMul('blockMul', owner)); pushLog(`${owner.name}이 방어 태세를 취한다.`); } break; }
      case 'block_party': { aliveParty().forEach(p=>p.block+=Math.round(card.block*relicMul('blockMul', p))); pushLog('파티 전체가 대비한다.'); break; }
      case 'heal': { if(allyTarget){ allyTarget.hp=Math.min(allyTarget.maxHp, allyTarget.hp+Math.round(card.heal*relicMul('healMul', allyTarget))); queueFx('heal', allyTarget); pushLog(`${allyTarget.name}의 상처를 봉합했다.`); } break; }
      case 'heal_party': { aliveParty().forEach(p=>{ p.hp=Math.min(p.maxHp,p.hp+Math.round(card.heal*relicMul('healMul', p))); queueFx('heal',p); }); pushLog('파티 전체의 상처를 봉합했다.'); break; }
      case 'calm': { if(allyTarget){ setDp(allyTarget, allyTarget.dp-card.calm); queueFx('calm', allyTarget); pushLog(`${allyTarget.name}이 숨을 고른다.`); } break; }
      case 'calm_party': { aliveParty().forEach(p=>{ setDp(p, p.dp-card.calm); queueFx('calm', p); }); pushLog('파티 전체가 진정된다.'); break; }
      case 'fuse_support': { if(allyTarget){ allyTarget.hp=Math.min(allyTarget.maxHp, allyTarget.hp+Math.round(card.heal*relicMul('healMul', allyTarget))); setDp(allyTarget, allyTarget.dp-card.calm); queueFx('heal', allyTarget); pushLog(`${allyTarget.name}이 정화와 회복을 동시에 받는다.`); } break; }
      case 'double_ap': {
        const usable = Math.max(0, b.ap + (b.tempAp||0));
        b.ap = usable * 2; b.tempAp = 0;
        pushLog(`태양 없는 정오 — 이 턴에 쓸 수 있는 AP가 ${usable}에서 ${b.ap}(으)로 늘었다.`);
        break;
      }
      case 'legendary_sanctuary': {
        aliveParty().forEach(p=>{
          p.hp=Math.min(p.maxHp,p.hp+Math.round(card.heal*relicMul('healMul', p)));
          setDp(p, p.dp-card.calm);
          p.block+=Math.round(card.block*relicMul('blockMul', p));
          queueFx('heal',p); queueFx('calm',p);
        });
        pushLog('마지막 잠수종이 닫히며 인양대 전체를 감싼다.');
        break;
      }
      case 'emergency_escape': { attemptEmergencyEscape(); return; }
      case 'draw': { drawHand(card.draw); pushLog('카드를 더 끌어온다.'); break; }
      case 'foresight': { drawHand(card.draw); if(owner&&owner.alive){ setDp(owner, owner.dp-card.calm); } pushLog('마음을 가라앉히며 앞일을 살핀다.'); break; }
      case 'reroll_intent': { if(enemyTarget){ enemyTarget.intent = pickIntent(enemyTarget); pushLog(`${foeDisplayName(enemyTarget)}의 운명이 뒤틀린다.`); } break; }
      case 'swap': {
        if(allyTarget){
          const targetIdx = S.party.indexOf(allyTarget);
          if(targetIdx > 0){ const t=S.party[0]; S.party[0]=S.party[targetIdx]; S.party[targetIdx]=t; pushLog(`${ga(allyTarget.name)} 전열로 나선다.`); }
          else if(targetIdx===0 && S.party.length>1){ const t=S.party[0]; S.party[0]=S.party[1]; S.party[1]=t; pushLog('전열과 중열이 자리를 바꾼다.'); }
        }
        break;
      }
    }
    /* 자리가 바뀌면 사거리가 바뀌므로 예고를 다시 계산한다 */
    if(card.type==='swap') rollIntents();

    if(S.prologue && S.prologue.stage==='brace' && card.name==='놋쇠 벽'){
      S.prologue.stage = 'braceDone';
      pushLog('방어가 피해보다 먼저 닳는다. 이제 예고된 공격을 받아 보자.');
    }
    if(S.prologue && S.prologue.stage==='strike' && card.name==='저주받은 조준'){
      S.prologue.stage = 'pressure';
      /* 잠식(전투 바깥의 귀환 제한)과 심도압박(개인 상태)을 섞지 않는다.
         조준의 대가가 지도 제작자 개인의 게이지에 남도록 눈에 보이는 값으로 고정한다. */
      const oracle = S.party.find(p=>p.cls==='oracle');
      if(oracle) setDp(oracle, Math.max(oracle.dp, 42));
      b.hand = prologueHandForCalm();
      pushLog('힘을 빌린 대가로 심도압박이 올랐다. 사제의 기도로 이를 가라앉힐 수 있다.');
    }
    if(S.prologue && S.prologue.stage==='pressure' && card.name==='속죄의 기도'){
      S.prologue.stage = 'abyss';
      pushLog('심도압박은 방어로 막을 수 없지만, 진정 카드로 되돌릴 수 있다.');
    }

    if(b.enemies.every(e=>!e.alive)){ winBattle(); }
    render();
  }

  function executeEnemyTurn(){
    const b = S.battle;
    if(!b || b.over) return;
    clearLog();
    b.enemies.forEach(en=>{
      if(!en.alive) return;
      en.block = 0;
      const intent = en.intent;
      if(!intent) return;

      if(intent.type==='attack_reach'){
        const t = pickHeroTarget(en);
        if(t){
          pushLog(`${ga(foeDisplayName(en))} ${rankName(heroRank(t))}의 ${eul(t.name)} 노린다. (${intent.val})`);
          applyDamageToHero(t, intent.val, {from:en});
        } else pushLog(`${ga(foeDisplayName(en))} 허공을 할퀸다 — 닿지 않는다.`);

      } else if(intent.type==='double_attack_reach'){
        const t = pickHeroTarget(en);
        if(t){
          pushLog(`${ga(foeDisplayName(en))} ${eul(t.name)} 두 번 후려친다.`);
          applyDamageToHero(t, intent.val, {from:en});
          if(t.alive) applyDamageToHero(t, intent.val, {from:en});
        } else pushLog(`${ga(foeDisplayName(en))} 헛손질한다.`);

      } else if(intent.type==='attack_all'){
        const pool = heroesInReach(en);
        if(pool.length){
          pushLog(`${ga(foeDisplayName(en))} 닿는 모두를 집어삼킨다. (전체 ${intent.val})`);
          pool.forEach(p=>{ if(p.alive) applyDamageToHero(p, intent.val, {from:en}); });
        } else pushLog(`${foeDisplayName(en)}의 포효가 빈 물살을 때린다.`);

      } else if(intent.type==='whisper_random'){
        const alive = aliveParty();
        if(alive.length){
          const t = alive[Math.floor(Math.random()*alive.length)];
          pushLog(`무언가 ${t.name}의 귀에 속삭인다. (심도압박 +${intent.val})`);
          addDp(t, intent.val); checkCollapse(t);
        }

      } else if(intent.type==='whisper_rear'){
        const t = rearTarget();
        if(t){
          pushLog(`${ga(foeDisplayName(en))} 후미의 ${t.name}에게 속삭인다. (심도압박 +${intent.val})`);
          addDp(t, intent.val); checkCollapse(t);
        }

      } else if(intent.type==='snipe_lowest'){
        const pool = heroesInReach(en);
        if(pool.length){
          const t = pool.reduce((x,p)=> p.hp<x.hp ? p : x, pool[0]);
          pushLog(`${ga(foeDisplayName(en))} 가장 약한 ${eul(t.name)} 저격한다. (${intent.val})`);
          applyDamageToHero(t, intent.val, {stress:false, from:en});
        } else pushLog(`${ga(foeDisplayName(en))} 겨눌 표적을 찾지 못한다.`);

      } else if(intent.type==='guard_up'){
        en.block += intent.val;
        pushLog(`${ga(foeDisplayName(en))} 몸을 웅크린다. (방어 +${intent.val})`);
      }
    });
    /* 아군의 반격으로 마지막 적이 쓰러질 수 있다.
       전멸 확인을 아군 쪽만 하면, 적이 다 죽었는데 전투가 끝나지 않고
       빈 대열을 마주한 채 턴만 넘어간다. */
    if(checkPartyWipe()) return;
    if(b.enemies.every(e=>!e.alive)) winBattle();
  }

  function checkPartyWipe(){
    if(aliveParty().length===0){ triggerGameOver('파티 전원이 심연에 잠겼다.'); return true; }
    return false;
  }
  function triggerGameOver(reason){
    clearRun();
    S.loseReason = reason;
    if(S.battle) S.battle.over = true;
    S.screen = 'gameover';
  }
  const EMERGENCY_ESCAPE_CHANCE = {'표층':1, '중층':0.8, '심해':0.5, '끝없는 심연':0.1};
  function emergencyEscapeChance(tier){ return EMERGENCY_ESCAPE_CHANCE[tier] || 0.1; }
  /* 비상 탈출은 패배 판정이 아니라 버릴 수 있는 마지막 선택지다.
     조건·확률에 막히면 카드는 이미 소모되지만, 전투와 인양대는 그대로 남는다. */
  function failEmergencyEscape(reason){
    S.logMsg = reason;
    pushLog(reason);
    render();
    return false;
  }
  function attemptEmergencyEscape(){
    const b = S.battle;
    if(!b || b.over) return false;
    const badlyWounded = S.party.filter(p=>p && p.hp<=p.maxHp*0.5);
    if(badlyWounded.length>=2){
      return failEmergencyEscape('비상 탈출 실패 — 체력이 절반 이하인 대원이 둘 이상이다. 인양줄을 놓쳤다.');
    }
    const evacuees = S.party.filter(p=>p && p.alive && p.dp<50);
    if(!evacuees.length){
      return failEmergencyEscape('비상 탈출 실패 — 심도압박 50 미만인 대원이 없다. 누구도 인양줄을 붙잡지 못했다.');
    }
    const chance = emergencyEscapeChance(b.tier);
    if(Math.random()>=chance){
      return failEmergencyEscape(`${b.tier}의 수압이 인양줄을 끊었다. 비상 탈출에 실패했다. (성공 확률 ${Math.round(chance*100)}%)`);
    }
    b.over = true;
    const leftBehind = S.party.filter(p=>p && evacuees.indexOf(p)<0);
    const keptRelic = S.relics.length===1 ? S.relics[0] : null;
    S.emergencyExit = {tier:b.tier, chance:chance, evacuees:evacuees, leftBehind:leftBehind, keptRelic:keptRelic};
    clearRun();
    S.screen = 'emergencyExit';
    render();
    return true;
  }

  function endPlayerTurn(){
    const b = S.battle;
    if(!b || b.over || b.pendingCardUid || b.pendingDraw) return;
    if(S.prologue && S.prologue.stage!=='braceDone') return;
    b.hand.forEach(c=>{ c.contaminated = false; });
    b.discard.push(...b.hand); b.hand=[];

    executeEnemyTurn();
    if(b.over){ render(); return; }

    if(S.prologue && S.prologue.stage==='braceDone'){
      /* 이 한 턴은 잠식과 심도압박이 모두 보이도록 고정한다. */
      S.erosion = Math.min(100, S.erosion + 15);
      b.turn = 2; b.ap = b.maxAp; b.tempAp = 0;
      b.hand = prologueHandForStrike();
      b.enemies[0].intent = {type:'attack_reach', val:14, label:'심연의 강타', ic:IC_HEAVY};
      b.enemies[1].intent = {type:'whisper_rear', val:10, label:'속삭임', ic:IC_GAZE};
      S.prologue.stage = 'strike';
      pushLog('잠식이 차오른다. 원거리 적은 후미의 정신을 노린다.');
      render();
      return;
    }

    const rise = b.tier==='중층' ? 2 : (b.node && b.node.type==='elite' ? 1 : 0);
    if(rise>0){ aliveParty().forEach(p=>{ addDp(p, rise); checkCollapse(p); }); }

    const maxed = addErosion(erosionRate());
    if(checkPartyWipe()){ render(); return; }
    if(maxed){ triggerGameOver('잠식이 한계에 다다랐다. 돌아갈 길이 사라졌다.'); render(); return; }

    aliveParty().forEach(p=>p.block=0);
    /* 정규 AP를 둘 이상 남겨도 보존되는 것은 한 칸뿐이다. 임시 AP 자체는 다시
       넘기지 않아, 행동력이 끝없이 쌓이지 않는다. */
    const carry = b.ap >= TEMP_AP_MIN ? TEMP_AP_CARRY : 0;
    b.turn += 1;
    b.ap = b.maxAp;
    b.tempAp = carry;
    rollIntents();
    drawHand(handSize());
    render();
  }

  function winBattle(){
    /* 반격으로 끝난 전투도 일반 공격으로 끝난 전투와 같은 경로를 탄다.
       이미 끝난 전투를 다시 예약하지 않아, 반격 처리 뒤의 턴 정산이나
       늦게 도착한 타이머가 다음 화면을 덮어쓰지 않게 한다. */
    const b = S.battle;
    if(!b || b.over) return;
    b.over = true;
    pushLog('적이 물거품이 되어 흩어진다.');
    setTimeout(()=>{
      if(!S || S.battle!==b || S.screen!=='battle') return;
      completeCurrentNode();
      render();
    }, 550);
  }

  /* ============ MAP FLOW ============ */
  /* 갈림길은 한 번 뽑으면 고정된다 — 다시 그린다고 선택지가 바뀌면 고를 이유가 없다 */
  function availableNodes(){
    if(!S.mapChoices) S.mapChoices = rollChoices();
    return S.mapChoices;
  }
  function aftermathActionsFor(node){
    if(node.type==='rest') return 0;
    if(node.type==='elite' || node.boss) return 2;
    return 1;
  }
  function enterMapNode(id){
    const node = availableNodes().find(n=>n.id===id);
    if(!node) return;
    S.pendingNode = node;
    if(node.type==='battle' || node.type==='elite'){
      startBattle(node);
    } else if(node.type==='rest'){
      if(addErosion(EROSION_REST)){ triggerGameOver('숨을 고르는 사이 잠식이 한계를 넘었다.'); return; }
      S.rest = {choice:null};
      S.screen = 'rest';
    } else if(node.type==='treasure'){
      completeCurrentNode();
    }
  }
  function completeCurrentNode(){
    const node = S.pendingNode;
    S.mapVisited.push(node);
    S.mapChoices = null;
    S.stepInChapter += 1;
    S.party.forEach(p=>{ if(p) p.block=0; });
    const actions = aftermathActionsFor(node);
    const dropped = isBossTier(node) ? dropRelic() : null;
    const cardOffer = (node.type==='battle' || node.type==='elite') && S.runDeck.length<MAX_DECK_SIZE ? cardRewardOffer(node) : null;
    const surfaced = S.stepInChapter >= chapter().length;
    S.afterAftermath = !surfaced ? 'map' : (isFinalChapter() ? 'result' : 'escape');
    if(surfaced){
      const finalAbyss = isFinalChapter();
      const growth = rewardExtractionSurvivors(finalAbyss ? 2 : 1.3, finalAbyss);
      if(finalAbyss) S.finalGrowth = growth;
      else {
        const marker = markerRewardForChapter(S.chapter);
        S.escape = {offer:relicOffer(), taken:null, plates:unlockCandidates().map(d=>d.id), growth:growth, marker:marker};
      }
    }
    if(actions>0){
      S.aftermath = {actionsLeft:actions, selecting:null, fuseSelected:[], reveal:null, dropped:dropped, cardOffer:cardOffer, cardTaken:null};
      S.screen = 'aftermath';
    } else {
      S.screen = S.afterAftermath;
    }
    /* 자리가 없으면 무엇을 버릴지 먼저 고르고, 그다음 원래 가려던 화면으로 */
    offerRelic(dropped, S.screen);
  }
  function proceedAfterAftermath(){
    S.aftermath = null;
    S.screen = S.afterAftermath || 'map';
    /* 끝난 런은 이어받을 것이 없다 */
    if(S.screen==='result') clearRun();
    render();
  }

  /* 인양 — 수면으로 올라왔으니 잠식 시계가 처음으로 돌아가고, 숨과 상처를 어느 정도 되찾는다.
     이게 없으면 뒤로 갈수록 길어지는 구역을 버틸 방법이 없다. */
  function enterTavern(){
    /* plates 는 아직 고르지 않은 젖은 명패들, unlocked 는 이미 고른 사람.
       고르기 전에는 여관에 들어서자마자 명패 벽이 먼저 열린다. */
    S.tavern = {recruited:[], slot:null, plates:(S.escape && S.escape.plates) ? S.escape.plates.slice() : [], unlocked:null, seated:false};
    S.screen = 'tavern';
  }

  function descendNextChapter(){
    S.chapter += 1;
    S.stepInChapter = 0;
    S.mapChoices = null;
    S.pendingNode = null;
    S.escape = null;
    S.tavern = null;
    S.erosion = 0;
    S.party.forEach(p=>{
      if(!p || !p.alive) return;
      p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp*0.4));
      setDp(p, p.dp - 30);
      p.block = 0;
      p.collapsed = false;
    });
    S.screen = 'map';
  }

  function chooseRest(kind){ S.rest.choice = kind; }
  function confirmRest(){
    const alive = aliveParty();
    if(S.rest.choice==='heal'){ alive.forEach(p=>p.hp=Math.min(p.maxHp,p.hp+Math.round(10*relicMul('healMul', p)))); S.logMsg='상처를 돌본다.'; }
    else if(S.rest.choice==='calm'){ alive.forEach(p=>setDp(p, p.dp-18)); S.logMsg='잠시 눈을 감고 숨을 고른다.'; }
    completeCurrentNode();
    render();
  }

  /* ============ UPGRADE / FUSION ============ */
  const MAX_UPGRADE_LEVEL = 5;
  /* 예전 저장의 upgraded:true는 +1로 읽는다. 이름은 표시용이므로 따로 원래 이름을 남긴다. */
  function upgradeLevel(card){ return Number.isFinite(card.upgradeLevel) ? card.upgradeLevel : (card.upgraded ? 1 : 0); }
  function baseCardName(card){ return card.baseName || String(card.name||'').replace(/\++$/, ''); }
  /* 전투 덱에는 같은 카드가 세 장씩 들어가지만, 인양 뒤 관리 화면에서는
     같은 등급의 카드들을 한 줄로 묶어 필요한 정보만 보여 준다. */
  function cardManageKey(card){ return `${card.owner}|${baseCardName(card)}|${upgradeLevel(card)}`; }
  function groupDeckCards(cards){
    const groups = new Map();
    cards.forEach(card=>{
      const key = cardManageKey(card);
      if(!groups.has(key)) groups.set(key, {key:key, defId:card.defId, card:card, defIds:[], name:card.name, owner:card.owner, level:upgradeLevel(card), count:0});
      const group = groups.get(key);
      group.defIds.push(card.defId);
      group.count++;
    });
    return Array.from(groups.values());
  }
  /* 강화는 덱 속 개별 카드 한 장만 대상으로 삼는다.
     목록은 같은 종류를 묶되, 실제 강화는 그 묶음 안의 카드 한 장에만 적용한다. */
  function groupedUpgradeOptions(){
    return groupDeckCards(S.runDeck.filter(c=>upgradeLevel(c)<MAX_UPGRADE_LEVEL));
  }
  /* +3부터는 같은 카드·같은 강화 단계 두 장을 녹여 한 단계 위 카드 한 장으로 만든다. */
  const MERGE_UPGRADE_START_LEVEL = 3;
  function upgradeNeedsMerge(cardOrGroup){
    const level = Number.isFinite(cardOrGroup.level) ? cardOrGroup.level : upgradeLevel(cardOrGroup);
    return level >= MERGE_UPGRADE_START_LEVEL;
  }
  function canUpgradeGroup(group){ return !upgradeNeedsMerge(group) || group.count >= 2; }
  function groupedFusionOptions(){
    return groupDeckCards(S.runDeck.filter(c=>!isEpicCard(c) && !isLegendaryCard(c)));
  }
  function fusionMaterialCards(){
    return S.runDeck.filter(c=>!isEpicCard(c) && !isLegendaryCard(c));
  }
  function raiseCardLevel(c){
    const level = upgradeLevel(c);
    if(level>=MAX_UPGRADE_LEVEL) return false;
    c.baseName = baseCardName(c);
    c.upgradeLevel = level+1;
    c.upgraded = true;
    c.name = c.baseName + '+'.repeat(c.upgradeLevel);
    if(c.dmg) c.dmg = Math.round(c.dmg*1.35);
    if(c.block) c.block = Math.round(c.block*1.35);
    if(c.selfBlock) c.selfBlock = Math.round(c.selfBlock*1.35);
    if(c.heal) c.heal = Math.round(c.heal*1.35);
    if(c.calm) c.calm = Math.round(c.calm*1.35);
    if(c.selfDp) c.selfDp = Math.max(0, c.selfDp-2);
    if(c.type==='draw' || c.type==='foresight') c.draw = (c.draw||0)+1;
    if(c.type==='swap' || c.type==='reroll_intent') c.cost = Math.max(0, c.cost-1);
    /* +4 카드 두 장을 녹여 +5가 되는 순간, 평범한 기술은 심연의 에픽으로 변한다. */
    if(c.upgradeLevel===MAX_UPGRADE_LEVEL && !isLegendaryCard(c)){ c.epic=true; c.cost=1; }
    return true;
  }
  function previewUpgradeCard(c){
    const preview = Object.assign({}, c);
    return raiseCardLevel(preview) ? preview : null;
  }
  function applyUpgradeCard(c){
    if(!raiseCardLevel(c)) return false;
    S.logMsg = `${c.name} 카드가 강화되었다.`;
    return true;
  }
  function applyUpgradeByDefId(defId){
    const c = S.runDeck.find(c=>c.defId===defId);
    if(!c) return null;
    let material = null;
    if(upgradeNeedsMerge(c)){
      const key = cardManageKey(c);
      material = S.runDeck.find(other=>other.defId!==c.defId && cardManageKey(other)===key);
      if(!material) return null;
    }
    if(!applyUpgradeCard(c)) return null;
    if(material){
      const materialIdx = S.runDeck.findIndex(other=>other.defId===material.defId);
      if(materialIdx>=0) S.runDeck.splice(materialIdx, 1);
      S.logMsg = `${baseCardName(c)} +${upgradeLevel(c)-1} 두 장이 합쳐져 ${c.name}이(가) 되었다.`;
    }
    return c;
  }
  function activeFusionClassCards(){
    const presentClasses = new Set(S.party.filter(p=>p && p.alive).map(p=>p.cls));
    return FUSION_CLASS_CARD_POOL.filter(c=>presentClasses.has(c.owner));
  }
  function fusionResultCard(){
    if(Math.random() < EPIC_FUSION_CHANCE) return {base:pickOne(EPIC_CARD_POOL), epic:true};
    const classCards = activeFusionClassCards();
    const pool = classCards.length && Math.random()<0.5 ? classCards : FUSION_CARD_POOL;
    return {base:pickOne(pool), epic:false};
  }
  function applyFusion(defIdA, defIdB){
    const ia = S.runDeck.findIndex(c=>c.defId===defIdA);
    const ib = S.runDeck.findIndex(c=>c.defId===defIdB);
    if(ia<0 || ib<0 || ia===ib) return null;
    const first = Math.max(ia,ib), second = Math.min(ia,ib);
    S.runDeck.splice(first,1);
    S.runDeck.splice(second,1);
    const result = fusionResultCard();
    const epic = result.epic;
    const base = result.base;
    const newCard = mkDeckCard(base, 'fused');
    S.runDeck.push(newCard);
    S.logMsg = epic ? '심연이 합성에 응답했다. 에픽 카드가 모습을 드러냈다.' : '두 카드가 하나로 융합되었다.';
    return newCard;
  }
  const CARD_REWARD_OFFER_SIZE = 3;
  const ELITE_PREMIUM_CARD_CHANCE = EPIC_FUSION_CHANCE * 2;
  const BOSS_LEGENDARY_CARD_CHANCE = 0.05;
  function cardRewardPool(){
    const activeClasses = new Set(S.party.filter(p=>p && p.alive).map(p=>p.cls));
    const pool = CARD_DB.neutral.concat(Array.from(activeClasses).flatMap(cls=>CARD_DB[cls]||[]));
    const owned = new Set(S.runDeck.map(c=>`${c.owner}|${baseCardName(c)}`));
    const fresh = pool.filter(c=>!owned.has(`${c.owner}|${c.name}`));
    return fresh.length ? fresh : pool;
  }
  function premiumRewardCard(allowLegendary){
    return allowLegendary && Math.random()<BOSS_LEGENDARY_CARD_CHANCE ? pickOne(LEGENDARY_CARD_POOL) : pickOne(EPIC_CARD_POOL);
  }
  function cardRewardOffer(node){
    const offer = shuffle(cardRewardPool().slice()).slice(0, CARD_REWARD_OFFER_SIZE);
    if(!offer.length) return offer;
    const rewardSlot = Math.floor(Math.random()*offer.length);
    if(node && node.boss){
      /* 구역 수문장은 에픽을 반드시 남긴다. 그중 5%는 전설로 바뀐다. */
      offer[rewardSlot] = premiumRewardCard(true);
    } else if(isBossTier(node) && Math.random()<ELITE_PREMIUM_CARD_CHANCE){
      /* 정예는 일반 보상(5%)의 두 배 확률로 에픽 이상의 카드를 남긴다. */
      offer[rewardSlot] = premiumRewardCard(true);
    } else if(Math.random()<EPIC_FUSION_CHANCE){
      offer[rewardSlot] = pickOne(EPIC_CARD_POOL);
    }
    return shuffle(offer);
  }
  function claimCardReward(index){
    const a = S.aftermath;
    const card = a && a.cardOffer && a.cardOffer[index];
    if(!card) return null;
    const added = addRunDeckCard(card, 'reward');
    if(!added) return null;
    a.cardTaken = added;
    a.cardOffer = null;
    S.logMsg = `${added.name} 카드가 덱에 추가되었다. (${S.runDeck.length}/${MAX_DECK_SIZE})`;
    return added;
  }

  /* ============ ATMOSPHERE ============ */
  function tierSlug(tier){
    if(tier==='표층') return 'surface';
    if(tier==='중층') return 'mid';
    return 'abyss';
  }
  function currentTier(){
    if(S.screen==='prologue' || S.screen==='prologueFall') return '심해';
    if(S.screen==='gameover') return '심해';
    if(S.screen==='emergencyExit' && S.emergencyExit) return S.emergencyExit.tier;
    if(S.screen==='battle' && S.battle) return S.battle.tier;
    if((S.screen==='rest' || S.screen==='aftermath') && S.pendingNode) return S.pendingNode.tier;
    /* 인양된 뒤에는 수면 위다 — 배경도 같이 밝아져야 올라왔다는 게 읽힌다 */
    if(S.screen==='escape' || S.screen==='tavern' || S.screen==='result') return '표층';
    if(S.screen==='map') return chapter().tier;
    return '표층';
  }
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function bubbles(n){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(3,97).toFixed(1), size=rand(3,8).toFixed(1), dur=rand(14,24).toFixed(1), delay=(-rand(0,20)).toFixed(1);
      html += `<div class="bubble" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  function motes(n,kind){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(4,96).toFixed(1), top=rand(4,90).toFixed(1), size=rand(2,5).toFixed(1), dur=rand(14,24).toFixed(1), delay=(-rand(0,20)).toFixed(1);
      html += `<div class="mote mote-${kind}" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  /* 가라앉는 잿가루 — 어느 층이든 위에서 계속 내려온다 */
  function ashes(n){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(2,98).toFixed(1), size=rand(1,2.4).toFixed(1), dur=rand(20,38).toFixed(1), delay=(-rand(0,36)).toFixed(1);
      html += `<div class="ash" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  function atmoMarkup(slug){
    if(slug==='surface') return `<div class="atmo-gradient atmo-surface"></div><div class="beam beam1"></div><div class="beam beam2"></div>${bubbles(7)}${ashes(10)}`;
    if(slug==='mid') return `<div class="atmo-gradient atmo-mid"></div>${motes(8,'mid')}${ashes(14)}`;
    return `<div class="atmo-gradient atmo-abyss"></div>${motes(4,'abyss')}${ashes(8)}`;
  }

  /* ============ RENDER ============ */
  const app = document.getElementById('app');
  app.innerHTML = '<div id="atmo" aria-hidden="true"></div><div id="content"></div>'
                + '<div id="grain" aria-hidden="true"></div><div id="fx" aria-hidden="true"></div>'
                + '<div id="flash" aria-hidden="true"></div>';
  const atmoEl = document.getElementById('atmo');
  const contentEl = document.getElementById('content');
  const fxEl = document.getElementById('fx');
  const flashEl = document.getElementById('flash');

  /* ============ 파티클 ============
     피해 판정은 render() 앞에서 끝나지만 그때의 DOM 은 곧 버려진다.
     그래서 이벤트만 큐에 쌓아두고, 다시 그린 뒤 카드 위치를 찾아 뿌린다. */
  let fxQueue = [];
  function queueFx(kind, unit, amount){
    if(!S.battle) return;
    const side = S.party.indexOf(unit) >= 0 ? 'hero' : 'foe';
    const key  = side==='hero' ? unit.id : S.battle.enemies.indexOf(unit);
    fxQueue.push({kind:kind, side:side, key:key, amount:amount||0});
  }

  const FX_COLOR = {
    heroHit:'#c4383c', foeHit:'#b87ad8',
    dodge:'#8fd4c4', guard:'#9fc0d8', riposte:'#e0574f',
    heal:'#e0aa4c', calm:'#7fbfae', death:'#cfe4dd',
  };
  function clearFxLayer(){ while(fxEl.firstChild) fxEl.removeChild(fxEl.firstChild); }
  const FX_MAX = 180;   /* 타이머가 밀려도 레이어가 무한히 불어나지 않게 */
  function spawn(cls, x, y, color, size, vars, life){
    while(fxEl.childElementCount >= FX_MAX) fxEl.removeChild(fxEl.firstChild);
    const p = document.createElement('div');
    p.className = 'p ' + cls;
    p.style.left = x+'px';
    p.style.top  = y+'px';
    if(color) p.style.color = color;
    if(size){ p.style.width = size[0]+'px'; p.style.height = size[1]+'px'; }
    if(vars) for(const k in vars) p.style.setProperty(k, vars[k]);
    fxEl.appendChild(p);
    setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, life||1100);
  }
  const rnd = (a,b)=> a + Math.random()*(b-a);

  function burst(x, y, color, n, spread){
    for(let i=0;i<n;i++){
      const a = (360/n)*i + rnd(-14,14);
      spawn('p-shard', x, y, color, [rnd(1.5,2.8), rnd(7,13)],
            {'--a':a+'deg', '--r':rnd(spread*0.55, spread)+'px', '--d':rnd(380,620)+'ms'}, 700);
    }
  }
  function playFx(ev, el){
    const ar = app.getBoundingClientRect();
    const r  = el.getBoundingClientRect();
    const cx = r.left - ar.left + r.width/2;
    const cy = r.top  - ar.top  + r.height/2;
    const mine = ev.side==='hero';

    if(ev.kind==='impact'){
      const col = mine ? FX_COLOR.heroHit : FX_COLOR.foeHit;
      /* 피해가 클수록 파편이 많고 멀리 튄다 */
      const n = Math.max(6, Math.min(14, 5 + Math.round(ev.amount*0.8)));
      burst(cx, cy, col, n, 30 + Math.min(26, ev.amount*2.2));
      spawn('p-ring', cx, cy, col, [30,30], {'--d':'380ms'}, 500);
      el.classList.add('hit-shake');

    } else if(ev.kind==='dodge'){
      for(let i=0;i<3;i++){
        spawn('p-wisp', cx + rnd(-8,8), cy + rnd(-12,12), FX_COLOR.dodge, null,
              {'--dx':rnd(20,36)+'px', '--d':rnd(420,600)+'ms'}, 700);
      }

    } else if(ev.kind==='guard'){
      spawn('p-ring', cx, cy, FX_COLOR.guard, [40,40], {'--d':'520ms'}, 650);
      burst(cx, cy, FX_COLOR.guard, 5, 20);

    } else if(ev.kind==='riposte'){
      spawn('p-slash', cx, cy, FX_COLOR.riposte, null, {'--a':'-32deg'}, 460);
      spawn('p-slash', cx, cy, FX_COLOR.riposte, null, {'--a':'26deg'}, 460);

    } else if(ev.kind==='death'){
      for(let i=0;i<12;i++){
        const s = rnd(3,8);
        spawn('p-bub', cx + rnd(-16,16), cy + rnd(-10,14), null, [s,s],
              {'--dx':rnd(-16,16)+'px', '--dy':rnd(48,92)+'px', '--d':rnd(700,1150)+'ms'}, 1300);
      }
      spawn('p-ring', cx, cy, FX_COLOR.death, [44,44], {'--d':'620ms'}, 800);

    } else if(ev.kind==='heal' || ev.kind==='calm'){
      const col = ev.kind==='heal' ? FX_COLOR.heal : FX_COLOR.calm;
      for(let i=0;i<8;i++){
        const s = rnd(2,4);
        spawn('p-mote', cx + rnd(-18,18), cy + rnd(-4,16), col, [s,s],
              {'--dx':rnd(-10,10)+'px', '--dy':rnd(26,48)+'px', '--d':rnd(560,900)+'ms'}, 1000);
      }
    }
  }
  function flushFx(){
    if(!fxQueue.length) return;
    const q = fxQueue; fxQueue = [];
    if(!S.battle || S.screen!=='battle'){ clearFxLayer(); return; }
    q.forEach(ev=>{
      const sel = ev.side==='hero'
        ? '.hero-card[data-id="'+ev.key+'"]'
        : '.foe-card[data-idx="'+ev.key+'"]';
      const el = contentEl.querySelector(sel);
      if(el) playFx(ev, el);
    });
  }
  function flash(type){
    if(!flashEl) return;
    flashEl.classList.remove('flash-white','flash-red');
    void flashEl.offsetWidth; // force reflow so the animation restarts even if same type fires again
    flashEl.classList.add(type==='white' ? 'flash-white' : 'flash-red');
  }
  let lastSlug = null;
  function ensureAtmo(slug){
    if(slug !== lastSlug){ atmoEl.innerHTML = atmoMarkup(slug); lastSlug = slug; }
    if(app.dataset.tier !== slug) app.dataset.tier = slug;
  }

  function dpColor(dp){ if(dp>=100) return '#d9452f'; if(dp>=70) return '#d89a3c'; return '#7fbfae'; }
  /* 정신 함몰 눈금. 픽셀 스킨이 이 두 값을 받아 각진 게이지를 채운다. */
  function dpRingStyle(dp){
    const col = dpColor(dp);
    /* 눈금이 네 칸 단위라 8칸(12.5%)으로 끊어 채운다 — 어중간한 픽셀이 남지 않게 */
    const pct = Math.round(Math.max(0, Math.min(100, dp)) / 12.5) * 12.5;
    return `--dp-col:${col}; --dp-pct:${pct}%; border-color:${col}55;`;
  }
  function ownerLabel(o){
    if(o==='neutral') return '중립';
    const def = CLASS_DEFS[o];
    return def ? def.name : o;
  }

  function renderTopbar(){
    const pct = Math.max(0, Math.min(100, S.erosion));
    const danger = pct >= 70 ? 'danger' : '';
    return `
      <div class="topbar">
        <div class="ero-row">
          <div class="ero-label">잠식</div>
          <div class="ero-case ${danger}"><div class="ero-fill" style="width:${pct}%"></div></div>
          <div class="ero-num mono ${danger}">${Math.round(S.erosion)}%</div>
        </div>
        ${ownedMarkers().length ? `<div class="marker-tray topbar-markers">${ownedMarkers().map(marker=>markerChip(marker)).join('')}</div>` : ''}
        ${S.relics.length ? `<div class="relic-tray topbar-relics">${S.relics.map(r=>relicChip(r,true)).join('')}</div>` : ''}
      </div>`;
  }

  function renderTitle(){
    contentEl.innerHTML = `
      <div class="screen title-screen">
        <div class="title-art" style="background-image:url('${ART_KEY}')"></div>
        <img class="title-wordmark" src="${ART_WORDMARK}" alt="FATHOM OF ABYSS">
        ${hasSavedRun() ? `
          <button class="btn primary" data-action="continue-run">이어서 탐색</button>
          <button class="btn" data-action="new-run">새로운 탐색</button>
        ` : `
          <button class="btn primary" data-action="new-run">새로운 탐색</button>
        `}
        <div class="title-version">v0.1.0-alpha.1</div>
      </div>`;
  }

  function renderPrologue(){
    contentEl.innerHTML = `
      <div class="screen prologue-screen">
        <img class="title-crest lost" src="assets/new_logo.png" alt="FATHOM OF ABYSS">
        <div class="title-en">Prologue · An Extraction Record</div>
        <h2 style="margin:0;">심해의 인양 기록</h2>
        <div class="prologue-scroll-box" aria-label="프롤로그 이야기">
          <div class="prologue-crawl">
            <p>바다는 모든 것을 삼킨다.<br>빛도, 이름도, 돌아가겠다는 약속도.</p>
            <p>검은 등대 조합은 심해에서 유물을 찾았다.<br>태초의 지식이 새겨진 성물이라 믿었다.</p>
            <p>수심계가 한계를 넘긴 뒤부터는 누구도 시간을 세지 않았다.<br>창밖은 검은 물조차 아니었다. 아무것도 존재하지 않던 태초의 어둠이, 유리 너머에서 조용히 숨 쉬고 있었다.</p>
            <p>그리고 마침내 인양 갈고리가 무언가를 붙잡았다.</p>
            <p class="em">그것은 잔해가 아니었다.<br>심연 바닥에 묻혀 있던 거대한 손가락—바위처럼 굳어 있었으나, 분명히 미세하게 움직이고 있는 손가락이었다.</p>
            <p class="em">그것은 바다가 아니었다.<br><b>심연이, 우리를 끌어내리고 있었다.</b></p>
          </div>
        </div>
        <button class="btn primary prologue-proceed" data-action="prologue-begin">기록을 엿본다</button>
      </div>`;
  }

  function renderPrologueFall(){
    contentEl.innerHTML = `
      <div class="screen prologue-screen prologue-fall-screen">
        <div class="title-en">No Return</div>
        <h2 style="margin:0;">심연은 모두를 삼켰다</h2>
        <div class="prologue-copy">인양선은 끝내 닿지 않았다. 남은 것은 심연의 꿈에서 건져 올린 전투 기록뿐이다.</div>
        <div class="prologue-fallen">${S.party.filter(p=>p).map(heroCardHtml).join('')}</div>
        <div class="prologue-panel"><div class="tier-tag">본편으로</div><p>이제 당신은 이 실패의 기록을 바탕으로 새로운 전문가들을 편성해 다시 내려갑니다. 프롤로그의 죽음은 본편의 해금과 덱에 영향을 주지 않습니다.</p></div>
        <button class="btn primary tutorial-pulse" data-action="prologue-real-run">새로운 탐색을 시작한다</button>
      </div>`;
  }

  /* 무엇을 들고 내려갈지 고르는 자리.
     직군마다 무작위 세 장 중 한 장, 공용은 무작위 여섯 장 중 넷을 고른다. */
  function pickRow(group, base, sel, full){
    return `
      <div class="pick-card ${cardVisualClass(base)} ${sel?'sel':''} ${(!sel&&full)?'full':''}"
           data-action="toggle-pick" data-group="${group}" data-name="${base.name}">
        <div class="pick-cost">${base.cost}</div>
        <div class="pick-body">
          <div class="pick-name">${base.name}</div>
          <div class="pick-desc">${base.desc}</div>
        </div>
      </div>`;
  }
  function renderDeckBuild(st){
    /* 떠오른 후보만 늘어놓는다 — 덱에 없는 나머지는 이 판에서는 보이지도 않는다 */
    const offerRows = (group, list, got, full) =>
      (st.offers[group]||[]).map(n=>{
        const b = list.find(c=>c.name===n);
        return b ? pickRow(group, b, got.includes(n), full) : '';
      }).join('');

    const sects = st.selected.map(cid=>{
      const def = CLASS_DEFS[cid];
      const got = st.picks[cid] || [];
      const full = got.length >= PICKS_PER_CLASS;
      return `
        <div class="deck-sect">
          <div class="deck-sect-head">
            <div class="portrait portrait-${cid}" style="width:24px;height:24px;margin:0;">${CLASS_ICON[cid]}</div>
            <span class="deck-sect-name">${def.name}</span>
            <span class="deck-count ${full?'done':''}">${got.length}/${PICKS_PER_CLASS}</span>
