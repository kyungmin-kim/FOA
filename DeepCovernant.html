  /* 효과미상은 한 턴의 교란일 뿐, 덱 전체가 영구히 오염되지는 않는다. */
  const UNKNOWN_CARD_MAX_PER_TURN = 3;
  /* 중층의 기존 15% 빈도는 절반으로 낮춘다. 하지만 심해와 끝없는 심연에서는
     심연의 관측이 강해지므로 다시 가파르게 늘어난다. */
  const UNKNOWN_CARD_CHANCE = {'중층':0.075, '심해':0.12, '끝없는 심연':0.18};
  /* 되돌릴 수 없는 카드는 가리지 않는다. 비상 탈출은 무엇인지 모른 채 눌렀다가
     대원과 유물을 잃는 카드라, 교란의 재미가 아니라 사고가 된다. */
  function canBeContaminated(card){ return !!card && card.type !== 'emergency_escape'; }
  function drawNextBattleCard(){
    const b = S.battle;
    /* 한도에 닿은 희귀 카드는 버린 더미로 잠시 보내고 일반 카드를 계속 찾는다.
       덱이 희귀 카드만 남은 경우에는 빈 손패를 반환하며, 다음 전투에서 제한이 초기화된다. */
    let attempts = b.deck.length + b.discard.length;
    while(attempts-- > 0){
      if(b.deck.length===0){
        if(b.discard.length===0) return null;
        b.deck = shuffleBattleDeck(b.discard); b.discard=[];
      }
      const c = b.deck.pop();
      if(isRareBattleCard(c)){
        const counts = rareDrawCounts(b);
        const key = rareDrawKey(c);
        if((counts[key]||0) >= rareDrawLimit(c)){
          b.discard.push(c);
          continue;
        }
        /* 이미 써 본 카드는 쓴 횟수만큼 꺾인 확률을 통과해야 손에 들어온다 */
        const uses = rareUseCounts(b)[key] || 0;
        if(uses > 0 && Math.random() >= rareRedrawChance(uses)){
          b.discard.push(c);
          continue;
        }
        counts[key] = (counts[key]||0) + 1;
      }
      c.contaminated = false;
      const unknownCount = b.hand.filter(card=>card.contaminated).length;
      const unknownChance = UNKNOWN_CARD_CHANCE[b.tier] || 0;
      if(canBeContaminated(c) && unknownCount < UNKNOWN_CARD_MAX_PER_TURN && Math.random() < unknownChance) c.contaminated = true;
      return c;
    }
    return null;
  }
  function drawHand(n){
    const b = S.battle;
    if(!b || n<=0) return;
    if(b.pendingDraw){ b.pendingDraw.remaining += n; return; }
    for(let left=n;left>0;left--){
      const c = drawNextBattleCard();
      if(!c) break;
      if(b.hand.length>=HAND_LIMIT){
        b.pendingDraw = {card:c, remaining:left-1};
        return;
      }
      b.hand.push(c);
    }
  }
  function replaceForPendingDraw(handUid){
    const b = S.battle;
    if(!b || !b.pendingDraw) return false;
    const idx = b.hand.findIndex(c=>c.uid===handUid);
    if(idx<0) return false;
    const removed = b.hand[idx];
    const incoming = b.pendingDraw.card;
    const remaining = b.pendingDraw.remaining;
    b.hand.splice(idx,1, incoming);
    b.discard.push(removed);
    b.pendingDraw = null;
    pushLog(`${removed.name}을(를) 버리고 ${incoming.name}을(를) 받았다.`);
    drawHand(remaining);
    return true;
  }

  /* 로그가 화면 한복판으로 나왔으니 조사도 제대로 붙인다 — 받침 유무로 갈라준다 */
  function hasJong(s){
    if(!s) return false;
    const c = s.charCodeAt(s.length-1);
    if(c < 0xAC00 || c > 0xD7A3) return false;     /* 한글 음절이 아니면 판단 보류 */
    return (c - 0xAC00) % 28 !== 0;
  }
  function ga(n){ return n + (hasJong(n) ? '이' : '가'); }
  function eul(n){ return n + (hasJong(n) ? '을' : '를'); }

  /* 전투 로그 — 적이 여럿이면 한 턴에 여러 줄이 쏟아지므로 최근 3줄을 모아 보여준다 */
  function pushLog(msg){
    if(!msg) return;
    if(!S.logLines) S.logLines = [];
    S.logLines.push(msg);
    while(S.logLines.length > 3) S.logLines.shift();
    S.logMsg = msg;
  }
  function clearLog(){ S.logLines = []; }

  function aliveParty(){ return S.party.filter(p=>p && p.alive); }
  function rearTarget(){ const a=aliveParty(); return a.length? a[a.length-1] : null; }
  function lowestHpTarget(){ const a=aliveParty(); if(!a.length) return null; return a.reduce((x,p)=>p.hp<x.hp?p:x, a[0]); }

  /* ============ 피격 반응 ============
     맞는 쪽이 굴린다: 회피 → 흘려막기 → 그래도 맞으면 반격.
     반격은 자기 열에서 상대 열까지 손이 닿을 때만 나간다.
     반격에 대한 재반격은 없다 (무한 연쇄 방지). */
  function markReact(unit, kind){
    unit.react = {kind:kind};
  }
  /* 표식은 '방금 무슨 일이 있었는지'를 보여주므로, 턴 번호가 아니라 행동 단위로 지운다.
     적 턴에 아군이 피하거나 받아친 것은 그 판정이 끝난 뒤 턴 번호가 올라간 다음에야
     그려진다 — 턴을 대조해 지우면 아군 표식만 영영 뜨지 않았다.
     그래서 다음 행동(카드 사용·턴 종료)이 시작될 때 한 번에 걷는다. */
  function clearReacts(){
    const b = S.battle;
    if(!b) return;
    S.party.forEach(p=>{ if(p) p.react = null; });
    (b.enemies||[]).forEach(en=>{ if(en) en.react = null; });
  }
  function canRiposte(defender, defRank, attacker, atkRank){
    if(!attacker || !attacker.alive) return false;
    return canActFrom(defender, defRank) && canHitRank(defender, atkRank);
  }
  /* ============ 크리티컬 ============
     아주 드물게 한 방이 깊게 들어간다. 아군도 적도 같은 문을 지나므로 확률은 같다.
     배율은 1.5~3.0 을 굴리되 최종 피해는 원래의 두 배를 넘지 않는다 — 굴림의 폭은
     넓게 두고 천장만 낮춰, 터졌을 때 늘 아프되 한 방에 판이 뒤집히지는 않게 한다.
     회피한 공격은 애초에 닿지 않았으므로 굴리지 않는다. */
  const CRIT_CHANCE   = 0.008;   /* 1% 이하 */
  const CRIT_MULT_MIN = 1.5;
  const CRIT_MULT_MAX = 3.0;
  const CRIT_MULT_CAP = 2.0;
  function rollCritMultiplier(){
    if(Math.random() >= CRIT_CHANCE) return 1;
    return Math.min(CRIT_MULT_MIN + Math.random()*(CRIT_MULT_MAX-CRIT_MULT_MIN), CRIT_MULT_CAP);
  }

  /* 회피/흘림 판정 + 방어도 소모. 실제 체력 차감은 호출부에서 한다. */
  /* 결과에는 실제로 깎인 피해(dealt)뿐 아니라 '무엇을 면했는지'도 함께 담는다.
     회피로 통째로 피한 양(avoided), 흘림으로 깎아낸 양(reduced) — 화면에 그 수치를
     띄워 줘야 왜 체력이 예상만큼 줄지 않았는지가 읽힌다. */
  function resolveIncoming(defender, amount){
    const rc = reactOf(defender);
    if(Math.random() < rc.dodge){
      markReact(defender, 'dodge');
      return {dealt:0, kind:'dodge', avoided:amount, reduced:0, crit:false};
    }
    let dmg = amount;
    let kind = 'hit';
    let reduced = 0;
    /* 크리티컬은 흘림·방어보다 먼저 부풀린다 — 깊게 들어간 한 방을 그 뒤에 막아 내는 순서다 */
    const critMult = rollCritMultiplier();
    const crit = critMult > 1;
    if(crit) dmg = Math.max(1, Math.round(dmg * critMult));
    if(Math.random() < rc.guard){
      const halved = Math.max(1, Math.round(dmg*0.5));
      reduced = dmg - halved;
      dmg = halved;
      markReact(defender, 'guard');
      kind = 'guard';
    }
    if(defender.block > 0){
      const absorbed = Math.min(defender.block, dmg);
      defender.block -= absorbed;
      dmg -= absorbed;
    }
    return {dealt:dmg, kind:kind, avoided:0, reduced:reduced, crit:crit};
  }

  /* 전사한 전문가는 자신이 다루던 기술도 함께 잃는다.
     합성·강화 카드는 owner 값으로 병과를 보존하므로 같은 경로로 모두 제거된다. */
  function purgeDeadClassCards(hero){
    if(!hero || !hero.cls || !S || S.prologue) return;
    const cls = hero.cls;
    const before = S.runDeck.length;
    S.runDeck = S.runDeck.filter(c=>c.owner!==cls);
    if(S.setup && S.setup.picks) delete S.setup.picks[cls];

    const b = S.battle;
    if(b){
      ['deck','hand','discard'].forEach(zone=>{
        b[zone] = (b[zone]||[]).filter(c=>c.owner!==cls);
      });
      if(b.pendingCardUid && !b.hand.some(c=>c.uid===b.pendingCardUid)){
        b.pendingCardUid = null;
        b.pendingDomain = null;
      }
    }
    if(before>S.runDeck.length) pushLog(`${hero.name}의 카드가 심연에 잠겼다.`);
  }

  function applyDamageToHero(hero, amount, opts){
    opts = opts || {};
    const stress = opts.stress!==false;
    const attacker = opts.from || null;
    if((hero.invulnerableTurns||0) > 0){
      queueFx('guard', hero);
      pushLog(`${ga(hero.name)} 침몰한 성궤의 보호를 받아 피해를 무시한다.`);
      return {dealt:0, kind:'invulnerable'};
    }
    /* 정신이 함몰되면 몸도 함께 무너진다. 방어·흘림 판정 전에 원피해가 50% 늘어난다. */
    if(hero.collapsed) amount = Math.round(amount * 1.5);
    const res = resolveIncoming(hero, amount);

    if(res.kind==='dodge'){
      queueFx('dodge', hero, res.avoided);
      pushLog(`${ga(hero.name)} 몸을 비틀어 피했다.`);
      triggerBulwarkRiposte(hero, attacker, opts);
      return res;
    }
    hero.hp = Math.max(0, hero.hp - res.dealt);
    if(res.dealt>0){
      flash('red');
      queueFx('impact', hero, res.dealt, res.crit);
      if(res.crit) pushLog(`급소를 찔렸다 — ${hero.name}이(가) 치명타로 ${res.dealt} 피해.`);
      if(stress) addDp(hero, 4);
    }
    if(res.kind==='guard'){ queueFx('guard', hero, res.reduced); pushLog(`${ga(hero.name)} 흘려 막았다. (${res.dealt} 피해)`); }
    if(hero.hp<=0 && hero.alive){
      hero.alive = false;
      purgeDeadClassCards(hero);
      queueFx('death', hero);
    }
    checkCollapse(hero);

    if(triggerBulwarkRiposte(hero, attacker, opts)) return res;

    if(hero.alive && opts.riposte!==false && canRiposte(hero, heroRank(hero), attacker, foeRank(attacker))
       && Math.random() < reactOf(hero).riposte){
      const rip = reactOf(hero).rip;
      markReact(hero, 'riposte');
      queueFx('riposte', hero, rip);
      /* 반격 선언 뒤의 회피·흘림 결과가 마지막 줄에 남도록 한다. */
      pushLog(`${ga(hero.name)} 곧바로 받아친다. (반격 ${rip})`);
      damageEnemy(attacker, rip, {riposte:true});
    }
    return res;
  }
  /* 침수된 방벽은 일반 반격과 달리 거리·확률을 묻지 않는다. 적이 공격을 선언한
     순간 벽에 닿아 되튄다. 반격끼리 되받아치는 무한 연쇄는 기존 규칙처럼 막는다. */
  function triggerBulwarkRiposte(hero, attacker, opts){
    const rip = hero && hero.bulwarkRiposte || 0;
    if(!rip || !hero.alive || !attacker || !attacker.alive || opts.riposte===false) return false;
    markReact(hero, 'riposte');
    queueFx('riposte', hero, rip);
    pushLog(`${ga(hero.name)} 침수된 방벽을 되울린다. (${rip} 반격)`);
    damageEnemy(attacker, rip, {riposte:true});
    return true;
  }
  /* 심도압박은 항상 0~100의 정수로 유지한다. 유물의 백분율 배율이 소수점을 만들 수 있다. */
  function setDp(hero, value){
    const safeValue = Number.isFinite(value) ? value : 0;
    hero.dp = Math.round(Math.max(0, Math.min(100, safeValue)));
    return hero.dp;
  }
  /* 심도압박 상승은 전부 이 문을 지난다 — 유물로 무뎌지는 지점이 한 곳뿐이도록 */
  function addDp(hero, amount){
    setDp(hero, hero.dp + amount * relicMul('dpMul', hero));
  }
  function checkCollapse(hero){
    if(hero.dp>=100 && !hero.collapsed){
      hero.collapsed = true; setDp(hero, 70);
      pushLog(`${hero.name}의 정신이 함몰됐다. 가하는 피해 -50% · 받는 피해 +50%.`);
    }
  }
  function damageEnemy(en, dmg, opts){
    opts = opts || {};
    flash('white');
    const res = resolveIncoming(en, dmg);
    if(res.kind==='dodge'){
      queueFx('dodge', en, res.avoided);
      pushLog(`${ga(foeDisplayName(en))} 미끄러지듯 피한다.`);
      return null;
    }
    en.hp = Math.max(0, en.hp - res.dealt);
    if(res.dealt>0){
      queueFx('impact', en, res.dealt, res.crit);
      if(res.crit) pushLog(`급소를 꿰뚫었다 — ${foeDisplayName(en)}에게 치명타로 ${res.dealt} 피해.`);
    }
    if(res.kind==='guard'){
      queueFx('guard', en, res.reduced);
      pushLog(`${ga(foeDisplayName(en))} 몸을 틀어 흘려낸다. (${res.dealt} 피해)`);
    }

    if(en.hp<=0){
      en.alive = false;
      queueFx('death', en);
    } else if(en.kind==='boss' && en.phase===1 && en.hp <= en.maxHp*0.5){
      en.phase = 2;
      en.atk = Math.round(en.atk*1.2);
      en.block = Math.max(en.block, 6);
      en.intent = pickIntent(en);
      pushLog(en.hiddenName
        ? `${en.name}의 흉부가 열리며 단안이 당신을 향한다. 그것은 심연이 아니라, 심연을 지키던 인간이었다...!`
        : `${ga(en.name)} 진짜 모습을 드러낸다...!`);
    }

    const hero = opts.from || null;
    if(en.alive && !opts.riposte && hero && hero.alive
       && canRiposte(en, foeRank(en), hero, heroRank(hero))
       && Math.random() < reactOf(en).riposte){
      const rip = reactOf(en).rip;
      markReact(en, 'riposte');
      queueFx('riposte', en, rip);
      pushLog(`${ga(foeDisplayName(en))} 이빨을 드러내며 받아친다. (반격 ${rip})`);
      applyDamageToHero(hero, rip, {stress:false, riposte:false});
    }
    return res;
  }

  function isEliteEnemy(en){
    const b = S && S.battle;
    return !!(en && (en.kind==='elite' || (b && b.node && b.node.type==='elite' && b.enemies[0]===en)));
  }
  /* 섬멸은 피해가 아니라 제거다. 회피·흘림·방어와 반격을 거치지 않는다. */
  function annihilateEnemy(en){
    if(!en || !en.alive) return false;
    en.hp = 0;
    en.block = 0;
    en.alive = false;
    queueFx('death', en);
    return true;
  }

  function isAttackCard(card){
    return card.type==='attack' || card.type==='fusion_attack' || card.type==='epic_attack' ||
      card.type==='drowned_sentence' || card.type==='abyssal_verdict' || card.type==='thousand_maws_tide' ||
      card.type==='reroll_intent';
  }
  function ownerOf(card){ return S.party.find(p=>p && p.id===card.owner) || null; }

  /* 이 카드가 지금 실제로 닿을 수 있는 적들 */
  function enemyTargetsFor(card){
    const b = S.battle;
    if(!b) return [];
    /* 합성 공격은 특정 병과가 휘두르는 무기가 아니라, 합성으로 부른 심연 그 자체다. */
    if(card.type==='abyssal_verdict') return b.enemies.filter(e=>e.alive && e.kind!=='boss');
    if(card.type==='fusion_attack' || card.type==='epic_attack' || card.type==='drowned_sentence' || card.type==='thousand_maws_tide' || (card.type==='reroll_intent' && card.owner==='neutral')) return b.enemies.filter(e=>e.alive);
    const owner = ownerOf(card);
    if(!owner || !owner.alive) return [];
    if(!canActFrom(owner, heroRank(owner))) return [];
    return b.enemies.filter(e => e.alive && canHitRank(owner, foeRank(e)));
  }

  /* 못 내는 이유를 문장으로 — 카드에 그대로 찍어 보여준다 */
  function cardBlockReason(card){
    if(!isAttackCard(card)) return null;
    if(card.type==='fusion_attack' || card.type==='epic_attack' || card.type==='drowned_sentence' || card.type==='abyssal_verdict' || card.type==='thousand_maws_tide' || (card.type==='reroll_intent' && card.owner==='neutral')) return null;
    const owner = ownerOf(card);
    if(!owner || !owner.alive) return '시전자가 없다';
    const oRank = heroRank(owner);
    if(!canActFrom(owner, oRank)) return `${reachOf(owner).label} 병과는 ${rankName(oRank)}에서 못 친다`;
    if(!enemyTargetsFor(card).length) return '닿는 적이 없다';
    return null;
  }

  function canPlayCard(card){
    const b = S.battle;
    if(!b || b.over) return false;
    if(b.pendingDraw) return false;
    /* 프롤로그에서는 지금 배울 한 장만 켠다. 다른 카드로 우연히 넘기지 못하게 한다. */
    if(S.prologue){
      const step = S.prologue.stage;
      if(step==='brace' && card.name!=='놋쇠 벽') return false;
      if(step==='strike' && card.name!=='저주받은 조준') return false;
      if(step==='pressure' && card.name!=='속죄의 기도') return false;
      if(step!=='brace' && step!=='strike' && step!=='pressure') return false;
    }
    if(b.pendingCardUid && b.pendingCardUid!==card.uid) return false;
    if(b.ap + (b.tempAp||0) < card.cost) return false;
    if(cardBlockReason(card)) return false;
    return true;
  }

  function beginTargeting(cardUid, domain){ S.battle.pendingCardUid=cardUid; S.battle.pendingDomain=domain; }
  function cancelTargeting(){ if(S.battle){ S.battle.pendingCardUid=null; S.battle.pendingDomain=null; } }

  function resolveCard(cardUidVal, targetInfo){
    const b = S.battle;
    if(!b || b.over) return;
    const idx = b.hand.findIndex(c=>c.uid===cardUidVal);
    if(idx===-1) return;
    const card = b.hand[idx];
    if(!canPlayCard(card)) return;

    flyOutCard(cardUidVal);   /* 손패가 아직 그대로일 때 떠 둔다 */
    clearReacts();   /* 지난 행동의 표식을 걷고, 이 카드가 만든 것만 남긴다 */
    cancelTargeting();
    clearLog();
    /* 임시 AP 는 이 턴이 지나면 사라진다 — 먼저 쓴다 */
    let cost = card.cost;
    const fromTemp = Math.min(b.tempAp||0, cost);
    b.tempAp = (b.tempAp||0) - fromTemp;
    b.ap -= (cost - fromTemp);
    b.hand.splice(idx,1);
    b.discard.push(card);
    card.contaminated = false;
    noteRareCardUsed(card);   /* 다음부터 이 카드가 돌아올 확률이 꺾인다 */

    const owner = ownerOf(card);
    const reachable = enemyTargetsFor(card);

    /* 사거리 밖은 애초에 후보에 없다 */
    let enemyTarget = null;
    if(card.range==='melee' || card.range==='ranged'){
      if(card.range==='ranged' && targetInfo && targetInfo.enemyIdx!=null){
        const t = b.enemies[targetInfo.enemyIdx];
        if(t && reachable.indexOf(t)>=0) enemyTarget = t;
      }
      if(!enemyTarget) enemyTarget = reachable[0] || null;
    }

    let allyTarget = null;
    if(card.range==='support_ally'){
      if(targetInfo && targetInfo.allyId){ allyTarget = S.party.find(p=>p && p.id===targetInfo.allyId && p.alive) || null; }
      if(!allyTarget) allyTarget = lowestHpTarget();
    }

    /* 제 정신을 깎아 쓰는 카드는 공격만이 아니다 — 종류를 가리지 않고 먼저 치른다 */
    if(card.selfDp && owner && owner.alive){ addDp(owner, card.selfDp); checkCollapse(owner); }

    switch(card.type){
      case 'attack':
      case 'fusion_attack':
      case 'epic_attack': {
        let dmg = Math.round(card.dmg * relicMul('dmgMul', owner));
        if(owner && owner.collapsed) dmg = Math.round(dmg*0.5);
        if(card.range==='aoe'){
          /* 선언은 먼저, 회피·흘림·각성 같은 실제 결과는 처리 직후 뒤에 남긴다. */
          pushLog(`${card.name} — 닿는 적 ${reachable.length}체에게 ${dmg} 피해.`);
          reachable.slice().forEach(en=>damageEnemy(en, dmg, {from:owner}));
        } else if(enemyTarget){
          pushLog(`${card.name} — ${foeDisplayName(enemyTarget)}에게 ${dmg} 피해.`);
          damageEnemy(enemyTarget, dmg, {from:owner});
          if(card.selfBlock && owner && owner.alive) owner.block += card.selfBlock;
        }
        break;
      }
      case 'drowned_sentence': {
        if(enemyTarget){
          const dmg = Math.round(card.dmg * relicMul('dmgMul', owner));
          const splash = Math.max(1, Math.round(dmg * card.splashRatio));
          const targetIndex = b.enemies.indexOf(enemyTarget);
          pushLog(`${card.name} — ${foeDisplayName(enemyTarget)}에게 ${dmg} 피해, 양옆에 ${splash} 파문 피해.`);
          damageEnemy(enemyTarget, dmg, {from:owner});
          [targetIndex-1, targetIndex+1].forEach(i=>{
            const side = b.enemies[i];
            if(side && side.alive) damageEnemy(side, splash, {from:owner});
          });
        }
        break;
      }
      case 'block': { if(owner&&owner.alive){ owner.block+=Math.round(card.block*relicMul('blockMul', owner)); pushLog(`${owner.name}이 방어 태세를 취한다.`); } break; }
      case 'block_party': {
        aliveParty().forEach(p=>{
          const grantedBlock = Math.round(card.block*relicMul('blockMul', p));
          p.block += grantedBlock;
          if(card.riposteRatio) p.bulwarkRiposte = Math.max(p.bulwarkRiposte||0, Math.round(grantedBlock*card.riposteRatio));
          else if(card.riposte) p.bulwarkRiposte = Math.max(p.bulwarkRiposte||0, card.riposte);
        });
        const riposte = card.riposteRatio ? Math.round(card.block*card.riposteRatio) : card.riposte;
        pushLog(riposte ? `파티 전체가 방벽을 세운다. 다음 공격은 ${riposte} 반격한다.` : '파티 전체가 대비한다.');
        break;
      }
      case 'heal': { if(allyTarget){ allyTarget.hp=Math.min(allyTarget.maxHp, allyTarget.hp+Math.round(card.heal*relicMul('healMul', allyTarget))); queueFx('heal', allyTarget); pushLog(`${allyTarget.name}의 상처를 봉합했다.`); } break; }
      case 'heal_party': { aliveParty().forEach(p=>{ p.hp=Math.min(p.maxHp,p.hp+Math.round(card.heal*relicMul('healMul', p))); queueFx('heal',p); }); pushLog('파티 전체의 상처를 봉합했다.'); break; }
      case 'calm': { if(allyTarget){ setDp(allyTarget, allyTarget.dp-card.calm); queueFx('calm', allyTarget); pushLog(`${allyTarget.name}이 숨을 고른다.`); } break; }
      case 'calm_party': { aliveParty().forEach(p=>{ setDp(p, p.dp-card.calm); queueFx('calm', p); }); pushLog('파티 전체가 진정된다.'); break; }
      case 'fuse_support': { if(allyTarget){ allyTarget.hp=Math.min(allyTarget.maxHp, allyTarget.hp+Math.round(card.heal*relicMul('healMul', allyTarget))); setDp(allyTarget, allyTarget.dp-card.calm); queueFx('heal', allyTarget); pushLog(`${allyTarget.name}이 정화와 회복을 동시에 받는다.`); } break; }
      case 'nameless_hymn': {
        const cleared = aliveParty().reduce((sum,p)=>sum+(p.dp||0),0);
        aliveParty().forEach(p=>{ setDp(p, 0); queueFx('calm', p); });
        const dmg = Math.floor(cleared/3);
        if(dmg>0) reachable.slice().forEach(en=>damageEnemy(en, dmg, {from:owner}));
        pushLog(`${card.name} — 심도압박 ${cleared}을 지우고, 모든 적에게 ${dmg} 피해.`);
        break;
      }
      case 'saints_last_prayer': {
        const regenPerTurn = Math.floor(card.regenTotal/card.regenTurns);
        aliveParty().forEach(p=>{
          const immediate = Math.round(p.maxHp*card.healRatio*relicMul('healMul', p));
          p.hp = Math.min(p.maxHp, p.hp+immediate);
          p.saintRegen = {amount:regenPerTurn, remaining:card.regenTotal-(regenPerTurn*card.regenTurns), turns:card.regenTurns};
          queueFx('heal', p);
        });
        pushLog(`${card.name} — 파티 전체가 최대 체력의 50%를 회복하고 3턴 동안 총 ${card.regenTotal}을 더 회복한다.`);
        break;
      }
      case 'sunken_ark': {
        const arkTurns = card.turns || 1;
        aliveParty().forEach(p=>{ p.invulnerableTurns = Math.max(p.invulnerableTurns||0, arkTurns); queueFx('guard', p); });
        pushLog(`${card.name} — 다가오는 적 턴 ${arkTurns}회 동안 파티 전체가 무적이 된다.`);
        break;
      }
      case 'thousand_maws_tide': {
        const targetIndex = enemyTarget ? b.enemies.indexOf(enemyTarget) : -1;
        const victims = [targetIndex-1,targetIndex+1].map(i=>b.enemies[i]).filter(en=>en && en.alive && en.kind!=='boss' && !isEliteEnemy(en));
        victims.forEach(annihilateEnemy);
        pushLog(victims.length ? `${card.name} — ${victims.map(foeDisplayName).join(' · ')}을(를) 파도 아래로 섬멸했다.` : `${card.name} — 섬멸할 일반 적이 양옆에 없다.`);
        break;
      }
      case 'abyssal_verdict': {
        if(enemyTarget && enemyTarget.kind!=='boss'){
          const name = foeDisplayName(enemyTarget);
          annihilateEnemy(enemyTarget);
          pushLog(`${card.name} — ${name}을(를) 심연으로 섬멸했다.`);
        }
        break;
      }
      case 'double_ap': {
        const usable = Math.max(0, b.ap + (b.tempAp||0));
        b.ap = usable * 2; b.tempAp = 0;
        pushLog(`태양 없는 정오 — 이 턴에 쓸 수 있는 AP가 ${usable}에서 ${b.ap}(으)로 늘었다.`);
        break;
      }
      case 'legendary_sanctuary': {
        aliveParty().forEach(p=>{
          p.hp=Math.min(p.maxHp,p.hp+Math.round(card.heal*relicMul('healMul', p)));
          setDp(p, p.dp-card.calm);
          p.block+=Math.round(card.block*relicMul('blockMul', p));
          queueFx('heal',p); queueFx('calm',p);
        });
        pushLog('마지막 잠수종이 닫히며 인양대 전체를 감싼다.');
        break;
      }
      case 'emergency_escape': { attemptEmergencyEscape(); return; }
      case 'draw': { drawHand(card.draw); pushLog('카드를 더 끌어온다.'); break; }
      case 'foresight': { drawHand(card.draw); if(owner&&owner.alive){ setDp(owner, owner.dp-card.calm); } pushLog('마음을 가라앉히며 앞일을 살핀다.'); break; }
      case 'reroll_intent': { if(enemyTarget){ enemyTarget.intent = pickIntent(enemyTarget); pushLog(`${foeDisplayName(enemyTarget)}의 운명이 뒤틀린다.`); } break; }
      case 'swap': {
        if(allyTarget){
          const targetIdx = S.party.indexOf(allyTarget);
          if(targetIdx > 0){ const t=S.party[0]; S.party[0]=S.party[targetIdx]; S.party[targetIdx]=t; pushLog(`${ga(allyTarget.name)} 전열로 나선다.`); }
          else if(targetIdx===0 && S.party.length>1){ const t=S.party[0]; S.party[0]=S.party[1]; S.party[1]=t; pushLog('전열과 중열이 자리를 바꾼다.'); }
        }
        break;
      }
    }
    /* 자리가 바뀌면 사거리가 바뀌므로 예고를 다시 계산한다 */
    if(card.type==='swap') rollIntents();

    if(S.prologue && S.prologue.stage==='brace' && card.name==='놋쇠 벽'){
      S.prologue.stage = 'braceDone';
      pushLog('방어가 피해보다 먼저 닳는다. 이제 예고된 공격을 받아 보자.');
    }
    if(S.prologue && S.prologue.stage==='strike' && card.name==='저주받은 조준'){
      S.prologue.stage = 'pressure';
      /* 잠식(전투 바깥의 귀환 제한)과 심도압박(개인 상태)을 섞지 않는다.
         조준의 대가가 지도 제작자 개인의 게이지에 남도록 눈에 보이는 값으로 고정한다. */
      const oracle = S.party.find(p=>p.cls==='oracle');
      if(oracle) setDp(oracle, Math.max(oracle.dp, 42));
      b.hand = prologueHandForCalm();
      pushLog('힘을 빌린 대가로 심도압박이 올랐다. 사제의 기도로 이를 가라앉힐 수 있다.');
    }
    if(S.prologue && S.prologue.stage==='pressure' && card.name==='속죄의 기도'){
      S.prologue.stage = 'abyss';
      pushLog('심도압박은 방어로 막을 수 없지만, 진정 카드로 되돌릴 수 있다.');
    }

    if(b.enemies.every(e=>!e.alive)){ winBattle(); }
    render();
  }

  function executeEnemyTurn(){
    const b = S.battle;
    if(!b || b.over) return;
    clearLog();
    b.enemies.forEach(en=>{
      if(!en.alive) return;
      en.block = 0;
      const intent = en.intent;
      if(!intent) return;

      if(intent.type==='attack_reach'){
        const t = pickHeroTarget(en);
        if(t){
          pushLog(`${ga(foeDisplayName(en))} ${rankName(heroRank(t))}의 ${eul(t.name)} 노린다. (${intent.val})`);
          applyDamageToHero(t, intent.val, {from:en});
        } else pushLog(`${ga(foeDisplayName(en))} 허공을 할퀸다 — 닿지 않는다.`);

      } else if(intent.type==='double_attack_reach'){
        const t = pickHeroTarget(en);
        if(t){
          pushLog(`${ga(foeDisplayName(en))} ${eul(t.name)} 두 번 후려친다.`);
          applyDamageToHero(t, intent.val, {from:en});
          if(t.alive && en.alive) applyDamageToHero(t, intent.val, {from:en});
        } else pushLog(`${ga(foeDisplayName(en))} 헛손질한다.`);

      } else if(intent.type==='attack_all'){
        const pool = heroesInReach(en);
        if(pool.length){
          pushLog(`${ga(foeDisplayName(en))} 닿는 모두를 집어삼킨다. (전체 ${intent.val})`);
          pool.forEach(p=>{ if(en.alive && p.alive) applyDamageToHero(p, intent.val, {from:en}); });
        } else pushLog(`${foeDisplayName(en)}의 포효가 빈 물살을 때린다.`);

      } else if(intent.type==='whisper_random'){
        const alive = aliveParty();
        if(alive.length){
          const t = alive[Math.floor(Math.random()*alive.length)];
          pushLog(`무언가 ${t.name}의 귀에 속삭인다. (심도압박 +${intent.val})`);
          addDp(t, intent.val); checkCollapse(t);
        }

      } else if(intent.type==='whisper_rear'){
        const t = rearTarget();
        if(t){
          pushLog(`${ga(foeDisplayName(en))} 후미의 ${t.name}에게 속삭인다. (심도압박 +${intent.val})`);
          addDp(t, intent.val); checkCollapse(t);
        }

      } else if(intent.type==='snipe_lowest'){
        const pool = heroesInReach(en);
        if(pool.length){
          const t = pool.reduce((x,p)=> p.hp<x.hp ? p : x, pool[0]);
          pushLog(`${ga(foeDisplayName(en))} 가장 약한 ${eul(t.name)} 저격한다. (${intent.val})`);
          applyDamageToHero(t, intent.val, {stress:false, from:en});
        } else pushLog(`${ga(foeDisplayName(en))} 겨눌 표적을 찾지 못한다.`);

      } else if(intent.type==='guard_up'){
        en.block += intent.val;
        pushLog(`${ga(foeDisplayName(en))} 몸을 웅크린다. (방어 +${intent.val})`);
      }
    });
    /* 아군의 반격으로 마지막 적이 쓰러질 수 있다.
       전멸 확인을 아군 쪽만 하면, 적이 다 죽었는데 전투가 끝나지 않고
       빈 대열을 마주한 채 턴만 넘어간다. */
    if(checkPartyWipe()) return;
    if(b.enemies.every(e=>!e.alive)) winBattle();
  }

  function checkPartyWipe(){
    if(aliveParty().length===0){ triggerGameOver('파티 전원이 심연에 잠겼다.'); return true; }
    return false;
  }
  function triggerGameOver(reason){
    clearRun();
    S.loseReason = reason;
    if(S.battle) S.battle.over = true;
    S.screen = 'gameover';
  }
  const EMERGENCY_ESCAPE_CHANCE = {'표층':1, '중층':0.8, '심해':0.5, '끝없는 심연':0.1};
  function emergencyEscapeChance(tier){ return EMERGENCY_ESCAPE_CHANCE[tier] || 0.1; }
  /* 비상 탈출은 패배 판정이 아니라 버릴 수 있는 마지막 선택지다.
     조건·확률에 막히면 카드는 이미 소모되지만, 전투와 인양대는 그대로 남는다. */
  function failEmergencyEscape(reason){
    S.logMsg = reason;
    pushLog(reason);
    render();
    return false;
  }
  function attemptEmergencyEscape(){
    const b = S.battle;
    if(!b || b.over) return false;
    const badlyWounded = S.party.filter(p=>p && p.hp<=p.maxHp*0.5);
    if(badlyWounded.length>=2){
      return failEmergencyEscape('비상 탈출 실패 — 체력이 절반 이하인 대원이 둘 이상이다. 인양줄을 놓쳤다.');
    }
    const evacuees = S.party.filter(p=>p && p.alive && p.dp<50);
    if(!evacuees.length){
      return failEmergencyEscape('비상 탈출 실패 — 심도압박 50 미만인 대원이 없다. 누구도 인양줄을 붙잡지 못했다.');
    }
    const chance = emergencyEscapeChance(b.tier);
    if(Math.random()>=chance){
      return failEmergencyEscape(`${b.tier}의 수압이 인양줄을 끊었다. 비상 탈출에 실패했다. (성공 확률 ${Math.round(chance*100)}%)`);
    }
    b.over = true;
    const leftBehind = S.party.filter(p=>p && evacuees.indexOf(p)<0);
    const keptRelic = S.relics.length===1 ? S.relics[0] : null;
    S.emergencyExit = {tier:b.tier, chance:chance, evacuees:evacuees, leftBehind:leftBehind, keptRelic:keptRelic};
    /* 탐색 기록은 지우지 않는다 — 인양줄로 빠져나오는 것은 이 전투 하나뿐이다 */
    S.screen = 'emergencyExit';
    render();
    return true;
  }
  /* 비상 탈출은 탐색을 끝내지 않는다. 이 전투에서만 빠져나와 지도의 그 자리로
     돌아가고, 하던 탐색을 그대로 이어간다. 대신 값은 그 자리에서 치른다 —
     인양줄을 붙잡지 못한 사람은 두고 오고, 유물도 하나만 건져 올린다.
     두고 온 자리는 여관에서 새 사람을 앉히는 빈자리가 된다. */
  function finishEmergencyEscape(){
    const ex = S.emergencyExit;
    if(!ex) return;
    (ex.leftBehind || []).forEach(p=>{
      if(!p || !p.alive) return;
      p.alive = false;
      p.block = 0;
      purgeDeadClassCards(p);
    });
    S.emergencyExit = null;
    S.battle = null;
    /* 노드는 끝내지 않았다 — 지도로 돌아가면 그 갈림길 앞에 다시 선다 */
    S.pendingNode = null;
    S.screen = 'map';
  }

  function resolvePartyTurnEffects(){
    const healed = [];
    aliveParty().forEach(p=>{
      const regen = p.saintRegen;
      if(regen && regen.turns>0){
        const amount = regen.amount + (regen.remaining>0 ? 1 : 0);
        if(regen.remaining>0) regen.remaining--;
        regen.turns--;
        const before = p.hp;
        p.hp = Math.min(p.maxHp, p.hp+amount);
        if(p.hp>before){ queueFx('heal', p); healed.push(`${p.name} +${p.hp-before}`); }
        if(regen.turns<=0) delete p.saintRegen;
      }
      if((p.invulnerableTurns||0)>0) p.invulnerableTurns--;
    });
    if(healed.length) pushLog(`성자의 마지막 기도의 여운 — ${healed.join(' · ')}`);
  }

  function endPlayerTurn(){
    const b = S.battle;
    if(!b || b.over || b.pendingCardUid || b.pendingDraw) return;
    if(S.prologue && S.prologue.stage!=='braceDone') return;
    clearReacts();   /* 적 턴에 생길 표식만 남도록 먼저 걷는다 */
    b.hand.forEach(c=>{ c.contaminated = false; });
    b.discard.push(...b.hand); b.hand=[];

    executeEnemyTurn();
    /* 침수된 방벽의 강제 반격은 이 적 턴에만 유지된다. */
    S.party.forEach(p=>{ if(p) p.bulwarkRiposte = 0; });
    if(b.over){ render(); return; }
    resolvePartyTurnEffects();

    if(S.prologue && S.prologue.stage==='braceDone'){
      /* 이 한 턴은 잠식과 심도압박이 모두 보이도록 고정한다. */
      S.erosion = Math.min(100, S.erosion + 15);
      /* 놋쇠 벽(1 AP)을 쓰고 남긴 2 AP를 직접 보여준다. 다음 턴에는
         반투명 임시 AP 한 칸이 추가되어, 이월 규칙을 전투판에서 확인할 수 있다. */
      const carry = b.ap >= TEMP_AP_MIN ? TEMP_AP_CARRY : 0;
      b.turn = 2; b.ap = b.maxAp; b.tempAp = carry;
      b.hand = prologueHandForStrike();
      b.enemies[0].intent = {type:'attack_reach', val:14, label:'심연의 강타', ic:IC_HEAVY};
      b.enemies[1].intent = {type:'whisper_rear', val:10, label:'속삭임', ic:IC_GAZE};
      S.prologue.stage = 'strike';
      pushLog(carry ? 'AP를 2개 남겨 임시 AP +1을 얻었다. 반투명한 눈금은 이번 턴에만 쓸 수 있다.' : '잠식이 차오른다. 원거리 적은 후미의 정신을 노린다.');
      render();
      return;
    }

    const rise = b.tier==='중층' ? 2 : (b.node && b.node.type==='elite' ? 1 : 0);
    if(rise>0){ aliveParty().forEach(p=>{ addDp(p, rise); checkCollapse(p); }); }

    const maxed = addErosion(erosionRate());
    if(checkPartyWipe()){ render(); return; }
    if(maxed){ triggerGameOver('잠식이 한계에 다다랐다. 돌아갈 길이 사라졌다.'); render(); return; }

    aliveParty().forEach(p=>p.block=0);
    /* 정규 AP를 둘 이상 남겨도 보존되는 것은 한 칸뿐이다. 임시 AP 자체는 다시
       넘기지 않아, 행동력이 끝없이 쌓이지 않는다. */
    const carry = b.ap >= TEMP_AP_MIN ? TEMP_AP_CARRY : 0;
    b.turn += 1;
    b.ap = b.maxAp;
    b.tempAp = carry;
    rollIntents();
    drawHand(handSize());
    render();
  }

  function winBattle(){
    /* 반격으로 끝난 전투도 일반 공격으로 끝난 전투와 같은 경로를 탄다.
       이미 끝난 전투를 다시 예약하지 않아, 반격 처리 뒤의 턴 정산이나
       늦게 도착한 타이머가 다음 화면을 덮어쓰지 않게 한다. */
    const b = S.battle;
    if(!b || b.over) return;
    b.over = true;
    pushLog('적이 물거품이 되어 흩어진다.');
    setTimeout(()=>{
      if(!S || S.battle!==b || S.screen!=='battle') return;
      completeCurrentNode();
      render();
    }, 550);
  }

  /* ============ MAP FLOW ============ */
  /* 갈림길은 한 번 뽑으면 고정된다 — 다시 그린다고 선택지가 바뀌면 고를 이유가 없다 */
  function availableNodes(){
    if(!S.mapChoices) S.mapChoices = rollChoices();
    return S.mapChoices;
  }
  function aftermathActionsFor(node){
    if(node.type==='rest') return 0;
    if(node.type==='elite' || node.boss) return 2;
    return 1;
  }
  function enterMapNode(id){
    const node = availableNodes().find(n=>n.id===id);
    if(!node) return;
    S.pendingNode = node;
    if(node.type==='battle' || node.type==='elite'){
      startBattle(node);
    } else if(node.type==='rest'){
      if(addErosion(EROSION_REST)){ triggerGameOver('숨을 고르는 사이 잠식이 한계를 넘었다.'); return; }
      S.rest = {choice:null};
      S.screen = 'rest';
    } else if(node.type==='treasure'){
      completeCurrentNode();
    }
  }
  function completeCurrentNode(){
    const node = S.pendingNode;
    S.mapVisited.push(node);
    S.mapChoices = null;
    S.stepInChapter += 1;
    S.party.forEach(p=>{ if(p) p.block=0; });
    const actions = aftermathActionsFor(node);
    const dropped = isBossTier(node) ? dropRelic() : null;
    const cardOffer = (node.type==='battle' || node.type==='elite') && S.runDeck.length<MAX_DECK_SIZE ? cardRewardOffer(node) : null;
    const surfaced = S.stepInChapter >= chapter().length;
    S.afterAftermath = !surfaced ? 'map' : (isFinalChapter() ? 'result' : 'escape');
    if(surfaced){
      const finalAbyss = isFinalChapter();
      const growth = rewardExtractionSurvivors(finalAbyss ? 2 : 1.3, finalAbyss);
      if(finalAbyss) S.finalGrowth = growth;
      else {
        const marker = markerRewardForChapter(S.chapter);
        S.escape = {offer:relicOffer(), taken:null, plates:unlockCandidates().map(d=>d.id), growth:growth, marker:marker};
      }
    }
    if(actions>0){
      S.aftermath = {actionsLeft:actions, selecting:null, fuseSelected:[], reveal:null, dropped:dropped, cardOffer:cardOffer, cardTaken:null};
      S.screen = 'aftermath';
    } else {
      S.screen = S.afterAftermath;
    }
    /* 자리가 없으면 무엇을 버릴지 먼저 고르고, 그다음 원래 가려던 화면으로 */
    offerRelic(dropped, S.screen);
  }
  function proceedAfterAftermath(){
    S.aftermath = null;
    S.screen = S.afterAftermath || 'map';
    /* 끝난 런은 이어받을 것이 없다 */
    if(S.screen==='result') clearRun();
    render();
  }

  /* 인양 — 수면으로 올라왔으니 잠식 시계가 처음으로 돌아가고, 숨과 상처를 어느 정도 되찾는다.
     이게 없으면 뒤로 갈수록 길어지는 구역을 버틸 방법이 없다. */
  function enterTavern(){
    /* plates 는 아직 고르지 않은 젖은 명패들, unlocked 는 이미 고른 사람.
       고르기 전에는 여관에 들어서자마자 명패 벽이 먼저 열린다. */
    S.tavern = {recruited:[], slot:null, plates:(S.escape && S.escape.plates) ? S.escape.plates.slice() : [], unlocked:null, seated:false};
    S.screen = 'tavern';
  }

  function descendNextChapter(){
    S.chapter += 1;
    S.stepInChapter = 0;
    S.mapChoices = null;
    S.pendingNode = null;
    S.escape = null;
    S.tavern = null;
    S.erosion = 0;
    S.party.forEach(p=>{
      if(!p || !p.alive) return;
      p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp*0.4));
      setDp(p, p.dp - 30);
      p.block = 0;
      p.collapsed = false;
    });
    S.screen = 'map';
  }

  function chooseRest(kind){ S.rest.choice = kind; }
  function confirmRest(){
    const alive = aliveParty();
    if(S.rest.choice==='heal'){ alive.forEach(p=>p.hp=Math.min(p.maxHp,p.hp+Math.round(10*relicMul('healMul', p)))); S.logMsg='상처를 돌본다.'; }
    else if(S.rest.choice==='calm'){ alive.forEach(p=>setDp(p, p.dp-18)); S.logMsg='잠시 눈을 감고 숨을 고른다.'; }
    completeCurrentNode();
    render();
  }

  /* ============ UPGRADE / FUSION ============ */
  const MAX_UPGRADE_LEVEL = 5;
  /* 예전 저장의 upgraded:true는 +1로 읽는다. 이름은 표시용이므로 따로 원래 이름을 남긴다. */
  function upgradeLevel(card){ return Number.isFinite(card.upgradeLevel) ? card.upgradeLevel : (card.upgraded ? 1 : 0); }
  function baseCardName(card){ return card.baseName || String(card.name||'').replace(/\++$/, ''); }
  /* 전투 덱에는 같은 카드가 세 장씩 들어가지만, 인양 뒤 관리 화면에서는
     같은 등급의 카드들을 한 줄로 묶어 필요한 정보만 보여 준다. */
  function cardManageKey(card){ return `${card.owner}|${baseCardName(card)}|${upgradeLevel(card)}`; }
  function groupDeckCards(cards){
    const groups = new Map();
    cards.forEach(card=>{
      const key = cardManageKey(card);
      if(!groups.has(key)) groups.set(key, {key:key, defId:card.defId, card:card, defIds:[], name:card.name, owner:card.owner, level:upgradeLevel(card), count:0});
      const group = groups.get(key);
      group.defIds.push(card.defId);
      group.count++;
    });
    return Array.from(groups.values());
  }
  /* 강화는 덱 속 개별 카드 한 장만 대상으로 삼는다.
     목록은 같은 종류를 묶되, 실제 강화는 그 묶음 안의 카드 한 장에만 적용한다. */
  function groupedUpgradeOptions(){
    return groupDeckCards(S.runDeck.filter(c=>upgradeLevel(c)<MAX_UPGRADE_LEVEL && !c.unupgradable));
  }
  /* +3부터는 같은 카드·같은 강화 단계 두 장을 녹여 한 단계 위 카드 한 장으로 만든다. */
  const MERGE_UPGRADE_START_LEVEL = 3;
  function upgradeNeedsMerge(cardOrGroup){
    const level = Number.isFinite(cardOrGroup.level) ? cardOrGroup.level : upgradeLevel(cardOrGroup);
    return level >= MERGE_UPGRADE_START_LEVEL;
  }
  function canUpgradeGroup(group){ return !upgradeNeedsMerge(group) || group.count >= 2; }
  function groupedFusionOptions(){
    return groupDeckCards(S.runDeck.filter(c=>!isEpicCard(c) && !isLegendaryCard(c)));
  }
  function fusionMaterialCards(){
    return S.runDeck.filter(c=>!isEpicCard(c) && !isLegendaryCard(c));
  }
  function raiseCardLevel(c){
    const level = upgradeLevel(c);
    if(level>=MAX_UPGRADE_LEVEL || c.unupgradable) return false;
    c.baseName = baseCardName(c);
    c.upgradeLevel = level+1;
    c.upgraded = true;
    c.name = c.baseName + '+'.repeat(c.upgradeLevel);
    if(c.dmg) c.dmg = Math.round(c.dmg*1.35);
    if(c.block) c.block = Math.round(c.block*1.35);
    if(c.selfBlock) c.selfBlock = Math.round(c.selfBlock*1.35);
    if(c.heal) c.heal = Math.round(c.heal*1.35);
    if(c.calm) c.calm = Math.round(c.calm*1.35);
    if(c.selfDp) c.selfDp = Math.max(0, c.selfDp-2);
    if(c.type==='draw' || c.type==='foresight') c.draw = (c.draw||0)+1;
    if(c.type==='swap' || c.type==='reroll_intent') c.cost = Math.max(0, c.cost-1);
    /* +4 카드 두 장을 녹여 +5가 되는 순간, 평범한 기술은 심연의 에픽으로 변한다. */
    if(c.upgradeLevel===MAX_UPGRADE_LEVEL && !isLegendaryCard(c)){ c.epic=true; c.cost=1; }
    return true;
  }
  function previewUpgradeCard(c){
    const preview = Object.assign({}, c);
    return raiseCardLevel(preview) ? preview : null;
  }
  function applyUpgradeCard(c){
    if(!raiseCardLevel(c)) return false;
    S.logMsg = `${c.name} 카드가 강화되었다.`;
    return true;
  }
  function applyUpgradeByDefId(defId){
    const c = S.runDeck.find(c=>c.defId===defId);
    if(!c) return null;
    let material = null;
    if(upgradeNeedsMerge(c)){
      const key = cardManageKey(c);
      material = S.runDeck.find(other=>other.defId!==c.defId && cardManageKey(other)===key);
      if(!material) return null;
    }
    if(!applyUpgradeCard(c)) return null;
    if(material){
      const materialIdx = S.runDeck.findIndex(other=>other.defId===material.defId);
      if(materialIdx>=0) S.runDeck.splice(materialIdx, 1);
      S.logMsg = `${baseCardName(c)} +${upgradeLevel(c)-1} 두 장이 합쳐져 ${c.name}이(가) 되었다.`;
    }
    return c;
  }
  function activeFusionClassCards(){
    const presentClasses = new Set(S.party.filter(p=>p && p.alive).map(p=>p.cls));
    return FUSION_CLASS_CARD_POOL.filter(c=>presentClasses.has(c.owner));
  }
  function fusionResultCard(){
    if(Math.random() < EPIC_FUSION_CHANCE) return {base:pickEpicCard(), epic:true};
    const classCards = activeFusionClassCards();
    const pool = classCards.length && Math.random()<0.5 ? classCards : FUSION_CARD_POOL;
    return {base:pickOne(pool), epic:false};
  }
  function applyFusion(defIdA, defIdB){
    const ia = S.runDeck.findIndex(c=>c.defId===defIdA);
    const ib = S.runDeck.findIndex(c=>c.defId===defIdB);
    if(ia<0 || ib<0 || ia===ib) return null;
    const first = Math.max(ia,ib), second = Math.min(ia,ib);
    S.runDeck.splice(first,1);
    S.runDeck.splice(second,1);
    const result = fusionResultCard();
    const epic = result.epic;
    const base = result.base;
    const newCard = mkDeckCard(base, 'fused');
    S.runDeck.push(newCard);
    S.logMsg = epic ? '심연이 합성에 응답했다. 에픽 카드가 모습을 드러냈다.' : '두 카드가 하나로 융합되었다.';
    return newCard;
  }
  const CARD_REWARD_OFFER_SIZE = 3;
  const ELITE_PREMIUM_CARD_CHANCE = EPIC_FUSION_CHANCE * 2;
  const BOSS_LEGENDARY_CARD_CHANCE = 0.05;
  function cardRewardPool(){
    const activeClasses = new Set(S.party.filter(p=>p && p.alive).map(p=>p.cls));
    const pool = CARD_DB.neutral.concat(Array.from(activeClasses).flatMap(cls=>CARD_DB[cls]||[]));
    const owned = new Set(S.runDeck.map(c=>`${c.owner}|${baseCardName(c)}`));
    const fresh = pool.filter(c=>!owned.has(`${c.owner}|${c.name}`));
    return fresh.length ? fresh : pool;
  }
  function premiumRewardCard(allowLegendary){
    return allowLegendary && Math.random()<BOSS_LEGENDARY_CARD_CHANCE ? pickOne(LEGENDARY_CARD_POOL) : pickEpicCard();
  }
  function cardRewardOffer(node){
    const offer = shuffle(cardRewardPool().slice()).slice(0, CARD_REWARD_OFFER_SIZE);
    if(!offer.length) return offer;
    const rewardSlot = Math.floor(Math.random()*offer.length);
    if(node && node.boss){
      /* 구역 수문장은 에픽을 반드시 남긴다. 그중 5%는 전설로 바뀐다. */
      offer[rewardSlot] = premiumRewardCard(true);
    } else if(isBossTier(node) && Math.random()<ELITE_PREMIUM_CARD_CHANCE){
      /* 정예는 일반 보상(5%)의 두 배 확률로 에픽 이상의 카드를 남긴다. */
      offer[rewardSlot] = premiumRewardCard(true);
    } else if(Math.random()<EPIC_FUSION_CHANCE){
      offer[rewardSlot] = pickEpicCard();
    }
    return shuffle(offer);
  }
  function claimCardReward(index){
    const a = S.aftermath;
    const card = a && a.cardOffer && a.cardOffer[index];
    if(!card) return null;
    const added = addRunDeckCard(card, 'reward');
    if(!added) return null;
    a.cardTaken = added;
    a.cardOffer = null;
    S.logMsg = `${added.name} 카드가 덱에 추가되었다. (${S.runDeck.length}/${MAX_DECK_SIZE})`;
    if(isLegendaryCard(added)) a.reveal = {kind:'reward', card:added, legendaryAcquired:true};
    else if(isEpicCard(added)) a.reveal = {kind:'reward', card:added, epicAcquired:true};
    return added;
  }

  /* ============ ATMOSPHERE ============ */
  function tierSlug(tier){
    if(tier==='표층') return 'surface';
    if(tier==='중층') return 'mid';
    return 'abyss';
  }
  function currentTier(){
    if(S.screen==='prologue' || S.screen==='prologueFall') return '심해';
    if(S.screen==='gameover') return '심해';
    if(S.screen==='emergencyExit' && S.emergencyExit) return S.emergencyExit.tier;
    if(S.screen==='battle' && S.battle) return S.battle.tier;
    if((S.screen==='rest' || S.screen==='aftermath') && S.pendingNode) return S.pendingNode.tier;
    /* 인양된 뒤에는 수면 위다 — 배경도 같이 밝아져야 올라왔다는 게 읽힌다 */
    if(S.screen==='escape' || S.screen==='tavern' || S.screen==='result') return '표층';
    if(S.screen==='map') return chapter().tier;
    return '표층';
  }
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function bubbles(n){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(3,97).toFixed(1), size=rand(3,8).toFixed(1), dur=rand(14,24).toFixed(1), delay=(-rand(0,20)).toFixed(1);
      html += `<div class="bubble" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  function motes(n,kind){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(4,96).toFixed(1), top=rand(4,90).toFixed(1), size=rand(2,5).toFixed(1), dur=rand(14,24).toFixed(1), delay=(-rand(0,20)).toFixed(1);
      html += `<div class="mote mote-${kind}" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  /* 가라앉는 잿가루 — 어느 층이든 위에서 계속 내려온다 */
  function ashes(n){
    let html='';
    for(let i=0;i<n;i++){
      const left=rand(2,98).toFixed(1), size=rand(1,2.4).toFixed(1), dur=rand(20,38).toFixed(1), delay=(-rand(0,36)).toFixed(1);
      html += `<div class="ash" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    return html;
  }
  function atmoMarkup(slug){
    if(slug==='surface') return `<div class="atmo-gradient atmo-surface"></div><div class="beam beam1"></div><div class="beam beam2"></div>${bubbles(7)}${ashes(10)}`;
    if(slug==='mid') return `<div class="atmo-gradient atmo-mid"></div>${motes(8,'mid')}${ashes(14)}`;
    return `<div class="atmo-gradient atmo-abyss"></div>${motes(4,'abyss')}${ashes(8)}`;
  }

  /* ============ RENDER ============ */
  const app = document.getElementById('app');
  app.innerHTML = '<div id="atmo" aria-hidden="true"></div><div id="content"></div>'
                + '<div id="grain" aria-hidden="true"></div><div id="fx" aria-hidden="true"></div>'
                + '<div id="flash" aria-hidden="true"></div>';
  const atmoEl = document.getElementById('atmo');
  const contentEl = document.getElementById('content');
  const fxEl = document.getElementById('fx');
  const flashEl = document.getElementById('flash');

  /* ============ 배경음 ============
     10초짜리 고리 두 개 — 탐색 중에는 심연의 소음이, 전투에서는 교전의 박동이 돈다.

     되도록 Web Audio 로 튼다. 디코딩한 파형을 그대로 물려 돌리므로 이음매가 없고,
     트랙을 바꿀 때 두 소리를 겹쳐 넘길 수 있다. 다만 file:// 로 열면 fetch 가 막히는
     브라우저가 있어, 그때는 트랙마다 <audio loop> 하나씩으로 물러선다
     (이쪽은 되감을 때 아주 짧게 끊기고 겹쳐 넘기지도 못하지만 소리는 계속 난다).

     브라우저는 사용자가 한 번 건드리기 전에는 소리를 내주지 않으므로 첫 입력에 깨운다. */
  /* gain 은 트랙마다 따로 둔다 — 전투 곡은 소리가 촘촘해서 같은 값으로 깔면
     기본음보다 크게 들리고, 무엇보다 전투 중에는 타격음과 화면이 먼저 읽혀야 한다. */
  /* 파일 이름은 곡이 아니라 '자리'를 가리킨다 — bgm-<쓰임>.m4a.
     곡이 바뀌어도 자리 이름은 그대로라, 새 음원을 같은 이름으로 덮어 굽기만 하면 된다.

     싣는 것은 언제나 인코딩된 m4a 다. 무압축 원본(assets/*.wav)은 저장소에서 빠지므로
     그 경로를 가리키면 내려받은 쪽에서는 소리가 통째로 사라진다.
     seconds 는 원본의 정확한 길이 — 인코더가 덧댄 꼬리를 여기서 잘라 낸다.
     트랙마다 길이가 다르므로 한 값으로 묶어 두면 긴 곡이 중간에서 되감긴다. */
  const BGM_TRACKS = {
    ambient: {src:'assets/bgm-ambient.m4a', gain:1,   seconds:20},
    battle:  {src:'assets/bgm-battle.m4a',  gain:0.5, seconds:10},
  };
  const BGM_KEY = 'fathom.bgm.v1';
  /* 음악은 배경이지 무대가 아니다 — 있는 줄 모르고 듣다가 없으면 허전한 정도로만 깐다. */
  const BGM_VOLUME = 0.0675;
  const BGM_FADE = 0.7;          /* 트랙을 겹쳐 넘기는 시간(초) */
  let bgmOn = Store.get(BGM_KEY) !== 'off';
  let bgmCtx = null, bgmMaster = null, bgmTrack = null;
  const bgmBuffers = {};   /* 트랙별 디코딩 결과 — 한 번 받으면 다시 받지 않는다 */
  const bgmEls = {};       /* file:// 대비 요소 재생 */
  let bgmVoice = null;     /* 지금 울리고 있는 {node, gain} */
  let bgmPrimed = false;   /* 제스처 안에서 오디오 잠금을 푼 적이 있는가 */
  let bgmMode = null;      /* 'buffer' | 'element' — 실제로 소리가 나기 시작하면 정해진다 */
  let bgmBufferFailed = false;  /* Web Audio 로 받아 오지 못했다 — 요소로 물러서야 한다 */

  function bgmDesiredTrack(){ return (S && S.screen === 'battle') ? 'battle' : 'ambient'; }
  function bgmTrackGain(key){
    const t = BGM_TRACKS[key];
    return t && Number.isFinite(t.gain) ? t.gain : 1;
  }
  /* 값이 없으면 0 을 돌려주고, 부르는 쪽이 버퍼 길이를 그대로 쓰게 둔다 */
  function bgmTrackSeconds(key){
    const t = BGM_TRACKS[key];
    return t && Number.isFinite(t.seconds) ? t.seconds : 0;
  }

  /* ---- 물러섰을 때: 트랙마다 요소 하나 ---- */
  function bgmEl(key){
    if(!bgmEls[key]){
      const el = document.createElement('audio');
      el.src = BGM_TRACKS[key].src;
      el.loop = true;
      el.preload = 'none';
      el.playsInline = true;
      el.setAttribute('playsinline','');
      el.volume = 0;
      document.body.appendChild(el);
      bgmEls[key] = el;
    }
    return bgmEls[key];
  }
  function bgmPlayFallback(key){
    Object.keys(bgmEls).forEach(k=>{ if(k !== key) bgmEls[k].pause(); });
    const el = bgmEl(key);
    el.volume = BGM_VOLUME * bgmTrackGain(key);
    const p = el.play();
    if(p && p.then) p.then(()=>{ bgmMode = 'element'; }).catch(()=>{});
    else bgmMode = 'element';
  }

  /* ---- Web Audio ---- */
  function bgmLoad(key){
    if(bgmBuffers[key]) return Promise.resolve(bgmBuffers[key]);
    return fetch(BGM_TRACKS[key].src)
      .then(r=>{ if(!r.ok) throw new Error('bgm'); return r.arrayBuffer(); })
      .then(buf=>bgmCtx.decodeAudioData(buf))
      .then(decoded=>{ bgmBuffers[key] = decoded; return decoded; });
  }
  function bgmPlayBuffer(key){
    const buf = bgmBuffers[key];
    if(!bgmCtx || !buf) return;
    const now = bgmCtx.currentTime;
    /* 울리던 것은 끊지 않고 걷어 낸다 — 전투에 드는 순간 소리가 뚝 끊기면 화면보다 먼저 놀란다 */
    if(bgmVoice){
      const old = bgmVoice;
      try{
        old.gain.gain.cancelScheduledValues(now);
        old.gain.gain.setValueAtTime(old.gain.gain.value, now);
        old.gain.gain.linearRampToValueAtTime(0, now + BGM_FADE);
        old.node.stop(now + BGM_FADE + 0.05);
        /* 다 넘어간 뒤에는 그래프에서도 떼어 낸다. 참조만 버리고 두면 소리 없는
           마디가 그래프에 계속 남아 매 렌더 퀀텀마다 처리된다 — 지도와 전투를
           오갈 때마다 하나씩 쌓여, 나중에는 그 자체가 끊김이 된다. */
        old.node.onended = function(){
          try{ old.node.disconnect(); old.gain.disconnect(); }catch(e){}
        };
      }catch(e){}
      bgmVoice = null;
    }
    /* 요소로 먼저 울리고 있었다면 이제 물러난다 */
    Object.keys(bgmEls).forEach(k=>bgmEls[k].pause());
    const gain = bgmCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(bgmTrackGain(key), now + BGM_FADE);
    gain.connect(bgmMaster);
    const node = bgmCtx.createBufferSource();
    node.buffer = buf;
    node.loop = true;
    node.loopStart = 0;
    /* 디코딩된 버퍼는 인코더가 덧댄 만큼 원본보다 길 수 있다. 원래 길이에서 끊어야
       한 바퀴가 정확히 맞물린다. 짧게 나오면(있는 그대로) 버퍼 끝까지 쓴다. */
    node.loopEnd = Math.min(bgmTrackSeconds(key) || buf.duration, buf.duration);
    node.connect(gain);
    node.start(now);
    bgmVoice = {node:node, gain:gain};
    bgmMode = 'buffer';
  }
  function bgmPlay(key){
    if(bgmCtx){
      bgmLoad(key)
        .then(()=>{ if(bgmOn && bgmTrack === key) bgmPlayBuffer(key); })
        .catch(()=>{
          bgmBufferFailed = true;   /* 다음 손길에서 제스처 안에 요소로 넘어간다 */
          if(bgmOn && bgmTrack === key) bgmPlayFallback(key);
        });
    } else {
      bgmPlayFallback(key);
    }
  }
  /* 화면이 바뀔 때마다 불린다 — 같은 트랙이면 아무 일도 하지 않는다 */
  function bgmSetTrack(key){
    if(!BGM_TRACKS[key] || bgmTrack === key) return;
    bgmTrack = key;
    if(!bgmOn || !bgmPrimed) return;
    bgmPlay(key);
  }

  /* ---- 잠금 풀기 ----
     모바일은 데스크톱보다 훨씬 깐깐하다. 소리를 처음 내는 일은 반드시 '손가락이
     닿은 그 순간' 동기적으로 해 두어야 하고, 나중에(fetch·decode 가 끝난 뒤) 하면
     거절당한다. AudioContext 를 깨우고 소리 없는 한 칸을 실제로 울리면 풀린다.

     <audio> 요소는 Web Audio 가 없을 때만 미리 눌러 둔다. 예전에는 물러설 자리를
     만든다며 두 트랙을 다 눌러 뒀는데, 그러면 같은 파일을 미디어 파이프라인이
     한 번, Web Audio 가 또 한 번 내려받아 디코딩한다 — 휴대폰에서는 이 중복이
     그대로 첫 끊김과 메모리 압박이 된다. 버퍼 재생이 실패한 뒤에는 다음 손길에서
     동기적으로 요소를 트므로(bgmGesture) 물러설 길은 그대로 남는다. */
  function bgmPrime(){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx && !bgmCtx){
      try{
        bgmCtx = new Ctx();
        bgmMaster = bgmCtx.createGain();
        bgmMaster.gain.value = BGM_VOLUME;
        bgmMaster.connect(bgmCtx.destination);
      }catch(e){ bgmCtx = null; bgmMaster = null; }
    }
    if(bgmCtx){
      if(bgmCtx.state === 'suspended') bgmCtx.resume().catch(()=>{});
      try{
        const tick = bgmCtx.createBufferSource();
        tick.buffer = bgmCtx.createBuffer(1, 1, 22050);
        tick.connect(bgmCtx.destination);
        tick.start(0);
      }catch(e){}
    } else if(!bgmPrimed){
      /* Web Audio 가 아예 없는 곳 — 이때만 요소에 허락을 받아 둔다 */
      Object.keys(BGM_TRACKS).forEach(k=>{
        const el = bgmEl(k);
        el.volume = 0;
        const p = el.play();
        if(p && p.then) p.then(()=>{ if(bgmMode !== 'element') el.pause(); }).catch(()=>{});
      });
    }
    bgmPrimed = true;
  }
  /* 한 번 실패하면 끝이 아니라, 소리가 실제로 날 때까지 손이 닿을 때마다 다시 시도한다.
     첫 탭이 로딩·정책·무음 전환에 걸려 놓치는 일이 모바일에서는 흔하다.
     버퍼 재생이 이미 한 번 엎어졌다면 여기서(제스처 안에서) 곧바로 요소로 넘어간다. */
  function bgmGesture(){
    if(!bgmOn) return;
    bgmPrime();
    if(!bgmTrack) bgmTrack = bgmDesiredTrack();
    if(bgmBufferFailed && bgmMode !== 'element'){ bgmPlayFallback(bgmTrack); return; }
    if(!bgmMode) bgmPlay(bgmTrack);
    else if(bgmCtx && bgmCtx.state === 'suspended') bgmCtx.resume().catch(()=>{});
  }
  function setBgmOn(on){
    bgmOn = !!on;
    Store.set(BGM_KEY, bgmOn ? 'on' : 'off');
    if(!bgmOn){
      if(bgmVoice){
        try{ bgmVoice.node.stop(); }catch(e){}
        try{ bgmVoice.gain.disconnect(); }catch(e){}
        bgmVoice = null;
      }
      Object.keys(bgmEls).forEach(k=>bgmEls[k].pause());
      bgmMode = null;
      return;
    }
    /* 설정에서 켜는 것도 손가락이 닿은 순간이다 — 그대로 잠금을 푼다 */
    bgmPrime();
    if(bgmCtx && bgmCtx.state === 'suspended') bgmCtx.resume().catch(()=>{});
    bgmTrack = bgmDesiredTrack();
    bgmPlay(bgmTrack);
  }
  ['pointerdown','touchstart','keydown'].forEach(evt=>{
    window.addEventListener(evt, bgmGesture, {passive:true});
  });
  /* 화면을 껐다 켜거나 앱을 다녀오면 iOS 는 컨텍스트를 재워 둔다 — 돌아올 때 깨운다 */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible' || !bgmOn) return;
    if(bgmCtx && bgmCtx.state === 'suspended') bgmCtx.resume().catch(()=>{});
    if(bgmMode === 'element' && bgmTrack){
      const el = bgmEls[bgmTrack];
      if(el && el.paused){ const p = el.play(); if(p && p.catch) p.catch(()=>{}); }
    }
  });

  /* ============ 파티클 ============
     피해 판정은 render() 앞에서 끝나지만 그때의 DOM 은 곧 버려진다.
     그래서 이벤트만 큐에 쌓아두고, 다시 그린 뒤 카드 위치를 찾아 뿌린다. */
  let fxQueue = [];
  function queueFx(kind, unit, amount, crit){
    if(!S.battle) return;
    const side = S.party.indexOf(unit) >= 0 ? 'hero' : 'foe';
    const key  = side==='hero' ? unit.id : S.battle.enemies.indexOf(unit);
    fxQueue.push({kind:kind, side:side, key:key, amount:amount||0, crit:!!crit});
  }

  /* 낸 카드는 곧 손패에서 지워지고 전투판이 통째로 다시 그려진다.
     지워지기 직전의 카드를 그 모습 그대로 떠서, 다시 그려지지 않는 #fx 레이어에
     같은 자리로 얹어 둔다 — 손에서 한 장이 뽑혀 나가는 것처럼 보이게 하는 잔상이다.
     반드시 손패가 아직 남아 있는 동안(상태를 건드리기 전에) 불러야 한다. */
  function flyOutCard(uid){
    if(!fxEl || !contentEl || S.screen!=='battle') return;
    const el = contentEl.querySelector('.card[data-uid="'+uid+'"]');
    if(!el) return;
    const ar = app.getBoundingClientRect();
    const r  = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.classList.add('card-fly');
    ghost.classList.remove('selecting','tutorial-pulse');
    ghost.removeAttribute('data-action');   /* 잔상이 클릭을 가로채지 않게 */
    ghost.removeAttribute('data-uid');
    ghost.style.left   = (r.left - ar.left) + 'px';
    ghost.style.top    = (r.top  - ar.top)  + 'px';
    ghost.style.width  = r.width  + 'px';
    ghost.style.height = r.height + 'px';
    fxEl.appendChild(ghost);
    setTimeout(()=>{ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 130);
  }

  const FX_COLOR = {
    heroHit:'#c4383c', foeHit:'#b87ad8',
    dodge:'#8fd4c4', guard:'#9fc0d8', riposte:'#e0574f',
    /* 되받아친 값은 내가 낸 것이라 붉은 피해와 갈라 둔다 — 우리 쪽 반격만 푸르게 */
    riposteHero:'#6fb4ff',
    /* 치명타 — 표시는 어느 쪽이든 같은 경보색이고, 튀는 것만 각자의 피를 따른다 */
    crit:'#ff5a3c', bloodHero:'#b42a2e', bloodFoe:'#8f66c4',
    /* 회복은 초록 — 십자와 티끌이 한 가지 빛으로 읽혀야 무엇이 일어났는지 한눈에 갈린다.
       진정(계열)은 그대로 물빛이라 회복과 헷갈리지 않는다. */
    heal:'#6fdc8c', calm:'#7fbfae', death:'#cfe4dd',
    /* 수치는 파편보다 밝아야 초상 위에서 읽힌다.
       내가 맞으면 핏빛, 내가 때리면 뼛빛 — 색만으로 누구의 피해인지 갈린다. */
    dmgHero:'#ff7a70', dmgFoe:'#f7ecd6',
  };
  function clearFxLayer(){ while(fxEl.firstChild) fxEl.removeChild(fxEl.firstChild); }
  const FX_MAX = 180;   /* 타이머가 밀려도 레이어가 무한히 불어나지 않게 */
  function spawn(cls, x, y, color, size, vars, life, text){
    while(fxEl.childElementCount >= FX_MAX) fxEl.removeChild(fxEl.firstChild);
    const p = document.createElement('div');
    p.className = 'p ' + cls;
    p.style.left = x+'px';
    p.style.top  = y+'px';
    if(color) p.style.color = color;
    if(size){ p.style.width = size[0]+'px'; p.style.height = size[1]+'px'; }
    if(vars) for(const k in vars) p.style.setProperty(k, vars[k]);
    /* 적 이름 등 바깥에서 온 문자열은 넣지 않지만, 그래도 textContent 로만 붙인다 */
    if(text != null) p.textContent = text;
    fxEl.appendChild(p);
    setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, life||1100);
  }
  const rnd = (a,b)=> a + Math.random()*(b-a);

  function burst(x, y, color, n, spread){
    for(let i=0;i<n;i++){
      const a = (360/n)*i + rnd(-14,14);
      spawn('p-shard', x, y, color, [rnd(1.5,2.8), rnd(7,13)],
            {'--a':a+'deg', '--r':rnd(spread*0.55, spread)+'px', '--d':rnd(380,620)+'ms'}, 700);
    }
  }
  /* 회피·흘림·반격도 피해와 같은 글꼴·같은 초상 위에 수치를 띄운다.
     다만 붉은 피해 수치와 같은 자리에서 출발하면 겹쳐 읽히지 않으므로 한 줄 위에 얹는다.
     막아낸 것이 없으면(1 피해를 흘리는 등) 배지만 남기고 수치는 띄우지 않는다. */
  function reactNum(x, y, color, label, amount){
    const n = Math.round(amount || 0);
    if(n <= 0) return;
    spawn('p-dmg', x, y - 18, color, null,
          {'--d':'900ms', 'font-size':'13px'}, 1100, label + ' ' + n);
  }
  /* 튄 피 — 위로 솟았다가 아래로 떨어진다. 파편이 곧게 뻗는 것과 달리 호를 그린다. */
  function bloodBurst(x, y, color){
    for(let i=0;i<14;i++){
      const s = rnd(2,4.5);
      spawn('p-blood', x + rnd(-6,6), y + rnd(-6,6), color, [s,s],
            {'--dx':rnd(-34,34)+'px', '--dy':rnd(26,52)+'px',
             '--rise':rnd(8,22)+'px', '--d':rnd(480,780)+'ms'}, 900);
    }
  }

  function playFx(ev, el, stack){
    const ar = app.getBoundingClientRect();
    const r  = el.getBoundingClientRect();
    const cx = r.left - ar.left + r.width/2;
    const cy = r.top  - ar.top  + r.height/2;
    const mine = ev.side==='hero';
    /* 수치는 카드 한가운데가 아니라 맞은 얼굴 위에 뜬다 — 누가 맞았는지가 먼저 읽혀야 한다.
       초상은 아군·적이 서로 다른 클래스를 쓰고, 못 찾으면 카드 기준으로 물러선다. */
    const face = el.querySelector('.portrait, .enemy-portrait');
    const fr = face ? face.getBoundingClientRect() : r;
    const fx = fr.left - ar.left + fr.width/2;
    const fy = fr.top  - ar.top  + fr.height/2;

    if(ev.kind==='impact'){
      const col = mine ? FX_COLOR.heroHit : FX_COLOR.foeHit;
      /* 피해가 클수록 파편이 많고 멀리 튄다 */
      const n = Math.max(6, Math.min(14, 5 + Math.round(ev.amount*0.8)));
      burst(cx, cy, col, n, 30 + Math.min(26, ev.amount*2.2));
      spawn('p-ring', cx, cy, col, [30,30], {'--d':'380ms'}, 500);
      /* 큰 피해일수록 크게, 오래 남는다. 치명타는 거기서 한 번 더 키운다. */
      const big = ev.amount >= 12;
      const s = stack || 0;
      const size = Math.round((big?19:15) * (ev.crit ? 1.25 : 1));
      spawn('p-dmg', fx + (s%2 ? 13 : -13)*Math.ceil(s/2), fy - s*7,
            mine ? FX_COLOR.dmgHero : FX_COLOR.dmgFoe, null,
            {'--d': (big?1050:880)+'ms', 'font-size': size+'px'},
            big?1200:1000, '-'+ev.amount);
      if(ev.crit){
        /* 피는 초상 언저리에서 튀고, 표시는 그 위로 솟는다 */
        bloodBurst(fx, fy, mine ? FX_COLOR.bloodHero : FX_COLOR.bloodFoe);
        spawn('p-crit', fx, fy - 34, FX_COLOR.crit, null, {'--d':'950ms'}, 1150, 'CRITICAL!');
        flash('red');
      }
      el.classList.add('hit-shake');

    } else if(ev.kind==='dodge'){
      for(let i=0;i<3;i++){
        spawn('p-wisp', cx + rnd(-8,8), cy + rnd(-12,12), FX_COLOR.dodge, null,
              {'--dx':rnd(20,36)+'px', '--d':rnd(420,600)+'ms'}, 700);
      }
      /* 통째로 피한 양을 그대로 띄운다 — 체력이 왜 그대로인지가 여기서 읽힌다 */
      reactNum(fx, fy, FX_COLOR.dodge, '회피', ev.amount);

    } else if(ev.kind==='guard'){
      spawn('p-ring', cx, cy, FX_COLOR.guard, [40,40], {'--d':'520ms'}, 650);
      burst(cx, cy, FX_COLOR.guard, 5, 20);
      /* 흘림은 깎아낸 양을 띄운다. 실제로 들어간 피해는 붉은 수치로 따로 뜬다 */
      reactNum(fx, fy, FX_COLOR.guard, '흘림', ev.amount);

    } else if(ev.kind==='riposte'){
      spawn('p-slash', cx, cy, FX_COLOR.riposte, null, {'--a':'-32deg'}, 460);
      spawn('p-slash', cx, cy, FX_COLOR.riposte, null, {'--a':'26deg'}, 460);
      /* 되돌려준 양. 맞은 쪽에는 이 값이 붉은 피해 수치로 다시 뜬다.
         우리 쪽 반격은 푸르게 — 같은 화면에 붉은 수치가 함께 뜨므로 주인이 갈려야 한다. */
      reactNum(fx, fy, mine ? FX_COLOR.riposteHero : FX_COLOR.riposte, '반격', ev.amount);

    } else if(ev.kind==='death'){
      for(let i=0;i<12;i++){
        const s = rnd(3,8);
        spawn('p-bub', cx + rnd(-16,16), cy + rnd(-10,14), null, [s,s],
              {'--dx':rnd(-16,16)+'px', '--dy':rnd(48,92)+'px', '--d':rnd(700,1150)+'ms'}, 1300);
      }
      spawn('p-ring', cx, cy, FX_COLOR.death, [44,44], {'--d':'620ms'}, 800);

    } else if(ev.kind==='heal' || ev.kind==='calm'){
      const col = ev.kind==='heal' ? FX_COLOR.heal : FX_COLOR.calm;
      for(let i=0;i<8;i++){
        const s = rnd(2,4);
        spawn('p-mote', cx + rnd(-18,18), cy + rnd(-4,16), col, [s,s],
              {'--dx':rnd(-10,10)+'px', '--dy':rnd(26,48)+'px', '--d':rnd(560,900)+'ms'}, 1000);
      }
      /* 회복은 카드 둘레를 따라 십자를 돋운다 — 타원으로 돌려야 세로로 긴 카드에서도
         모서리에 몰리지 않고 테두리를 고르게 두른다. 하나씩 시차를 두어 차례로 돋는다. */
      if(ev.kind==='heal'){
        const PLUS_N = 7;
        for(let i=0;i<PLUS_N;i++){
          const a = (Math.PI*2/PLUS_N)*i + rnd(-0.22, 0.22);
          const rx = r.width/2  + rnd(1,7);
          const ry = r.height/2 + rnd(1,7);
          spawn('p-plus', cx + Math.cos(a)*rx, cy + Math.sin(a)*ry, col, null,
                {'--dx':rnd(-6,6)+'px', '--dy':rnd(18,30)+'px',
                 '--d':rnd(720,980)+'ms', '--dl':Math.round(i*55)+'ms'},
                1400, '+');
        }
      }
    }
  }
  function flushFx(){
    if(!fxQueue.length) return;
    const q = fxQueue; fxQueue = [];
    if(!S.battle || S.screen!=='battle'){ clearFxLayer(); return; }
    /* 광역기나 반격으로 한 번에 여러 대를 맞으면 수치가 같은 자리에 겹쳐 한 줄로 뭉친다.
       같은 대상의 몇 번째 피해인지 세어, 뜨는 자리를 조금씩 어긋나게 한다. */
    const hitSeen = {};
    q.forEach(ev=>{
      const sel = ev.side==='hero'
        ? '.hero-card[data-id="'+ev.key+'"]'
        : '.foe-card[data-idx="'+ev.key+'"]';
      const el = contentEl.querySelector(sel);
      if(!el) return;
      let stack = 0;
      if(ev.kind==='impact'){
        const id = ev.side+':'+ev.key;
        stack = hitSeen[id] = (hitSeen[id]||0) + 1;
      }
      playFx(ev, el, stack - 1);
    });
  }
  function flash(type){
    if(!flashEl) return;
    flashEl.classList.remove('flash-white','flash-red');
    void flashEl.offsetWidth; // force reflow so the animation restarts even if same type fires again
    flashEl.classList.add(type==='white' ? 'flash-white' : 'flash-red');
  }
  let lastSlug = null;
  function ensureAtmo(slug){
    if(slug !== lastSlug){ atmoEl.innerHTML = atmoMarkup(slug); lastSlug = slug; }
    if(app.dataset.tier !== slug) app.dataset.tier = slug;
  }

  /* 압박이 오를수록 물빛에서 놋쇠빛으로, 끝에는 핏빛으로 넘어간다 */
  function dpColor(dp){ if(dp>=100) return '#d9452f'; if(dp>=70) return '#d89a3c'; return '#7fbfae'; }

  /* 체력이 줄수록 피가 굳는다 — 색은 선홍에서 검붉게 가라앉고, 맥은 반대로 빨라진다.
     단계로 끊지 않고 비율에 따라 이어지게 두어야 깎여 나가는 것이 눈에 보인다. */
  const VITAL_DUR_FULL = 2.6, VITAL_DUR_EMPTY = 0.75;
  function vitalDuration(ratio){
    const r = Math.max(0, Math.min(1, Number.isFinite(ratio) ? ratio : 0));
    return (VITAL_DUR_EMPTY + (VITAL_DUR_FULL - VITAL_DUR_EMPTY) * r).toFixed(2);
  }
  function hpFillColor(ratio){
    const r = Math.max(0, Math.min(1, Number.isFinite(ratio) ? ratio : 0));
    /* 바닥에서도 검은 판 위에서 읽혀야 하므로 완전히 어둡게 내리지는 않는다 */
    const lerp = (empty, full)=>Math.round(empty + (full - empty) * r);
    return `rgb(${lerp(122,196)},${lerp(20,56)},${lerp(24,60)})`;
  }
  function ownerLabel(o){
    if(o==='neutral') return '중립';
    const def = CLASS_DEFS[o];
    return def ? def.name : o;
  }

  /* 게임 가이드 — 프롤로그 튜토리얼이 한 번씩 짚어 준 규칙을 언제든 다시 펴 볼 수 있게 모았다.
     수치는 실제 상수에서 읽어 온다. 규칙을 고치면 안내문도 따라 바뀌어야 하기 때문이다.
     항목 추가는 이 배열에 {t, lines} 를 하나 더 얹으면 된다. */
  function guideSections(){
    const eroRates = CHAPTERS.map(c=>`${c.tier} ${c.erosion}%`).join(' · ');
    return [
      {t:'AP · 행동력', lines:[
        `전투는 매 턴 AP <b>${3}</b>개로 시작하고, 카드는 저마다 적힌 만큼 AP를 씁니다.`,
        `정규 AP를 <b>${TEMP_AP_MIN}개 이상</b> 남기고 턴을 끝내면 다음 턴에 임시 AP <b>+${TEMP_AP_CARRY}</b>를 받습니다.`,
        '반투명한 임시 AP는 그 턴에만 쓰이며 정규 AP보다 <b>먼저</b> 소모됩니다.',
      ]},
      {t:'방어 · 예고', lines:[
        '적 카드 아래에는 다음에 할 행동이 미리 보입니다. 그것을 보고 막을지 때릴지 고릅니다.',
        '방어는 <b>턴이 끝나면 사라집니다.</b> 쟁여 둘 수 없으니 맞을 턴에 맞춰 올리세요.',
      ]},
      {t:'심도압박', lines:[
        '심연의 감각에 인식이 동조되는 정도입니다. <b>방어로는 막을 수 없습니다.</b>',
        '원거리 공격·광기 계열 카드는 위력의 대가로 자신의 압박을 올립니다.',
        '<b>100</b>에 닿으면 정신이 함몰되어 가하는 피해 <b>-50%</b>, 받는 피해 <b>+50%</b>가 되고 70으로 되돌아갑니다.',
        '진정 계열 카드와 은신처 휴식(압박 -30)으로만 내릴 수 있습니다.',
      ]},
      {t:'잠식', lines:[
        `0에서 시작해 <b>${EROSION_MAX}%</b>에 닿으면 탐색이 그 자리에서 끝납니다. 되돌리는 수단은 없습니다.`,
        `전투의 턴이 끝날 때마다 구역별로 오릅니다 — ${eroRates}.`,
        `은신처에서 숨을 고르면 체력과 압박을 얻는 대신 잠식이 <b>${EROSION_REST}%</b> 오릅니다.`,
      ]},
      {t:'대열 · 사거리', lines:[
        '서 있는 열이 곧 화력입니다. 병과마다 휘두를 수 있는 자기 열과 닿는 상대 열이 정해져 있습니다.',
        `<b>${REACH.melee.label}</b> — ${REACH.melee.note}`,
        `<b>${REACH.mid.label}</b> — ${REACH.mid.note}`,

  /* 상단 메뉴 팝업 — 항목 추가는 이 배열만 늘리면 된다.
     view:'placeholder' 는 아직 구현되지 않은 기능의 안내문을,
     view:'guide' 는 sections() 가 돌려주는 목록을 접이식 문서로,
     view:'confirm' 은 실행 전 확인이 필요한 항목을 그린다. */
  /* 설정 항목도 배열 하나로 늘린다 — 읽고 쓰는 두 함수만 주면 줄이 하나 더 생긴다. */
  const SETTING_TOGGLES = [
    {id:'bgm', label:'배경음', hint:'심연의 소음이 끊기지 않고 흐른다.',
      get:()=>bgmOn, set:v=>setBgmOn(v)},
  ];

  const MENU_ITEMS = [
    /* view:'toggle' 은 하위 화면 없이 목록에서 바로 뒤집힌다. 소리를 끄는 일은
       설정 안까지 들어가기엔 급할 때가 많다 — 메뉴를 열자마자 한 번에 닿게 둔다. */
    {id:'mute', view:'toggle', label:()=> bgmOn ? '음소거' : '소리 켜기',
      run(){ setBgmOn(!bgmOn); }},
    {id:'settings', label:'설정', view:'settings', title:'설정'},
    {id:'system', label:'게임 가이드', view:'guide', title:'게임 가이드',
      sections:guideSections},
    {id:'quit', label:'게임 종료', view:'confirm', title:'게임 종료', confirmLabel:'게임 종료',
      desc:'제목 화면으로 나갑니다. 지도·휴식 등 안전한 지점까지는 이미 저장되어 있습니다.',
      run(){ S.screen = 'title'; }},
  ];
  let menuOpen = false;
  let menuStep = null; /* null 이면 목록, 아니면 MENU_ITEMS 의 id */
  let guideOpen = 0;   /* 가이드에서 펼쳐 둔 장의 번호 */

  function renderMenuOverlay(){
    if(!menuOpen) return '';
    const item = MENU_ITEMS.find(m=>m.id===menuStep) || null;
    let body;
    if(!item){
      /* 이름이 상태에 따라 달라지는 항목(음소거 등)은 함수로 받는다 */
      body = `<div class="menu-list">${MENU_ITEMS.map(m=>{
        const label = typeof m.label === 'function' ? m.label() : m.label;
        return `<button class="menu-item" data-action="menu-open-item" data-menu-id="${m.id}">${label}</button>`;
      }).join('')}</div>`;
    } else if(item.view==='guide'){
      /* 한 번에 한 장만 펼친다 — 작은 화면에서 통째로 흘리면 어디를 읽는지 놓친다 */
      const sections = item.sections();
      body = `
        <div class="menu-guide">
          ${sections.map((sec,i)=>`
            <div class="guide-sec ${guideOpen===i?'open':''}">
              <button class="guide-sec-head" data-action="menu-guide-toggle" data-index="${i}">
                <span>${sec.t}</span><span class="guide-sec-mark" aria-hidden="true"></span>
              </button>
              ${guideOpen===i ? `<ul class="guide-sec-body">${sec.lines.map(l=>`<li>${l}</li>`).join('')}</ul>` : ''}
            </div>`).join('')}
        </div>
        <button class="btn menu-guide-back" data-action="menu-back">뒤로</button>`;
    } else if(item.view==='settings'){
      body = `
        <div class="menu-settings">
          ${SETTING_TOGGLES.map(t=>{
            const on = !!t.get();
            return `
            <div class="setting-row">
              <div>
                <div class="setting-label">${t.label}</div>
                ${t.hint ? `<div class="setting-hint">${t.hint}</div>` : ''}
              </div>
              <button class="setting-switch ${on?'on':''}" role="switch" aria-checked="${on}"
                      data-action="menu-toggle-setting" data-setting-id="${t.id}">${on?'켬':'끔'}</button>
            </div>`;
          }).join('')}
        </div>
        <button class="btn menu-guide-back" data-action="menu-back">뒤로</button>`;
    } else if(item.view==='confirm'){
      body = `
        <div class="menu-confirm">
          <p>${item.desc}</p>
          <div class="menu-confirm-actions">
            <button class="btn" data-action="menu-back">취소</button>
            <button class="btn danger" data-action="menu-confirm" data-menu-id="${item.id}">${item.confirmLabel||'확인'}</button>
          </div>
        </div>`;
    } else {
      body = `
        <div class="menu-placeholder">
          <p>${item.desc}</p>
          <button class="btn" data-action="menu-back">뒤로</button>
        </div>`;
    }
    return `
      <div class="menu-overlay" role="dialog" aria-modal="true" aria-label="${item?item.title:'메뉴'}" data-action="close-menu">
          <div class="menu-panel ${item&&item.view==='guide'?'wide':''}" data-action="menu-noop">
            <div class="menu-panel-head">
            ${item ? `<h3>${item.title}</h3>` : '<span aria-hidden="true"></span>'}
            <button class="menu-close" data-action="close-menu" aria-label="닫기"><span class="menu-close-ico"></span></button>
          </div>
          ${body}
        </div>
      </div>`;
  }

      <div class="topbar">

          <button class="menu-btn" data-action="open-menu" aria-label="메뉴" aria-haspopup="dialog"><span class="menu-ico"></span></button>
          <div class="ero-label">잠식</div>
          <div class="ero-case ${danger}">
            <div class="ero-fill" style="width:${pct}%"></div>

${(ownedMarkers().length || S.relics.length) ? `<div class="topbar-collection ${S.relics.length?'with-relics':''} ${ownedMarkers().length?'with-markers':''}">
          ${S.relics.length ? `<div class="relic-tray topbar-relics relic-count-${Math.min(4,S.relics.length)}">${S.relics.map(r=>relicChip(r,true)).join('')}</div>` : ''}
