  .fusion-inspect{ width:100%; max-width:300px; display:flex; flex-direction:column; gap:5px; }
  .card-inspect{ border:1px solid rgba(184,147,79,0.68); padding:7px 9px; text-align:left; background:rgba(20,25,26,0.70); box-shadow:inset 0 0 12px rgba(184,147,79,0.08); }
  .card-inspect.normal{ border-color:var(--card-normal); background:rgba(42,42,39,0.52); }
  .card-inspect.class{ border-color:var(--card-class); background:rgba(25,42,57,0.58); }
  .card-inspect.epic{ border-color:var(--card-epic); background:rgba(38,30,58,0.68); }
  .card-inspect.legendary{ border-color:var(--card-legendary); background:rgba(62,47,20,0.68); }
  .card-inspect-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; color:var(--bone); font-size:11px; }
  .card-inspect-meta{ color:var(--gaslamp); font-size:9px; white-space:nowrap; }
  .card-inspect.normal .card-inspect-meta{ color:var(--card-normal-hi); }
  .card-inspect.class .card-inspect-meta{ color:var(--card-class-text); }
  .card-inspect.epic .card-inspect-meta{ color:var(--card-epic-hi); }
  .card-inspect.legendary .card-inspect-meta{ color:var(--card-legendary-hi); }
  .card-inspect-effect{ margin-top:2px; color:var(--muted); font-size:10px; line-height:1.5; }

  .reveal-stage{ width:100%; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .reveal-banner{ font-family:'Nanum Myeongjo',serif; font-size:13px; color:var(--gaslamp); letter-spacing:0.14em; text-shadow:0 0 12px rgba(224,170,76,0.4); animation:revealBannerPulse 0.55s steps(2,end) infinite; }
  .reveal-card-wrap{ position:relative; display:flex; justify-content:center; padding:6px 0 4px; }
  .card.reveal-card{ flex:0 0 156px; height:198px; border-color:var(--gaslamp); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6),inset 0 0 26px rgba(224,170,76,0.14),0 0 24px rgba(224,170,76,0.4); transform:scale(1.05); }
  .reveal-upgrade .card.reveal-card{ animation:upgradeReveal 380ms steps(5,end) both; }
  .reveal-fusion .card.reveal-card{ animation:fusionReveal 460ms steps(6,end) both; }
  /* 보라색 글로우와 파편은 에픽이 실제로 모습을 드러낸 짧은 순간에만 쓴다. */
  .reveal-epic .reveal-banner{ color:var(--card-epic-hi); text-shadow:0 0 10px var(--card-epic),0 0 24px rgba(141,122,176,0.74); }
  .reveal-epic .card.reveal-card{ border-color:#a894cf; box-shadow:inset 0 0 0 1px rgba(225,215,255,0.42),inset 0 0 24px rgba(141,122,176,0.34),0 0 26px rgba(141,122,176,0.78); animation:epicReveal 620ms steps(7,end) both; }
  /* 전설은 에픽보다 한 단계 더 큰 황금 섬광과 긴 파편 궤적을 남긴다. */
  .reveal-legendary .reveal-banner{ color:var(--card-legendary-hi); font-size:15px; text-shadow:0 0 8px var(--card-legendary),0 0 22px var(--brass),0 0 42px rgba(230,189,89,0.88); animation-duration:0.32s; }
  .reveal-legendary .card.reveal-card{ border-color:#fff0a2; box-shadow:inset 0 0 0 1px rgba(255,247,185,0.72),inset 0 0 32px rgba(230,189,89,0.50),0 0 38px rgba(230,189,89,0.94),0 0 70px rgba(213,145,39,0.42); animation:legendaryReveal 880ms steps(9,end) both; }
  .reveal-sparks{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .reveal-spark{ position:absolute; left:50%; top:50%; width:4px; height:4px; background:#e7dcff; border:1px solid #7c67ad; box-shadow:0 0 7px #9c86d0; transform:translate(-50%,-50%) rotate(calc(var(--i) * 30deg)) translateY(-10px); animation:epicRevealSpark 620ms steps(7,end) both; animation-delay:calc(var(--i) * -34ms); }
  .reveal-legendary .reveal-spark{ width:5px; height:5px; background:#fff4b8; border-color:#d78d26; box-shadow:0 0 10px #f5cb5b,0 0 20px rgba(245,203,91,0.75); animation:legendaryRevealSpark 880ms steps(9,end) both; animation-delay:calc(var(--i) * -26ms); }
  @keyframes revealBannerPulse{ 0%,100%{ opacity:0.68; transform:translateY(0); } 50%{ opacity:1; transform:translateY(-1px); } }
  @keyframes upgradeReveal{ 0%{ opacity:0; transform:scale(0.52) translateY(18px) rotate(-4deg); filter:brightness(2.7); } 46%{ opacity:1; transform:scale(1.18) translateY(-3px) rotate(1deg); filter:brightness(1.65); } 72%{ transform:scale(0.99) translateY(1px); } 100%{ opacity:1; transform:scale(1.05); filter:brightness(1); } }
  @keyframes fusionReveal{ 0%{ opacity:0; transform:scale(0.22) rotate(-12deg); filter:brightness(3); } 44%{ opacity:1; transform:scale(1.22) rotate(3deg); filter:brightness(1.9); } 70%{ transform:scale(0.98) rotate(-1deg); } 100%{ opacity:1; transform:scale(1.05); filter:brightness(1); } }
  @keyframes epicReveal{ 0%{ opacity:0; transform:scale(0.18) rotate(-10deg); filter:brightness(3.6); } 48%{ opacity:1; transform:scale(1.20) rotate(2deg); filter:brightness(1.8); } 74%{ transform:scale(0.99) rotate(0); } 100%{ opacity:1; transform:scale(1.05); filter:brightness(1); } }
  @keyframes epicRevealSpark{ 0%{ opacity:0; transform:translate(-50%,-50%) rotate(calc(var(--i) * 30deg)) translateY(-8px) scale(0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-50%) rotate(calc(var(--i) * 30deg)) translateY(-112px) scale(1.35); } }
  @keyframes legendaryReveal{ 0%{ opacity:0; transform:scale(0.08) rotate(-16deg); filter:brightness(5); } 34%{ opacity:1; transform:scale(1.28) rotate(4deg); filter:brightness(2.6); } 58%{ transform:scale(0.94) rotate(-1deg); filter:brightness(1.5); } 78%{ transform:scale(1.12) rotate(1deg); } 100%{ opacity:1; transform:scale(1.05); filter:brightness(1); } }
  @keyframes legendaryRevealSpark{ 0%{ opacity:0; transform:translate(-50%,-50%) rotate(calc(var(--i) * 18deg)) translateY(-8px) scale(0); } 16%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-50%) rotate(calc(var(--i) * 18deg)) translateY(-154px) scale(1.7); } }
  .card.reveal-card .card-name{ font-size:13px; }
  .card.reveal-card .card-desc{ font-size:10.5px; }

  /* 유물 = 성유물함 */
  .relic-card{
    border:1px solid var(--brass); border-radius:0; padding:16px 22px 18px;
    background:linear-gradient(180deg, rgba(184,147,79,0.13), rgba(10,17,19,0.55));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(184,147,79,0.11), 0 0 22px rgba(184,147,79,0.22);
    clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 11px, 100% calc(100% - 11px), calc(100% - 11px) 100%, 11px 100%, 0 calc(100% - 11px), 0 11px);
    max-width:280px; text-align:center;
  }
  .relic-glyph{ display:flex; justify-content:center; color:var(--gaslamp); filter:drop-shadow(0 0 10px rgba(224,170,76,0.55)); margin-bottom:6px; }
  .relic-name{ font-family:'Nanum Myeongjo',serif; font-size:14px; color:var(--brass); margin-bottom:6px; letter-spacing:0.03em; }
  .relic-desc{ font-family:'Nanum Myeongjo',serif; font-size:12.5px; color:var(--muted); line-height:1.65; font-style:italic; }
  .relic-boon{ font-size:11px; color:var(--phosphor); letter-spacing:0.04em; line-height:1.5; margin-bottom:6px; }
  /* 유물 원화는 한 장의 제단화에 모여 있다. 좌표만 달리해 각 유물의 초상으로 쓴다. */
  .relic-portrait{
    display:inline-block; width:36px; height:36px; flex:0 0 36px;
    background-image:url('assets/유물.png'); background-repeat:no-repeat;
    background-size:768px auto; background-position:var(--relic-x) var(--relic-y);
    image-rendering:auto;
  }
  /* 작은 칩은 원화 중앙을 잘라 아이콘처럼 쓰고, 획득 화면은 원형 액자 전체가
     보이도록 별도의 스프라이트 좌표와 넉넉한 캔버스를 쓴다. */
  .relic-portrait.large{ width:88px; height:88px; flex-basis:88px; }
  /* 잠식 아래 선반은 시야를 가리지 않도록 기존 25px의 절반 크기로 둔다. */
  .relic-portrait.compact{ width:13px; height:13px; flex-basis:13px; background-size:269px auto; }
  .relic-glyph .relic-portrait{ margin:0; }
  .relic-tier{
    display:inline-block; margin-left:auto; padding:2px 4px; border:1px solid currentColor;
    font-family:'Galmuri9','Nanum Myeongjo',serif !important; font-size:8px; line-height:1;
    letter-spacing:0.04em;
  }
  .tier-common{ color:#c6bba3; }.tier-uncommon{ color:#9ebd72; }.tier-rare{ color:#79b4d9; }
  .tier-very-rare{ color:#bd8bd5; }.tier-legendary{ color:#e29a45; }

  /* 첫 하강 — 설명을 읽고 넘기는 대신 실제 전투판에서 한 수씩 익힌다. */
  .prologue-screen{ padding:24px 18px; justify-content:center; align-items:center; text-align:center; gap:13px; overflow-y:auto; }
  /* 사망 연출은 프롤로그·일반 패배 모두 하나의 심연 테마를 공유한다. */
  .prologue-fall-screen,.result-screen.lose{
    isolation:isolate;
    background:linear-gradient(rgba(14,4,7,0.25),rgba(10,3,5,0.42)),url('assets/failed.png') center 100%/auto 130% no-repeat;
  }
  .prologue-fall-screen::before,.result-screen.lose::before{ content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,rgba(8,2,4,0.025),rgba(8,2,4,0.28)); }
  .prologue-fall-screen > *,.result-screen.lose > *{ position:relative; z-index:1; }
  .prologue-fall-screen .title-crest,.result-screen.lose .title-crest{ display:none; }
  .prologue-copy{ max-width:330px; color:var(--muted); font-size:12px; line-height:1.8; word-break:keep-all; }
  .prologue-panel{
    width:100%; max-width:350px; margin:2px auto 0; padding:8px 10px; text-align:left;
    border:1px solid rgba(224,170,76,0.62); background:#111416;
    box-shadow:inset 1px 1px 0 rgba(224,170,76,0.16), inset -1px -1px 0 #000;
  }
  .prologue-panel .tier-tag{ color:var(--gaslamp); margin-bottom:3px; }
  .prologue-panel p{ margin:0; color:var(--ink); font-size:10px; line-height:1.6; word-break:keep-all; }
  .prologue-fallen{ width:100%; max-width:340px; display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
  .prologue-fallen .hero-card{ min-height:112px; }
  .prologue-scroll-box{
    width:100%; max-width:340px; height:min(48vh,360px); overflow:hidden; position:relative;
    border-top:1px solid rgba(184,147,79,0.35); border-bottom:1px solid rgba(184,147,79,0.35);
    background:linear-gradient(180deg,#071014 0%,rgba(7,16,20,0.14) 18%,rgba(7,16,20,0.14) 82%,#071014 100%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 84%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 84%,transparent 100%);
  }
  .prologue-crawl{
    /* 첫 문장이 하단 가장자리에서 나타나 심해처럼 위로 떠오른다. */
    position:absolute; left:0; right:0; top:calc(100% - 56px); padding:0 18px; text-align:left;
    animation:prologueCrawl 40s linear infinite;
  }
  .prologue-crawl p{ margin:0 0 28px; color:#d6d0c2; font-size:13px; line-height:2; word-break:keep-all; text-shadow:1px 1px 0 #000; }
  /* 강조 문단은 깜빡이지 않는다 — 읽는 글을 흔들면 읽히지 않는다.
     본문보다 한 단 밝은 뼈색으로만 갈라 둔다. */
  .prologue-crawl p.em{ color:#efe9dc; }
  /* 첫 행은 즉시 하단에 보이고, 끝 행까지 지나간 뒤 다시 아래에서 시작한다. */
  @keyframes prologueCrawl{ from{transform:translateY(0);} to{transform:translateY(-160%);} }
  .btn.prologue-proceed{ animation:prologueProceed 1s steps(2,end) infinite; }
  @keyframes prologueProceed{ 0%,100%{ border-color:#e0aa4c; box-shadow:inset 1px 1px 0 #e8c479,inset -1px -1px 0 #5c4826,0 0 0 transparent; } 50%{ border-color:#fff0c7; box-shadow:inset 1px 1px 0 #fff0c7,inset -1px -1px 0 #5c4826,0 0 12px rgba(224,170,76,0.68); } }
  /* 튜토리얼에서 지금 눌러야 할 카드·표적·버튼. 보상이나 위험 요소와 혼동되지 않게 금빛 한 색만 쓴다. */
  .tutorial-pulse{ animation:tutorialPulse 0.9s steps(2,end) infinite !important; position:relative; z-index:2; }
  @keyframes tutorialPulse{ 0%,100%{ border-color:#e0aa4c; box-shadow:0 0 0 1px rgba(224,170,76,0.20),inset 1px 1px 0 rgba(232,196,121,0.35); } 50%{ border-color:#fff0c7; box-shadow:0 0 0 2px rgba(224,170,76,0.72),0 0 14px rgba(224,170,76,0.56),inset 1px 1px 0 #fff0c7; } }
  @media (prefers-reduced-motion: reduce){ .btn.prologue-proceed,.tutorial-pulse{ animation:none !important; } }
  @media (prefers-reduced-motion: reduce){ .prologue-scroll-box{ height:auto; max-height:48vh; overflow-y:auto; -webkit-mask-image:none; mask-image:none; }.prologue-crawl{ position:static; animation:none; padding:18px; } }

  /* ---------- ESCAPE / 인양 ---------- */
  .escape-screen{
    padding:26px 18px; justify-content:center; align-items:center; text-align:center; gap:12px; overflow-y:auto;
    isolation:isolate; background:linear-gradient(rgba(4,10,13,0.27),rgba(4,10,13,0.40)),url('assets/escape.png') center/cover no-repeat;
  }
  .escape-screen::before{ content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,rgba(5,14,18,0.04),rgba(5,11,13,0.26)); }
  .escape-screen > *{ position:relative; z-index:1; }
  /* 이전 마크업이 남아 있어도 인양 완료 제목 위의 문양은 표시하지 않는다. */
  .escape-screen .title-glyph{ display:none; }
  .escape-note{
    font-family:'Nanum Myeongjo',serif; font-size:11.5px; color:var(--muted);
    line-height:1.7; max-width:300px; font-style:italic;
  }
  .escape-growth{ width:100%; max-width:330px; padding:8px 10px; border:1px solid rgba(127,191,174,0.48); background:rgba(10,27,28,0.64); box-shadow:inset 0 0 14px rgba(127,191,174,0.08); }
  .escape-growth-title{ color:var(--phosphor); font-size:10px; letter-spacing:0.06em; margin-bottom:4px; }
  .escape-growth-row{ display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-top:1px solid rgba(127,191,174,0.14); color:var(--bone); font-size:10px; }
  .escape-growth-row small{ color:var(--muted); font-size:9px; text-align:right; }
  .relic-offer{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:330px; }
  .relic-opt{
    min-width:0; border:1px solid var(--brass-dim); border-radius:0; padding:11px 13px; text-align:left; cursor:pointer;
    background:linear-gradient(180deg, rgba(184,147,79,0.09), rgba(10,17,19,0.5));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .relic-opt:active{ border-color:var(--gaslamp); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), 0 0 16px rgba(224,170,76,0.3); }
  .relic-opt.slot-locked{ opacity:0.48; cursor:not-allowed; border-style:dashed; }
  .relic-slot-lock{ margin-top:5px; color:var(--blood); font-size:9px; }
  .relic-opt-head{
    display:flex; align-items:center; gap:7px; margin-bottom:5px;
    font-family:'Nanum Myeongjo',serif; font-size:12.5px; color:var(--brass);
  }
  .relic-opt-head > .portrait{ flex-shrink:0; }
  .relic-opt .relic-desc{ font-size:11px; line-height:1.55; }

  /* 지니고 있는 유물 — 이름만 늘어놓는 선반 */
  .relic-tray{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:330px; }
  .relic-chip{
    display:inline-flex; align-items:center; gap:4px;
    border:1px solid var(--brass-dim); background:rgba(184,147,79,0.09);
    padding:2px 7px; font-size:9.5px; color:var(--brass); letter-spacing:0.03em;
  }
  /* 유물은 남은 폭을 이름 길이에 맞춰 나누고, 표식은 항상 우측의 작은 아이콘 줄에 둔다. */
  .topbar-collection{ display:flex; align-items:center; gap:4px; margin-top:6px; min-width:0; }
  .topbar-relics{ min-width:0; flex:1 1 auto; max-width:none; display:flex; gap:3px; margin:0; --relic-font-size:10px; }
  .topbar-relics.relic-count-2{ --relic-font-size:9px; }
  .topbar-relics.relic-count-3{ --relic-font-size:8px; }
  .topbar-relics.relic-count-4{ --relic-font-size:7px; }
  .topbar-relics .relic-chip{ min-width:0; flex:1 1 auto; font-size:var(--relic-font-size); padding:1px 4px; }
  .topbar-relics .relic-chip span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 관측 표식은 보유 개수만큼만 우측에 붙는다. 세 개가 차도 유물 이름 영역을 침범하지 않는다. */
  .topbar-markers{ flex:0 0 auto; display:flex; justify-content:flex-end; gap:3px; margin-left:auto; }
  .marker-chip{
    width:26px; height:26px; flex:0 0 26px; display:flex; align-items:center; justify-content:center; padding:1px;
    border:1px solid rgba(166,79,79,0.62); background:rgba(48,9,13,0.38);
  }
  .marker-chip img{ width:100%; height:100%; display:block; object-fit:contain; background:#050607; image-rendering:auto; }

  .chapter-tag{
    display:flex; align-items:center; gap:8px;
    font-family:'Nanum Myeongjo',serif; font-size:10.5px; letter-spacing:0.2em;
    color:var(--brass); text-transform:uppercase;
  }
  .chapter-step{ font-family:monospace; font-size:10px; color:var(--muted); letter-spacing:0.06em; }
  .chapter-lead{
    font-family:'Nanum Myeongjo',serif; font-size:11.5px; color:var(--muted);
    font-style:italic; line-height:1.7; max-width:300px; text-align:center;
  }
  .chapter-threat{ display:block; margin-top:3px; color:var(--blood); font-family:'GalmuriMono11',monospace; font-size:8.5px; font-style:normal; letter-spacing:0.02em; }
  .node-card.boss{ border-color:var(--blood); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 20px rgba(143,32,40,0.2); }

  /* ---------- TAVERN / 여관 ---------- */
  .tavern-screen{ padding:24px 18px; justify-content:center; align-items:center; text-align:center; gap:11px; overflow-y:auto; }
  .tavern-roster{ display:flex; flex-direction:column; gap:6px; width:100%; max-width:330px; }
  .tavern-seat{
    min-width:0; display:flex; align-items:center; gap:9px; text-align:left;
    border:1px solid var(--brass-dim); padding:7px 9px;
    background:linear-gradient(180deg, rgba(184,147,79,0.07), rgba(10,17,19,0.45));
  }
  .tavern-seat.empty{ border-style:dashed; border-color:var(--crack); opacity:0.75; }
  .tavern-seat.fresh{ border-color:var(--phosphor); box-shadow:0 0 12px rgba(127,191,174,0.22); }
  .tavern-seat-body{ flex:1; min-width:0; }
  .tavern-seat-name{ font-size:11.5px; color:var(--ink); }
  .tavern-seat-sub{ font-size:9.5px; color:var(--muted); margin-top:1px; }
  .tavern-new{ font-size:8.5px; color:var(--phosphor); letter-spacing:0.08em; }
  .btn.tavern-hire{ flex-shrink:0; padding:4px 10px; font-size:10px; }
  .tavern-unlock{
    width:100%; max-width:330px; text-align:left; padding:9px 12px;
    border:1px solid var(--gaslamp); background:linear-gradient(180deg, rgba(224,170,76,0.12), rgba(10,17,19,0.5));
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .tavern-unlock .relic-opt-head{ color:var(--gaslamp); }

  /* 젖은 명패 — 여관 안쪽 벽 */
  .plate-wall{
    width:100%; max-width:330px; text-align:left; padding:8px 11px;
    border:1px solid var(--brass-dim); border-left:3px solid var(--gaslamp);
    background:linear-gradient(180deg, rgba(184,147,79,0.09), rgba(6,12,14,0.55));
  }
  .plate-wall-head{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:0.06em; color:var(--gaslamp); text-shadow:1px 1px 0 #000;
  }
  .plate-wall-note{ font-size:9.5px; color:var(--muted); line-height:1.7; margin-top:3px; word-break:keep-all; }
  /* 아직 물이 떨어지는 명패는 인광이 돈다 */
  .relic-opt.plate-opt{ border-color:rgba(127,191,174,0.5); }
  .relic-opt.plate-opt:hover{ border-color:var(--phosphor); box-shadow:0 0 12px rgba(127,191,174,0.20); }
  .plate-story{ font-style:italic; }
  .plate-left{ color:var(--muted); margin-top:4px; }

  /* 아직 만나지 못한 병과 */
  .class-card.locked{ opacity:0.4; border-style:dashed; cursor:default; }
  .class-card.locked .portrait{ filter:grayscale(1) brightness(0.6); }
  .class-locked-tag{ font-size:9px; color:var(--muted); letter-spacing:0.14em; }

  /* ---------- RESULT / GAMEOVER ---------- */
  .result-screen{ padding:32px 22px; justify-content:center; align-items:center; text-align:center; gap:14px;}
  /* 인양·완주·실패 결과는 한눈에 읽혀야 한다. 보조 영문 라벨의 기본 11px보다 두 배 크게 쓴다. */
  #app .escape-screen > .title-en,
  #app .result-screen > .title-en,
  #app .prologue-fall-screen > .title-en{
    font-size:22px; font-weight:700; line-height:1.2; letter-spacing:1px;
    text-shadow:1px 1px 0 #000, 0 0 8px rgba(224,170,76,0.35);
  }
  /* 화면과 원화 비율이 같아도 위치 이동이 보이도록 130%로 확대해 하단에 맞춘다.
     원화의 시작점이 약 30% 위로 올라가 게임오버 문구와 겹치지 않는다. */
  .result-screen.lose .title-en{ color:var(--blood-lit); }
  .result-list{ font-size:12px; color:var(--muted); line-height:1.95; }

  /* ================================================================
     안전 영역 — 노치와 홈 인디케이터
     viewport-fit=cover 로 화면 끝까지 그리므로, 그만큼 직접 비켜 줘야 한다.
     비켜 주지 않으면 상단바가 노치에 잘리고 턴 종료 버튼이 홈 바에 깔린다.
     웹 브라우저에서는 inset 이 전부 0 이라 아무것도 달라지지 않는다.
     ================================================================ */
  :root{
    --sa-top:    env(safe-area-inset-top, 0px);
    --sa-bottom: env(safe-area-inset-bottom, 0px);
    --sa-left:   env(safe-area-inset-left, 0px);
    --sa-right:  env(safe-area-inset-right, 0px);
  }
  /* 가로 여백은 화면 전체가 진다 — 가로로 눕히면 양쪽에 노치가 온다 */
  #app{ padding-left:var(--sa-left); padding-right:var(--sa-right); }

  .topbar{ padding-top:calc(10px + var(--sa-top)); }
  .hand-zone{ padding-bottom:calc(10px + var(--sa-bottom)); }
  /* 전투가 아닌 화면들은 제 스크롤 컨테이너 안에서 비켜 준다 */
  .map-screen,.rest-screen,.result-screen,.tavern-screen,.escape-screen{
    padding-top:calc(20px + var(--sa-top));
    padding-bottom:calc(20px + var(--sa-bottom));
  }
  .title-screen{
    padding-top:calc(24px + var(--sa-top));
    padding-bottom:calc(24px + var(--sa-bottom));
  }

  ::-webkit-scrollbar{ display:none; }

  /* ================================================================
     PIXEL SKIN
     여기서부터는 앞의 동판화 규칙을 픽셀 규칙으로 덮어쓴다.
     원칙은 셋뿐이다 — 흐릿한 것을 없애고, 곡선을 계단으로 바꾸고,
     모든 치수를 정수 픽셀에 맞춘다.
     ================================================================ */

  /* ---- 글꼴 : 세리프를 비트맵으로 ----
     앞쪽 규칙들이 저마다 Cinzel·IM Fell·Spectral 을 직접 지정해 두었으므로
     한 군데만 고쳐서는 안 잡힌다. 전부 걷어낸 뒤 표제와 숫자만 되돌려 준다. */
  body,#app,#app *{
    font-family:'Galmuri11','Nanum Myeongjo',serif !important;
    letter-spacing:0; font-style:normal !important;
  }
  #app h1,#app h2,#app h3,#app .disp,#app .btn,#app .title-en,#app .title-kr,
  #app .foe-name,#app .foe-rank,#app .hero-rank,#app .node-card h3,
  #app .rest-opt .t,#app .relic-opt-head,#app .zone-label,#app .ap-label,
  #app .menu-item{
    font-family:'Galmuri14','Galmuri11','Nanum Myeongjo',serif !important;
  }
  #app .mono,#app .hero-num,#app .block-tag,#app .card-cost,#app .ero-num{
    font-family:'GalmuriMono11','Galmuri11',monospace !important;
  }
  .title-kr{ font-size:24px; letter-spacing:0.06em; text-shadow:2px 2px 0 #000; }
  /* 비트맵 글꼴에 그림자를 흘리면 획이 뭉갠다 — 그림자도 한 픽셀씩 각지게 */
  h1,h2,h3,.disp,.foe-name,.hero-name,.btn{ text-shadow:1px 1px 0 rgba(0,0,0,0.9); }

  /* ---- 흐림 제거 ---- */
  .beam{ filter:none; opacity:0.5; }
  .mote,.ash{ box-shadow:none; }
  .title-kr,.title-glyph span{ filter:none; }

  /* ---- 곡선을 계단으로 ---- */
  .btn,.foe-card,.hero-card,.hpbar,.intent-badge,.block-tag,.reach-chip{ border-radius:0; }
  .bubble,.mote,.ash{ border-radius:0; }        /* 물거품도 재도 네모난 픽셀 하나 */
  .ash{ width:2px; height:2px; }
  .mote{ image-rendering:pixelated; }

  /* ---- 버튼 : 그라디언트 대신 한 픽셀 베벨 ---- */
  .btn{
    background:#141a1c;
    border:1px solid var(--brass-dim);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.16), inset -1px -1px 0 rgba(0,0,0,0.8);
    padding:12px 24px;
  }
  .btn:active{ transform:translateY(1px); box-shadow: inset -1px -1px 0 rgba(224,170,76,0.12), inset 1px 1px 0 rgba(0,0,0,0.8); }
  .btn.primary{
    background:#a67c33; color:#120a05;
    border-color:#e0aa4c;
    box-shadow: inset 1px 1px 0 #e8c479, inset -1px -1px 0 #5c4826;
    text-shadow:1px 1px 0 rgba(255,240,205,0.3);
  }
  .btn.danger{ background:#2a0f12; color:var(--blood-lit); border-color:#6a2420;
    box-shadow: inset 1px 1px 0 rgba(196,56,60,0.22), inset -1px -1px 0 rgba(0,0,0,0.8); }

  /* ---- 메뉴 : 다른 버튼과 같은 픽셀 베벨로 맞춘다 ---- */
  .menu-btn,.menu-close,.menu-item{ border-radius:0; }
  .menu-btn,.menu-item{
    background:#141a1c;
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.16), inset -1px -1px 0 rgba(0,0,0,0.8);
  }
  .menu-btn:active,.menu-item:active{
    background:#141a1c;
    box-shadow: inset -1px -1px 0 rgba(224,170,76,0.12), inset 1px 1px 0 rgba(0,0,0,0.8);
  }

  /* ---- 초상 감실 : 클립패스 대신 각진 액자 ----
     비스듬히 잘라내면 대각선 가장자리가 흐려져 픽셀이 죽는다.
     대신 다키스트 던전식 사각 액자로 통일하고, 직군은 테두리 색으로만 가른다. */
  .portrait{
    width:42px; height:42px; margin:0 auto 4px;
    clip-path:none !important; border-radius:0 !important;
    background:#05080a !important; overflow:hidden;
    border:1px solid var(--brass-dim);
    box-shadow: inset 0 0 0 1px #000;
    filter:none !important;
  }
  .portrait-vanguard{ border-color:#4f6675; }
  .portrait-chemist { border-color:#54684b; }
  .portrait-priest  { border-color:#7c7666; }
  .portrait-oracle  { border-color:#544b74; }
  .portrait-hellion { border-color:#7a2a2c; }
  .portrait-robber  { border-color:#4a5c45; }
  .portrait-jester  { border-color:#4e4468; }

  /* 적 감실도 같은 규칙 — 둥근 후광 대신 젖은 석판 한 장 */
  .enemy-portrait,
  .enemy-portrait.tier-surface,
  .enemy-portrait.tier-mid{
    width:48px; height:48px; border-radius:0;
    background:#06090c;
    border:1px solid rgba(141,122,176,0.30);
    box-shadow: inset 0 0 0 1px #000;
    animation:none;
    padding:1px;
  }
  .enemy-portrait.tier-mid{ border-color:rgba(156,53,80,0.34); }
  .foe-card.elite-foe .enemy-portrait{ transform:none; border-color:var(--brass-dim); }
  .foe-card.boss-foe .enemy-portrait,
  .foe-card.boss-foe .enemy-portrait.tier-mid{ width:76px; height:76px; }
  .foe-row.crowded .enemy-portrait{ width:36px; height:36px; }
  .foe-card.boss-awakened .enemy-portrait{ border-color:var(--blood-lit); }

  /* ---- 체력 게이지 : 매끈한 띠 대신 눈금 ----
     눈금은 반드시 색 '위에' 얹어야 한다. background-image 만 새로 주면
     아래 깔려 있던 색 그라디언트를 통째로 갈아치워서 게이지가 투명해진다. */
  .hpbar{
    border-radius:0; height:9px;
    background:#0a0e12;
    border:1px solid rgba(0,0,0,0.8);
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.9), 0 0 0 1px rgba(141,122,176,0.34);
  }
  .hero-hpline .hpbar{ height:9px; }
  .hpbar .fill{
    transition:width 0.2s steps(8, end);
    background-color:#7a66a6;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.45) 0 1px, transparent 1px 4px),
      linear-gradient(90deg, #5a4780, #a894cf);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }
  /* 피는 계급을 가리지 않는다 — 아군은 동맥색, 적은 잠식의 보라 */
  .hero-card .hpbar .fill{
    background-color:#a8262c;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.45) 0 1px, transparent 1px 4px),
      linear-gradient(90deg, #6b1620, #c4383c);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
  }

  /* ---- 조준 표시 : 확대 대신 점멸 ----
     픽셀 그림을 1.035배로 늘리면 매 프레임 다른 픽셀이 뭉갠다. */
  @keyframes targetPulse{ 0%,100%{ transform:none; opacity:1; } 50%{ transform:none; opacity:0.72; } }
  .foe-card.targetable,.hero-card.targetable{
    box-shadow: inset 0 0 0 1px #000, inset 0 0 0 2px rgba(127,191,174,0.5);
    animation:targetPulse 0.9s steps(2,end) infinite;
  }

  /* ---- 파티클 : 둥근 빛망울 대신 각진 부스러기 ----
     번짐(box-shadow blur)을 걷어내고 움직임도 계단으로 끊는다.
     매끄럽게 흐르는 파티클 하나가 화면 전체의 픽셀감을 깬다. */
  .p-shard,.p-ring,.p-wisp,.p-slash,.p-bub,.p-mote,.p-plus,.p-blood{
    border-radius:0 !important; box-shadow:none !important; filter:none !important;
    image-rendering:pixelated;
  }
  .p-shard{ width:3px; height:6px; animation-timing-function:steps(7,end); }
  .p-ring{ border-width:2px; animation-timing-function:steps(6,end); }
  .p-wisp{ height:3px; background:currentColor; animation-timing-function:steps(6,end); }
  .p-slash{ height:3px; background:currentColor; animation-timing-function:steps(5,end); }
  .p-bub{ background:rgba(206,228,220,0.5); border:1px solid rgba(236,244,240,0.7);
          animation-timing-function:steps(9,end); }
  .p-mote{ animation-timing-function:steps(8,end); }
  .p-blood{ animation-timing-function:steps(8,end); }
  /* 치명타 글자도 비트맵으로 세운다 — 확대는 획을 뭉개므로 튀어오르기만 시킨다 */
  .p-crit{
    font-family:'GalmuriMono11',monospace !important;
    font-size:14px; letter-spacing:0.06em;
    text-shadow:1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    animation-timing-function:steps(8,end);
  }
  @keyframes critPop{
    from{ transform:translate(-50%,-50%) translateY(6px); opacity:0; }
    14% { transform:translate(-50%,-50%) translateY(-2px); opacity:1; }
    64% { transform:translate(-50%,-50%) translateY(-12px); opacity:1; }
    to  { transform:translate(-50%,-50%) translateY(-26px); opacity:0; }
  }
  /* 십자도 비트맵 글꼴로 세우고 계단으로 끊는다 — 번짐은 위에서 이미 걷어냈으므로
     검은 테를 한 겹 둘러 어두운 카드 위에서도 획이 살아 있게 한다. */
  .p-plus{
    font-family:'GalmuriMono11',monospace !important;
    font-size:13px; letter-spacing:0;
    text-shadow:1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    animation-timing-function:steps(7,end);
  }
  @keyframes plusRise{
    from{ transform:translate(-50%,-50%); opacity:0; }
    20% { transform:translate(-50%,-50%); opacity:1; }
    to  { transform:translate(calc(-50% + var(--dx,0px)), calc(-50% - var(--dy,24px))); opacity:0; }
  }
  /* 수치는 비트맵 글꼴로 세우고, 솟아오르는 것도 계단으로 끊는다.
     확대·축소는 획을 뭉개므로 픽셀 스킨에서는 오르내리기만 시킨다. */
  .p-dmg{
    font-family:'GalmuriMono11',monospace !important;
    font-size:15px; letter-spacing:0;
    text-shadow:1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    animation-timing-function:steps(7,end);
  }
  @keyframes dmgFloat{
    from{ transform:translate(-50%,-50%) translateY(4px); opacity:0; }
    15% { transform:translate(-50%,-50%) translateY(-4px); opacity:1; }
    55% { transform:translate(-50%,-50%) translateY(-14px); opacity:1; }
    to  { transform:translate(-50%,-50%) translateY(-28px); opacity:0; }
  }

  /* ---- 피격 흔들림 : 정수 픽셀만큼만, 뚝뚝 끊어서 ---- */
  @keyframes hitShake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-3px); }
    40%{ transform:translateX(3px); }
    60%{ transform:translateX(-2px); }
    80%{ transform:translateX(2px); }
  }
  .hit-shake{ animation:hitShake 240ms steps(1,end); }

  /* ---- 스프라이트 숨쉬기 ----
     물속에 떠 있는 것들은 가만히 있지 않는다. 한 픽셀씩만 오르내린다. */
  @keyframes pxFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2px); } }
  @keyframes pxFloatSlow{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-1px); } }
  .enemy-portrait img{ animation:pxFloat 2.4s steps(2,end) infinite; }
  .foe-card:nth-child(2n) .enemy-portrait img{ animation-duration:2.9s; animation-delay:-0.7s; }
  .foe-card:nth-child(3n) .enemy-portrait img{ animation-duration:3.4s; animation-delay:-1.4s; }
  .foe-card.boss-foe .enemy-portrait img{ animation-duration:4.2s; }
  .foe-card.boss-awakened .enemy-portrait img{ animation-duration:1.4s; }
  .battle-screen .portrait img.px{ animation:pxFloatSlow 3.6s steps(2,end) infinite; }
  .foe-card[style*="opacity:0.3"] .enemy-portrait img,
  .hero-card[style*="opacity:0.35"] .portrait img.px{ animation:none; filter:grayscale(1) brightness(0.5); }

  /* ---- 주사선 + 픽셀 격자 : 화면 전체를 한 장의 낡은 브라운관으로 ---- */
  #grain{
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.13) 0 1px, transparent 1px 3px);
  }
  #grain::after{
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.85), inset 0 0 40px 14px rgba(0,0,0,0.25), inset 0 0 160px 56px rgba(0,0,0,0.22);
  }

  /* ---- 층 배경 : 매끈한 그라디언트를 디더 띠로 ----
     물속으로 내려갈수록 색이 한 단씩 뚝뚝 떨어지게 만든다. */
  #app[data-tier="surface"]{ --column-bg:
      repeating-linear-gradient(180deg,
        #16292c 0 26px, #132427 26px 52px, #0f1e21 52px 82px, #0c191c 82px 116px,
        #0a1517 116px 154px, #081113 154px 196px, #060d0f 196px 100%); }
  #app[data-tier="mid"]{ --column-bg:
      repeating-linear-gradient(180deg,
        #0d1519 0 26px, #0b1317 26px 52px, #0a1114 52px 82px, #080e11 82px 116px,
        #070c0e 116px 154px, #050a0b 154px 196px, #04080a 196px 100%); }
  #app[data-tier="abyss"]{ --column-bg:
      repeating-linear-gradient(180deg,
        #06080b 0 26px, #050709 26px 52px, #040608 52px 82px, #030405 82px 116px,
        #020304 116px 154px, #010202 154px 196px, #000000 196px 100%); }

  /* 제목 화면의 회전 궤도 — 원을 네모로 바꾸면 돌 때마다 대각선이 생겨 못 쓴다.
     돌리지 말고, 겹쳐 새긴 사각 인장으로 세워 둔다. */
  .title-glyph{
    width:96px; height:96px; border-radius:0;
    border:1px solid var(--brass-dim);
    box-shadow: inset 0 0 0 1px #000, inset 0 0 0 4px rgba(184,147,79,0.10);
  }
  .title-glyph::before{
    inset:8px; border-radius:0; animation:none;
    border:1px dashed rgba(184,147,79,0.30);
  }
  .title-glyph::after{
    inset:-5px; border-radius:0; animation:none;
    border:1px solid rgba(184,147,79,0.13);
    border-top-color:rgba(196,56,60,0.40);
    border-bottom-color:rgba(127,191,174,0.28);
  }
  .rule::after{ transform:translate(-50%,-50%); width:5px; height:5px; }

  /* ---- 타이틀 : 키 아트 위에 문장과 워드마크를 얹는다 ----
     문장과 워드마크는 검은 바탕째로 구웠다. screen 으로 합성하면 검정이 사라져
     투명 PNG 없이도 배경 위에 얹힌다 — 알파를 깎으면 어두운 놋쇠 선이 함께 날아간다. */
  .title-screen{ justify-content:center; padding:24px; gap:9px; position:relative; }
  .title-art{
    position:absolute; inset:0;
    background-size:cover; background-position:50% 20%;
    opacity:0.55; pointer-events:none; z-index:0;
    -webkit-mask-image:linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,0.25) 78%, transparent 100%);
            mask-image:linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,0.25) 78%, transparent 100%);
  }
  .title-screen > *:not(.title-art){ position:relative; z-index:1; }
  .title-wordmark{
    width:100%; max-width:318px; height:auto; display:block; margin:0 auto 2px;
    mix-blend-mode:screen;
  }
  /* 문장 — 배경이 깨끗한 결과·게임오버 화면에 세운다 */
  .title-crest{
    width:104px; height:auto; display:block; margin:0 auto;
    mix-blend-mode:screen;
  }
  .title-crest.lost{ filter:hue-rotate(-28deg) saturate(1.5) brightness(0.95); }
  .title-screen .title-en,.title-screen .title-sub{ text-shadow:1px 1px 0 #000, 0 0 9px #000; }
  .title-screen .rule{ margin:2px auto; }
  .title-screen > .title-version{
    position:absolute; right:calc(12px + var(--sa-right)); bottom:calc(10px + var(--sa-bottom)); z-index:2;
    margin:0; color:rgba(214,208,194,0.58); font-size:9px; letter-spacing:0.12em;
    text-shadow:1px 1px 0 #000;
  }
  @media (max-height:680px){
    .title-wordmark{ max-width:258px; }
    .title-crest{ width:78px; }
  }

  /* 해금 알림 — 여관에 들어서면 먼저 눈에 들어와야 한다 */
  .tavern-unlock.unlocked{
    border-color:var(--gaslamp);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.20), 0 0 0 1px #000;
  }
  .unlock-banner{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:1px; color:var(--gaslamp);
    margin-bottom:6px; text-shadow:1px 1px 0 #000;
  }

  /* 새로 건진 유물 — 지닌 것들과 갈라 보이게 */
  .relic-opt.incoming{ border-color:var(--gaslamp); box-shadow: inset 1px 1px 0 rgba(224,170,76,0.22), 0 0 0 1px #000; }
  .relic-new{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important; font-size:9px;
    color:#120a05; background:#a67c33; border:1px solid #e0aa4c;
    padding:0 4px; margin-left:4px;
  }

  /* 임시 AP — 이 턴이 지나면 사라지므로 반쯤 비쳐 보이게 둔다 */
  .pip.temp{
    opacity:0.5;
    border-style:dashed;
  }
  .pip.temp.filled{
    background:#c9964a; border-color:#e8c479;
    box-shadow: inset 1px 1px 0 rgba(232,196,121,0.5);
  }

  /* 아직 아무도 서지 않은 자리 */
  .portrait-vacant{
    border:1px dashed var(--brass-dim) !important;
    background:#070b0d !important;
  }
  .tavern-seat.empty .tavern-seat-name{ color:var(--muted); }

  /* 잠긴 직군은 회색이 아니라 그늘에 앉아 있다 */
  .class-card.locked .portrait{ filter:brightness(0.42) saturate(0.35) !important; }

  /* ---- 보스급이 남기고 간 것 ---- */
  .relic-card.drop{
    border-color:var(--gaslamp);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.2), inset -1px -1px 0 rgba(0,0,0,0.8), 0 0 0 1px #000;
  }
  .drop-banner{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:1px; color:var(--gaslamp);
    margin-bottom:6px; text-shadow:1px 1px 0 #000;
  }

  /* ---- 덱 구성 : 무엇을 들고 내려갈지 고르는 자리 ----
     손패 카드처럼 크게 펼치면 열아홉 장이 화면을 넘긴다. 한 줄짜리 표로 눕힌다. */
  .deck-sect{ width:100%; max-width:340px; margin:0 auto 10px; }
  .deck-sect-head{
    display:flex; align-items:center; gap:6px; margin-bottom:5px;
    padding-bottom:3px; border-bottom:1px solid rgba(184,147,79,0.22);
  }
  .deck-sect-name{ flex:1; color:var(--brass); font-size:11px; letter-spacing:0.02em; }
  .deck-count{
    font-family:'GalmuriMono9',monospace !important; font-size:9px;
    color:var(--muted); border:1px solid var(--brass-dim); padding:1px 4px;
  }
  .deck-count.done{ color:#120a05; background:#a67c33; border-color:#e0aa4c; }

  .pick-card{
    display:flex; align-items:stretch; gap:7px; margin-bottom:4px;
    padding:5px 7px 5px 5px; cursor:pointer;
    background:#0b1114;
    border:1px solid var(--brass-dim);
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.8);
  }
  .pick-card .pick-cost{
    flex-shrink:0; width:18px; display:flex; align-items:center; justify-content:center;
    font-family:'GalmuriMono11',monospace !important; font-size:11px;
    color:#f0e4c8; background:#7e1a22;
    border:1px solid #c9964a; box-shadow: inset 1px 1px 0 #b8323a;
  }
  .pick-body{ flex:1; min-width:0; text-align:left; }
  .pick-name{ font-size:11px; color:var(--ink); line-height:1.3; }
  .pick-desc{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; color:var(--muted); line-height:1.45; margin-top:2px; word-break:keep-all;
  }
  /* 고른 것 — 놋쇠로 덧대어 한눈에 갈라 보이게 */
  .pick-card.sel{
    background:#1a1408;
    border-color:var(--gaslamp);
    box-shadow: inset 1px 1px 0 rgba(224,170,76,0.28), inset -1px -1px 0 rgba(0,0,0,0.8), 0 0 0 1px #000;
  }
  .pick-card.sel .pick-name{ color:var(--gaslamp); }
  .pick-card.owner-neutral{ border-color:var(--card-normal); }
  .pick-card.owner-vanguard,.pick-card.owner-chemist,.pick-card.owner-priest,.pick-card.owner-oracle,
  .pick-card.owner-hellion,.pick-card.owner-robber,.pick-card.owner-jester{ border-color:var(--card-class); }
  .pick-card.epic{ border-color:var(--card-epic); }
  .pick-card.legendary{ border-color:var(--card-legendary); }
  /* 칸이 다 찼을 때 못 고르는 것은 물러나 있게 — 막지는 않는다(고른 걸 눌러 빼면 된다) */
  .pick-card.full{ opacity:0.4; }
  .pick-card:active{ transform:translateY(1px); }

  /* ---- 등잔 기름 = AP : 방울을 각진 눈금으로 ---- */
  .pip{
    width:10px; height:14px; border-radius:0; transform:none;
    border:1px solid var(--brass-dim); background:#0a0c0d;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.8);
  }
  .pip.filled{
    background:#c9964a; border-color:#e8c479; box-shadow: inset 1px 1px 0 #e8c479, inset -1px -1px 0 #6b5530;
  }

  /* ---- 밀랍 봉인 = 비용 : 찌그러진 원 대신 각진 인장 ---- */
  .card-cost{
    border-radius:0; width:22px; height:22px; top:-7px; left:-7px;
    background:#b8750d;
    border:1px solid #f2ce4b;
    color:#080704;
    font-weight:900;
    box-shadow: inset 1px 1px 0 #ffe47a, inset -1px -1px 0 #65400a, 1px 1px 0 rgba(0,0,0,0.9);
    text-shadow:none;
  }

  /* ---- 정신 함몰 게이지 : 체력과 같은 케이스를 쓰되 한 칸 얇게 ----
     압박도 체력도 채움색이 인라인으로 들어오므로, 여기서는 눈금만 그 위에 얹는다.
     background-image 에 색 그라디언트를 주면 그 색을 덮어 버린다. */
  .dp-line .hpbar{ height:6px; }
  .hero-card .dpbar .fill,
  .hero-card .lifebar .fill{
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.45) 0 1px, transparent 1px 4px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
  }

  /* ---- 인장 : SVG 자리를 픽셀 그림이 물려받았으니 크기 규칙도 옮긴다 ---- */
  .relic-glyph{ filter:none; }
  .relic-chip img.px{ flex-shrink:0; }
  /* 감실 없이 놓인 인장만 붙든다 — 액자 안의 초상은 제 크기(100%)를 지킨다 */
  .relic-opt-head > img.px{ flex-shrink:0; }
  .relic-opt-head > .portrait{ flex-shrink:0; }

  /* 의도 배지 도상도 마찬가지 — 칸이 좁아져도 12px 를 깎지 않는다 */
  .intent-badge .ic img.px,
  .foe-row.many .intent-badge .ic img.px,
  .foe-row.crowded .intent-badge .ic img.px{ width:12px; height:12px; flex-shrink:0; }
  /* 잔글씨 도상은 12×12 로 찍혀 있다. 9px·10px·11px 로 줄이면 정수배가 아니라서
     최근접 보간이 12줄 중 한두 줄을 통째로 버리고, 방패 외곽선이 갉아먹힌다.
     좁은 칸에서도 제 크기(12px)를 지키게 둔다. */
  .react-tag img.px{ width:12px; height:12px; flex-shrink:0; }
  .block-tag img.px{ width:12px; height:12px; flex-shrink:0; }
  .crumb-chip{
    border-radius:0; width:22px; height:22px;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.85), inset -1px -1px 0 rgba(184,147,79,0.10);
  }

  /* ================================================================
     시인성 — 비트맵 글꼴은 제 크기에서만 또렷하다
     갈무리는 7·9·11·14px 로 그려진 글꼴이다. 8.5px 나 9.5px 로 쓰면
     획이 픽셀 격자에서 반 칸 어긋나 안티에일리어싱으로 뭉갠다.
     그래서 잔글씨를 전부 설계 크기에 붙이고, 자간도 정수 픽셀로 끊는다.
     ================================================================ */

  /* --- 11px 급 : 플레이어가 실제로 읽는 잔글씨 ---
     예전엔 9px 이었다. 격자에는 맞았지만 손에 쥔 화면에서는 너무 작았다.
     비트맵 글꼴이라 10px 같은 중간값으로는 못 올리고 한 단(9→11) 통째로 올린다. */
  #app .reach-chip,#app .rank-warn,#app .foe-rank,#app .hero-rank,
  #app .class-locked-tag,#app .tavern-new,#app .tavern-seat-sub,
  #app .af-row-owner,#app .class-tagline,#app .node-type-tag,
  #app .title-en,#app .ero-label,#app .ap-label,#app .tier-tag,
  #app .rank-slot-label,#app .card-desc,#app .topbar-relics .relic-chip,
  #app .foe-row.many .foe-rank,#app .pick-desc,#app .drop-banner{
    font-family:'Galmuri11','Nanum Myeongjo',serif !important;
    font-size:11px; letter-spacing:0; line-height:1.5;
  }
  #app .card-desc{ line-height:1.55; }
  /* 상단 선반은 정보 밀도가 높아 별도로 30% 줄인다. 일반 유물 선택창은 읽기 크기를 유지한다. */
  #app .topbar-relics .relic-chip{ font-size:var(--relic-font-size,8px) !important; line-height:1.35; gap:3px; padding:1px 4px; }
  /* 자간을 벌려야 읽히는 것은 대문자·기호로 된 표제뿐이다 */
  #app .title-en,#app .ero-label,#app .ap-label,#app .tier-tag,
  #app .zone-label,#app .rank-slot-label{ letter-spacing:1px; }

  /* --- 9px 급 : 읽지 않고 훑고 지나가는 장식 딱지만 (예전 7px) --- */
  #app .zone-label,#app .card-owner-tag,
  #app .foe-row.crowded .reach-chip{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:1px;
  }

  /* --- 숫자 : 고정폭도 제 크기로 --- */
  #app .hero-num,#app .foe-row.many .hero-num,#app .deck-count{
    font-family:'GalmuriMono11',monospace !important; font-size:11px; letter-spacing:0;
  }
  #app .hero-num{ min-width:32px; }

  /* --- 본문·표제도 한 단씩 --- */
  body,#app,#app *{ line-height:1.55; }
  #app .card-name,#app .hero-name,#app .foe-name,#app .pick-name,
  #app .rank-slot-name,#app .relic-name,#app .tavern-seat-name{ font-size:12px; }
  #app .class-blurb,#app .relic-desc,#app .relic-boon,#app .af-flavor,
  #app .escape-note,#app .reach-legend,#app .log-plate,#app .title-sub,
  #app .node-card p,#app .rest-opt .d,#app .result-list{ font-size:12px; line-height:1.6; }
  #app h2,#app h3,#app .node-card h3{ font-size:16px; }

  /* --- 대비 : 어두운 판 위에서 회색이 너무 가라앉아 있었다 --- */
  #app .card-desc,#app .pick-desc,#app .class-blurb,#app .relic-desc,
  #app .af-flavor,#app .escape-note,#app .reach-legend,#app .hero-num,
  #app .tavern-seat-sub,#app .af-row-owner,#app .card-owner-tag{ color:#a8a596; }
  #app .log-plate,#app .node-card p{ color:#c4bfae; }

  /* ---- 이름이 길면 두 줄이 된다 ----
     한 카드만 두 줄이 되면 그 카드의 체력바만 아래로 밀려 줄이 어그러진다.
     ('앵무조개 오징어' 처럼 긴 이름이 실제로 있다.)
     그래서 두 줄 자리를 미리 비워 두고, 짧은 이름은 그 안에서 가운데 선다.

     이름과 계기는 한 덩어리로 읽혀야 하므로 그 사이를 최대한 좁힌다.
     본문 줄간(1.55)을 그대로 쓰면 두 줄 자리가 37px 이 되어 빈 공간이 남으니,
     이름만 줄간을 좁혀(1.2) 두 줄 높이를 29px 로 줄이고 여백도 1px 만 남긴다. */
  #app .foe-name,#app .hero-name{
    display:flex; align-items:center; justify-content:center;
    line-height:1.2; min-height:29px; margin:1px 0 1px;
  }
  #app .foe-row.crowded .foe-name{ min-height:27px; }

  /* ---- 낮은 화면 : 전투 한 판이 세로로 다 들어가야 한다 ----
     320×568 같은 기기에서는 적·아군·손패를 합치면 화면을 넘긴다.
     아군 대열이 flex 로 짜부라져 24px 짜리 띠가 되는 사고가 여기서 났다.
     짓눌리게 두는 대신, 초상과 카드를 한 단씩 줄여 자리를 만든다.
     글씨 크기는 건드리지 않는다 — 작은 화면일수록 글씨는 커야 한다. */
  @media (max-height:680px){
    .enemy-zone{ padding:6px 8px 4px; }
    .enemy-portrait,
    .enemy-portrait.tier-surface,
    .enemy-portrait.tier-mid{ width:38px; height:38px; }
    .foe-card.boss-foe .enemy-portrait,
    .foe-card.boss-foe .enemy-portrait.tier-mid{ width:56px; height:56px; }
    .foe-row.crowded .enemy-portrait{ width:32px; height:32px; }
    #app .foe-name,#app .hero-name{ min-height:15px; margin:1px 0 1px; }
    #app .foe-row.crowded .foe-name{ min-height:15px; }

    .party-zone{ padding:6px 6px; }
    .portrait{ width:34px; height:34px; margin:0 auto 3px; }
    .dp-line .hpbar{ height:5px; }

    .mid-stage{ padding:4px 10px; }
    .hand-zone{ padding:4px 6px calc(7px + var(--sa-bottom)); }
    .energy-row,.ap-row{ margin-bottom:5px; }
    .hand-row{ padding:14px 7px 6px; gap:7px; }
    .card{ flex:0 0 112px; height:142px; padding:7px 6px; }
    .card-name{ margin-top:7px; min-height:20px; }
    #app .card-desc{ line-height:1.4; }
    .btn{ padding:9px 18px; }

    /* 턴 종료가 제 줄을 차지하면 그 한 줄 때문에 버튼이 화면 밖으로 밀린다.
       AP 줄의 빈 오른쪽에 얹어 한 줄을 통째로 돌려받는다. */
    .hand-zone{ position:relative; }
    .ap-row{ justify-content:flex-start; padding-left:4px; }
    .end-turn-row{ position:absolute; top:2px; right:8px; padding-top:0; z-index:3; }
    .end-turn-row .btn{ padding:6px 14px; }

    /* 좁은 칸에서 '중열 [중거리]' 가 두 줄로 접히면 그 카드만 아래로 밀린다 */
    #app .reach-chip{ font-size:9px; padding:0 3px; }
  }

  /* ---- 좁은 화면 : 글씨를 줄이는 대신 여백을 줄인다 ----
     손바닥만 한 화면일수록 글씨가 커야 읽힌다. 자리는 패딩에서 뺀다. */
  @media (max-width:400px){
    .map-screen{ padding:calc(14px + var(--sa-top)) 10px calc(14px + var(--sa-bottom)); gap:9px; }
    .rest-screen,.result-screen{ padding:calc(18px + var(--sa-top)) 12px calc(18px + var(--sa-bottom)); }
    .enemy-zone{ padding:8px 6px 5px; }
    .foe-row{ gap:4px; }
    .foe-card{ padding:6px 3px; }
    .party-zone{ padding:8px 5px; gap:4px; }
    .hero-card{ padding:6px 3px; }
    .hand-row{ gap:7px; padding:16px 7px 8px; }
    .deck-sect{ max-width:none; }
    .pick-card{ padding:5px 5px 5px 4px; gap:6px; }
    .topbar{ padding:calc(8px + var(--sa-top)) 10px 7px; }
    .btn{ padding:11px 16px; }
    #app .title-kr{ font-size:22px; }
  }

  /* ---- 방어 = 놋쇠로 덧댄 판금 ----
     초상 위에 겹쳐 놓이는 딱지라 반투명하면 뒤의 그림과 섞여 읽히지 않는다.
     불투명 판으로 깔고, 검은 테를 한 겹 둘러 무엇 위에 놓이든 떼어 놓는다. */
  #app .block-tag{
    display:inline-flex; align-items:center; gap:3px;
    padding:1px 4px 1px 3px;
    font-family:'GalmuriMono11',monospace !important;
    font-size:11px; letter-spacing:0; line-height:1;
    color:#f0e4c8;
    background:#0e1a20;
    border:1px solid var(--brass);
    box-shadow: 0 0 0 1px #000, inset 1px 1px 0 rgba(224,170,76,0.22);
    text-shadow:1px 1px 0 #000;
  }

  /* ---- 피격 반응 표식 : 같은 이유로 불투명하게 ---- */
  /* 표식 더미가 카드 안쪽 맨 위에 얹히면 열 표시("전열/중열/후열")를 덮는다.
     더미째로 테두리 위에 반 칸 올려 걸어 두면 둘 다 읽힌다. */
  #app .status-stack{ top:-7px; left:2px; }
  #app .react-tag{
    gap:3px; padding:1px 4px 1px 3px; line-height:1;
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:0;
    background:#05090c;
    box-shadow: 0 0 0 1px #000;
    text-shadow:1px 1px 0 #000;
    animation:reactPop 0.35s steps(3,end);
  }
  /* 색이 곧 뜻이다 — 회피/흘림/반격을 글자만이 아니라 색으로도 가른다 */
  .react-dodge{ color:#a8e6d6; }
  .react-guard{ color:#bcd8ee; }
  .react-riposte{ color:#e0605c; }

  /* 의도 배지도 8.5~10.5px 를 오가고 있었다 — 전부 9px 로 붙인다 */
  #app .intent-badge,
  #app .foe-row.many .intent-badge,
  #app .foe-row.crowded .intent-badge{
    font-family:'Galmuri9','Nanum Myeongjo',serif !important;
    font-size:9px; letter-spacing:0; gap:4px; line-height:1.35;
    padding:3px 6px 3px 5px;
  }
  /* 글자를 키운 만큼 좁은 칸에서 넘칠 여지가 생긴다.
     줄이는 대신 접히게 둔다 — 읽을 수 있어야 배지다. */
  #app .foe-row.many .intent-badge,
  #app .foe-row.crowded .intent-badge{
    flex-wrap:wrap; justify-content:center; max-width:100%;
    gap:2px 3px; padding:2px 4px;
  }

  /* 앞의 감축 규칙은 .enemy-portrait 를 세웠지만, 이제 숨쉬는 건 그 안의 스프라이트다 */
  @media (prefers-reduced-motion: reduce){
    .enemy-portrait img,.portrait img.px,
    .p-shard,.p-ring,.p-wisp,.p-slash,.p-bub,.p-mote,
    .reveal-banner,.card.reveal-card,.reveal-spark{ animation:none !important; }
  }

  /* ---- 코스믹 호러 UI 아트 ----
     생성 원본은 투명 WebP로 다듬어 100px 이하로 보관한다. 화면에서는 작은
     저해상도 프레임을 늘려 쓰므로, 기존의 픽셀 베벨과 등급별 색 규칙을 유지한다. */
  /* 메뉴 제목·항목·시스템 안내문까지 기존 게임 UI의 한 가지 비트맵 폰트로 통일한다. */
  #app .menu-panel,
  #app .menu-panel *{
    font-family:'Galmuri14','Galmuri11','Nanum Myeongjo',serif !important;
  }
  .menu-item{ text-align:center; }

  .card{
    --card-art:url('assets/ui/card-normal.webp');
    --card-surface:#101719;
    isolation:isolate;
    text-align:center;
    background-color:var(--card-surface);
    background-image:repeating-linear-gradient(51deg, rgba(224,206,170,0.035) 0 1px, transparent 1px 3px);
  }
  /* 등급 프레임은 원본 색상으로 보이고, 글자와 비용 인장은 항상 위에 둔다. */
  .card::before{
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:var(--card-art);
    background-size:110% 110%; background-position:center; background-repeat:no-repeat;
    opacity:1;
  }
  .card > *{ position:relative; z-index:1; }
  .card.normal,.card.owner-neutral{ --card-art:url('assets/ui/card-normal.webp'); --card-surface:#0b0d10; }
  .card.class,
  .card.owner-vanguard,.card.owner-chemist,.card.owner-priest,.card.owner-oracle,
  .card.owner-hellion,.card.owner-robber,.card.owner-jester{ --card-art:url('assets/ui/card-class.webp'); --card-surface:#101a32; }
  .card.epic{ --card-art:url('assets/ui/card-epic.webp'); --card-surface:#191124; }
  .card.legendary{ --card-art:url('assets/ui/card-legendary.webp'); --card-surface:#1d160c; }

  /* 일반 카드의 검은 중심에는 뼛빛 문자를 써서 작은 화면에서도 읽힌다. */
  .card.normal .card-name:not(.glitch), .card.owner-neutral .card-name:not(.glitch){ color:#e7e1d0; text-shadow:1px 1px 0 rgba(0,0,0,0.9); }
  .card.normal .card-desc:not(.glitch), .card.owner-neutral .card-desc:not(.glitch){ color:#c5bcaa; border-top-color:rgba(231,225,208,0.22); }
  .card.normal .card-owner-tag, .card.owner-neutral .card-owner-tag{ color:#eee7d6; }

  /* AP 표기는 유지하고, 각 행동점 칸만 압축된 심해 에너지 수정으로 바꾼다. */
  .pip{
    width:16px; height:16px; border:0; border-radius:0; transform:none;
    background:url('assets/ui/ap-crystal.webp') center/contain no-repeat;
    box-shadow:none;
    image-rendering:pixelated;
  }
  .pip:not(.filled){ filter:grayscale(1) brightness(0.42); opacity:0.5; }
  .pip.filled{ background:url('assets/ui/ap-crystal.webp') center/contain no-repeat; border:0; box-shadow:none; }
  /* 임시 AP도 같은 수정으로 그린다. 다만 이 턴에만 빌린 것이라 아직 덜 맺힌 것처럼
     반쯤 비쳐 보이게 두고, 꺼져 있는 칸(무채색)과 헷갈리지 않도록 빛무리를 남긴다.
     앞의 사각형 규칙(.pip.temp.filled)보다 뒤에 있어야 이 그림이 이긴다. */
  .pip.temp,.pip.temp.filled{
    background:url('assets/ui/ap-crystal.webp') center/contain no-repeat;
    border:0; box-shadow:none; opacity:0.62;
    filter:saturate(0.8) drop-shadow(0 0 3px rgba(224,170,76,0.6));
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ ICONS ============
     모티프는 셋뿐이다 — 잠수 장비(놋쇠·리벳), 이단 성물(십자·봉인),
     심연의 기관(눈·아가리·촉수). 전부 아래 픽셀 엔진으로 찍는다. */

  /* ============ PIXEL ART ENGINE ============
     이 게임의 도상은 전부 손으로 찍은 픽셀맵이다. 한 글자가 한 픽셀이고,
     '.' 은 비워 둔다. 팔레트는 젖은 석재·놋쇠·피·부식 보라·심해 인광 다섯 계열로만 묶어
     스무 마리가 넘는 괴물이 한 판화에서 찍혀 나온 것처럼 보이게 한다. */
  const PX_PAL = {
    '.':null,
    /* 젖은 석재 — 어두운 쪽에서 밝은 쪽으로 */
    '0':'#04070a', '1':'#0b1216', '2':'#16232a', '3':'#26383f',
    '4':'#3a5158', '5':'#55707a', '6':'#7f9aa1', '7':'#a8bfc2',
    /* 변색된 놋쇠 · 가스등 */
    'b':'#2e2210', 'B':'#5c4826', 'Y':'#8f7038', 'G':'#c9964a', 'g':'#e8c479',
    /* 피 */
    'r':'#26090e', 'R':'#5e161d', 'E':'#96232a', 'F':'#c4383c',
    /* 부식 보라 — 이단과 잠식의 색 */
    'p':'#1c1528', 'P':'#372a4c', 'V':'#5c4a7d', 'W':'#8d7ab0',
    /* 심해 생물발광 */
    'c':'#0e211f', 'C':'#255049', 'L':'#4f8f80', 'M':'#7fbfae',
    /* 뼈 · 상아 · 낡은 종이 */
    'n':'#6e6759', 'N':'#a89f8b', 'i':'#d9d0bd',
    /* 젖은 가죽 · 밧줄 */
    'o':'#2a1d16', 'O':'#4a3226', 'u':'#6b4a35',
    /* 쇠붙이와 그늘 */
    'x':'#15181a', 'X':'#33393b', 'z':'#5a6266',
  };

  /* 오른쪽 여백까지 세어가며 찍으면 손이 먼저 지친다 — 짧은 줄은 알아서 채운다. */
  function pxPad(rows){
    let w = 0;
    rows.forEach(r=>{ if(r.length > w) w = r.length; });
    return {w:w, h:rows.length, rows:rows.map(r=> r + '.'.repeat(w - r.length))};
  }

  const PX_CACHE = {};   /* 이름 → data URL */
  const PX_DIM   = {};   /* 이름 → {w,h} — 세로로 긴 놈을 짓눌러 그리지 않기 위해 */

  /* 픽셀맵을 1픽셀=1셀 짜리 PNG 로 굽는다. 확대는 CSS 의 image-rendering:pixelated 가 맡는다. */
  function pxURL(name){
    if(PX_CACHE[name]) return PX_CACHE[name];
    const sp = PX_SPRITES[name];
    if(!sp) return '';
    const m = pxPad(sp.rows);
    const cv = document.createElement('canvas');
    cv.width = m.w; cv.height = m.h;
    const ctx = cv.getContext('2d');
    const table = sp.pal ? Object.assign({}, PX_PAL, sp.pal) : PX_PAL;
    for(let y=0; y<m.h; y++){
      const row = m.rows[y];
      for(let x=0; x<m.w; x++){
        const col = table[row[x]];
        if(!col) continue;          /* '.' 과 미등록 문자는 그대로 비운다 */
        ctx.fillStyle = col;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    PX_DIM[name] = {w:m.w, h:m.h};
    PX_CACHE[name] = cv.toDataURL('image/png');
    return PX_CACHE[name];
  }

  /* 스프라이트 등록소 — 이름 하나로 어디서든 꺼내 쓴다. */
  const PX_SPRITES = {};
  function pxDef(name, rows, pal){ PX_SPRITES[name] = {rows:rows, pal:pal}; }

  /* size 를 한 변으로 하는 정사각 틀에 비율을 지켜 앉힌다. */
  function pxImg(name, size, cls){
    const url = pxURL(name);
    if(!url) return '';
    const d = PX_DIM[name];
    const k = size / Math.max(d.w, d.h);
    return '<img class="px'+(cls?' '+cls:'')+'" src="'+url+'" alt="" draggable="false"'
         + ' style="width:'+Math.round(d.w*k)+'px;height:'+Math.round(d.h*k)+'px">';
  }

  /* 감실을 가득 채운다 — 크기는 CSS 가 정하게 두고 비율만 지킨다. */
  function pxFill(name, cls){
    const url = pxURL(name);
    if(!url) return '';
    return '<img class="px'+(cls?' '+cls:'')+'" src="'+url+'" alt="" draggable="false"'
         + ' style="width:100%;height:100%;object-fit:contain;display:block;">';
  }

  /* 외부 에셋 초상도 기존 픽셀 초상과 같은 틀에 넣는다. */
  function assetIcon(src, cls){
    return '<img class="px'+(cls?' '+cls:'')+'" src="'+src+'" alt="" draggable="false"'
         + ' style="width:100%;height:100%;object-fit:cover;display:block;">';
  }

  /* ============ 사거리 ============
     다키스트던전식 — 서 있는 열이 곧 화력이다.
       from : 이 병과가 공격을 시작할 수 있는 "자기 열"
       hits : 그때 닿을 수 있는 "상대 열"
     근접이 후열로 밀려나면 from 을 벗어나 전열을 때릴 수 없고,
     원거리가 전열로 끌려나오면 조준할 자리가 없어 무력해진다. */
  const REACH = {
    melee:  {id:'melee',  label:'근접',   from:[0,1],   hits:[0,1],
             note:'전열·중열에서만 휘두를 수 있다'},
    mid:    {id:'mid',    label:'중거리', from:[0,1,2], hits:[0,1,2],
             note:'후미(심부)에서는 손이 닿지 않는다'},
    ranged: {id:'ranged', label:'원거리', from:[1,2,3,4], hits:[0,1,2,3,4],
             note:'전열에 서면 조준할 자리가 없다'},
  };
  function reachOf(unit){ return REACH[unit && unit.reach] || REACH.mid; }
  function canActFrom(unit, rank){ return reachOf(unit).from.indexOf(rank) >= 0; }
  function canHitRank(unit, rank){ return reachOf(unit).hits.indexOf(rank) >= 0; }

  /* 피격 반응 성향 — 앞에 설수록 받아치고, 뒤에 설수록 비껴난다 */
  const REACT = {
    melee:  {dodge:0.08, guard:0.24, riposte:0.30, rip:5},
    mid:    {dodge:0.15, guard:0.15, riposte:0.14, rip:3},
    ranged: {dodge:0.24, guard:0.07, riposte:0.05, rip:2},
  };
  /* 개체별 reactMod 가 있으면 그것이 사거리 기본값을 덮어쓴다 (갑각은 잘 흘리고, 해파리는 잘 피한다) */
  function reactOf(unit){
    const base = (unit && unit.reactMod) || REACT[unit && unit.reach] || REACT.mid;
    if(!unit || !unit.isHero) return base;
    /* 유물은 아군에게만 붙는다 — 적은 언제나 맨몸의 기본값으로 판정한다 */
    const veteranReact = unit.descentReact || 0;
    return {
      dodge:   Math.min(0.60, base.dodge   + relicSum('dodge', unit) + veteranReact),
      guard:   Math.min(0.70, base.guard   + relicSum('guard', unit) + veteranReact),
      riposte: Math.min(0.70, base.riposte + relicSum('riposte', unit)),
      rip:     base.rip + relicSum('rip', unit),
    };
  }

     window.FOA_STORAGE = { get(k), set(k,v), remove(k) } 를 심어 두면 그쪽을 쓴다.

  const Store = (function(){

    if(native && typeof native.get === 'function' && typeof native.set === 'function'){
      return Object.assign({ kind:'native', ok:true }, native);
    }
    const mem = {};
    let ok = true;
    return {
      kind:'local',
      get ok(){ return ok; },
      get(k){
        try{ const v = localStorage.getItem(k); if(v !== null) return v; }catch(e){ ok = false; }
        return (k in mem) ? mem[k] : null;
      },
      set(k, v){
        mem[k] = v;
        try{ localStorage.setItem(k, v); return true; }
        catch(e){ ok = false; return false; }

        delete mem[k];

      let kind = rollNodeKind(step);

      if(chapter().tier!=='표층'){
        for(let tries=0; tries<8 && seen.has(kind); tries++) kind = rollNodeKind(step);

  function relicApplies(r, unit){

  /* 여관에서 새로 합류한 사람 몫 — 제 카드 한 장을 무작위로 쥐고 합류한다. */
  function randomPicks(list, n){
    return shuffle(list.slice()).slice(0,n).map(c=>c.name);
  }

  /* ============ TAVERN ============
     인양된 자리에서만 사람을 바꾼다. 죽은 자의 카드는 덱에서 함께 빠지고,
     새로 온 사람의 카드가 그 자리에 들어온다 — 쓸 사람이 없는 카드로 손패가 막히지 않도록. */
  /* 채울 수 있는 자리 — 쓰러진 자리와, 처음부터 비어 있던 자리 둘 다.
     넷을 짜고 셋만 데리고 내려가므로 네 번째 칸은 늘 null 로 남는다.
     예전에는 이 칸이 후보에서 빠져, 인양해서 사람을 해금해도 앉힐 데가 없었다. */
  function openSlots(){
    const out = [];
    S.party.forEach((p,i)=>{ if(!p || !p.alive) out.push(i); });
    return out;
  }
  function recruitCandidates(){
    const inParty = S.party.filter(p=>p && p.alive).map(p=>p.cls);
    return unlockedClassIds().filter(id=>inParty.indexOf(id)<0).map(id=>CLASS_DEFS[id]);
  }
  function recruitInto(slotIdx, classId){
    const fallen = S.party[slotIdx];
    if(fallen && fallen.alive) return null;     /* 살아 있는 사람은 밀어낼 수 없다 */
    if(!isUnlocked(classId)) return null;

    const hero = makeHero(classId);
    applyRelicMaxHp(hero);
    S.party[slotIdx] = hero;

    /* 쓰러진 사람의 카드는 함께 빠진다. 빈 칸이었다면 뺄 것이 없다 */
    if(fallen) S.runDeck = S.runDeck.filter(c=>c.owner!==fallen.cls);
    const picked = randomPicks(CARD_DB[classId], RECRUIT_PICKS_PER_CLASS);
    S.setup.picks[classId] = picked;
    const added = addPickedToRunDeck(CARD_DB[classId], picked, 'recruit');
    S.logMsg = added.length ? `${CLASS_DEFS[classId].name}이(가) ${picked.join(' · ')}을(를) 들고 합류했다.` : `${CLASS_DEFS[classId].name}은(는) 합류했지만, 덱이 가득 차 카드는 맡기지 못했다.`;
    return hero;
  }

  /* ============ 저장 ============
     런 하나를 통째로 넣어 둔다. 다만 적이 들고 있는 icon 은 base64 이미지 통짜라
     그대로 담으면 저장소가 금방 찬다 — 이름만 남기고 불러올 때 다시 붙인다.
     전투 중에는 저장하지 않는다. 조준 중이던 카드나 파티클 같은 순간 상태까지
     되살리려면 복잡해지고, 실패하면 런 전체를 잃는다.
     전투에서 나가면 그 노드 입구부터 다시 시작한다. */
  const RUN_KEY = 'fathom.run.v1';
  const UPGRADE_GUIDE_KEY = 'fathom.upgrade-guide.v1';
  /* 한 번이라도 내려가 본 적이 있는지 — '새로운 탐색' 이 해금을 지워도 이 자국만은 남는다.
     처음 켠 사람에게만 제목 화면 버튼을 '시작하기' 로 보여주기 위한 표시다. */
  const PLAYED_KEY = 'fathom.played.v1';
  const SAFE_SCREENS = ['map','rest','aftermath','escape','tavern','relicSwap'];
  function hasSeenUpgradeGuide(){ return Store.get(UPGRADE_GUIDE_KEY)==='1'; }
  function markUpgradeGuideSeen(){ Store.set(UPGRADE_GUIDE_KEY, '1'); }
  /* 표시가 없던 시절에 이미 놀던 사람은 남아 있는 기록으로 알아본다 */
  function hasPlayedBefore(){
    return Store.get(PLAYED_KEY)==='1'
      || hasSavedRun() || UNLOCKED.length > 0 || OWNED_MARKERS.length > 0 || hasSeenUpgradeGuide();
  }
  function markPlayed(){ Store.set(PLAYED_KEY, '1'); }

  function foeIconByName(name){
    const all = FOE_SURFACE.concat(FOE_ELITES, FOE_ENDLESS, [FOE_BOSS, FOE_ENDLESS_BOSS]);
    const hit = all.find(f=>f.name===name);
    return hit ? hit.icon : null;
  }
  function saveRun(){
    if(!S || SAFE_SCREENS.indexOf(S.screen) < 0) return;
    try{
      /* icon 은 적 초상, ic 는 예고 행동 도상 — 둘 다 base64 이미지 통짜다.
         이름과 타입만 남기고 불러올 때 다시 붙인다. */
      const json = JSON.stringify(S, (k,v)=> (k==='icon' || k==='ic') ? undefined : v);
      Store.set(RUN_KEY, json);
    }catch(e){}
  }
  function hasSavedRun(){ return !!Store.get(RUN_KEY); }
  function clearRun(){ Store.remove(RUN_KEY); }
  function loadRun(){
    try{
      const raw = Store.get(RUN_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!data || SAFE_SCREENS.indexOf(data.screen) < 0) return false;
      /* 저장할 때 떼어낸 초상을 이름으로 다시 붙인다 */
      if(data.battle && data.battle.enemies){
        data.battle.enemies.forEach(en=>{
          en.icon = foeIconByName(en.name);
          /* 예고 행동은 다음 전투가 시작될 때 어차피 새로 뽑는다 —
             전투 중에는 저장하지 않으므로 여기서는 비워 두면 된다 */
          en.intent = null;
        });
      }
      (data.runDeck||[]).forEach(refreshSpecialEpicCard);
      if(data.aftermath){
        (data.aftermath.cardOffer||[]).forEach(refreshSpecialEpicCard);
        if(data.aftermath.reveal && data.aftermath.reveal.card) refreshSpecialEpicCard(data.aftermath.reveal.card);
      }
      restoreStarterDeckIds(data);
      S = data;
      return true;
    }catch(e){ return false; }
  }
  /* '새로운 탐색' 은 해금까지 지운다 — 말 그대로 처음부터다 */
  function wipeAllSaves(){
    clearRun();
    Store.remove(UNLOCK_KEY);
    Store.remove(MARKER_KEY);
    UNLOCKED = [];
    OWNED_MARKERS = [];
  }

  /* 여관에서 대열을 다시 짠다.
     살아서 돌아온 사람은 그대로 데려간다 — 체력도 심도압박도 이어받는다.
     새로 들어온 사람만 몸을 만들고, 덱은 빠진 병과의 카드를 걷어내고
     들어온 병과의 카드를 채운다(강화해 둔 카드는 그 병과가 남아 있으면 그대로다). */
  function applyReform(placements){
    const keep = {};
    S.party.forEach(p=>{ if(p && p.alive) keep[p.cls] = p; });

    const before = Object.keys(keep);
    const after  = placements.filter(Boolean);

    S.party = placements.map(cid=>{
      if(!cid) return null;
      if(keep[cid]) return keep[cid];
      const hero = makeHero(cid);
      applyRelicMaxHp(hero);
      return hero;
    });

    /* 빠진 병과의 카드는 덱에서 함께 나간다 */
    before.filter(c=>after.indexOf(c)<0).forEach(cls=>{
      S.runDeck = S.runDeck.filter(c=>c.owner!==cls);
      delete S.setup.picks[cls];
    });
    /* 새로 들어온 병과는 제 카드 중 둘을 무작위로 쥐고 온다 */
    const joined = after.filter(c=>before.indexOf(c)<0);
    joined.forEach(cls=>{
      const picked = randomPicks(CARD_DB[cls], RECRUIT_PICKS_PER_CLASS);
      S.setup.picks[cls] = picked;
      addPickedToRunDeck(CARD_DB[cls], picked, 'recruit');
    });
    return joined;
  }

  function newRun(){
    S = {
      screen:'title',
      setup: { phase:'pick-classes', selected:[], placements:[null,null,null,null], armed:null,
               picks:{}, offers:{}, reform:false },
      erosion: 0,
      chapter: 0,
      stepInChapter: 0,
      mapChoices: null,
      mapVisited: [],
      pendingNode: null,
      afterAftermath: null,
      aftermath: null,
      runDeck: null,
      starterDeckCardIds: [],
      party: null,
      battle: null,
      rest: null,
      relics: [],
      escape: null,
      emergencyExit: null,
      finalGrowth: null,
      tavern: null,
      prologue: null,
      logMsg: '',
      logLines: [],
      loseReason:'',
    };
  }

  /* 프롤로그는 저장되는 런과 분리한다. 네 사람이 이미 한 번 심연에 닿았다는
     사실만 남기고, 본편의 선택·해금·덱에는 어떤 이득도 남기지 않는다. */
  function tutorialCard(owner, name){
    const base = (CARD_DB[owner]||[]).find(c=>c.name===name);
    return base ? Object.assign({}, base, {uid:nextId(), defId:nextId(), upgraded:false, contaminated:false}) : null;
  }
  function tutorialFoe(name, hp, atk, reach, role, icon, intent){
    return {id:nextId(), name, maxHp:hp, hp:hp, atk:atk, reach:reach, role:role,
            icon:icon, block:0, intent:intent, alive:true, react:null};
  }
  function startPrologue(){
    newRun();
    S.prologue = {stage:'briefing'};
    S.screen = 'prologue';
  }
  function beginPrologueBattle(){
    S.party = BASE_CLASSES.map(makeHero);
    /* 첫 예시는 확률이 아니라 규칙을 보여주는 장면이다 — 회피·반격이 끼어들면
       방어가 피해를 막는 핵심이 흐려진다. */
    S.party[0].reactMod = {dodge:0, guard:0, riposte:0, rip:0};
    S.erosion = 10;
    const frontIntent = {type:'attack_reach', val:12, label:'내려찍기', ic:IC_CLEAVER};
    const rearIntent  = {type:'whisper_rear', val:7, label:'심연의 응시', ic:IC_GAZE};
    const ranged = FOE_ENDLESS.find(f=>f.name==='침묵의 등불지기');
    const finalBoss = tutorialFoe(FOE_ENDLESS_BOSS.name, FOE_ENDLESS_BOSS.maxHp, FOE_ENDLESS_BOSS.atk, FOE_ENDLESS_BOSS.reach, FOE_ENDLESS_BOSS.role, FOE_ENDLESS_BOSS.icon, frontIntent);
    /* 프롤로그의 기록에서도 정체는 끝까지 가린다. */
    finalBoss.kind = 'boss'; finalBoss.phase = 1; finalBoss.hiddenName = '???';
    const enemies = [
      finalBoss,
      tutorialFoe(ranged.name, ranged.maxHp, ranged.atk, ranged.reach, ranged.role, ranged.icon, rearIntent)
    ];
    S.battle = {
      tier:'끝없는 심연', node:{type:'battle',tier:'끝없는 심연',title:'되돌아갈 수 없는 문턱',desc:''}, enemies,
      deck:[], hand:[tutorialCard('vanguard','놋쇠 벽')], discard:[],
      ap:3, maxAp:3, tempAp:0, turn:1, over:false, pendingCardUid:null, pendingDomain:null
    };
    S.prologue.stage = 'brace';
    S.logMsg = '이름 없는 거대한 존재와 심연의 등불지기가 인양대를 바라본다.';
    S.screen = 'battle';
  }
  function prologueHandForStrike(){
    return [tutorialCard('oracle','저주받은 조준')].filter(Boolean);
  }
  function prologueHandForCalm(){
    return [tutorialCard('priest','속죄의 기도')].filter(Boolean);
  }
  function finishPrologue(){
    S.party.forEach(p=>{ p.hp=0; p.dp=100; p.block=0; p.alive=false; p.collapsed=true; });
    S.battle = null;
    S.prologue.stage = 'fallen';
    S.screen = 'prologueFall';
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }
  /* 강한 카드는 덱에 남아 있어도 초반 손패를 독점하지 않는다.
     섞일 때 일반 1 : 에픽 0.4 : 전설 0.2의 가중치를 쓴다. */
  const BATTLE_DRAW_WEIGHT = {normal:1, epic:0.4, legendary:0.2};
  /* 희귀 카드는 '전부 몇 장'이 아니라 '한 장이 몇 번'으로 센다.
     같은 에픽 하나가 한 전투 내내 되돌아오며 손패를 독점하는 것을 막되,
     서로 다른 에픽을 모아 온 덱은 모은 만큼 다양하게 쓸 수 있다.
     세는 단위는 카드의 정체(id·원래 이름)라 같은 카드를 여러 장 가져도 한도는 하나다.
     한도에 닿은 카드는 버린 더미로 돌아가고, 다음 전투에서 다시 0부터 센다. */
  const RARE_DRAW_MAX_PER_BATTLE = {epic:4, legendary:4};
  function battleDrawWeight(card){ return isLegendaryCard(card) ? BATTLE_DRAW_WEIGHT.legendary : (isEpicCard(card) ? BATTLE_DRAW_WEIGHT.epic : BATTLE_DRAW_WEIGHT.normal); }
  function isRareBattleCard(card){ return isEpicCard(card) || isLegendaryCard(card); }
  /* +5 강화로 에픽이 된 카드는 풀의 id 가 없다 — 그때는 강화 전 이름으로 센다. */
  function rareDrawKey(card){ return card.id || card.baseName || card.name; }
  function rareDrawLimit(card){
    return isLegendaryCard(card) ? RARE_DRAW_MAX_PER_BATTLE.legendary : RARE_DRAW_MAX_PER_BATTLE.epic;
  }
  function rareDrawCounts(b){
    /* 예전 저장은 이 값이 숫자(전체 합계)였다 — 장부 모양이 다르면 새로 편다. */
    if(!b.rareDraws || typeof b.rareDraws !== 'object') b.rareDraws = {};
    return b.rareDraws;
  }
  /* 한 번 써 버린 에픽은 같은 전투에서 점점 돌아오기 어려워진다.
     뽑은 횟수가 아니라 '쓴 횟수'로 꺾는다 — 손에 들고만 있던 것은 값을 치르지 않았으므로.
     아직 안 쓴 카드는 그대로, 한 번 썼으면 50%, 두 번이면 10%, 세 번부터는 0.1%.
     굴림에 진 카드는 버린 더미로 돌아가고, 다음 전투에서 장부가 비워진다. */
  const RARE_REDRAW_CHANCE = [1, 0.5, 0.1, 0.001];
  function rareRedrawChance(uses){
    if(uses <= 0) return 1;
    return RARE_REDRAW_CHANCE[Math.min(uses, RARE_REDRAW_CHANCE.length - 1)];
  }
  function rareUseCounts(b){
    if(!b.rareUses || typeof b.rareUses !== 'object') b.rareUses = {};
    return b.rareUses;
  }
  function noteRareCardUsed(card){
    const b = S.battle;
    if(!b || !isRareBattleCard(card)) return;
    const uses = rareUseCounts(b);
    const key = rareDrawKey(card);
    uses[key] = (uses[key] || 0) + 1;
  }
  function shuffleBattleDeck(cards){
    const pool = cards.slice();
    const ordered = [];
    while(pool.length){
      const total = pool.reduce((sum,card)=>sum+battleDrawWeight(card),0);
      let roll = Math.random()*total;
      let idx = pool.length-1;
      for(let i=0;i<pool.length;i++){
        roll -= battleDrawWeight(pool[i]);
        if(roll<=0){ idx=i; break; }
      }
      ordered.push(pool.splice(idx,1)[0]);
    }
    /* drawNextBattleCard 는 pop()으로 뽑으므로 첫 후보가 배열 끝에 오도록 뒤집는다. */
    return ordered.reverse();
  }
  function cloneForBattle(runDeck){
    return shuffleBattleDeck(runDeck.map(c=>Object.assign({}, c, {uid:nextId(), contaminated:false})));
  }

  /* ============ 적 도감 ============
     적도 아군과 똑같은 규칙을 쓴다 — 서 있는 열이 곧 사거리다.
     역할(role)이 성향을, 사거리(reach)가 제약을 맡는다:
       brute      — 한 방이 무겁다
       skirmisher — 잘게 여러 번
       warden     — 웅크리고 버틴다
       caster     — 살을 깎지 않고 정신을 깎는다
       sniper     — 약한 놈만 골라 쏜다
     react 로 개체마다 회피/흘림/반격 성향을 덧씌운다. */
  /* 표층 몹 풀 — 표층 조우에서 무작위로 올라온다.
     서 있는 열이 곧 사거리이므로, 그 열에서 손이 닿는 놈만 후보가 된다
     (근접을 후열에 세우면 아무것도 못 하고 서 있게 된다).
     중층·심층 풀은 설계만 되어 있고 아직 자리가 없다 — 지금은 모든 층이 이 풀을 쓴다. */
  const FOE_SURFACE = [
    {name:'조수의 신도',       maxHp:26, atk:6, reach:'melee',  role:'skirmisher', icon:ICON_CULTIST},
    {name:'익사한 파수꾼',     maxHp:28, atk:7, reach:'melee',  role:'brute',      icon:ICON_WARDEN},
    {name:'그물에 걸린 순례자', maxHp:22, atk:5, reach:'melee',  role:'skirmisher', icon:ICON_PILGRIM},
    {name:'소금에 전 예언자',   maxHp:20, atk:4, reach:'mid',    role:'caster',     icon:ICON_PROPHET},
    /* 느리지만 묵직 — 웅크리는 빈도를 두 배로 */
    {name:'잠수종 속의 것',     maxHp:30, atk:6, reach:'melee',  role:'brute',      icon:ICON_BELLTHING,
     intentMod:{guard_up:2}, reactMod:{dodge:0.02, guard:0.30, riposte:0.18, rip:5}},
    {name:'눈먼 그물지기',     maxHp:22, atk:6, reach:'ranged', role:'sniper',     icon:ICON_NETKEEPER},
    {name:'녹슨 잠수복 순찰자', maxHp:27, atk:7, reach:'melee',  role:'brute',      icon:ICON_PATROLLER},
    /* 최약체지만 속삭임이 잦다 — 무작위 속삭임 가중치를 네 배로 */
    {name:'부유하는 익사체',   maxHp:18, atk:5, reach:'melee',  role:'skirmisher', icon:ICON_FLOATER,
     intentMod:{whisper_random:4}, reactMod:{dodge:0.22, guard:0.06, riposte:0.08, rip:3}},
  ];

  const FOE_ELITES = [
    {name:'감시자',            maxHp:36, atk:7, reach:'melee', role:'skirmisher', icon:ICON_WATCHER},
    /* 웅크린 다음 크게 친다 */
    {name:'쇠사슬 파수장',     maxHp:42, atk:8, reach:'melee', role:'brute',      icon:ICON_CHAINWARD,
     intentMod:{guard_up:3}},
    {name:'첫 번째 잠수복',    maxHp:40, atk:7, reach:'mid',   role:'caster',     icon:ICON_FIRSTSUIT},
    /* 속삭임 빈도 매우 높음 */
    {name:'아홉 눈의 조타수',  maxHp:38, atk:6, reach:'mid',   role:'caster',     icon:ICON_HELMSMAN,
     intentMod:{whisper_rear:2, whisper_random:2}},
    /* 삼킨 종을 울려 전열 전체를 친다 */
    {name:'종을 삼킨 자',      maxHp:44, atk:8, reach:'melee', role:'brute',      icon:ICON_BELLEATER,
     intentMod:{attack_all:3}},
    {name:'조수를 부르는 여사제', maxHp:34, atk:5, reach:'mid', role:'caster',    icon:ICON_PRIESTESS},
    /* 가장 단단하다 — 방어 위주 */
    {name:'강철 아가미',       maxHp:46, atk:9, reach:'melee', role:'warden',     icon:ICON_STEELGILL,
     reactMod:{dodge:0.03, guard:0.38, riposte:0.30, rip:6}},
    /* 약한 놈만 골라 끌어내린다. 원거리로 두면 전열에 세울 수 없어 중거리로 둔다 */
    {name:'익사시키는 자',     maxHp:40, atk:8, reach:'mid',   role:'sniper',     icon:ICON_DROWNER},
  ];
  const FOE_BOSS = {name:'꿈꾸는 손의 파수꾼', maxHp:72, atk:9, reach:'mid', role:'brute', icon:ICON_BOSS, kind:'boss', phase:1};

  /* 끝없는 심연의 토착자. 마지막 장에서는 기존 적과 이 풀을 섞어 무작위 조우를 만든다. */
  const FOE_ENDLESS = [
    {name:'사슬 끊는 자',     maxHp:64, atk:14, reach:'melee',  role:'brute',      icon:assetIcon('assets/minion-chain-severer.png'),
     intentMod:{attack_reach:2}, reactMod:{dodge:0.03, guard:0.20, riposte:0.20, rip:7}},
    {name:'흑조의 성가대',    maxHp:50, atk:10, reach:'mid',    role:'caster',     icon:assetIcon('assets/minion-black-tide-choir.png'),
     intentMod:{whisper_rear:3, whisper_random:3}},
    {name:'안구 갑각수',      maxHp:74, atk:12, reach:'melee',  role:'warden',     icon:assetIcon('assets/minion-ocular-carapace.png'),
     intentMod:{guard_up:3}, reactMod:{dodge:0.02, guard:0.42, riposte:0.24, rip:6}},
    {name:'침묵의 등불지기',  maxHp:52, atk:11, reach:'ranged', role:'sniper',     icon:assetIcon('assets/minion-silent-lamplighter.png'),
     intentMod:{whisper_rear:2, snipe_lowest:2}},
    {name:'심연의 낙하자',    maxHp:56, atk:15, reach:'ranged', role:'skirmisher', icon:assetIcon('assets/minion-abyss-diver.png'),
     intentMod:{double_attack_reach:2}, reactMod:{dodge:0.16, guard:0.05, riposte:0.16, rip:6}},
  ];
  const FOE_ENDLESS_BOSS = {
    name:'최심의 안식자 네루모르', hiddenName:'???', maxHp:180, atk:16,
    reach:'mid', role:'brute', icon:assetIcon('assets/boss-nemorum.png'), kind:'boss', phase:1,
    intentMod:{attack_all:2, attack_reach:2}, reactMod:{dodge:0.05, guard:0.24, riposte:0.26, rip:9},
  };

  /* 네루모르는 절반을 잃기 전까지 이름조차 허락하지 않는다.
     피가 흐른 뒤에야 이것이 심연의 눈이 아니라, 그 눈을 지키던 인간이었음이 드러난다. */
  function foeDisplayName(en){
    return en && en.hiddenName && en.hp > en.maxHp*0.5 ? en.hiddenName : en.name;
  }

  function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  /* 가중 추첨 — [[무게, 값], ...] */
  function weighted(list){
    const pool = list.filter(p=>p[0] > 0);
    if(!pool.length) return list[0][1];
    let total = 0; pool.forEach(p=>{ total += p[0]; });
    let r = Math.random()*total;
    for(let i=0;i<pool.length;i++){ r -= pool[i][0]; if(r<=0) return pool[i][1]; }
    return pool[pool.length-1][1];
  }

  /* 이 열에서 실제로 손이 닿는 놈만 후보에 올린다 */
  function foePoolFor(tier){
    return tier==='끝없는 심연' ? FOE_SURFACE.concat(FOE_ELITES, FOE_ENDLESS) : FOE_SURFACE;
  }
  function foeCandidates(rank, tier){
    const pool = foePoolFor(tier);
    const ok = pool.filter(f => REACH[f.reach].from.indexOf(rank) >= 0);
    return ok.length ? ok : pool;
  }
  /* 머릿수가 늘면 개체는 약해진다 — 총 위협량을 대충 맞춰둔다 */
  function countScale(n){
    return n<=1 ? 1.35 : n===2 ? 1.0 : n===3 ? 0.78 : n===4 ? 0.62 : 0.50;
  }
  /* 얼마나 깊이 들어왔나 — 지나온 노드 수에 층 보정을 더한다 */
  function stageDepth(node){
    let d = S.mapVisited.length;
    if(node.tier === '중층') d += 2;
    else if(node.tier === '심해') d += 4;
    else if(node.tier === '끝없는 심연') d += 8;
    return d;
  }
  /* 깊어질수록 무리가 커진다. 얕은 곳은 2~3, 심층은 4~5가 기본이 된다.
     (실측 평균: 깊이0 ≈ 2.7마리 → 깊이4+ ≈ 4.2마리) */
  function rollFoeCount(depth, tier){
    if(tier==='끝없는 심연') return weighted([[3,4],[7,5]]);
    const d = Math.min(depth, 5);
    return weighted([
      [Math.max(0, 5 - d*2), 2],
      [4,                    3],
      [2 + d,                4],
      [Math.max(0, d*2 - 1), 5],
    ]);
  }

  function scaleFoeForTier(foe, node, packScale, leader){
    const threat = tierThreat(node.tier);
    const boss = leader && !!node.boss;
    const elite = leader && node.type==='elite';
    const hpRoleMul = boss ? threat.bossHp : elite ? threat.eliteHp : 1;
    const atkRoleMul = boss ? threat.bossAtk : elite ? threat.eliteAtk : 1;
    foe.maxHp = Math.max(8, Math.round(foe.maxHp * packScale * threat.hp * hpRoleMul));
    foe.atk = Math.max(1, Math.round(foe.atk * threat.atk * atkRoleMul));
    foe.pressureMul = threat.pressure;
    return foe;
  }
  function makeFoe(rank, scale, node){
    const base = Object.assign({}, pickOne(foeCandidates(rank, node.tier)));
    return scaleFoeForTier(base, node, scale, false);
  }

  function enemySetFor(node){
    const set = [];
    const depth = stageDepth(node);
    const endless = node.tier==='끝없는 심연';
    /* 우두머리 자체가 무겁다 — 수행원은 깊이에 따라 천천히만 는다 (총 4를 넘기지 않는다) */
    const escortsFor = () => Math.min(3, 1 + Math.floor(Math.random()*2) + Math.floor(depth/4));

    if(node.boss){
      set.push(scaleFoeForTier(Object.assign({}, endless ? FOE_ENDLESS_BOSS : FOE_BOSS), node, 1, true));
      const n = endless ? 3 : escortsFor();
      for(let r=1; r<=n; r++) set.push(makeFoe(r, endless ? 0.92 : 0.8, node));
      return set;
    }
    if(node.type==='elite'){
      const leaders = endless ? FOE_ELITES.concat(FOE_ENDLESS) : FOE_ELITES;
      set.push(scaleFoeForTier(Object.assign({}, pickOne(leaders)), node, 1, true));
      const n = endless ? 3 : escortsFor();
      for(let r=1; r<=n; r++) set.push(makeFoe(r, endless ? 0.95 : 0.8, node));
      return set;
    }
    const n = rollFoeCount(depth, node.tier);
    const scale = countScale(n) * (endless ? 1.22 : 1);
    for(let r=0; r<n; r++) set.push(makeFoe(r, scale, node));
    return set;
  }

  function handSize(){ return Math.min(HAND_LIMIT, 5 + relicSum('draw')); }

  function startBattle(node){
    const enemies = enemySetFor(node).map(e=>Object.assign({}, e, {hp:e.maxHp, block:0, intent:null, alive:true, react:null}));
    const ap = 3 + relicSum('ap');
    S.battle = {
      tier: node.tier, node, enemies,
      deck: cloneForBattle(S.runDeck), hand:[], discard:[],
      ap:ap, maxAp:ap, tempAp:0, turn:1, over:false, rareDraws:{}, rareUses:{},
      pendingCardUid:null, pendingDomain:null, pendingDraw:null,
    };
    S.party.forEach(p=>{ if(p) p.react = null; });
    aliveParty().forEach(p=>{
      const mend = relicSum('battleHeal', p);
      if(mend>0) p.hp = Math.min(p.maxHp, p.hp + mend);
    });
    fxQueue = [];
    clearLog();
    rollIntents();
    drawHand(handSize());
    S.logMsg = node.boss
      ? (node.tier==='끝없는 심연' ? '검은 수면 아래의 눈이 당신을 알아본다. 그 앞에 한 인간의 형체가 서 있다.' : '이곳의 꿈을 지키는 형체가 어둠 속에서 몸을 일으킨다.')
      : node.type==='elite' ? '유난히 거대한 형체가 앞장서 다가온다. 그것은 당신을 처음 보는 얼굴이 아니다.'
      : enemies.length>1 ? `어둠 속에서 ${enemies.length}개의 형체가 열을 이룬다. 모두 같은 박자로 숨을 쉰다.`
      : '어둠 속의 형체가 고개를 든다. 당신이 먼저 보았다고 믿게 만든다.';
    S.screen = 'battle';
  }

  /* 죽은 자는 열을 차지하지 않는다 — 앞이 쓰러지면 뒤가 당겨진다 (다키스트던전식) */
  function effRank(arr, idx){
    let r = 0;
    for(let i=0; i<idx; i++){ const u = arr[i]; if(u && u.alive) r++; }
    return r;
  }
  function heroRank(h){ return effRank(S.party, S.party.indexOf(h)); }
  function foeRank(en){ return effRank(S.battle.enemies, S.battle.enemies.indexOf(en)); }

  /* 이 적이 지금 닿을 수 있는 아군들 */
  function heroesInReach(en){
    const r = foeRank(en);
    if(!canActFrom(en, r)) return [];
    return S.party.filter(h => h && h.alive && canHitRank(en, heroRank(h)));
  }
  function pickHeroTarget(en){
    const pool = heroesInReach(en);
    if(!pool.length) return null;
    /* 원거리는 뒤를, 나머지는 앞을 노린다 */
    return en.reach==='ranged' ? pool[pool.length-1] : pool[0];
  }

  function pressureIntent(en, value){ return Math.max(1, Math.round(value * (en.pressureMul || 1))); }
  /* 적의 예고 행동 — 자기 열에서 실제로 할 수 있는 것만 고른다 */
  function pickIntent(en){
    const rank = foeRank(en);
    const roll = Math.random();
    const stuck = !canActFrom(en, rank) || heroesInReach(en).length===0;

    if(en.kind==='boss'){
      if(stuck) return {type:'guard_up', val:8, label:'웅크림', ic:IC_GUARD};
      if(en.phase===2){
        if(roll<0.34) return {type:'attack_reach', val:en.atk, label:'심연의 강타', ic:IC_CLEAVER};
        if(roll<0.60) return {type:'attack_all', val:Math.round(en.atk*0.7), label:'심연의 포효', ic:IC_ROAR};
        if(roll<0.82) return {type:'whisper_rear', val:pressureIntent(en,11), label:'심연의 응시', ic:IC_GAZE};
        return {type:'guard_up', val:10, label:'웅크림', ic:IC_GUARD};
      }
      if(roll<0.46) return {type:'attack_reach', val:en.atk, label:'대신관의 강타', ic:IC_CLEAVER};
      if(roll<0.78) return {type:'whisper_rear', val:pressureIntent(en,9), label:'심연의 응시', ic:IC_GAZE};
      return {type:'guard_up', val:8, label:'웅크림', ic:IC_GUARD};
    }

    /* 손이 닿지 않으면 자리를 고쳐 잡거나 속삭인다 */
    if(stuck){
      return roll<0.5
        ? {type:'guard_up', val:5, label:'웅크림', ic:IC_GUARD}
        : {type:'whisper_random', val:pressureIntent(en,6), label:'속삭임', ic:IC_GAZE};
    }

    return weighted(intentPool(en));
  }

  /* 역할별 예고 행동 표 — 같은 사거리라도 성향이 다르면 전혀 다르게 싸운다 */
  function intentPool(en){
    const a = en.atk;
    const hit = (v,l,ic)=>({type:'attack_reach', val:Math.max(1,Math.round(v)), label:l, ic:ic||IC_CLEAVER});
    const dbl = (v,l)=>({type:'double_attack_reach', val:Math.max(1,Math.round(v)), label:l, ic:IC_DOUBLE});
    const rear = (v,l)=>({type:'whisper_rear', val:pressureIntent(en,v), label:l, ic:IC_GAZE});
    const anyone = (v,l)=>({type:'whisper_random', val:pressureIntent(en,v), label:l, ic:IC_GAZE});
    const grd = (v)=>({type:'guard_up', val:Math.max(4,Math.round(v)), label:'웅크림', ic:IC_GUARD});
    const snipe = (v,l)=>({type:'snipe_lowest', val:Math.max(1,Math.round(v)), label:l, ic:IC_SNIPE});

    let list;
    switch(en.role){
      case 'brute':
        list = [[4, hit(a*1.75,'강타 예고',IC_HEAVY)], [3, hit(a,'내려찍기')], [1, grd(a*0.8)]]; break;
      case 'skirmisher':
        list = [[4, dbl(a*0.62,'연속 공격')], [3, hit(a,'베어물기')], [1, anyone(6,'속삭임')]]; break;
      case 'warden':
        list = [[4, grd(a*1.4)], [3, hit(a,'밀어붙이기')], [1, anyone(6,'속삭임')]]; break;
      case 'caster':
        list = [[4, rear(9,'심연의 응시')], [3, anyone(7,'속삭임')], [1, hit(a*0.8,'저주 발사',IC_SNIPE)]]; break;
      case 'sniper':
        list = [[4, snipe(a,'약자 저격')], [3, hit(a*0.9,'원거리 사격',IC_SNIPE)], [1, rear(8,'후열 응시')]]; break;
      default:
        list = [[1, hit(a,'공격')]];
    }

    /* 개체별 성향 — 역할표는 그대로 두고 특정 행동의 가중치만 배로 올린다.
       '느리지만 묵직'(웅크림 ×2)이나 '속삭임 빈도 높음'(×4) 같은 것이
       이름표로만 남지 않고 실제로 그렇게 싸우도록. */
    const mod = en.intentMod;
    if(mod){
      list = list.map(p => [p[0] * (mod[p[1].type] || 1), p[1]]);
      /* 역할표에 없는 행동은 새로 얹는다 — 지금은 전체 공격뿐이다 */
      if(mod.attack_all){
        list.push([mod.attack_all, {type:'attack_all', val:Math.max(1,Math.round(a*0.7)),
                                    label:'삼킨 종을 울린다', ic:IC_ROAR}]);
      }
    }
    return list;
  }
  function rollIntents(){ S.battle.enemies.forEach(en=>{ if(en.alive) en.intent = pickIntent(en); }); }
