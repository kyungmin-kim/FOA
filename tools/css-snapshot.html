<!DOCTYPE html>
<meta charset="utf-8">
<title>css-snapshot</title>
<!--
  CSS 캐스케이드를 건드릴 때 쓰는 계측기.

  게임을 iframe 에 띄우고, 프롤로그(대본이 정해져 있어 매번 같다)를 따라
  전투까지 몰고 간 다음, 화면에 있는 모든 요소의 계산된 스타일을 찍는다.
  레이어를 넣기 전과 후의 결과가 같아야 '보이는 것은 그대로'라고 말할 수 있다.

  같은 출처여야 iframe 안쪽을 읽을 수 있으므로 반드시 http 로 연다:
      python3 -m http.server 8765
      chrome --headless --dump-dom \
             'http://localhost:8765/tools/css-snapshot.html' > before.txt
-->
<body style="margin:0">
<iframe id="game" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">RUNNING</pre>
<script>
/* 게임은 적의 예고 행동도 파티클도 난수로 굴린다. 그대로 두면 잴 때마다 다른 화면이
   나와 비교가 되지 않는다. 게임 스크립트가 돌기 전에 Math.random 을 씨앗 고정된
   것으로 갈아 끼워, 매번 똑같은 판이 펼쳐지게 한다. */
const SEED_SHIM = `<script>(function(){
  let s = 0x9E3779B9;
  Math.random = function(){
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  /* 저장된 탐색이 남아 있으면 시작 화면이 달라진다 — 늘 빈손에서 출발한다 */
  try{ localStorage.clear(); }catch(e){}
})();<\/script>`;

/* 색·크기처럼 눈에 보이는 결과만 추린다. 전부 찍으면 차이가 묻힌다. */
const PROPS = [
  'display','position','width','height','margin','padding',
  'color','background-color','background-image','background-size','background-position',
  'border','border-radius','box-shadow','opacity','transform','filter',
  'font-family','font-size','font-weight','letter-spacing','line-height','text-align',
  'animation-name','animation-duration','animation-timing-function','z-index','overflow',
  /* 글자 폭·상자 크기를 바꾸는 것들 — 빠뜨리면 '왜 폭이 달라졌는지'를 못 짚는다 */
  'font-style','font-variant','font-stretch','text-transform','white-space','word-spacing',
  'min-width','max-width','min-height','max-height','flex','flex-basis','box-sizing',
  'align-items','justify-content','gap','text-shadow','image-rendering',
];

function path(el){
  const bits = [];
  for(let n = el; n && n.nodeType === 1 && bits.length < 6; n = n.parentElement){
    let s = n.tagName.toLowerCase();
    if(n.id) s += '#' + n.id;
    if(n.className && typeof n.className === 'string')
      s += '.' + n.className.trim().split(/\s+/).sort().join('.');
    const sibs = n.parentElement ? [...n.parentElement.children].filter(c => c.tagName === n.tagName) : [];
    if(sibs.length > 1) s += `:nth(${sibs.indexOf(n)})`;
    bits.unshift(s);
  }
  return bits.join(' > ');
}

function snap(doc, label, lines){
  const els = doc.querySelectorAll('*');
  const rows = new Set();
  els.forEach(el => {
    if(['SCRIPT','STYLE','TITLE','META','LINK'].includes(el.tagName)) return;
    const cs = doc.defaultView.getComputedStyle(el);
    /* 인라인으로 박힌 속성은 캐스케이드를 건너뛴다 — 검증 대상이 아니고,
       분위기 파티클처럼 난수로 찍히는 값이라 비교만 어지럽힌다. */
    const inline = new Set([...el.style].map(String));
    const vals = PROPS.filter(p => !inline.has(p))
                      .map(p => `${p}=${cs.getPropertyValue(p)}`).join('|');
    /* ::before/::after 도 스킨이 갈아치우는 자리라 함께 찍는다 */
    const be = doc.defaultView.getComputedStyle(el, '::before');
    const af = doc.defaultView.getComputedStyle(el, '::after');
    const pv = ['content','background-image','background-size','transform','animation-name','width','height','display']
      .map(p => `b:${p}=${be.getPropertyValue(p)}|a:${p}=${af.getPropertyValue(p)}`).join('|');
    /* 분위기 파티클은 개수·차례가 매번 달라진다. 자리 대신 클래스로만 세어
       '그 클래스가 어떤 모양인가'는 지키고 몇 번째인가는 버린다(Set 이 중복을 접는다). */
    const inAtmo = el.closest('#atmo');
    const key = inAtmo ? `#atmo ${el.tagName.toLowerCase()}.${(el.className||'').trim()}` : path(el);
    rows.add(`${key}\t${vals}\t${pv}`);
  });
  lines.push(`===== ${label} (${rows.size} rows) =====`);
  lines.push(...[...rows].sort());   /* DOM 순서가 흔들려도 비교가 되도록 */
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function click(doc, sel){
  const el = doc.querySelector(sel);
  if(!el) return false;
  el.dispatchEvent(new doc.defaultView.MouseEvent('click', {bubbles:true}));
  return true;
}

(async function(){
  const lines = [];
  const fr = document.getElementById('game');

  /* 게임 HTML 을 받아 씨앗 고정 스크립트를 맨 앞에 끼우고 iframe 에 직접 쓴다.
     src 로 걸면 게임 스크립트가 먼저 돌아 버려 난수를 갈아 끼울 틈이 없다. */
  const raw = await (await fetch('../FathomOfAbyss.html')).text();
  const seeded = raw.replace('<head>', '<head>' + SEED_SHIM);
  if(seeded === raw) throw new Error('<head> 를 찾지 못해 난수를 고정하지 못했다');
  const doc = fr.contentDocument;
  doc.open(); doc.write(seeded); doc.close();
  await new Promise(r => {
    if(doc.readyState === 'complete') return r();
    fr.contentWindow.addEventListener('load', r, {once:true});
    setTimeout(r, 1500);
  });

  /* 애니메이션이 도는 중에 재면 잴 때마다 값이 다르다(파티클의 opacity, 빛줄기의 transform…).
     전부 같은 시점에 얼려 두면 계산된 값이 결정적이 된다 — 음수 지연으로 타임라인을
     1.5초 지점에 가져다 놓고 멈춘다. 전환(transition)도 같은 이유로 끈다.
     여기서 건드리는 것은 '언제'뿐이고 '무엇이 이기는가'는 그대로라, 캐스케이드 검증에
     영향을 주지 않는다. */
  const freeze = doc.createElement('style');
  freeze.textContent =
    '*,*::before,*::after{animation-play-state:paused !important;' +
    'animation-delay:-1.5s !important;transition:none !important;}';
  doc.head.appendChild(freeze);
  /* 글꼴이 아직 안 붙은 채로 재면 글자 폭이 대체 글꼴 기준으로 나온다 —
     같은 파일을 두 번 재도 값이 달라지는 원인이 여기다. 다 붙을 때까지 기다린다. */
  if(doc.fonts && doc.fonts.ready) await doc.fonts.ready;
  await sleep(400);

  snap(doc, '01-title', lines);

  /* 프롤로그는 대본이 정해져 있어 매번 같은 화면이 나온다 */
  click(doc, '[data-action="new-run"]');      await sleep(250);
  snap(doc, '02-prologue', lines);

  click(doc, '[data-action="prologue-begin"]'); await sleep(250);
  snap(doc, '03-battle', lines);               /* 전투 — 게이지·카드·스킨이 모두 나온다 */

  /* 손패를 눌러 카드 선택 상태(.selecting)와 조준 표시까지 본다 */
  click(doc, '.hand-row .card');               await sleep(250);
  snap(doc, '04-battle-card-selected', lines);

  /* 메뉴 팝업 — 레이어 밖에 있던 UI */
  click(doc, '[data-action="open-menu"]');     await sleep(200);
  snap(doc, '05-menu', lines);
  click(doc, '[data-action="menu-open-item"][data-menu-id="system"]'); await sleep(200);
  snap(doc, '06-guide', lines);

  document.getElementById('out').textContent = lines.join('\n');
  document.title = 'DONE ' + lines.length;
})();
</script>
